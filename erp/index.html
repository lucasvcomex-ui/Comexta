function onAppClick(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.getAttribute('data-action');
  if(!acaoPermitida(action)){ avisoSemPermissao(action); return; }
  // PDFs com "perguntar o modelo ao baixar": abre a escolha antes de gerar
  if(!state.relPular){ const docEsc = relDocDaAcao(action); if(docEsc && relCfgSalva(docEsc).escolherAoBaixar){ state.relEscolha = { docId:docEsc, action }; renderApp(); return; } }
  state.relPular = false;
  const [cmd, a1, a2] = action.split(':');
  if(cmd.startsWith('sair-cot-')){ acaoSairCotacao(cmd); return; }
  if(cmd.startsWith('rel-') && acaoRel(cmd, a1)) return;
  if(cmd.startsWith('cfg-')){ acaoConfig(cmd, a1, a2); return; }
  if(cmd.startsWith('proc-') && (acaoTemplateProcesso(cmd, a1, a2) || acaoProcesso(cmd, a1, a2))) return;
  if(cmd.startsWith('mon-') && acaoMonitoramento(cmd, a1, a2)) return;
  if(cmd.startsWith('dash-') && acaoDash(cmd, a1, a2)) return;
  if(cmd.startsWith('fin-') && acaoFin(cmd, a1)) return;
  if(cmd.startsWith('prod-') && acaoProd(cmd, a1, a2)) return;
  if(cmd.startsWith('venda-')){ acaoVenda(cmd, a1, a2, action); return; }
  if(cmd.startsWith('cot-') && acaoTemplateCotacoes(cmd, a1, a2)) return;
  if(cmd.startsWith('ftpl-') && acaoFiltrosTpl(cmd, a1)) return;
  if(cmd==='exportar'){ exportarTela(a1, a2); return; }
  if(cmd.startsWith('cadtpl-') && acaoTemplateCadastro(cmd, a1, a2)) return;
  switch(cmd){
    case 'go': navigate(a1); break;
    case 'toggle-module':
      state.openModule = state.openModule===a1 ? null : a1;
      renderApp();
      break;
    case 'toggle-nav':
      state.navDropdown = state.navDropdown===a1 ? null : a1;
      renderApp();
      break;
    case 'toggle-side': {
      state.sideOpen = state.sideOpen || {};
      if(state.sideCollapsed && window.innerWidth>980){ state.sideCollapsed = false; state.sideOpen[a1] = true; try{ localStorage.setItem('comexta:sideCollapsed','0'); }catch(e){} renderApp(); break; }
      state.sideOpen[a1] = !state.sideOpen[a1];
      const grp = document.querySelector(`[data-action="toggle-side:${a1}"]`);
      if(grp && grp.closest('.side-group')) grp.closest('.side-group').classList.toggle('open', state.sideOpen[a1]); else renderApp();
      break;
    }
    case 'toggle-sidebar': {
      if(window.innerWidth<=980) state.sideMobile = !state.sideMobile;
      else{ state.sideCollapsed = !state.sideCollapsed; try{ localStorage.setItem('comexta:sideCollapsed', state.sideCollapsed ? '1' : '0'); }catch(e){} }
      const lay = document.querySelector('.layout');
      if(lay){ lay.classList.toggle('side-collapsed', !!state.sideCollapsed); lay.classList.toggle('side-open', !!state.sideMobile); } else renderApp();
      break;
    }
    case 'add-produto': addProduto(); break;
    case 'remove-produto': removeProduto(Number(a1)); break;
    case 'save-calculo': salvarCalculo(); break;
    case 'download-pdf-numerario': {
      const r = computeRateio(state.dados, computeDados(state.dados));
      if(r.linhas.length===0){ toast('Preencha ao menos um produto antes de exportar.'); break; }
      gerarDashboardPDF(state.dados, {id:state.currentCotacaoId, data:new Date().toISOString()});
      break;
    }
    case 'nova-cotacao': novaCotacao(); break;
    case 'limpar-dados': limparDados(); break;
    case 'abrir-cotacao': abrirCotacao(a1); break;
    case 'duplicar-cotacao': duplicarCotacao(a1, 'Simplificada'); break;
    case 'duplicar-cotacao-formal': duplicarCotacao(a1, 'Formal'); break;
    case 'excluir-cotacao': excluirCotacao(a1); break;
    case 'baixar-cotacao-pdf': baixarCotacaoPdf(a1); break;
    case 'cancelar-edicao-cotacao': state.currentCotacaoId=null; renderApp(); break;
    case 'aplicar-filtros': {

      state.filtros.texto = document.getElementById('f-texto').value.trim();
      state.filtros.de = document.getElementById('f-de').value;

    case 'remove-caixa-sim': removeCaixaSim(Number(a1)); break;

function onAppInput(e){
  const el = e.target;
  if(el.hasAttribute && el.hasAttribute('data-vf') && el.type!=='checkbox' && el.tagName!=='SELECT'){ onVendaInput(el, 'input'); return; }
  if(el.hasAttribute && el.hasAttribute('data-cad-tipos')){ onCadTiposInput(el, false); return; }
  if(el.hasAttribute && (el.hasAttribute('data-rel') || el.hasAttribute('data-rel-bloco'))){ onRelInput(el); return; }
  if(onConfigInput(el)) return;
  if(el.hasAttribute('data-proc')){ if(el.type!=='checkbox' && el.tagName!=='SELECT') onProcessoInput(el, 'input'); return; }
  if(el.hasAttribute('data-mon') || el.hasAttribute('data-monsim') || el.hasAttribute('data-mon-filtro')){ onMonitoramentoInput(el, 'input'); return; }
  if(el.hasAttribute('data-cad-filtro')){ onFiltroCadastro(el, 'input'); return; }
  const bind = el.getAttribute('data-bind');
  if(!bind) return;
  const inCadForm = !!el.closest('#cad-rich-form');
  const inFormalForm = !!el.closest('#dadosFormal-form') || !!el.closest('#statusFormal-wrap');
  const inSim = el.getAttribute('data-sim')==='1';
  const target = inCadForm ? state.cadDraft : (inFormalForm ? state.dadosFormal : (inSim ? state.simulacao : state.dados));
  if(!target) return;
  let val = el.value;
  if(el.getAttribute('data-pct')){ setPath(target, bind, val===''?'':num(val)/100); }
  else { setPath(target, bind, val); }
  if(inCadForm) return; // cadastro é salvo explicitamente pelo botão Salvar
  if(inFormalForm){
    saveDraftFormal();
    patchComputedDadosFormal();
    return;
  }
  if(inSim){
    saveDraftSimulacao();
    if(el.closest('#simCarga-form')) patchComputedSimCarga();
    return;
  }
  const ac = el.getAttribute('data-ac');
  if(ac){
    const acIdx = el.getAttribute('data-ac-idx');
    if(val.trim().length>=3) showAutocomplete(el, ac, acIdx!==null?Number(acIdx):null);
    else hideAutocomplete();
  }
  if(bind==='cliente'){
    const match = empresasDoTipo('cliente').find(cl=>(cl.nomeFantasia||cl.razaoSocial||'').trim().toLowerCase()===val.trim().toLowerCase());
    if(match && match.cnpjCpf){
      state.dados.clienteCnpjCpf = match.cnpjCpf;
      const cnpjInput = document.getElementById('dados-form') ? el.closest('.card').querySelector('[data-bind="clienteCnpjCpf"]') : null;
      if(cnpjInput) cnpjInput.value = match.cnpjCpf;
    }
  }
  saveDraft();
  if(el.closest('#dados-form')) patchComputedDados();
}
function onAppChange(e){
  const el = e.target;
  if(el.hasAttribute && el.hasAttribute('data-vf')){ onVendaInput(el, 'change'); return; }
  if(el.hasAttribute && el.hasAttribute('data-vtpl-campo')){ onVendaTemplateCampo(el); return; }
  if(el.hasAttribute && el.hasAttribute('data-cad-tipos')){ onCadTiposInput(el, true); return; }
  if(el.hasAttribute && (el.hasAttribute('data-rel') || el.hasAttribute('data-rel-bloco'))){ onRelInput(el); return; }
  if(onConfigChange(el)) return;
  if(el.hasAttribute('data-proc')){ onProcessoInput(el, 'change'); return; }
  if(el.hasAttribute('data-mon') || el.hasAttribute('data-monsim') || el.hasAttribute('data-mon-filtro')){ onMonitoramentoInput(el, 'change'); return; }
  if(el.hasAttribute('data-dash') || el.hasAttribute('data-dash-sel') || el.hasAttribute('data-dash-fmt')){ onDashInput(el); return; }
  if(el.hasAttribute('data-fin-sel') || el.hasAttribute('data-fin-proc-sel')){ onFinInput(el); return; }
  if(el.hasAttribute('data-ptpl-campo')){ onProdTemplateCampo(el); return; }
  if(el.hasAttribute('data-prod-data') || el.hasAttribute('data-prod-pronto')){ onProdInput(el); return; }
  if(el.hasAttribute('data-mtpl-campo')){ onTemplateCampoMon(el); return; }
  if(el.hasAttribute('data-tpl-campo')){ onTemplateCampo(el); return; }
  if(el.hasAttribute('data-cot-tpl')){ onCotTemplateCampo(el); return; }
  if(el.hasAttribute('data-cadtpl-campo')){ onCadTemplateCampo(el); return; }
  if(el.hasAttribute('data-cad-filtro')){ onFiltroCadastro(el, 'change'); return; }
  if(el.id==='icms-input' || el.id==='icms-input-formal') return; // handled by input
  if(el.id==='doc-file-input'){ handleFilesSelected(el.files); return; }
  if(el.id==='anexo-file-input'){ handleAnexoFilesSelected(el.files); return; }
  if(el.id==='anexo-file-input-formal'){ handleAnexoFilesSelectedFormal(el.files); return; }
  if(el.id==='foto-file-input'){ handleFotosSelected(el.files); return; }
  const bind = el.getAttribute('data-bind');
  if(!bind) return;
  const inCadForm = !!el.closest('#cad-rich-form');
  const inFormalForm = !!el.closest('#dadosFormal-form') || !!el.closest('#statusFormal-wrap');
  const inSim = el.getAttribute('data-sim')==='1';
  const target = inCadForm ? state.cadDraft : (inFormalForm ? state.dadosFormal : (inSim ? state.simulacao : state.dados));
  if(!target) return;
  if(el.tagName==='SELECT' && el.hasAttribute('data-bool')){ setPath(target, bind, el.value==='1'); }
  else if(el.getAttribute('data-pct')){ setPath(target, bind, el.value===''?'':num(el.value)/100); }
  else { setPath(target, bind, el.value); }
  if(inCadForm) return; // cadastro é salvo explicitamente pelo botão Salvar
  if(inSim){ saveDraftSimulacao(); return; }
  if(bind==='statusCotacao'){
    if(inFormalForm) saveDraftFormal(); else saveDraft();
    renderApp(); // precisa redesenhar para mostrar/ocultar motivo e observação
    return;
  }
  if(bind==='estado' && !inFormalForm){
    const est = ESTADOS.find(x=>x.uf===el.value);
    if(est){
      target.icms = est.aliq;
      const icmsInput = document.getElementById('icms-input');
      if(icmsInput) icmsInput.value = fmtPctEdit(est.aliq);
    }
  }
  if(inFormalForm){ saveDraftFormal(); patchComputedDadosFormal(); return; }
  saveDraft();
  patchComputedDados();
}

/* ----------------------------------- Init ------------------------------------ */
async function init(){
  const app = document.getElementById('app');
  app.addEventListener('click', onAppClick);
  app.addEventListener('input', onAppInput);
  app.addEventListener('change', onAppChange);
  const acDropdown = document.getElementById('ac-dropdown');
  if(acDropdown){
    acDropdown.addEventListener('mousedown', (e)=>{
      const opt = e.target.closest('.ac-option');
      if(opt){ e.preventDefault(); selectAutocomplete(Number(opt.getAttribute('data-idx'))); }
    });
  }
  document.addEventListener('click', (e)=>{
    if(acCurrentField && !e.target.closest('#ac-dropdown') && e.target!==acCurrentField.inputEl){
      hideAutocomplete();
    }
  });
  app.addEventListener('keydown', (e)=>{
    const campo = e.key==='Enter' && e.target.closest && e.target.closest('[data-ftpl]');
    if(campo){ e.preventDefault(); acaoFiltrosTpl('ftpl-filtrar', campo.getAttribute('data-ftpl').split('|')[0]); }
  });
  app.addEventListener('dragstart', (e)=>{
    const card = e.target.closest && e.target.closest('.kanban-card');
    if(card){
      const payload = card.hasAttribute('data-proc-id') ? JSON.stringify({ proc: card.getAttribute('data-proc-id') })
        : JSON.stringify({ id: card.getAttribute('data-cot-id'), tipo: card.getAttribute('data-cot-tipo') });
      e.dataTransfer.setData('text/plain', payload);
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
    }
  });
  app.addEventListener('dragend', (e)=>{
    const card = e.target.closest && e.target.closest('.kanban-card');
    if(card) card.classList.remove('dragging');
  });
  app.addEventListener('dragover', (e)=>{
    const dz = e.target.closest && e.target.closest('.file-dropzone');
    if(dz){ e.preventDefault(); dz.classList.add('dragover'); }
    const col = e.target.closest && e.target.closest('.kanban-column-body');
    if(col){ e.preventDefault(); col.classList.add('dragover'); }
  });
  app.addEventListener('dragleave', (e)=>{
    const dz = e.target.closest && e.target.closest('.file-dropzone');
    if(dz){ dz.classList.remove('dragover'); }
    const col = e.target.closest && e.target.closest('.kanban-column-body');
    if(col){ col.classList.remove('dragover'); }
  });
  app.addEventListener('drop', (e)=>{
    const dz = e.target.closest && e.target.closest('.file-dropzone');
    if(dz){
      e.preventDefault();
      dz.classList.remove('dragover');
      if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
        if(dz.id==='anexo-dropzone') handleAnexoFilesSelected(e.dataTransfer.files);
        else if(dz.id==='anexo-dropzone-formal') handleAnexoFilesSelectedFormal(e.dataTransfer.files);
        else if(dz.id==='foto-dropzone') handleFotosSelected(e.dataTransfer.files);
        else handleFilesSelected(e.dataTransfer.files);
      }
      return;
    }
    const col = e.target.closest && e.target.closest('.kanban-column-body');
    if(col){
      e.preventDefault();
      col.classList.remove('dragover');
      const novoStatus = col.getAttribute('data-status');
      let payload = null;
      try{ payload = JSON.parse(e.dataTransfer.getData('text/plain')); }catch(err){}
      if(payload && payload.proc && col.getAttribute('data-quadro')==='proc') moverProcessoStatus(payload.proc, novoStatus);
      else if(payload && payload.id && col.getAttribute('data-quadro')!=='proc') moverCotacaoStatus(payload.id, payload.tipo, novoStatus);
    }
  });
  document.addEventListener('click', (e)=>{
    if(state.navDropdown && !e.target.closest('.nav-group')){
      state.navDropdown = null;
      renderApp();
    }
  });
  try{
    if(!(await carregarUsuario())) return;
    state.cotacoesViewMode = prefsCotacoes().modo;
    await loadInitialData();
  }catch(err){
    // Sem os dados do servidor não renderiza o ERP: salvar em cima de listas vazias apagaria as cotações.
    console.error('Falha ao carregar dados:', err);
    document.getElementById('app').innerHTML = `<div style="max-width:460px;margin:80px auto;padding:0 16px;text-align:center;font-family:var(--font-body);">
      <h2 style="font-family:var(--font-display);color:var(--navy);">Não foi possível carregar seus dados</h2>
      <p style="color:var(--ink-soft);line-height:1.5;">Verifique sua conexão com a internet e tente novamente.</p>
      <button class="btn btn-primary" onclick="location.reload()">Tentar novamente</button></div>`;
    return;
  }
  renderApp();
}
window.addEventListener('beforeunload', avisoSairDaPagina);
init();

      </div>

        <label class="dash-check"><input type="radio" name="dash-fmt" data-dash-fmt="pdf" ${state.dashFormato==='pdf'?'checked':''}> PDF (gráficos + tabelas)</label>
        <label class="dash-check"><input type="radio" name="dash-fmt" data-dash-fmt="xml" ${state.dashFormato==='xml'?'checked':''}> XML (dados)</label>
        <p class="hint" style="margin:10px 0 0;">O arquivo sai com o período e a comparação que estão na tela de cada dashboard.</p>

    <div class="btn-row" style="margin-top:14px;">
      <button class="btn btn-primary btn-sm" data-action="dash-baixar">${ICONS.download} Baixar selecionados</button>
      <button class="btn btn-ghost btn-sm" data-action="dash-baixar-abrir">Fechar</button>
    </div>
  </div>` : '';
  return `
  <div class="home-hero">

    <h1>Comexta, comércio exterior inteligente</h1>
    <p>Acompanhe cotações, processos, containers e custos. Cada dashboard tem o seu próprio período (dia, semana, mês ou ano) e pode comparar o mesmo período entre anos diferentes.</p>
  </div>

  <div class="dash-topo">
    <div class="section-title" style="margin:0;"><span class="num">•</span> Dashboards</div>
    <button class="btn btn-ghost btn-sm" data-action="dash-baixar-abrir">${ICONS.download} Baixar dashboards</button>

  ${visiveis.map(id=>`<div class="card dash-bloco" id="dash-${id}">${dashBlocoHtml(id)}</div>`).join('')}
  <div class="dash-grid">
    <div class="card-flat dash-card">
      <div class="dash-title">Cadastros Ativos</div>
      <div class="dash-canvas-wrap"><canvas id="chart-cadastros"></canvas></div>
    </div>
  </div>

  <div class="footer-note"><span>Comexta · valores de referência, confira sempre a legislação aduaneira vigente.</span><span>v2.43 · módulo Vendas (cotação e pedidos) · build 15/10/2026</span></div>
  `;
}

/* ============================ Dashboards da Home ============================
   Cotações Salvas, Processos (por status), Monitoramento de Carga e Financeiro dos processos (câmbio e Outras Despesas).
   Cada um tem o próprio período (dia / semana / mês / ano) e pode comparar o mesmo período entre anos.
   Os dados vêm direto do que está cadastrado; nada é guardado à parte. */
const DASH_ORDEM = ['cot','proc','mon','fin','vcot','vped'];
const DASH_TITULOS = { cot:'Cotações Salvas', proc:'Processos por Status', mon:'Monitoramento de Carga', fin:'Financeiro dos Processos', vcot:'Cotações de Venda', vped:'Pedidos de Venda', cad:'Cadastros Ativos' };
const DASH_SECAO = { cot:'cotacoes', proc:'processos', mon:'monitoramento', fin:'financeiro', vcot:'vendas', vped:'vendas' };
const dashVisivel = id => { try{ return pode(DASH_SECAO[id], 'ver'); }catch(e){ return true; } };
const DASH_MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DASH_MESES_LONGOS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DASH_GRAN = { dia:'Dia', semana:'Semana', mes:'Mês', ano:'Ano' };
const DASH_CORES_ANO = ['#173A5E','#C07A25','#2F6B4F','#6E5EA6','#B23A32','#4E8F6F','#8F5A17','#3B5F8A'];
const DASH_COR_STATUS_PROC = { aberto:'#173A5E', producao:'#3B5F8A', transito_origem:'#C07A25', warehouse_origem:'#D69A4A', desembaraco_origem:'#E3B877', porto_origem:'#A8691C',
  transito_internacional:'#8F5A17', porto_destino:'#B0793A', desembaraco:'#6E5EA6', desembaracado:'#8E7FC4', transito_destino:'#2F6B4F', entregue:'#4E8F6F', finalizado:'#1F4E38', cancelado:'#B23A32' };
const DASH_COR_SIT_MON = { sem_dados:'#9AA5B8', aguardando:'#173A5E', no_prazo:'#2F6B4F', vencendo:'#C07A25', excedido:'#B23A32', devolvido_ok:'#4E8F6F', devolvido_excedido:'#8F2E28' };

function dashParseData(v){
  const s = String(v||'').trim(); if(!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(m) return { y:+m[1], m:+m[2], d:+m[3] };
  const t = Date.parse(s); if(Number.isNaN(t)) return null;
  const dt = new Date(t); return { y:dt.getFullYear(), m:dt.getMonth()+1, d:dt.getDate() };
}
// Semana ISO (segunda a domingo); o ano ISO pode diferir do ano do calendário nas pontas.
function dashIsoSemana(y, m, d){
  const alvo = new Date(Date.UTC(y, m-1, d));
  const dia = (alvo.getUTCDay() + 6) % 7;
  alvo.setUTCDate(alvo.getUTCDate() - dia + 3);
  const anoIso = alvo.getUTCFullYear();
  const quinta = new Date(Date.UTC(anoIso, 0, 4));
  const sem = 1 + Math.round(((alvo - quinta) / 86400000 - 3 + ((quinta.getUTCDay() + 6) % 7)) / 7);
  return { ano:anoIso, sem };
}
const dashSemanasNoAno = y => dashIsoSemana(y, 12, 28).sem;
function dashCfg(id){
  const c = state.dash[id], hoje = new Date();
  if(!c.ano) c.ano = hoje.getFullYear();
  if(!c.mes) c.mes = hoje.getMonth() + 1;
  return c;
}
function dashFaixaFn(cfg){
  if(cfg.gran==='dia') return dt => dt.y===cfg.ano && dt.m===cfg.mes;
  if(cfg.gran==='semana') return dt => dashIsoSemana(dt.y, dt.m, dt.d).ano===cfg.ano;
  if(cfg.gran==='mes') return dt => dt.y===cfg.ano;
  return () => true;
}
function dashTextoPeriodo(cfg, anos){
  if(cfg.gran==='dia') return DASH_MESES_LONGOS[cfg.mes-1] + ' de ' + cfg.ano + ' (dia a dia)';
  if(cfg.gran==='semana') return 'Semanas de ' + cfg.ano;
  if(cfg.gran==='mes') return 'Meses de ' + cfg.ano;
  return 'Todos os anos (' + (anos[0]||cfg.ano) + ' a ' + (anos[anos.length-1]||cfg.ano) + ')';
}
function dashEixo(cfg, anosSerie, anosDados){
  if(cfg.gran==='dia'){
    const n = Math.max(...anosSerie.map(a=>new Date(a, cfg.mes, 0).getDate()));
    return { labels:Array.from({length:n}, (_,i)=>String(i+1)), anos:null };
  }
  if(cfg.gran==='semana'){
    const n = Math.max(...anosSerie.map(dashSemanasNoAno));
    return { labels:Array.from({length:n}, (_,i)=>'S'+(i+1)), anos:null };
  }
  if(cfg.gran==='mes') return { labels:[...DASH_MESES], anos:null };
  const min = Math.min(...anosDados), max = Math.max(...anosDados);
  const anos = []; for(let a=min; a<=max; a++) anos.push(a);
  return { labels:anos.map(String), anos };
}
function dashIndice(cfg, dt, ano, eixo){
  if(cfg.gran==='dia') return (dt.y===ano && dt.m===cfg.mes) ? dt.d-1 : -1;
  if(cfg.gran==='semana'){ const w = dashIsoSemana(dt.y, dt.m, dt.d); return w.ano===ano ? w.sem-1 : -1; }
  if(cfg.gran==='mes') return dt.y===ano ? dt.m-1 : -1;
  return eixo.anos.indexOf(dt.y);
}

/* --- modelos: cada dashboard devolve registros {dt, cat, v, ...} --- */
function dashModelo(id){
  const hoje = hojeLocalISO(), regs = []; let semData = 0, semCambio = 0;
  if(id==='cot'){
    const add = (lista, tipo) => (lista||[]).forEach(c=>{
      const dt = dashParseData(c.criadoEm); if(!dt){ semData++; return; }
      const st = (c.dados && c.dados.statusCotacao) || 'em_andamento';
      regs.push({ dt, cat: COT_STATUS_LABEL[st] ? st : 'em_andamento', v:1, tipo, resumo:c.resumo||{}, ref:c.id });
    });
    add(state.cotacoesIndex, 'Simplificada'); add(state.cotacoesFormalIndex, 'Formal');
    return { id, regs, semData, fmt:n=>String(Math.round(n)), unidade:'cotações',
      categorias:[['em_andamento','Em Andamento','#173A5E'], ['enviado_cliente','Enviado Cliente','#C07A25'], ['aceito','Aprovado','#2F6B4F'], ['negado','Negado','#B23A32']] };
  }
  if(id==='vcot' || id==='vped'){
    const tipo = id==='vcot' ? 'cot' : 'ped', cfg = VENDA_TIPOS[tipo];
    (state[cfg.estado]||[]).forEach(v=>{
      const dt = dashParseData(v.dataVenda || v.criadoEm); if(!dt){ semData++; return; }
      regs.push({ dt, cat:v.status, v:1, total:calcVenda(v).totalVenda, cliente:v.cliente||'', vendedor:v.vendedor||'', ref:v.id });
    });
    return { id, regs, semData, fmt:n=>String(Math.round(n)), unidade:tipo==='cot' ? 'cotações' : 'pedidos', categorias:Object.entries(cfg.status).map(([k, [r, , cor]])=>[k, r, cor]) };
  }
  if(id==='proc'){
    (state.processosIndex||[]).forEach(p=>{
      const dt = dashParseData(dataAberturaProcesso(p)); if(!dt){ semData++; return; }
      regs.push({ dt, cat:statusProc(p), v:1, modal:((p.transporte||{}).modal)||'', ref:p.id });
    });
    const usados = Object.keys(PROC_STATUS).filter(k=>regs.some(r=>r.cat===k));
    return { id, regs, semData, fmt:n=>String(Math.round(n)), unidade:'processos',
      categorias: usados.map(k=>[k, PROC_STATUS[k].label, DASH_COR_STATUS_PROC[k]||'#9AA5B8']) };
  }
  if(id==='mon'){
    const custo = state.dash.mon.medida==='custo';
    (state.monitoramento||[]).forEach(m=>{
      const dt = dashParseData(m.chegada || m.eta || m.etd); if(!dt){ semData++; return; }
      const c = monCalcular(m, hoje);
      regs.push({ dt, cat:c.situacao, v: custo ? c.custoBRL : 1, qtd:1, custoBRL:c.custoBRL, porto:m.portoDestino||'', ref:m.container||'' });
    });
    return { id, regs, semData, fmt: custo ? fmtBRL : (n=>String(Math.round(n))), unidade: custo ? 'R$' : 'containers',
      categorias: Object.entries(MON_SITUACOES).map(([k,v])=>[k, v.rotulo, DASH_COR_SIT_MON[k]]) };
  }
  // financeiro: parcelas do fechamento de câmbio (Produto) e Outras Despesas de cada processo, em R$ (valor × taxa da moeda)
  (state.processosIndex||[]).forEach(raw=>{
    let p; try{ p = procNorm(raw); }catch(e){ return; }
    lancamentosFinanceirosProc(p).forEach(l=>{
      const dt = dashParseData(l.vencimento); if(!dt){ semData++; return; }
      if(l.moeda!=='BRL' && !(l.taxa>0)){ semCambio++; return; }
      const venc = String(l.vencimento).slice(0,10) < hoje;
      regs.push({ dt, cat: l.pago ? 'pago' : (venc ? 'vencido' : 'aberto'), v:l.brl, ref:p.id, desc:l.rotulo });
    });
  });
  const visao = state.dash.fin.visao;
  const todas = [['pago','Pagos','#2F6B4F'], ['aberto','Em aberto','#173A5E'], ['vencido','Vencidos','#B23A32']];
  return { id, regs, regsKpi:regs, semData, semCambio, fmt:fmtBRL, unidade:'R$',
    filtro: visao==='total' ? null : (r=>r.cat===visao),
    categorias: visao==='total' ? todas : todas.filter(c=>c[0]===visao) };
}
const soma_ = (lista, k) => lista.reduce((a, r)=>a + (Number(r[k])||0), 0);
function dashKpis(id, rf){
  const soma = f => rf.filter(f).reduce((a,r)=>a+r.v, 0), n = f => rf.filter(f).length;
  if(id==='cot') return [
    { rot:'Cotações no período', val:String(rf.length) },
    { rot:'Aprovadas', val:String(n(r=>r.cat==='aceito')), cor:'#2F6B4F' },
    { rot:'Negadas', val:String(n(r=>r.cat==='negado')), cor:'#B23A32' },
    { rot:'Em aberto (andamento + enviadas)', val:String(n(r=>r.cat==='em_andamento'||r.cat==='enviado_cliente')) } ];
  if(id==='vcot') return [
    { rot:'Cotações no período', val:String(rf.length) },
    { rot:'Aceitas', val:String(n(r=>r.cat==='aceita')), cor:'#2F6B4F' },
    { rot:'Recusadas', val:String(n(r=>r.cat==='recusada')), cor:'#B23A32' },
    { rot:'Valor em aberto', val:fmtBRL(soma_(rf.filter(r=>r.cat==='em_andamento' || r.cat==='enviada'), 'total')), cor:'#C07A25' } ];
  if(id==='vped') return [
    { rot:'Pedidos no período', val:String(rf.length) },
    { rot:'Valor dos pedidos', val:fmtBRL(soma_(rf.filter(r=>r.cat!=='cancelado'), 'total')), cor:'#173A5E' },
    { rot:'Entregues', val:String(n(r=>r.cat==='entregue')), cor:'#2F6B4F' },
    { rot:'Cancelados', val:String(n(r=>r.cat==='cancelado')), cor:'#B23A32' } ];
  if(id==='proc') return [
    { rot:'Processos no período', val:String(rf.length) },
    { rot:'Em andamento', val:String(n(r=>!['finalizado','entregue','cancelado'].includes(r.cat))), cor:'#C07A25' },
    { rot:'Entregues / finalizados', val:String(n(r=>r.cat==='finalizado'||r.cat==='entregue')), cor:'#2F6B4F' },
    { rot:'Cancelados', val:String(n(r=>r.cat==='cancelado')), cor:'#B23A32' } ];
  if(id==='mon') return [
    { rot:'Containers no período', val:String(rf.length) },
    { rot:'No free time', val:String(n(r=>r.cat==='no_prazo'||r.cat==='aguardando')), cor:'#2F6B4F' },
    { rot:'Free time vencendo', val:String(n(r=>r.cat==='vencendo')), cor:'#C07A25' },
    { rot:'Excedidos', val:String(n(r=>r.cat==='excedido'||r.cat==='devolvido_excedido')), cor:'#B23A32' },
    { rot:'Custo após o free time', val:fmtBRL(rf.reduce((a,r)=>a+r.custoBRL,0)) } ];
  return [
    { rot:'Custos totais', val:fmtBRL(soma(()=>true)), visao:'total' },
    { rot:'Custos pagos', val:fmtBRL(soma(r=>r.cat==='pago')), cor:'#2F6B4F', visao:'pago' },
    { rot:'Em aberto (a vencer)', val:fmtBRL(soma(r=>r.cat==='aberto')), cor:'#173A5E', visao:'aberto' },
    { rot:'Vencidos', val:fmtBRL(soma(r=>r.cat==='vencido')), cor:'#B23A32', visao:'vencido' } ];
}
function dashExtra(id, rf){
  const agrupa = (chaveFn, valorFn, max) => {
    const m = new Map(); rf.forEach(r=>{ const k = chaveFn(r) || '—'; m.set(k, (m.get(k)||0) + valorFn(r)); });
    const l = [...m.entries()].filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0, max||6);
    return { labels:l.map(x=>x[0]), valores:l.map(x=>x[1]) };
  };
  if(id==='cot'){
    const s = f => rf.filter(r=>r.tipo===f);
    const sm = (lista, k) => lista.reduce((a,r)=>a+(Number(r.resumo[k])||0), 0);
    return { titulo:'Custos totais das cotações (R$)', fmt:fmtBRL, labels:['Simplificada — Simples Nacional','Simplificada — Lucro Real','Formal — c/ créditos','Formal — s/ créditos'],
      valores:[sm(s('Simplificada'),'custoSimples'), sm(s('Simplificada'),'custoLucroReal'), sm(s('Formal'),'custoComCredito'), sm(s('Formal'),'custoSemCredito')], cor:'#173A5E' };
  }
  if(id==='vcot'){ const g = agrupa(r=>r.vendedor || 'Sem vendedor', r=>r.total, 6); return { titulo:'Valor das cotações por vendedor (R$)', fmt:fmtBRL, ...g, cor:'#C07A25' }; }
  if(id==='vped'){ const g = agrupa(r=>r.cliente || 'Sem cliente', r=>r.total, 6); return { titulo:'Valor dos pedidos por cliente (R$)', fmt:fmtBRL, ...g, cor:'#2F6B4F' }; }
  if(id==='proc'){ const g = agrupa(r=>PROC_MODAIS[r.modal]||'Sem modal', ()=>1); return { titulo:'Processos por modal', fmt:n=>String(Math.round(n)), ...g, cor:'#C07A25' }; }
  if(id==='mon'){ const g = agrupa(r=>r.porto, r=>r.qtd, 6); return { titulo:'Containers por porto de destino', fmt:n=>String(Math.round(n)), ...g, cor:'#2F6B4F' }; }
  const g = agrupa(r=>r.ref, r=>r.v, 6); return { titulo:'Maiores custos por processo (R$)', fmt:fmtBRL, ...g, cor:'#6E5EA6' };
}
function dashDados(id){
  const mod = dashModelo(id), cfg = dashCfg(id);
  const anos = [...new Set([...mod.regs.map(r=>r.dt.y), new Date().getFullYear()])].sort((a,b)=>a-b);
  cfg.comp = cfg.comp.filter(a=>a!==cfg.ano);
  const base = mod.filtro ? mod.regs.filter(mod.filtro) : mod.regs;
  const faixa = dashFaixaFn(cfg);
  const anosSerie = cfg.gran==='ano' ? [null] : [cfg.ano, ...cfg.comp];
  const anosNum = anosSerie.filter(a=>a!=null);
  const eixo = dashEixo(cfg, anosNum.length ? anosNum : [cfg.ano], anos);
  const zeros = () => new Array(eixo.labels.length).fill(0);
  const series = anosSerie.map(a=>{
    const v = zeros(); base.forEach(r=>{ const i = dashIndice(cfg, r.dt, a, eixo); if(i>=0 && i<v.length) v[i] += r.v; });
    return { nome: a==null ? 'Total' : String(a), valores:v };
  });
  const cats = mod.categorias.map(([chave, nome, cor])=>{
    const v = zeros(); base.forEach(r=>{ if(r.cat!==chave) return; const i = dashIndice(cfg, r.dt, cfg.gran==='ano' ? null : cfg.ano, eixo); if(i>=0 && i<v.length) v[i] += r.v; });
    return { chave, nome, cor, valores:v };
  });
  const rf = base.filter(r=>faixa(r.dt));
  const rfKpi = (mod.regsKpi || mod.regs).filter(r=>faixa(r.dt));
  const dist = cats.map(c=>({ nome:c.nome, cor:c.cor, valor:c.valores.reduce((a,b)=>a+b,0) })).filter(x=>x.valor>0);
  return { id, titulo:DASH_TITULOS[id], mod, cfg, anos, eixo, series, cats, dist, kpis:dashKpis(id, rfKpi), extra:dashExtra(id, rf),
    comparar: cfg.gran!=='ano' && cfg.comp.length>0, periodo:dashTextoPeriodo(cfg, anos), vazio: mod.regs.length===0 };
}

/* --- tela --- */
function dashControlesHtml(id, D){
  const cfg = D.cfg;
  const outros = D.anos.filter(a=>a!==cfg.ano);
  return `<div class="dash-controles">
    <div class="dash-seg">${Object.entries(DASH_GRAN).map(([g,r])=>`<button class="${cfg.gran===g?'ativo':''}" data-action="dash-gran:${id}:${g}">${r}</button>`).join('')}</div>
    ${cfg.gran!=='ano' ? `<label class="dash-sel">Ano <select data-dash="${id}:ano">${D.anos.map(a=>`<option ${a===cfg.ano?'selected':''}>${a}</option>`).join('')}</select></label>` : ''}
    ${cfg.gran==='dia' ? `<label class="dash-sel">Mês <select data-dash="${id}:mes">${DASH_MESES_LONGOS.map((m,i)=>`<option value="${i+1}" ${i+1===cfg.mes?'selected':''}>${m}</option>`).join('')}</select></label>` : ''}
    ${cfg.gran!=='ano' ? `<div class="dash-comp"><span>Comparar com:</span>${outros.length ? outros.map(a=>`<button class="dash-chip ${cfg.comp.includes(a)?'ativo':''}" data-action="dash-comp:${id}:${a}">${a}</button>`).join('') : '<em>sem outros anos com dados</em>'}</div>`
      : '<span class="hint">Cada barra é um ano, então a visão anual já compara os anos.</span>'}
    ${id==='mon' ? `<div class="dash-seg dash-medida"><button class="${state.dash.mon.medida==='qtd'?'ativo':''}" data-action="dash-medida:mon:qtd">Containers</button><button class="${state.dash.mon.medida==='custo'?'ativo':''}" data-action="dash-medida:mon:custo">Custo (R$)</button></div>` : ''}
  </div>`;
}
function dashBlocoHtml(id){
  const D = dashDados(id);
  const avisos = [];
  if(D.mod.semData) avisos.push(D.mod.semData + ' registro' + (D.mod.semData===1?'':'s') + ' sem data (fora do gráfico)');
  if(D.mod.semCambio) avisos.push(D.mod.semCambio + ' lançamento' + (D.mod.semCambio===1?'':'s') + ' em moeda estrangeira sem taxa informada (fora da soma)');
  const kpis = D.kpis.map(k => id==='fin'
    ? `<button class="dash-kpi sel ${state.dash.fin.visao===k.visao?'ativo':''}" style="--cor:${k.cor||'#173A5E'}" data-action="dash-visao:fin:${k.visao}"><span>${esc(k.rot)}</span><b>${esc(k.val)}</b></button>`
    : `<div class="dash-kpi" style="--cor:${k.cor||'#173A5E'}"><span>${esc(k.rot)}</span><b>${esc(k.val)}</b></div>`).join('');
  return `
    <div class="dash-head">
      <div><div class="dash-nome">${esc(D.titulo)}</div><div class="dash-periodo">${esc(D.periodo)}${D.comparar ? ' · comparando com ' + D.cfg.comp.join(', ') : ''}</div></div>
      ${dashControlesHtml(id, D)}
    </div>
    ${id==='fin' ? '<p class="hint" style="margin:0 0 10px;">Fonte: fechamento de câmbio (janela Produto) e Outras Despesas de cada processo. Clique em um quadro para ver só aquele grupo. Em aberto = ainda no prazo; vencidos = não pagos com vencimento já passado.</p>' : ''}
    <div class="dash-kpis">${kpis}</div>
    ${D.vazio ? `<div class="dash-empty">${ICONS.calc}<span>Ainda não há dados para este dashboard.</span></div>` : `
    <div class="dash-corpo">
      <div class="dash-principal"><div class="dash-sub-t">${D.comparar ? 'Comparação entre anos' : 'Por período'}</div><div class="dash-canvas"><canvas id="dash-${id}-main"></canvas></div></div>
      <div class="dash-lado">
        <div><div class="dash-sub-t">Distribuição no período</div><div class="dash-canvas curto"><canvas id="dash-${id}-pizza"></canvas></div></div>
        <div><div class="dash-sub-t">${esc(D.extra.titulo)}</div><div class="dash-canvas curto"><canvas id="dash-${id}-extra"></canvas></div></div>
      </div>
    </div>`}
    ${avisos.length ? `<p class="hint" style="margin:10px 0 0;">${esc(avisos.join(' · '))}</p>` : ''}`;
}
function dashDesenhar(id){
  if(typeof Chart==='undefined') return;
  const D = dashDados(id); if(D.vazio) return;
  Chart.defaults.font.family = "Play, Inter, sans-serif";
  const fmt = D.mod.fmt;
  const eixoY = { beginAtZero:true, ticks:{ precision:0, callback:v=>fmt(v) } };
  const cMain = document.getElementById('dash-'+id+'-main');
  if(cMain){
    if(D.comparar){
      homeCharts['dash-'+id+'-main'] = new Chart(cMain, { type:'line',
        data:{ labels:D.eixo.labels, datasets:D.series.map((s,i)=>({ label:s.nome, data:s.valores, borderColor:DASH_CORES_ANO[i%DASH_CORES_ANO.length], backgroundColor:DASH_CORES_ANO[i%DASH_CORES_ANO.length], tension:.25, pointRadius:3 })) },
        options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
          plugins:{ legend:{position:'bottom'}, tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+fmt(c.parsed.y)}} }, scales:{ y:eixoY } } });
    }else{
      homeCharts['dash-'+id+'-main'] = new Chart(cMain, { type:'bar',
        data:{ labels:D.eixo.labels, datasets:D.cats.filter(c=>c.valores.some(v=>v>0)).map(c=>({ label:c.nome, data:c.valores, backgroundColor:c.cor, borderRadius:3, maxBarThickness:34 })) },
        options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
          plugins:{ legend:{position:'bottom', labels:{boxWidth:11, font:{size:11}}}, tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+fmt(c.parsed.y)}} },
          scales:{ x:{stacked:true}, y:{...eixoY, stacked:true} } } });
    }
  }
  const cPie = document.getElementById('dash-'+id+'-pizza');
  if(cPie) homeCharts['dash-'+id+'-pizza'] = new Chart(cPie, { type:'doughnut',
    data:{ labels:D.dist.map(x=>x.nome), datasets:[{ data:D.dist.map(x=>x.valor), backgroundColor:D.dist.map(x=>x.cor) }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{position:'right', labels:{boxWidth:10, font:{size:11}}}, tooltip:{callbacks:{label:c=>' '+c.label+': '+fmt(c.parsed)}} } } });
  const cEx = document.getElementById('dash-'+id+'-extra');
  if(cEx) homeCharts['dash-'+id+'-extra'] = new Chart(cEx, { type:'bar',
    data:{ labels:D.extra.labels, datasets:[{ data:D.extra.valores, backgroundColor:D.extra.cor, borderRadius:3, maxBarThickness:22 }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>' '+D.extra.fmt(c.parsed.x)}} },
      scales:{ x:{ beginAtZero:true, ticks:{ callback:v=>D.extra.fmt(v) } } } } });
}
function dashRedesenhar(id){
  const el = document.getElementById('dash-'+id); if(!el) return renderApp();
  Object.keys(homeCharts).filter(k=>k.startsWith('dash-'+id+'-')).forEach(k=>{ try{ homeCharts[k].destroy(); }catch(e){} delete homeCharts[k]; });
  el.innerHTML = dashBlocoHtml(id);
  dashDesenhar(id);
}

/* --- ações --- */
function acaoDash(cmd, a1, a2){
  switch(cmd){
    case 'dash-gran': state.dash[a1].gran = a2; dashRedesenhar(a1); return true;
    case 'dash-comp': { const c = state.dash[a1], a = Number(a2); c.comp = c.comp.includes(a) ? c.comp.filter(x=>x!==a) : [...c.comp, a].sort((x,y)=>x-y); dashRedesenhar(a1); return true; }
    case 'dash-visao': state.dash.fin.visao = a2; dashRedesenhar('fin'); return true;
    case 'dash-medida': state.dash.mon.medida = a2; dashRedesenhar('mon'); return true;
    case 'dash-baixar-abrir': state.dashBaixar.aberto = !state.dashBaixar.aberto; renderApp(); return true;
    case 'dash-baixar': dashBaixar(); return true;
  }
  return false;
}
function onDashInput(el){
  if(el.hasAttribute('data-dash-sel')){ state.dashSel[el.getAttribute('data-dash-sel')] = el.checked; return; }
  if(el.hasAttribute('data-dash-fmt')){ state.dashFormato = el.getAttribute('data-dash-fmt'); return; }
  const [id, campo] = String(el.getAttribute('data-dash')).split(':');
  state.dash[id][campo] = Number(el.value);
  dashRedesenhar(id);
}

/* --- exportação (PDF e XML) --- */
const xmlEsc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function dashSnapshotCadastros(){
  const outras = state.clientes.length - empresasDoTipo('cliente').length - state.fornecedores.length;
  return [['Clientes', empresasDoTipo('cliente').length], ['Fornecedores', state.fornecedores.length], ['Outras empresas', outras], ['Produtos', state.produtos.length]];
}
function dashXml(ids){
  const L = [];
  L.push('<?xml version="1.0" encoding="UTF-8"?>');
  L.push(`<dashboards geradoEm="${xmlEsc(new Date().toISOString())}" sistema="Comexta">`);
  ids.forEach(id=>{
    if(id==='cad'){
      L.push(`  <dashboard id="cad" titulo="${xmlEsc(DASH_TITULOS.cad)}">`);
      dashSnapshotCadastros().forEach(([r,v])=>L.push(`    <item rotulo="${xmlEsc(r)}" valor="${v}"/>`));
      L.push('  </dashboard>'); return;
    }
    const D = dashDados(id), cfg = D.cfg;
    L.push(`  <dashboard id="${id}" titulo="${xmlEsc(D.titulo)}" visao="${xmlEsc(DASH_GRAN[cfg.gran])}" periodo="${xmlEsc(D.periodo)}" ano="${cfg.gran==='ano'?'':cfg.ano}" mes="${cfg.gran==='dia'?cfg.mes:''}" comparar="${xmlEsc(cfg.gran==='ano'?'':cfg.comp.join(','))}"${id==='fin'?` filtro="${xmlEsc(state.dash.fin.visao)}"`:''}${id==='mon'?` medida="${xmlEsc(state.dash.mon.medida)}"`:''} unidade="${xmlEsc(D.mod.unidade)}">`);
    L.push('    <indicadores>'); D.kpis.forEach(k=>L.push(`      <indicador rotulo="${xmlEsc(k.rot)}" valor="${xmlEsc(k.val)}"/>`)); L.push('    </indicadores>');
    L.push('    <series>');
    D.series.forEach(s=>{ L.push(`      <serie nome="${xmlEsc(s.nome)}">`); s.valores.forEach((v,i)=>L.push(`        <ponto rotulo="${xmlEsc(D.eixo.labels[i])}" valor="${Math.round(v*100)/100}"/>`)); L.push('      </serie>'); });
    L.push('    </series>');
    L.push('    <categorias>');
    D.cats.forEach(c=>{ L.push(`      <categoria nome="${xmlEsc(c.nome)}">`); c.valores.forEach((v,i)=>L.push(`        <ponto rotulo="${xmlEsc(D.eixo.labels[i])}" valor="${Math.round(v*100)/100}"/>`)); L.push('      </categoria>'); });
    L.push('    </categorias>');
    L.push('    <distribuicao>'); D.dist.forEach(x=>L.push(`      <item rotulo="${xmlEsc(x.nome)}" valor="${Math.round(x.valor*100)/100}"/>`)); L.push('    </distribuicao>');
    L.push(`    <destaque titulo="${xmlEsc(D.extra.titulo)}">`); D.extra.labels.forEach((r,i)=>L.push(`      <item rotulo="${xmlEsc(r)}" valor="${Math.round(D.extra.valores[i]*100)/100}"/>`)); L.push('    </destaque>');
    L.push('  </dashboard>');
  });
  L.push('</dashboards>');
  return L.join('\n');
}
function dashBaixarArquivo(blob, nome){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function dashPdf(ids){
  if(typeof window.jspdf==='undefined' || !window.jspdf.jsPDF){ toast('Não foi possível carregar a biblioteca de PDF. Verifique sua conexão e recarregue a página.'); return; }
  const doc = novoPdfDoc('dashboards');
  if(typeof doc.autoTable!=='function'){ toast('Não foi possível carregar o plugin de tabelas do PDF.'); return; }
  // Gráfico como imagem, com as proporções reais do gráfico (sem esticar): cabe na caixa e fica centralizado
  const imagem = chave => { try{ const ch = homeCharts[chave]; if(!ch) return null; const cv = ch.canvas || {}; return { uri:ch.toBase64Image('image/png', 1), w:cv.width || ch.width || 1, h:cv.height || ch.height || 1 }; }catch(e){ return null; } };
  const colocar = (img, x, y, caixaW, caixaH) => { const k = Math.min(caixaW/img.w, caixaH/img.h), w = img.w*k, h = img.h*k; doc.addImage(img.uri, 'PNG', x + (caixaW - w)/2, y + (caixaH - h)/2, w, h); };
  ids.forEach((id, n)=>{
    if(n>0) doc.addPage();
    if(id==='cad'){
      pdfHeader(doc, 'Dashboard — ' + DASH_TITULOS.cad, 'Situação atual dos cadastros', fmtDate(new Date().toISOString()));
      const img = imagem('cadastros'); let y = 80;
      if(img && relBloco(doc,'graficos')){ colocar(img, 28, y, 480, 220); y += 236; }
      if(relBloco(doc,'tabela')) doc.autoTable({ startY:y, margin:{left:28,right:28}, head:[['Cadastro','Quantidade']], body:dashSnapshotCadastros().map(([r,v])=>[r, String(v)]), theme:'grid', styles:{fontSize:9, cellPadding:4}, headStyles:{fillColor:corCabecalhoPdf(), textColor:corTextoCabecalhoPdf()} });
      return;
    }
    const D = dashDados(id);
    pdfHeader(doc, 'Dashboard — ' + D.titulo, D.periodo + (D.comparar ? ' · comparando com ' + D.cfg.comp.join(', ') : '') + (id==='fin' ? ' · filtro: ' + ({total:'custos totais',pago:'pagos',aberto:'em aberto',vencido:'vencidos'})[state.dash.fin.visao] : '') + (id==='mon' ? ' · medida: ' + (state.dash.mon.medida==='custo'?'custo (R$)':'containers') : ''), fmtDate(new Date().toISOString()));
    let y = 78;
    if(relBloco(doc,'kpis')){
    doc.autoTable({ startY:y, margin:{left:28,right:28}, head:[D.kpis.map(k=>k.rot)], body:[D.kpis.map(k=>k.val)], theme:'grid', styles:{fontSize:9, cellPadding:5, halign:'center'}, headStyles:{fillColor:corCabecalhoPdf(), textColor:corTextoCabecalhoPdf(), fontSize:8} });
    y = doc.lastAutoTable.finalY + 14;
    }
    const im1 = relBloco(doc,'graficos') ? imagem('dash-'+id+'-main') : null, im2 = relBloco(doc,'graficos') ? imagem('dash-'+id+'-pizza') : null;
    const larguraUtil = doc.internal.pageSize.getWidth() - 56, retrato = larguraUtil < 700, w1 = retrato ? Math.round(larguraUtil*0.58) : 500, w2 = retrato ? Math.round(larguraUtil*0.40) : 270, x2 = retrato ? 28 + w1 + 10 : 540;
    if(im1){ colocar(im1, 28, y, w1, 210); }
    if(im2){ colocar(im2, x2, y, w2, 210); }
    if(im1 || im2) y += 224;
    const eixoRot = D.cfg.gran==='dia' ? 'Dia' : D.cfg.gran==='semana' ? 'Semana' : D.cfg.gran==='mes' ? 'Mês' : 'Ano';
    // comparando anos: uma coluna por ano; senão: uma coluna por categoria + total
    const colunas = D.comparar ? D.series : [...D.cats.filter(c=>c.valores.some(v=>v>0)), { nome:'Total', valores:D.series[0].valores }];
    const cab = [eixoRot, ...colunas.map(c=>c.nome)];
    const corpo = D.eixo.labels.map((rot, i)=>[rot, ...colunas.map(c=>D.mod.fmt(c.valores[i]))]);
    if(relBloco(doc,'tabela')) doc.autoTable({ startY:y, margin:{left:28,right:28}, head:[cab], body:corpo, theme:'grid', styles:{fontSize:7.5, cellPadding:3, halign:'right'}, columnStyles:{0:{halign:'left'}}, headStyles:{fillColor:corCabecalhoPdf(), textColor:corTextoCabecalhoPdf(), halign:'center'} });
  });
  await downloadPdfBlob(doc, 'comexta-dashboards-' + hojeLocalISO() + '.pdf');
}
async function dashBaixar(){
  const ids = DASH_ORDEM.concat(['cad']).filter(i=>state.dashSel[i] && (i==='cad' || dashVisivel(i)));
  if(!ids.length){ toast('Selecione pelo menos um dashboard.'); return; }
  if(state.dashFormato==='xml'){
    dashBaixarArquivo(new Blob([dashXml(ids)], { type:'application/xml;charset=utf-8' }), 'comexta-dashboards-' + hojeLocalISO() + '.xml');
    toast('XML gerado com ' + ids.length + ' dashboard' + (ids.length===1?'':'s') + '.', 'ok');
    return;
  }
  await dashPdf(ids);
}

/* ------------------------------ Dashboards (Chart.js) ----------------------- */
let homeCharts = {};
function destroyHomeCharts(){
  Object.values(homeCharts).forEach(ch=>{ try{ ch.destroy(); }catch(e){} });
  homeCharts = {};
}
function renderHomeCharts(){
  destroyHomeCharts();
  if(typeof Chart==='undefined'){ console.error('Chart.js não carregou — verifique a conexão.'); return; }
  const ctxCad = document.getElementById('chart-cadastros');
  if(ctxCad){
    const cad = dashSnapshotCadastros();
    homeCharts.cadastros = new Chart(ctxCad, {
      type:'bar',
      data:{ labels:cad.map(x=>x[0]), datasets:[{ label:'Cadastros', data:cad.map(x=>x[1]), backgroundColor:['#173A5E','#C07A25','#6E5EA6','#2F6B4F'], borderRadius:5, maxBarThickness:46 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{callbacks:{label:(c)=>' '+c.parsed.y+' cadastro(s)'}} },
        scales:{ y:{ beginAtZero:true, ticks:{precision:0} } } }
    });
  }
  DASH_ORDEM.filter(dashVisivel).forEach(dashDesenhar);
}
