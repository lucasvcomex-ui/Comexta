<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comexta · Importação Simplificada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.min.js"></script>
<style>
:root{
  --paper:#F7F5F0;
  --paper-2:#EFEBE2;
  --ink:#171F2A;
  --ink-soft:#5B6673;
  --navy:#173A5E;
  --navy-deep:#0E2740;
  --navy-100:#EAF0F7;
  --amber:#C07A25;
  --amber-deep:#8F5A17;
  --amber-100:#F5E7CC;
  --green:#2F6B4F;
  --green-100:#E1EEE6;
  --red:#B23A32;
  --red-100:#F6E1DF;
  --line:#E3DACB;
  --line-soft:#EDE8DC;
  --surface:#FFFFFF;
  --shadow: 0 1px 1px rgba(20,35,55,0.04), 0 10px 28px -12px rgba(20,35,55,0.16);
  --shadow-lg: 0 4px 10px rgba(20,35,55,0.05), 0 22px 48px -16px rgba(20,35,55,0.22);
  --radius: 14px;
  --radius-sm: 10px;
  --ease: cubic-bezier(.2,.7,.3,1);
  --font-display:'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-body:'Inter', ui-sans-serif, system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 500px at 10% -10%, #FBF8F1 0%, transparent 60%),
    var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
#app{min-height:100vh; display:flex; flex-direction:column;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--amber-100);}

/* ---------- Topbar ---------- */
.topbar{
  background:linear-gradient(165deg,var(--navy) 0%, var(--navy-deep) 100%);
  color:#fff;
  padding:14px 28px;
  display:flex; align-items:center; gap:18px;
  position:sticky; top:0; z-index:40;
  box-shadow:0 1px 0 rgba(255,255,255,0.06) inset, 0 8px 24px -10px rgba(14,39,64,0.5);
  backdrop-filter:saturate(1.15);
}
.brand{display:flex; align-items:center; gap:0; cursor:pointer; user-select:none;}
.logo-chip{
  background:#fff; border-radius:12px; padding:6px 14px; display:flex; align-items:center;
  box-shadow:0 2px 8px -2px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,255,255,0.6);
  transition:transform .18s var(--ease);
}
.brand:hover .logo-chip{transform:translateY(-1px);}
.logo-chip img{display:block; height:30px; width:auto;}
@media (max-width:760px){ .logo-chip img{height:24px;} .logo-chip{padding:5px 10px;} }
.brand-mark{
  width:36px; height:36px; border-radius:10px;
  background:conic-gradient(from 220deg, var(--amber), var(--amber-deep) 40%, var(--amber) 80%);
  display:flex; align-items:center; justify-content:center;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35);
  flex-shrink:0;
}
.brand-mark svg{width:20px; height:20px;}
.brand-text{display:flex; flex-direction:column; line-height:1.15;}
.brand-text .t1{font-family:var(--font-display); font-weight:700; font-size:16px; letter-spacing:0.2px;}
.brand-text .t2{font-size:11px; color:#B9C9DA; letter-spacing:0.6px; text-transform:uppercase;}
.crumbs{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); margin:0 0 18px; flex-wrap:wrap;}
.crumbs .seg{cursor:pointer; opacity:0.85; transition:opacity .12s ease;}
.crumbs .seg:hover{opacity:1; text-decoration:underline;}
.crumbs .sep{opacity:0.4;}
.crumbs .cur{color:var(--navy); font-weight:700;}
.topbar-spacer{flex:1;}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.pill-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(255,255,255,0.18);
  padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer;
  transition:background .15s ease, transform .1s ease;
}
.pill-btn:hover{background:rgba(255,255,255,0.16);}
.pill-btn:active{transform:translateY(1px);}
.pill-btn svg{width:14px;height:14px;}

/* ---------- Top nav (Início / Importação Simplificada / Cadastro) ---------- */
.topnav{display:flex; align-items:center; gap:4px;}
.nav-btn{
  display:inline-flex; align-items:center; gap:8px; background:transparent; border:1px solid transparent;
  color:#EAF0F7; padding:9px 14px; border-radius:9px; font-weight:600; font-size:13.5px; cursor:pointer;
  white-space:nowrap; transition:background .15s ease;
}
.nav-btn svg{width:15px; height:15px; flex-shrink:0;}
.nav-btn:hover{background:rgba(255,255,255,0.10);}
.nav-btn.active{background:rgba(255,255,255,0.14); color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.22);}
.nav-group{position:relative;}
.nav-dropdown{
  position:absolute; top:calc(100% + 8px); left:0; min-width:220px; background:var(--surface);
  border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:8px;
  display:none; z-index:60;
}
.nav-dropdown.open{display:block;}
.nav-drop-item{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:7px;
  font-size:13px; font-weight:600; color:var(--ink); cursor:pointer;
}
.nav-drop-item svg{width:15px; height:15px; color:var(--amber-deep); flex-shrink:0;}
.nav-drop-item:hover{background:var(--paper);}
.nav-drop-item-parent{
  position:relative; display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:9px 10px; border-radius:7px; font-size:13px; font-weight:600; color:var(--ink); cursor:default;
}
.nav-drop-item-parent:hover{background:var(--paper);}
.nav-drop-item-parent .npl{display:flex; align-items:center; gap:10px;}
.nav-drop-item-parent svg.chev-right{width:13px; height:13px; color:var(--ink-soft); flex-shrink:0;}
.nav-flyout{
  position:absolute; top:-8px; left:calc(100% + 6px); min-width:200px; background:var(--surface);
  border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:8px;
  display:none; z-index:70;
}
.nav-drop-item-parent:hover .nav-flyout{display:block;}
@media (max-width:760px){
  .topnav{gap:0;}
  .nav-btn{padding:8px 9px; font-size:12px;}
  .brand-text{display:none;}
}

/* ---------- Layout shell ---------- */
.shell{flex:1; display:flex; width:100%;}
.sidenav{
  width:230px; flex-shrink:0; background:var(--navy-100); border-right:1px solid var(--line);
  padding:22px 14px; display:flex; flex-direction:column; gap:4px;
}
.sidenav .grp-label{font-size:11px; text-transform:uppercase; letter-spacing:0.7px; color:var(--ink-soft); margin:14px 8px 6px;}
.sidenav .side-sublabel{font-size:10px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-soft); opacity:0.75; margin:10px 8px 3px; min-height:12px;}
.side-link{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-sm);
  font-size:13.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; border:1px solid transparent;
  transition:background .15s var(--ease), color .15s var(--ease);
}
.side-link svg{width:16px;height:16px; flex-shrink:0;}
.side-link:hover{background:rgba(23,58,94,0.07); color:var(--navy);}
.side-link.active{background:var(--surface); color:var(--navy); border-color:var(--line); box-shadow:var(--shadow);}
.main{flex:1; padding:30px 34px 70px; max-width:1280px;}
.main.wide{max-width:none;}

/* ---------- Typography ---------- */
h1,h2,h3{font-family:var(--font-display); margin:0; color:var(--navy-deep);}
.page-title{font-size:27px; font-weight:700; letter-spacing:-0.3px;}
.page-sub{color:var(--ink-soft); font-size:14px; margin-top:5px; max-width:640px; line-height:1.5;}
.section-title{font-family:var(--font-display); font-size:15px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:0.5px; display:flex; align-items:center; gap:10px;}
.section-title .num{
  font-family:var(--font-mono); font-size:11px; color:var(--amber-deep); background:var(--amber-100);
  border-radius:6px; padding:2px 7px; font-weight:600;
}

/* ---------- Cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:24px 26px; margin-bottom:22px;
  transition:box-shadow .2s var(--ease);
}
.card-flat{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius); padding:19px 21px;}
.hairline{border:none; border-top:1px dashed var(--line); margin:20px 0;}

/* ---------- Dashboards ---------- */
.dash-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:980px){.dash-grid{grid-template-columns:1fr;}}
.dash-card{display:flex; flex-direction:column; gap:12px;}
.dash-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:var(--ink-soft);}
.dash-canvas-wrap{position:relative; height:220px;}
.dash-empty{
  height:220px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  color:var(--ink-soft); font-size:12.5px; text-align:center; border:1.5px dashed var(--line); border-radius:10px; padding:0 16px;
}
.dash-empty svg{width:26px; height:26px; color:var(--line);}

/* ---------- Home ---------- */
.home-hero{padding:46px 6px 10px;}
.home-hero .kicker{
  font-family:var(--font-mono); font-size:12px; letter-spacing:2px; text-transform:uppercase;
  color:var(--amber-deep); display:flex; align-items:center; gap:10px;
}
.home-hero .kicker::before{content:''; width:26px; height:1px; background:var(--amber-deep); display:inline-block;}
.home-hero h1{font-size:40px; margin-top:10px; max-width:680px; line-height:1.08;}
.home-hero p{color:var(--ink-soft); font-size:15px; max-width:560px; margin-top:14px; line-height:1.55;}

.module-grid{display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:34px;}
@media (max-width:880px){.module-grid{grid-template-columns:1fr;}}
.module-card{
  background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden;
  box-shadow:var(--shadow); transition:box-shadow .2s var(--ease), transform .2s var(--ease);
}
.module-card:hover{box-shadow:var(--shadow-lg); transform:translateY(-2px);}
.module-head{
  padding:24px 24px 20px; cursor:pointer; display:flex; align-items:flex-start; gap:16px; user-select:none;
}
.module-icon{
  width:46px; height:46px; border-radius:12px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.module-icon svg{width:24px; height:24px;}
.module-card.blue .module-icon{background:var(--navy-100); color:var(--navy);}
.module-card.amber .module-icon{background:var(--amber-100); color:var(--amber-deep);}
.module-head .mt{flex:1;}
.module-head h3{font-size:18px;}
.module-head p{margin:5px 0 0; font-size:13px; color:var(--ink-soft); line-height:1.45;}
.module-chevron{width:18px; height:18px; color:var(--ink-soft); transition:transform .2s ease; margin-top:6px; flex-shrink:0;}
.module-card.open .module-chevron{transform:rotate(90deg);}
.module-sub{max-height:0; overflow:hidden; transition:max-height .28s ease;}
.module-card.open .module-sub{max-height:260px;}
.module-sub-inner{padding:0 22px 22px; display:flex; flex-direction:column; gap:8px;}
.sub-btn{
  display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:11px;
  background:var(--paper); border:1px solid var(--line-soft); cursor:pointer; font-weight:600; font-size:13.5px; color:var(--ink);
  transition:background .15s ease, border-color .15s ease, transform .15s ease;
}
.sub-btn:hover{background:#fff; border-color:var(--amber); transform:translateX(2px);}
.sub-btn svg{width:16px;height:16px; color:var(--amber-deep); flex-shrink:0;}
.sub-btn .desc{font-weight:400; color:var(--ink-soft); font-size:12px; margin-left:auto; text-align:right;}

.home-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:30px;}
@media (max-width:880px){.home-stats{grid-template-columns:1fr;}}
.stat-card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px; transition:box-shadow .18s var(--ease);}
.stat-card:hover{box-shadow:var(--shadow);}
.stat-card .lbl{font-size:11.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); font-weight:600;}
.stat-card .val{font-family:var(--font-mono); font-size:24px; font-weight:600; color:var(--navy-deep); margin-top:6px;}
.stat-card .sub{font-size:12px; color:var(--ink-soft); margin-top:3px;}

/* ---------- Forms ---------- */
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:12px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.3px;}
.field input, .field select{
  border:1px solid var(--line); background:#fff; border-radius:var(--radius-sm); padding:10px 12px; font-size:14px;
  font-family:var(--font-body); color:var(--ink); outline:none; transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.field input.input-blue, .field select.input-blue, td input.input-blue{
  background:#EAF2FC; border-color:#BFD7F0;
}
.field input:focus, .field select:focus, td input:focus{border-color:var(--navy); box-shadow:0 0 0 3px rgba(23,58,94,0.12);}
.field .hint{font-size:11.5px; color:var(--ink-soft); opacity:0.85;}
.field-row{display:grid; gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
.grid-4{grid-template-columns:1fr 1fr 1fr 1fr;}
@media (max-width:760px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
input[readonly]{background:var(--paper-2) !important; color:var(--ink-soft); cursor:default;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px; border-radius:var(--radius-sm); padding:11px 18px;
  font-weight:700; font-size:13.5px; cursor:pointer; border:1px solid transparent; transition:filter .15s var(--ease), transform .1s var(--ease), box-shadow .15s var(--ease);
}
.btn svg{width:15px;height:15px;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy); color:#fff; box-shadow:0 1px 2px rgba(23,58,94,0.15);}
.btn-primary:hover{filter:brightness(1.12); box-shadow:0 4px 12px -4px rgba(23,58,94,0.4);}
.btn-amber{background:var(--amber); color:#fff; box-shadow:0 1px 2px rgba(192,122,37,0.15);}
.btn-amber:hover{filter:brightness(1.08); box-shadow:0 4px 12px -4px rgba(192,122,37,0.4);}
.btn-ghost{background:transparent; color:var(--navy); border-color:var(--line);}
.btn-ghost:hover{background:var(--navy-100);}
.btn-danger{background:transparent; color:var(--red); border-color:var(--red-100);}
.btn-danger:hover{background:var(--red-100);}
.btn-sm{padding:7px 12px; font-size:12.5px; border-radius:8px;}
.btn[disabled]{opacity:0.45; cursor:not-allowed;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-sm);}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:640px;}
thead th{
  background:var(--navy-100); color:var(--navy-deep); text-align:left; font-size:11px;
  text-transform:uppercase; letter-spacing:0.4px; padding:10px 12px; white-space:nowrap; font-weight:700;
  border-bottom:1px solid var(--line);
}
tbody td{padding:9px 10px; border-bottom:1px solid var(--line-soft); white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr{transition:background .12s ease;}
tbody tr:hover{background:#FBFAF6;}
tfoot td{padding:10px 12px; font-weight:700; background:var(--paper-2); border-top:2px solid var(--line); font-family:var(--font-mono);}
td input{width:100%; min-width:90px; border:1px solid var(--line); border-radius:7px; padding:7px 8px; font-size:13px; font-family:var(--font-body);}
.num-mono{font-family:var(--font-mono); text-align:right;}
td.num-mono, th.num-mono{text-align:right;}
.row-remove{color:var(--red); cursor:pointer; background:none; border:none; padding:4px;}
.row-remove svg{width:15px;height:15px;}

/* ---------- Badges / alerts ---------- */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; letter-spacing:0.2px;}
.badge-green{background:var(--green-100); color:var(--green);}
.badge-red{background:var(--red-100); color:var(--red);}
.badge-amber{background:var(--amber-100); color:var(--amber-deep);}
.badge-navy{background:var(--navy-100); color:var(--navy);}
.badge-ok{background:var(--green-100); color:var(--green);}
.badge-danger{background:var(--red-100); color:var(--red);}
.alert{border-radius:var(--radius-sm); padding:14px 16px; display:flex; gap:12px; align-items:flex-start; font-size:13px; border:1px solid;}
.alert svg{width:18px;height:18px; flex-shrink:0; margin-top:1px;}
.alert-ok{background:var(--green-100); border-color:#BFDCC9; color:#1F5A3D;}
.alert-warn{background:var(--red-100); border-color:#E9C2BD; color:#8C2C25;}
.alert-info{background:var(--navy-100); border-color:#C9D8E7; color:var(--navy-deep);}
.stamp{
  font-family:var(--font-mono); font-weight:700; font-size:12px; color:var(--amber-deep);
  border:1.5px dashed var(--amber-deep); border-radius:8px; padding:4px 10px; display:inline-block;
  transform:rotate(-2deg); background:var(--amber-100);
}

/* ---------- Summary strip ---------- */
.kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px 18px; transition:box-shadow .18s var(--ease), transform .18s var(--ease);}
.kpi:hover{box-shadow:var(--shadow); transform:translateY(-1px);}
.kpi .k-lbl{font-size:11px; text-transform:uppercase; color:var(--ink-soft); font-weight:700; letter-spacing:0.4px;}
.kpi .k-val{font-family:var(--font-mono); font-size:19px; font-weight:600; margin-top:6px; color:var(--navy-deep);}
.kpi .k-sub{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

/* ---------- Toast ---------- */
#toast-wrap{position:fixed; bottom:22px; right:22px; z-index:100; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--navy-deep); color:#fff; padding:12px 18px; border-radius:9px; font-size:13px; font-weight:600;
  box-shadow:0 10px 30px -10px rgba(0,0,0,0.4); display:flex; align-items:center; gap:10px;
  animation:toastIn .25s ease;
}
.toast svg{width:16px;height:16px; color:var(--amber);}
@keyframes toastIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Empty state ---------- */
.empty{
  text-align:center; padding:52px 24px; color:var(--ink-soft); border:1.5px dashed var(--line); border-radius:12px;
}
.empty svg{width:38px; height:38px; color:var(--line); margin-bottom:12px;}
.empty h3{color:var(--ink); font-size:15px; margin-bottom:6px;}
.empty p{font-size:13px; max-width:340px; margin:0 auto;}

/* ---------- Cadastro list ---------- */
.cad-list{display:flex; flex-direction:column; gap:0;}
.cad-item{display:flex; align-items:center; gap:14px; padding:14px 4px; border-bottom:1px solid var(--line-soft);}
.cad-item:last-child{border-bottom:none;}
.cad-avatar{
  width:36px; height:36px; border-radius:8px; background:var(--navy-100); color:var(--navy);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;
}
.cad-avatar.cad-avatar-lg{ width:68px; height:68px; border-radius:10px; font-size:22px; }
.cad-avatar.cad-avatar-lg svg{ width:26px; height:26px; }
.cad-item .ci-main{flex:1; min-width:0;}
.cad-item .ci-name{font-weight:600; font-size:14px;}
.cad-item .ci-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.cad-item .ci-actions{display:flex; gap:6px; flex-shrink:0;}
.icon-btn{
  width:30px; height:30px; border-radius:7px; border:1px solid var(--line); background:#fff; cursor:pointer;
  display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
}
.icon-btn:hover{background:var(--navy-100); color:var(--navy);}
.icon-btn-danger{background:var(--red); color:#fff; border-color:var(--red); animation:pulseDanger 1s ease infinite;}
.icon-btn-danger:hover{background:var(--red); color:#fff; filter:brightness(1.1);}
@keyframes pulseDanger{0%,100%{opacity:1;} 50%{opacity:0.65;}}
.icon-btn svg{width:14px;height:14px;}

/* ---------- Form tabs (Cadastro rico) ---------- */
.form-tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:20px; flex-wrap:wrap;}
.form-tab{
  display:inline-flex; align-items:center; gap:7px; padding:10px 16px; font-size:13px; font-weight:700;
  color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
  transition:color .15s ease, border-color .15s ease;
}
.form-tab svg{width:15px; height:15px;}
.form-tab:hover{color:var(--navy);}
.form-tab.active{color:var(--navy); border-bottom-color:var(--amber);}
.form-tab .tab-count{
  font-family:var(--font-mono); font-size:10.5px; background:var(--navy-100); color:var(--navy);
  border-radius:999px; padding:1px 7px; font-weight:700;
}

/* ---------- Visualização somente leitura (Cadastro) ---------- */
.view-section-title{
  font-family:var(--font-display); font-size:12px; font-weight:700; color:var(--navy);
  text-transform:uppercase; letter-spacing:0.5px; margin:22px 0 12px;
}
.view-section-title:first-of-type{margin-top:0;}
.view-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px 20px;}
@media (max-width:760px){.view-grid{grid-template-columns:1fr;}}
.view-field{display:flex; flex-direction:column; gap:3px; min-width:0;}
.view-label{font-size:11px; text-transform:uppercase; letter-spacing:0.3px; color:var(--ink-soft); font-weight:600;}
.view-value{font-size:13.5px; color:var(--ink); word-break:break-word;}
.foto-view-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:14px; margin-bottom:6px;}
.foto-view-item{position:relative; border-radius:10px; overflow:hidden; border:2px solid var(--line); aspect-ratio:1; cursor:zoom-in;}
.foto-view-item.is-principal{border-color:var(--amber);}
.foto-view-item img{width:100%; height:100%; object-fit:cover; display:block;}
.foto-view-item .foto-badge{position:absolute; top:6px; left:6px;}

/* ---------- Lightbox (ampliar imagem) ---------- */
.lightbox-overlay{
  position:fixed; inset:0; background:rgba(14,20,26,0.9); z-index:200;
  display:flex; align-items:center; justify-content:center; padding:40px; cursor:zoom-out;
  animation:toastIn .15s ease;
}
.lightbox-overlay img{max-width:100%; max-height:100%; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,0.5); cursor:default;}

/* ---------- Autocomplete (busca no Cadastro) ---------- */
.ac-dropdown{
  position:fixed; background:#fff; border:1px solid var(--line); border-radius:9px;
  box-shadow:var(--shadow); max-height:230px; overflow-y:auto; z-index:300;
}
.ac-option{padding:9px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line-soft); color:var(--ink);}
.ac-option:last-child{border-bottom:none;}
.ac-option:hover{background:var(--paper);}
.ac-option .ac-sub{font-size:11px; color:var(--ink-soft); margin-top:2px;}

/* ---------- Documentos (upload/drag-drop) ---------- */
.doc-dropzone{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  border:1.5px dashed var(--line); border-radius:12px; padding:26px 20px; text-align:center; cursor:pointer;
  color:var(--ink-soft); font-size:13px; transition:border-color .15s ease, background .15s ease;
}
.doc-dropzone svg{width:24px; height:24px; color:var(--amber-deep);}
.doc-dropzone b{color:var(--ink);}
.doc-dropzone:hover, .doc-dropzone.dragover{border-color:var(--amber); background:var(--amber-100);}

/* ---------- Filter bar ---------- */
.filter-bar{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:18px;}
.view-toggle{display:inline-flex; gap:2px; background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:3px;}
.view-toggle-btn{display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:7px; border:none; background:transparent; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
.view-toggle-btn svg{width:15px; height:15px;}
.view-toggle-btn.active{background:var(--surface); color:var(--navy); box-shadow:var(--shadow);}
.kanban-board{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-items:start;}
.kanban-column{background:var(--paper); border:1px solid var(--line-soft); border-radius:12px; padding:10px; min-height:120px;}
.kanban-column-header{display:flex; align-items:center; justify-content:space-between; padding:4px 4px 10px;}
.kanban-count{font-size:12px; font-weight:700; color:var(--ink-soft);}
.kanban-column-body{display:flex; flex-direction:column; gap:10px; min-height:80px; border-radius:8px; padding:4px; transition:background .15s;}
.kanban-column-body.dragover{background:var(--navy-100);}
.kanban-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px; cursor:grab; box-shadow:var(--shadow); transition:opacity .15s, transform .15s;}
.kanban-card:active{cursor:grabbing;}
.kanban-card.dragging{opacity:0.4;}
.kanban-card-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.kanban-card-cliente{font-weight:700; font-size:13.5px; color:var(--ink); margin-bottom:6px;}
.kanban-card-row{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); margin-bottom:3px; line-height:1.4;}
.kanban-card-row svg{width:13px; height:13px; flex-shrink:0; color:var(--amber-deep);}
.kanban-empty{font-size:12px; color:var(--ink-soft); text-align:center; padding:20px 8px; font-style:italic;}
@media (max-width:900px){ .kanban-board{grid-template-columns:1fr 1fr;} }
@media (max-width:600px){ .kanban-board{grid-template-columns:1fr;} }
.filter-bar .field{min-width:170px;}

/* ---------- Tabs (module subnav rendered inside sidenav already) ---------- */
.footer-note{margin-top:36px; padding-top:18px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-soft); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

@media (max-width:760px){
  .sidenav{display:none;}
  .main{padding:22px 16px 60px;}
  .topbar{padding:12px 16px;}
  .crumbs{display:none;}
}

/* =========================================================================
   MANIFESTO — ERP de Importação Simplificada
   Baseado na planilha "Simulação Importação Simplificada"

/* ---------------------------- Utilidades ------------------------------- */
function num(v){ v = typeof v==='string' ? v.replace(',', '.') : v; const n = parseFloat(v); return isFinite(n) ? n : 0; }
function sum(arr){ return arr.reduce((a,b)=>a+(num(b)||0),0); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtBRL(n){ return (num(n)).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtUSD(n){ return (num(n)).toLocaleString('en-US',{style:'currency',currency:'USD'}); }
function fmtMoedaExt(n, moeda){
  const v = num(n);
  if(moeda==='EUR') return v.toLocaleString('de-DE',{style:'currency',currency:'EUR'});
  if(moeda==='RMB') return 'CN¥ '+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return v.toLocaleString('en-US',{style:'currency',currency:'USD'}); // USD (padrão)
}
function fmtNum(n,d=2){ return (num(n)).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtPct(n){ return (num(n)*100).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%'; }
function fmtPctEdit(n){
  let v = Math.round(num(n)*100*10000)/10000; // elimina ruído de ponto flutuante (ex: 7.000000000000001 -> 7)
  if(!isFinite(v)) v = 0;
  let s = v.toFixed(4).replace(/0+$/,'').replace(/\.$/,'');
  if(s===''||s==='-0') s = '0';
  return s.replace('.', ',');
}
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function fmtBytes(n){ n=num(n); if(n<1024) return n+' B'; if(n<1024*1024) return (n/1024).toFixed(1)+' KB'; return (n/1024/1024).toFixed(2)+' MB'; }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function getPath(obj, path){ return path.split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj); }
function setPath(obj, path, val){
  const parts = path.split('.'); let o = obj;
  for(let i=0;i<parts.length-1;i++){ o = o[parts[i]]; }
  o[parts[parts.length-1]] = val;
}
function toast(msg, kind){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = (kind==='ok'?ICONS.check:ICONS.info) + '<span>'+esc(msg)+'</span>';
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s ease'; el.style.opacity='0'; setTimeout(()=>el.remove(),320); }, 2600);
}

/* ------------------------------ Storage --------------------------------- */
async function storeGet(key){
  try{
    const raw = localStorage.getItem('comexta:'+key);
    return raw!==null ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function storeSet(key, value){
  try{ localStorage.setItem('comexta:'+key, JSON.stringify(value)); return true; }
  catch(e){ console.error('storage set failed', key, e); return false; }
}
async function storeDelete(key){
  try{ localStorage.removeItem('comexta:'+key); return true; }
  catch(e){ return false; }
}

// Preenche campos que possam faltar em rascunhos/cotações salvos antes de alguma atualização
// (ex: "anexos" foi adicionado depois — sem isso, dados antigos ficariam com anexos undefined).
function normalizeDados(d){
  const base = dadosPadrao();
  const merged = Object.assign({}, base, d||{});
  if(!Array.isArray(merged.produtos) || merged.produtos.length===0) merged.produtos = [novoProduto()];
  if(!Array.isArray(merged.despExtra) || merged.despExtra.length<4){
    const src = (d && Array.isArray(d.despExtra)) ? d.despExtra : [];
    merged.despExtra = [0,1,2,3].map(i=> src[i]!==undefined ? src[i] : '');
  }
  if(!Array.isArray(merged.anexos)) merged.anexos = [];
  // Compatibilidade com cotações salvas antes da correção do bug de dupla conversão:
  // se vier > 1, é o formato antigo (percentual cru, ex: 60) — converte para fração (0.60).
  if(num(merged.ii) > 1) merged.ii = num(merged.ii)/100;
  if(num(merged.icms) > 1) merged.icms = num(merged.icms)/100;
  return merged;
}

/* =========================== IMPORTAÇÃO FORMAL =============================
   Escopo: motor de cálculo fiel às fórmulas centrais da planilha anexada
   (Invoice, Frete+Seguro, Despesas que compõem a Nota Fiscal, Desembaraço com
   II/IPI/PIS/COFINS/ICMS e rateio por produto). Não replica os 11 câmbios por
   invoice nem a lista extensa de taxas de origem/destino nomeadas da planilha
   original — usa um câmbio por seção, no mesmo padrão da Importação Simplificada. */
function novoProdutoFormal(){
  return {id:uid(), fornecedor:'', produto:'', ncm:'', quantidade:'', valorUnit:'', pesoLiquido:'', cambio:'',
    ii:'', ipi:'', pis:'', cofins:'', icms:''};
}
function novaDespesaLinha(descricao='', moeda='R$'){ return {id:uid(), descricao, tarifa:'', moeda, tipoCalculo:'', quantidade:''}; }
function calcDespesaLinha(linha, cambio){
  const tarifa = num(linha.tarifa), qtd = num(linha.quantidade);
  const taxaAplicada = linha.moeda && linha.moeda!=='R$' ? cambio : 1;
  const tarifaReal = tarifa*taxaAplicada;
  const total = tarifaReal*qtd;
  return {...linha, tarifaReal, total};
}
function dadosFormalPadrao(){

function normalizeDadosFormal(d){
  const base = dadosFormalPadrao();
  const merged = Object.assign({}, base, d||{});
  if(!Array.isArray(merged.produtos) || merged.produtos.length===0) merged.produtos = [novoProdutoFormal()];
  merged.produtos = merged.produtos.map(p=>{
    const prod = Object.assign({}, novoProdutoFormal(), p);
    // Compatibilidade com cotações salvas antes da correção do bug de dupla conversão:
    // se vier > 1, é o formato antigo (percentual cru, ex: 18) — converte para fração (0.18).
    ['ii','ipi','pis','cofins','icms'].forEach(k=>{ if(num(prod[k]) > 1) prod[k] = num(prod[k])/100; });
    return prod;
  });
  ['freteLinhas','taxasOrigem','taxasDestino','armazenagemLinhas','outrasDespesasLinhas'].forEach(k=>{
    if(!Array.isArray(merged[k]) || merged[k].length===0) merged[k] = base[k];
  });
  if(!Array.isArray(merged.anexos)) merged.anexos = [];
  return merged;
}
function computeDadosFormal(d){
  const produtos = d.produtos.map(p=>{
    const qty = num(p.quantidade), vu = num(p.valorUnit), peso = num(p.pesoLiquido), cambio = num(p.cambio);
    const totalUSD = qty*vu;
    const totalBRL = totalUSD*cambio;
    return {...p, qty, vu, peso, cambio, totalUSD, totalBRL};
  });
  const sumQty = sum(produtos.map(p=>p.qty));
  const sumPeso = sum(produtos.map(p=>p.peso));
  const sumTotalUSD = sum(produtos.map(p=>p.totalUSD));
  const sumTotalBRL = sum(produtos.map(p=>p.totalBRL));

  const freteCambio = num(d.freteCambio);
  const freteLinhasCalc = d.freteLinhas.map(l=>calcDespesaLinha(l,freteCambio));
  const taxasOrigemCalc = d.taxasOrigem.map(l=>calcDespesaLinha(l,freteCambio));
  const taxasDestinoCalc = d.taxasDestino.map(l=>calcDespesaLinha(l,freteCambio));
  const freteTotalBRL = sum(freteLinhasCalc.map(l=>l.total))+sum(taxasOrigemCalc.map(l=>l.total))+sum(taxasDestinoCalc.map(l=>l.total));

  const armazenagemCambio = num(d.armazenagemCambio);
  const armazenagemLinhasCalc = d.armazenagemLinhas.map(l=>calcDespesaLinha(l,armazenagemCambio));
  const armazenagemTotal = sum(armazenagemLinhasCalc.map(l=>l.total));

  const outrasCambio = num(d.outrasDespesasCambio);
  const outrasLinhasCalc = d.outrasDespesasLinhas.map(l=>calcDespesaLinha(l,outrasCambio));
  const outrasTotal = sum(outrasLinhasCalc.map(l=>l.total));

  const despesasNF = armazenagemTotal+outrasTotal+num(d.capatazia)+num(d.siscomex)+num(d.afrmm); // compõem a Nota Fiscal, rateadas por valor
  const afrmmSiscomexTotal = num(d.siscomex)+num(d.afrmm); // só estes dois entram na base do ICMS

  const cambioDesembaraco = num(d.desembaracoCambio);
  const freteExtD = num(d.desembaracoFreteExt), seguroExtD = num(d.desembaracoSeguroExt), acrescimoExtD = num(d.desembaracoAcrescimoExt);
  const freteBRLD = cambioDesembaraco*freteExtD;
  const seguroBRLD = cambioDesembaraco*seguroExtD;
  const acrescimoBRLD = cambioDesembaraco*acrescimoExtD;

  // VMLE (Valor da Mercadoria no Local de Embarque) e VMLD (VMLE + Frete + Seguro)
  const vmleUSD = sumTotalUSD, vmleBRL = sumTotalBRL;
  const vmldUSD = vmleUSD+freteExtD+seguroExtD;
  const vmldBRL = vmleBRL+freteBRLD+seguroBRLD;

  return { produtos, sumQty, sumPeso, sumTotalUSD, sumTotalBRL,
    freteLinhasCalc, taxasOrigemCalc, taxasDestinoCalc, freteTotalBRL,
    armazenagemLinhasCalc, armazenagemTotal, outrasLinhasCalc, outrasTotal, despesasNF, afrmmSiscomexTotal,
    freteExtD, seguroExtD, acrescimoExtD, freteBRLD, seguroBRLD, acrescimoBRLD,
    vmleUSD, vmleBRL, vmldUSD, vmldBRL };
}
function computeRateioFormal(d, c){
  const linhas = c.produtos.map(p=>{
    if(!(p.qty>0) && !p.fornecedor && !p.produto) return null;
    const pesoShare = c.sumPeso>0 ? p.peso/c.sumPeso : 0;
    const valorShare = c.sumTotalUSD>0 ? p.totalUSD/c.sumTotalUSD : 0;
    const rateioFrete = pesoShare*c.freteBRLD;                        // rateio por peso (I)
    const rateioSeguro = valorShare*c.seguroBRLD;                     // rateio por valor (J)
    const rateioAcrescimo = valorShare*c.acrescimoBRLD;               // rateio por valor (K)
    const valorAduaneiro = p.totalBRL+rateioFrete+rateioSeguro+rateioAcrescimo; // L — base do I.I./I.P.I./PIS/COFINS
    const vmldProduto = p.totalBRL+rateioFrete+rateioSeguro;          // VMLD por produto (sem acréscimo)
    const rateioDespesasNF = valorShare*c.despesasNF;                 // Capatazia + Siscomex + AFRMM + Armazenagem + Outras (soma no custo final)
    const rateioAfrmmSiscomex = valorShare*c.afrmmSiscomexTotal;      // só Siscomex + AFRMM (base do ICMS)

    // --- Colunas de exibição da tabela "Rateio dos Custos por Produto" (Numerário/PDF) ---
    // Rateio Frete exibido = Frete Marítimo + Taxas de Origem + Taxas de Destino (aba Frete) + Seguro
    const rateioFreteTabela = pesoShare*c.freteTotalBRL + rateioSeguro;
    const rateioArmazenagemTabela = valorShare*c.armazenagemTotal;
    const rateioOutrasTabela = valorShare*(c.outrasTotal + num(d.capatazia) + num(d.siscomex));
    const rateioAfrmmTabela = valorShare*num(d.afrmm);

    const iiRate = num(p.ii), ipiRate = num(p.ipi), pisRate = num(p.pis), cofinsRate = num(p.cofins), icmsRate = num(p.icms);
    const bcII = valorAduaneiro;
    const ii = bcII*iiRate;
    const bcIpi = bcII+ii;
    const ipi = bcIpi*ipiRate;
    const bcPis = valorAduaneiro;
    const pis = bcPis*pisRate;
    const bcCofins = valorAduaneiro;
    const cofins = bcCofins*cofinsRate;
    // Base do ICMS = Valor Aduaneiro (com Acréscimo) + I.I. + I.P.I. + PIS + COFINS + AFRMM + Tx Siscomex
    // (replica exatamente a fórmula da planilha original: Desembaraço!AB = (L+P+S+V+Y+Z+AA)/(1-AC))
    const bcIcms = icmsRate<1 ? (valorAduaneiro+ii+ipi+pis+cofins+rateioAfrmmSiscomex)/(1-icmsRate) : 0;
    const icms = bcIcms*icmsRate;

    const custoTotalComCredito = valorAduaneiro+ii+rateioDespesasNF;
    const custoTotalSemCredito = valorAduaneiro+ii+ipi+pis+cofins+icms+rateioDespesasNF;
    const custoUnitComCredito = p.qty>0 ? custoTotalComCredito/p.qty : 0;
    const custoUnitSemCredito = p.qty>0 ? custoTotalSemCredito/p.qty : 0;

    return {...p, rateioFrete, rateioSeguro, rateioAcrescimo, valorAduaneiro, vmldProduto, rateioDespesasNF, rateioAfrmmSiscomex,
      rateioFreteTabela, rateioArmazenagemTabela, rateioOutrasTabela, rateioAfrmmTabela,
      // percentuais originais preservados (o.ii/.ipi/etc abaixo são sobrescritos pelos VALORES em R$)
      iiPct:num(p.ii), ipiPct:num(p.ipi), pisPct:num(p.pis), cofinsPct:num(p.cofins), icmsPct:num(p.icms),
      bcII, ii, bcIpi, ipi, bcPis, pis, bcCofins, cofins, bcIcms, icms,
      custoTotalComCredito, custoUnitComCredito, custoTotalSemCredito, custoUnitSemCredito};
  }).filter(Boolean);

  const totais = {
    qty: sum(linhas.map(l=>l.qty)), peso: sum(linhas.map(l=>l.peso)),
    totalUSD: sum(linhas.map(l=>l.totalUSD)), totalBRL: sum(linhas.map(l=>l.totalBRL)),
    rateioFrete: sum(linhas.map(l=>l.rateioFrete)), rateioSeguro: sum(linhas.map(l=>l.rateioSeguro)), rateioAcrescimo: sum(linhas.map(l=>l.rateioAcrescimo)),
    valorAduaneiro: sum(linhas.map(l=>l.valorAduaneiro)), rateioDespesasNF: sum(linhas.map(l=>l.rateioDespesasNF)),
    rateioFreteTabela: sum(linhas.map(l=>l.rateioFreteTabela)), rateioArmazenagemTabela: sum(linhas.map(l=>l.rateioArmazenagemTabela)),
    rateioOutrasTabela: sum(linhas.map(l=>l.rateioOutrasTabela)), rateioAfrmmTabela: sum(linhas.map(l=>l.rateioAfrmmTabela)),
    ii: sum(linhas.map(l=>l.ii)), ipi: sum(linhas.map(l=>l.ipi)), pis: sum(linhas.map(l=>l.pis)),
    cofins: sum(linhas.map(l=>l.cofins)), icms: sum(linhas.map(l=>l.icms)),
    custoTotalComCredito: sum(linhas.map(l=>l.custoTotalComCredito)),
    custoTotalSemCredito: sum(linhas.map(l=>l.custoTotalSemCredito)),
  };
  return { linhas, totais };
}

/* ============================ SIMULADOR DE CARGA ============================
   Cálculo estimado de ocupação de container (volume/peso/paletes), não é um
   otimizador de bin-packing 3D real — serve para planejamento e visualização
   aproximada, arredondando para cima o número de containers necessários. */
function novaCaixaSimulador(idx){
  return {id:uid(), nome:'', comprimento:'', largura:'', altura:'', quantidade:'', pesoPeca:'', cor: CORES_CAIXA[(idx||0)%CORES_CAIXA.length]};
}
function simulacaoPadrao(){
  return {
    nome:'',
    caixas:[novaCaixaSimulador(0)],
    tipoCarregamento:'solta', // solta | granel | pallets
    palete:{comprimento:'120', largura:'80', altura:'16', alturaMaxCarregamento:'200', cargaUtil:'1500', pesoPalete:'25'},
    containerTipos:[],
    embalagemTipo:'caixa-papelao',
    embalagemObs:'',
  };
}
function normalizeSimulacao(s){
  const base = simulacaoPadrao();
  const merged = Object.assign({}, base, s||{});
  if(!Array.isArray(merged.caixas) || merged.caixas.length===0) merged.caixas = [novaCaixaSimulador(0)];
  merged.palete = Object.assign({}, base.palete, merged.palete||{});
  if(!s || !Array.isArray(s.containerTipos)){
    // compatibilidade com simulações salvas antes do multi-seleção (campo antigo: containerTipo string)
    merged.containerTipos = (s && s.containerTipo) ? [s.containerTipo] : [];
  }
  delete merged.containerTipo;
  return merged;
}
function computeCaixaSimulador(cx){
  const qty = num(cx.quantidade), peso = num(cx.pesoPeca);
  const comp = num(cx.comprimento), larg = num(cx.largura), alt = num(cx.altura);
  const volumeUnitM3 = (comp*larg*alt)/1e6; // cm³ → m³
  const cbm = volumeUnitM3*qty;
  const pesoTotal = peso*qty;
  return {...cx, qty, peso, comp, larg, alt, volumeUnitM3, cbm, pesoTotal};
}
function computeSimulacao(sim){
  const caixas = sim.caixas.map(computeCaixaSimulador);
  const totalUnidades = sum(caixas.map(c=>c.qty));
  const totalCbm = sum(caixas.map(c=>c.cbm));
  const totalPeso = sum(caixas.map(c=>c.pesoTotal));
  return { caixas, totalUnidades, totalCbm, totalPeso };
}
function computePaleteCbmUtil(p){
  const comp=num(p.comprimento), larg=num(p.largura), altMax=num(p.alturaMaxCarregamento);
  return (comp*larg*altMax)/1e6; // m³ utilizáveis por palete (área x altura máxima de carregamento)
}
/* Aloca as caixas (Carga Solta/Granel) container a container, respeitando ao mesmo tempo o
   limite de volume (capacidadeCbm) E o limite de peso (maxPayload) de cada container — evita
   que um container "feche" por peso enquanto o cálculo de volume (ou vice-versa) ainda pensa
   que a carga toda coube no 1º container. */
function alocarContainersSolta(caixasComputadas, capacidadeCbm, maxPayload){
  const containers = [];
  let atual = { itens:[], volTotal:0, pesoTotal:0 };
  const fila = caixasComputadas.filter(c=>c.qty>0).map(c=>({...c, restante:c.qty}));
  if(fila.length===0) return containers;
  let seguro = 0;
  while(fila.some(c=>c.restante>0) && seguro<2000){
    seguro++;
    let progresso = false;
    for(const cx of fila){
      if(cx.restante<=0) continue;
      const volPerUnit = cx.volumeUnitM3||0, pesoPerUnit = cx.peso||0;
      const volLivre = capacidadeCbm>0 ? capacidadeCbm-atual.volTotal : Infinity;
      const pesoLivre = maxPayload>0 ? maxPayload-atual.pesoTotal : Infinity;
      const maxPorVolume = volPerUnit>0 ? Math.floor(volLivre/volPerUnit) : cx.restante;
      const maxPorPeso = pesoPerUnit>0 ? Math.floor(pesoLivre/pesoPerUnit) : cx.restante;
      const qtd = Math.max(0, Math.min(cx.restante, maxPorVolume, maxPorPeso));
      if(qtd<=0) continue;
      let existente = atual.itens.find(it=>it.id===cx.id);
      if(!existente){ existente = {...cx, qtyNesteContainer:0}; atual.itens.push(existente); }
      existente.qtyNesteContainer += qtd;
      atual.volTotal += qtd*volPerUnit;
      atual.pesoTotal += qtd*pesoPerUnit;
      cx.restante -= qtd;
      progresso = true;
    }
    if(!progresso){
      containers.push(atual);
      atual = { itens:[], volTotal:0, pesoTotal:0 };
    }
  }
  if(atual.itens.length) containers.push(atual);
  return containers;
}
function simularContainers(sim, containerKey){
  const cont = CONTAINERS[containerKey];
  const c = computeSimulacao(sim);
  if(!cont) return { cont:null, c };

  let volumeNecessario = c.totalCbm;
  let pesoNecessario = c.totalPeso;
  let unidadesPaletes = 0;
  let alocacaoContainers = null;

  if(sim.tipoCarregamento==='pallets'){
    const paleteCbmUtil = computePaleteCbmUtil(sim.palete);
    const pesoPalete = num(sim.palete.pesoPalete);
    unidadesPaletes = calcPaletizacao(sim).unidadesPaletes; // mesma fonte usada em toda a tela de Resultado
    volumeNecessario = unidadesPaletes*paleteCbmUtil;
    pesoNecessario = c.totalPeso + unidadesPaletes*pesoPalete;
  } else {
    alocacaoContainers = alocarContainersSolta(c.caixas, cont.capacidadeCbm, cont.maxPayload);
    volumeNecessario = sum(alocacaoContainers.map(ct=>ct.volTotal));
    pesoNecessario = sum(alocacaoContainers.map(ct=>ct.pesoTotal));
  }

  const containersPorVolume = cont.capacidadeCbm>0 ? Math.ceil(volumeNecessario/cont.capacidadeCbm) : 1;
  const containersPorPeso = cont.maxPayload>0 ? Math.ceil(pesoNecessario/cont.maxPayload) : 1;
  let containersPorPaletes = 1;
  if(sim.tipoCarregamento==='pallets' && unidadesPaletes>0){
    const info = simularPaletesNoContainer(sim, containerKey);
    const capacidadeReal = info ? info.capacidadeContainer : cont.maxPallets;
    containersPorPaletes = capacidadeReal>0 ? Math.ceil(unidadesPaletes/capacidadeReal) : 1;
  }
  const numContainers = sim.tipoCarregamento==='pallets'
    ? Math.max(containersPorVolume, containersPorPeso, containersPorPaletes, c.totalUnidades>0?1:0)
    : Math.max(alocacaoContainers ? alocacaoContainers.length : 1, c.totalUnidades>0?1:0);

  const ocupacaoVolume = numContainers>0 && cont.capacidadeCbm>0 ? (volumeNecessario/(cont.capacidadeCbm*numContainers))*100 : 0;
  const ocupacaoPeso = numContainers>0 && cont.maxPayload>0 ? (pesoNecessario/(cont.maxPayload*numContainers))*100 : 0;

  return { cont, c, volumeNecessario, pesoNecessario, unidadesPaletes, alocacaoContainers,
    numContainers, ocupacaoVolume, ocupacaoPeso, containersPorVolume, containersPorPeso, containersPorPaletes };
}

/* ------------------------------ Motor de cálculo --------------------------- */
function computeDados(d){
  const produtos = d.produtos.map(p=>{
    const qty = num(p.quantidade), vu = num(p.valorUnit), peso = num(p.pesoLiquido);
    const totalUSD = qty*vu;
    const totalBRL = totalUSD*num(d.cambioInvoice);
    return {...p, qty, vu, peso, totalUSD, totalBRL};
  });
  const sumQty = sum(produtos.map(p=>p.qty));
  const sumPeso = sum(produtos.map(p=>p.peso));
  const sumTotalUSD = sum(produtos.map(p=>p.totalUSD));   // F30
  const sumTotalBRL = sum(produtos.map(p=>p.totalBRL));   // G30

  const freteExt = num(d.freteExt), seguroExt = num(d.seguroExt);
  const cambioFrete = num(d.cambioFrete);
  const freteBRL = cambioFrete*freteExt;                  // E38
  const seguroBRL = cambioFrete*seguroExt;                // E39
  const totalFreteSeguroExt = freteExt+seguroExt;         // D41
  const totalFreteSeguroBRL = freteBRL+seguroBRL;         // E41

  const cambioDesembaraco = num(d.cambioDesembaraco);
  const invoiceExt = sumTotalUSD;                         // D52
  const invoiceBRL = cambioDesembaraco*invoiceExt;        // E52
  const freteExtD = freteExt;                             // D53
  const freteBRLD = cambioDesembaraco*freteExtD;          // E53
  const seguroExtD = seguroExt;                           // D54
  const seguroBRLD = cambioDesembaraco*seguroExtD;        // E54
  const valorAduaneiroExt = invoiceExt+freteExtD+seguroExtD;      // D56
  const valorAduaneiroBRL = cambioDesembaraco*valorAduaneiroExt;  // E56

  const ii = num(d.ii);        // D48
  const icms = num(d.icms);    // D49
  const iiValor = ii*valorAduaneiroBRL;                            // H52
  const vaMaisII = valorAduaneiroBRL+iiValor;                      // H53
  const bcIcms = icms<1 ? vaMaisII/(1-icms) : 0;                   // H54
  const icmsValor = bcIcms*icms;                                   // H55

  const despExtraTotal = sum(d.despExtra.map(num));                // D65
  const limiteUSD = valorAduaneiroExt;                             // F72 = D56
  const limiteExcedido = limiteUSD > LIMITE_SIMPLIFICADA_USD;

  return { produtos, sumQty, sumPeso, sumTotalUSD, sumTotalBRL,
    freteBRL, seguroBRL, totalFreteSeguroExt, totalFreteSeguroBRL,
    invoiceExt, invoiceBRL, freteExtD, freteBRLD, seguroExtD, seguroBRLD,
    valorAduaneiroExt, valorAduaneiroBRL, iiValor, vaMaisII, bcIcms, icmsValor,
    despExtraTotal, limiteUSD, limiteExcedido };
}

function computeRateio(d, c){
  // primeira passada — tudo exceto rateio de despesas extras
  const linhas = c.produtos.map(p=>{
    if(!(p.qty>0) && !p.fornecedor && !p.produto) return null;
    const pesoShare = c.sumPeso>0 ? p.peso/c.sumPeso : 0;
    const valorShare = c.sumTotalUSD>0 ? p.totalUSD/c.sumTotalUSD : 0;
    // O rateio respeita os pré-cálculos de cada taxa de câmbio preenchida em Dados:
    // o valor do produto usa a taxa da Invoice (p.totalBRL) e o frete/seguro usam a taxa do Frete
    // (c.freteBRL/c.seguroBRL) — a mesma taxa usada nos respectivos campos em Dados.
    const rateioFrete = pesoShare*c.freteBRL;                 // H (taxa da Invoice/Frete conforme Dados)
    const rateioSeguro = valorShare*c.seguroBRL;              // I (taxa do Frete conforme Dados)
    const valorAduaneiroProduto = p.totalBRL+rateioFrete+rateioSeguro; // J
    const rateioII = valorAduaneiroProduto*num(d.ii);   // K
    const icmsRate = num(d.icms);
    const rateioBcIcms = icmsRate<1 ? (valorAduaneiroProduto+rateioII)/(1-icmsRate) : 0; // L
    const rateioIcms = rateioBcIcms*icmsRate;              // M
    return {...p, valorShare, rateioFrete, rateioSeguro, valorAduaneiroProduto, rateioII, rateioBcIcms, rateioIcms};
  }).filter(Boolean);

  const sumJ = sum(linhas.map(l=>l.valorAduaneiroProduto));
  linhas.forEach(l=>{
    // Rateio das despesas extras segue a mesma proporção (valor $) usada no rateio do seguro.
    l.rateioDespExtra = l.valorShare*c.despExtraTotal;                    // N
    l.custoTotalSimples = l.valorAduaneiroProduto+l.rateioII+l.rateioIcms+l.rateioDespExtra; // O
    l.custoUnitSimples = l.qty>0 ? l.custoTotalSimples/l.qty : 0;         // P
    l.custoTotalLucroReal = l.valorAduaneiroProduto+l.rateioII+l.rateioDespExtra; // Q
    l.custoUnitLucroReal = l.qty>0 ? l.custoTotalLucroReal/l.qty : 0;     // R
  });

  const totais = {
    qty: sum(linhas.map(l=>l.qty)), peso: sum(linhas.map(l=>l.peso)),
    totalUSD: sum(linhas.map(l=>l.totalUSD)), totalBRL: sum(linhas.map(l=>l.totalBRL)),
    rateioFrete: sum(linhas.map(l=>l.rateioFrete)), rateioSeguro: sum(linhas.map(l=>l.rateioSeguro)),
    valorAduaneiroProduto: sumJ, rateioII: sum(linhas.map(l=>l.rateioII)),
    rateioBcIcms: sum(linhas.map(l=>l.rateioBcIcms)), rateioIcms: sum(linhas.map(l=>l.rateioIcms)),
    rateioDespExtra: sum(linhas.map(l=>l.rateioDespExtra)),
    custoTotalSimples: sum(linhas.map(l=>l.custoTotalSimples)),
    custoTotalLucroReal: sum(linhas.map(l=>l.custoTotalLucroReal)),
  };
  return { linhas, totais };
}

function crumbsHtml(){
  const meta = ROUTE_META[state.route];
  let items = [{label:'Início', route:'home'}];
  if(meta.group==='imp'){
    items.push({label:'Importação', route:'cotacoesTodas'});
    if(state.route==='dados'||state.route==='numerario') items.push({label:'Importação Simplificada', route:'dados'});
    if(state.route==='dadosFormal'||state.route==='numerarioFormal') items.push({label:'Importação Formal', route:'dadosFormal'});
  }
  if(meta.group==='cad') items.push({label:'Cadastro', route:'cad-cliente'});
  if(meta.label) items.push({label:meta.label, route:state.route, cur:true});
  return items.map((it,i)=>{
    const sep = i>0 ? '<span class="sep">/</span>' : '';
    if(it.cur) return sep+`<span class="cur">${esc(it.label)}</span>`;
    return sep+`<span class="seg" data-action="go:${it.route}">${esc(it.label)}</span>`;
  }).join('');
}

function viewFor(route){
  switch(route){
    case 'home': return renderHome();
    case 'dados': return renderDados();
    case 'numerario': return renderNumerario();
    case 'dadosFormal': return renderDadosFormal();
    case 'numerarioFormal': return renderNumerarioFormal();
    case 'cotacoesTodas': return renderCotacoesTodas();
    case 'simInicio': return renderSimInicio();
    case 'simCarga': return renderSimCarga();
    case 'simCarregando': return renderSimCarregando();
    case 'simPaletes': return renderSimPaletes();
    case 'simEquipamentos': return renderSimEquipamentos();
    case 'simEmbalagem': return renderSimEmbalagem();
    case 'simResultado': return renderSimResultado();
    case 'cad-cliente': return renderCadastro('cliente');
    case 'cad-fornecedor': return renderCadastro('fornecedor');
    case 'cad-produto': return renderCadastro('produto');
    default: return renderHome();

  const app = document.getElementById('app');

  const lightbox = state.lightboxSrc ? `<div class="lightbox-overlay" data-action="fechar-lightbox"><img src="${state.lightboxSrc}" alt="" data-action="noop"></div>` : '';
  const lightbox3d = state.lightbox3D ? `
  <div class="lightbox-overlay" data-action="fechar-3d-lightbox" style="cursor:default;">
    <div style="width:min(94vw,1100px); height:min(80vh,720px); background:linear-gradient(180deg,#EFEAE0,#E4DECD); border-radius:14px; overflow:hidden; position:relative;" data-action="noop">

  app.innerHTML = topbarHtml() + `<div class="shell">${sideNavHtml()}<div class="main ${wide}">${crumbs}${viewFor(state.route)}</div></div>` + lightbox + lightbox3d;

function limiteAlertHtml(c){
  if(c.limiteExcedido){
    return `<div class="alert alert-warn">${ICONS.warn}<div><b>Limite da Importação Simplificada excedido.</b><br>
      Custo + Frete + Seguro = <b>${fmtUSD(c.limiteUSD)}</b> — acima de US$ ${LIMITE_SIMPLIFICADA_USD.toLocaleString('en-US')}.
      Esta operação deve ser enquadrada como Importação Formal.</div></div>`;
  }
  return `<div class="alert alert-ok">${ICONS.check}<div><b>Dentro do limite da Importação Simplificada.</b><br>
      Custo + Frete + Seguro = <b>${fmtUSD(c.limiteUSD)}</b> (limite: US$ ${LIMITE_SIMPLIFICADA_USD.toLocaleString('en-US')}).</div></div>`;
}

function patchComputedDados(){
  const d = state.dados, c = computeDados(d);
  const root = document.getElementById('dados-form');
  if(!root) return;
  c.produtos.forEach((p,idx)=>{
    const a = root.querySelector(`[data-calc-row="${idx}:usd"]`); if(a) a.textContent = fmtUSD(p.totalUSD);
    const b = root.querySelector(`[data-calc-row="${idx}:brl"]`); if(b) b.textContent = fmtBRL(p.totalBRL);
  });
  const map = {
    'tot-qty': fmtNum(c.sumQty), 'tot-peso': fmtNum(c.sumPeso)+' kg', 'tot-usd': fmtUSD(c.sumTotalUSD), 'tot-brl': fmtBRL(c.sumTotalBRL),
    'frete-brl': '≈ '+fmtBRL(c.freteBRL), 'seguro-brl': '≈ '+fmtBRL(c.seguroBRL),
    'tot-fs-usd': fmtUSD(c.totalFreteSeguroExt), 'tot-fs-brl': fmtBRL(c.totalFreteSeguroBRL),
    'd52': fmtUSD(c.invoiceExt), 'e52': fmtBRL(c.invoiceBRL), 'd53': fmtUSD(c.freteExtD), 'e53': fmtBRL(c.freteBRLD),
    'd54': fmtUSD(c.seguroExtD), 'e54': fmtBRL(c.seguroBRLD), 'd56': fmtUSD(c.valorAduaneiroExt), 'e56': fmtBRL(c.valorAduaneiroBRL),
    'ii-valor': fmtBRL(c.iiValor), 'va-ii': fmtBRL(c.vaMaisII), 'bc-icms': fmtBRL(c.bcIcms), 'icms-valor': fmtBRL(c.icmsValor),
    'desp-extra-total': fmtBRL(c.despExtraTotal),
  };
  Object.keys(map).forEach(k=>{ const el = root.querySelector(`[data-calc="${k}"]`); if(el) el.textContent = map[k]; });
  const alertBox = document.getElementById('limite-alert'); if(alertBox) alertBox.innerHTML = limiteAlertHtml(c);
}

function renderDespesaTable(sectionKey, linhas, cambio){
  const cRate = num(cambio);

    const calc = calcDespesaLinha(l, cRate);
    return `<tr>
      <td><input data-bind="${sectionKey}.${idx}.descricao" value="${esc(l.descricao)}" class="input-blue" placeholder="Descrição"></td>

        <option value="EUR" ${l.moeda==='EUR'?'selected':''}>EUR</option>
        <option value="RMB" ${l.moeda==='RMB'?'selected':''}>RMB</option>
      </select></td>
      <td class="num-mono" data-despesa-calc="${sectionKey}:${idx}:tarifaReal">${fmtBRL(calc.tarifaReal)}</td>
      <td><select data-bind="${sectionKey}.${idx}.tipoCalculo" class="input-blue">

        <option value="Container" ${l.tipoCalculo==='Container'?'selected':''}>Container</option>

      </select></td>
      <td><input type="number" step="any" data-bind="${sectionKey}.${idx}.quantidade" value="${esc(l.quantidade)}" class="input-blue num-mono" placeholder="0"></td>
      <td class="num-mono" data-despesa-calc="${sectionKey}:${idx}:total">${fmtBRL(calc.total)}</td>

    </tr>`;

  const total = sum(linhas.map(l=>calcDespesaLinha(l,cRate).total));
  return `
  <div class="table-wrap" style="margin-bottom:10px;">
    <table><thead><tr><th>Descrição da Despesa</th><th>Tarifa</th><th>Moeda</th><th class="num-mono">Tarifa em Real</th><th>Tipo de Cálculo</th><th>Qtd.</th><th class="num-mono">Total</th><th></th></tr></thead>

    </table>
  </div>
  <button class="btn btn-ghost btn-sm" data-action="add-despesa-linha:${sectionKey}">${ICONS.plus} Adicionar Linha</button>
  `;
}

function patchDespesaSecao(root, sectionKey, linhas, cambio){
  const cRate = num(cambio);
  let total = 0;
  linhas.forEach((l, idx)=>{
    const calc = calcDespesaLinha(l, cRate);
    total += calc.total;
    const elReal = root.querySelector(`[data-despesa-calc="${sectionKey}:${idx}:tarifaReal"]`);
    if(elReal) elReal.textContent = fmtBRL(calc.tarifaReal);
    const elTotal = root.querySelector(`[data-despesa-calc="${sectionKey}:${idx}:total"]`);
    if(elTotal) elTotal.textContent = fmtBRL(calc.total);
  });
  const elGeral = root.querySelector(`[data-despesa-calc="${sectionKey}::total-geral"]`);
  if(elGeral) elGeral.textContent = fmtBRL(total);
}
function patchImpostosDesembaraco(root, d, c){
  const r = computeRateioFormal(d, c);
  d.produtos.forEach((p, idx)=>{
    const linha = r.linhas.find(l=>l.id===p.id);
    ['ii','ipi','pis','cofins','icms'].forEach(tributo=>{
      const el = root.querySelector(`[data-imposto-calc="${idx}:${tributo}"]`);
      if(el) el.textContent = fmtBRL(linha ? linha[tributo] : 0);
    });
  });
  ['ii','ipi','pis','cofins','icms'].forEach(tributo=>{
    const el = root.querySelector(`[data-imposto-calc="total:${tributo}"]`);
    if(el) el.textContent = fmtBRL(r.totais[tributo]);
  });
}
function patchComputedDadosFormal(){
  const d = state.dadosFormal, c = computeDadosFormal(d);
  const root = document.getElementById('dadosFormal-form');
  if(!root) return;
  c.produtos.forEach((p,idx)=>{
    const a = root.querySelector(`[data-calc-row="${idx}:usd"]`); if(a) a.textContent = fmtUSD(p.totalUSD);
    const b = root.querySelector(`[data-calc-row="${idx}:brl"]`); if(b) b.textContent = fmtBRL(p.totalBRL);
  });
  patchDespesaSecao(root, 'freteLinhas', d.freteLinhas, d.freteCambio);
  patchDespesaSecao(root, 'taxasOrigem', d.taxasOrigem, d.freteCambio);
  patchDespesaSecao(root, 'taxasDestino', d.taxasDestino, d.freteCambio);
  patchDespesaSecao(root, 'armazenagemLinhas', d.armazenagemLinhas, d.armazenagemCambio);
  patchDespesaSecao(root, 'outrasDespesasLinhas', d.outrasDespesasLinhas, d.outrasDespesasCambio);
  patchImpostosDesembaraco(root, d, c);
  const map = {
    'tot-qty': fmtNum(c.sumQty), 'tot-peso': fmtNum(c.sumPeso)+' kg', 'tot-usd': fmtUSD(c.sumTotalUSD), 'tot-brl': fmtBRL(c.sumTotalBRL),
    'frete-total': fmtBRL(c.freteTotalBRL), 'armazenagem-total': fmtBRL(c.armazenagemTotal), 'outras-total': fmtBRL(c.outrasTotal),
    'vmle-usd': fmtUSD(c.vmleUSD), 'vmle-brl': fmtBRL(c.vmleBRL), 'vmld-usd': fmtUSD(c.vmldUSD), 'vmld-brl': fmtBRL(c.vmldBRL),
  };
  Object.keys(map).forEach(k=>{ const el = root.querySelector(`[data-calc="${k}"]`); if(el) el.textContent = map[k]; });
}

/* --------------------------- Autocomplete (Cadastro) ------------------------ */
let acCurrentField = null; // {type, idx, inputEl}
function acSearch(type, query){
  const q = String(query||'').trim().toLowerCase();
  if(q.length<3) return [];
  if(type==='cliente'){
    return state.clientes.filter(c=>((c.nomeFantasia||c.razaoSocial||'')).toLowerCase().includes(q))
      .slice(0,6).map(c=>({label:c.nomeFantasia||c.razaoSocial||'(sem nome)', sub:c.cnpjCpf||'', data:c}));
  }
  if(type==='clienteCnpj'){
    const qDigits = q.replace(/\D/g,'');
    if(qDigits.length<3) return [];
    return state.clientes.filter(c=>(c.cnpjCpf||'').replace(/\D/g,'').includes(qDigits))
      .slice(0,6).map(c=>({label:c.cnpjCpf, sub:c.nomeFantasia||c.razaoSocial||'', data:c}));
  }
  if(type==='fornecedor'){
    return state.fornecedores.filter(f=>((f.nomeFantasia||f.razaoSocial||'')).toLowerCase().includes(q))
      .slice(0,6).map(f=>({label:f.nomeFantasia||f.razaoSocial||'(sem nome)', sub:f.cnpjCpf||'', data:f}));
  }
  if(type==='produto'){
    return state.produtos.filter(p=>(p.nome||'').toLowerCase().includes(q))
      .slice(0,6).map(p=>({label:p.nome||'(sem nome)', sub:[p.codigoInterno,p.ncm].filter(Boolean).join(' · '), data:p}));
  }
  return [];
}
function showAutocomplete(inputEl, type, idx){
  const dd = document.getElementById('ac-dropdown');
  if(!dd) return;
  const results = acSearch(type, inputEl.value);
  if(!results.length){ hideAutocomplete(); return; }
  acCurrentField = {type, idx, inputEl};
  dd._results = results;
  dd.innerHTML = results.map((r,i)=>`
    <div class="ac-option" data-idx="${i}">${esc(r.label)}${r.sub?`<div class="ac-sub">${esc(r.sub)}</div>`:''}</div>
  `).join('');
  const rect = inputEl.getBoundingClientRect();
  dd.style.left = Math.round(rect.left)+'px';
  dd.style.top = Math.round(rect.bottom+4)+'px';
  dd.style.width = Math.max(Math.round(rect.width),220)+'px';
  dd.style.display = 'block';
}
function hideAutocomplete(){
  const dd = document.getElementById('ac-dropdown');
  if(dd){ dd.style.display='none'; dd.innerHTML=''; dd._results=null; }
  acCurrentField = null;
}
function selectAutocomplete(optIdx){
  const dd = document.getElementById('ac-dropdown');
  if(!dd || !dd._results || !acCurrentField) return;
  const r = dd._results[optIdx];
  if(!r) return;
  const { type, idx } = acCurrentField;
  const nome = r.data.nomeFantasia || r.data.razaoSocial || r.data.nome || '';
  if(type==='cliente'){
    state.dados.cliente = nome;
    state.dados.clienteCnpjCpf = r.data.cnpjCpf || state.dados.clienteCnpjCpf;
  } else if(type==='clienteCnpj'){
    state.dados.clienteCnpjCpf = r.data.cnpjCpf || '';
    state.dados.cliente = nome || state.dados.cliente;
  } else if(type==='fornecedor'){
    state.dados.produtos[idx].fornecedor = nome;
  } else if(type==='produto'){
    state.dados.produtos[idx].produto = nome;
  }
  saveDraft();
  hideAutocomplete();
  renderApp();
}

/* -------------------------------- Cotação ---------------------------------- */
function cotacoesFiltradas(){
  const f = state.filtros;
  return state.cotacoesIndex.filter(cot=>{
    if(f.numero && !cot.id.toLowerCase().includes(f.numero.toLowerCase())) return false;
    if(f.texto){
      const t = f.texto.toLowerCase();
      const hit = cot.dados.produtos.some(p=> (p.fornecedor||'').toLowerCase().includes(t) || (p.produto||'').toLowerCase().includes(t));
      if(!hit) return false;
    }
    if(f.de && cot.criadoEm < f.de) return false;
    if(f.ate && cot.criadoEm > (f.ate+'T23:59:59')) return false;
    return true;
  }).sort((a,b)=> b.seq - a.seq);
}

function cotacoesTodasFiltradas(ignorarStatus){
  const f = state.filtrosTodas;
  const simplificadas = state.cotacoesIndex.map(cot=>({ tipo:'Simplificada', cot }));
  const formais = state.cotacoesFormalIndex.map(cot=>({ tipo:'Formal', cot }));
  let combinadas = simplificadas.concat(formais);
  if(f.tipo && f.tipo!=='todos') combinadas = combinadas.filter(x=>x.tipo===(f.tipo==='simplificada'?'Simplificada':'Formal'));
  return combinadas.filter(({tipo, cot})=>{
    const d = cot.dados;
    if(f.numero && !cot.id.toLowerCase().includes(f.numero.toLowerCase())) return false;
    if(f.texto){
      const t = f.texto.toLowerCase();
      const clienteMatch = (d.cliente||'').toLowerCase().includes(t);
      const produtoMatch = (d.produtos||[]).some(p=> (p.fornecedor||'').toLowerCase().includes(t) || (p.produto||'').toLowerCase().includes(t));
      if(!clienteMatch && !produtoMatch) return false;
    }
    if(f.de && cot.criadoEm < f.de) return false;
    if(f.ate && cot.criadoEm > (f.ate+'T23:59:59')) return false;
    const cidadeOrigem = tipo==='Simplificada' ? d.cidadeOrigem : d.freteOrigem;
    const cidadeDestino = tipo==='Simplificada' ? d.cidadeDestino : d.freteDestino;
    if(f.vendedor && !(d.vendedor||'').toLowerCase().includes(f.vendedor.toLowerCase())) return false;
    if(f.responsavel && !(d.responsavel||'').toLowerCase().includes(f.responsavel.toLowerCase())) return false;
    if(f.paisOrigem && !(d.paisOrigem||'').toLowerCase().includes(f.paisOrigem.toLowerCase())) return false;
    if(f.paisDestino && !(d.paisDestino||'').toLowerCase().includes(f.paisDestino.toLowerCase())) return false;
    if(f.portoOrigem && !(d.portoOrigem||'').toLowerCase().includes(f.portoOrigem.toLowerCase())) return false;
    if(f.portoDestino && !(d.portoDestino||'').toLowerCase().includes(f.portoDestino.toLowerCase())) return false;
    if(f.cidadeOrigem && !(cidadeOrigem||'').toLowerCase().includes(f.cidadeOrigem.toLowerCase())) return false;
    if(f.cidadeDestino && !(cidadeDestino||'').toLowerCase().includes(f.cidadeDestino.toLowerCase())) return false;
    if(f.incoterm && (d.incoterm||'').toLowerCase()!==f.incoterm.toLowerCase()) return false;
    if(!ignorarStatus && f.statusCotacao && (d.statusCotacao||'em_andamento')!==f.statusCotacao) return false;
    if(f.statusMotivoNegado && (d.statusMotivoNegado||'')!==f.statusMotivoNegado) return false;
    if(f.ncm){
      const ncmMatch = (d.produtos||[]).some(p=> (p.ncm||'').toLowerCase().includes(f.ncm.toLowerCase()));
      if(!ncmMatch) return false;
    }
    return true;
  }).sort((a,b)=> new Date(b.cot.criadoEm) - new Date(a.cot.criadoEm));
}
async function moverCotacaoStatus(id, tipo, novoStatus){
  const lista = tipo==='Simplificada' ? state.cotacoesIndex : state.cotacoesFormalIndex;
  const item = lista.find(x=>x.id===id);
  if(!item) return;
  const statusAntigo = item.dados.statusCotacao||'em_andamento';
  if(statusAntigo===novoStatus) return;
  item.dados.statusCotacao = novoStatus;
  if(novoStatus!=='negado'){ item.dados.statusMotivoNegado=''; item.dados.statusObservacao=''; }
  item.atualizadoEm = new Date().toISOString();
  if(tipo==='Simplificada') await persistCotacoesIndex(); else await persistCotacoesFormalIndex();
  const statusLabels = {em_andamento:'Em Andamento', enviado_cliente:'Enviado Cliente', aceito:'Aprovado', negado:'Negado'};
  toast(`${id}: status alterado para "${statusLabels[novoStatus]||novoStatus}".`, 'ok');
  renderApp();
}

}
