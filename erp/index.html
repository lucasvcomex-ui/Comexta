function permissaoDaAcao(action){
  return PERMISSAO_DA_ACAO[action] || PERMISSAO_DA_ACAO[action.split(':')[0]] || null;
}
// "Salvar": novo registro exige criar; registro já salvo exige editar.
function acaoDeSalvar(action){
  if(action.startsWith('save-calculo-formal')) return state.currentCotacaoFormalId ? 'editar' : 'criar';
  if(action.startsWith('save-calculo')) return state.currentCotacaoId ? 'editar' : 'criar';
  if(action.startsWith('salvar-simulacao')) return state.currentSimulacaoId ? 'editar' : 'criar';
  if(action.startsWith('cad-save')) return (state.cadEdit && state.cadEdit.id) ? 'editar' : 'criar';
  if(action.startsWith('proc-salvar')) return state.currentProcessoId ? 'editar' : 'criar';
  if(action.startsWith('venda-salvar')) return (state.vendaForm && state.vendaForm.draft && state.vendaForm.draft.id) ? 'editar' : 'criar';
  return 'editar';
}
function acaoPermitida(action){
  const p = permissaoDaAcao(action);
  if(!p) return true;
  const [secao, acao] = p;
  if(acao==='salvar') return pode(secao, acaoDeSalvar(action));
  return pode(secao, acao);
}
const NOME_ACAO = { ver:'visualizar', criar:'criar', editar:'editar' };
function avisoSemPermissao(action){
  const [secao, acao] = permissaoDaAcao(action);
  const a = acao==='salvar' ? acaoDeSalvar(action) : acao;
  toast(`Você não tem permissão para ${NOME_ACAO[a]} em ${SECOES[secao]}. Fale com o administrador da empresa.`);
}

// Esconde o que o usuário não pode usar (menus, cartões e botões).
function aplicarPermissoesNaTela(){
  const app = document.getElementById('app');
  for(const el of app.querySelectorAll('[data-action]')){
    const action = el.getAttribute('data-action');
    const p = permissaoDaAcao(action);
    if(!p) continue;
    const [secao, acao] = p;
    const visivel = acao==='salvar' ? (pode(secao,'criar') || pode(secao,'editar')) : pode(secao, acao);
    if(!visivel) el.style.display = 'none';
  }
  for(const [grupo, secao] of Object.entries(SECAO_DO_GRUPO)){
    if(pode(secao, 'ver')) continue;
    const card = app.querySelector('#mod-'+grupo);
    if(card) card.style.display = 'none';
    const btn = app.querySelector(`[data-action="toggle-nav:${grupo}"]`);
    if(btn && btn.closest('.nav-group')) btn.closest('.nav-group').style.display = 'none';
    const gh = app.querySelector(`[data-action="toggle-side:${grupo}"]`);
    if(gh && gh.closest('.side-group')) gh.closest('.side-group').style.display = 'none';
  }
  // Submenus que ficaram vazios (ex.: "Importação Simplificada" sem "Nova Cotação")
  for(const pai of app.querySelectorAll('.nav-drop-item-parent')){
    const itens = [...pai.querySelectorAll('.nav-drop-item')];
    if(itens.length && itens.every(i=>i.style.display==='none')) pai.style.display = 'none';
  }
}

// Rotas: quem não vê a área não entra; "Nova Cotação" sem ter uma cotação aberta exige criar.
function rotaPermitida(route){
  const meta = ROUTE_META[route];
  if(!meta || !meta.group) return true;
  const secao = SECAO_DO_GRUPO[meta.group];
  if(!pode(secao, 'ver')) return false;
  if(route==='dados' && !state.currentCotacaoId && !pode('cotacoes','criar')) return false;
  if(route==='dadosFormal' && !state.currentCotacaoFormalId && !pode('cotacoes','criar')) return false;
  if(route==='processoForm' && !state.currentProcessoId && !pode('processos','criar')) return false;
  return true;
}

async function carregarEquipe(){
  if(state.cfgCarregandoEquipe) return;
  state.cfgCarregandoEquipe = true;
  try{
    const [{ data: equipe, error: e1 }, { data: convites, error: e2 }] = await Promise.all([
      sb.from('perfis').select('user_id, email, nome, telefone, cargo, foto, papel, permissoes, criado_em').order('criado_em'),
      sb.from('convites').select('*').is('aceito_em', null).order('criado_em', { ascending:false }),
    ]);
    if(e1 || e2) throw (e1 || e2);
    state.cfgEquipe = equipe; state.cfgConvites = convites;
  }catch(err){
    console.error(err);
    toast('Não foi possível carregar a equipe.');
    state.cfgEquipe = state.cfgEquipe || []; state.cfgConvites = state.cfgConvites || [];
  }finally{
    state.cfgCarregandoEquipe = false;
    if(state.route==='config') renderApp();
  }
}

// Reduz a foto para 256×256 (recorte central) em JPEG, para guardar leve no perfil.
function reduzirFoto(arquivo){
  return new Promise((resolve, reject)=>{
    if(!arquivo || !/^image\//.test(arquivo.type)) return reject(new Error('Escolha um arquivo de imagem.'));
    const img = new Image();
    const url = URL.createObjectURL(arquivo);
    img.onload = ()=>{
      const lado = 256, menor = Math.min(img.width, img.height);
      const canvas = document.createElement('canvas');
      canvas.width = lado; canvas.height = lado;
      canvas.getContext('2d').drawImage(img, (img.width-menor)/2, (img.height-menor)/2, menor, menor, 0, 0, lado, lado);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('Não foi possível ler esta imagem.')); };
    img.src = url;
  });
}
async function onFotoSelecionada(input){
  try{ state.cfgFotoNova = await reduzirFoto(input.files && input.files[0]); renderApp(); }
  catch(err){ toast(err.message); }

function cnpjValido(c){
  if(!/^\d{14}$/.test(c) || /^(\d)\1{13}$/.test(c)) return false;
  const calc = (base) => {
    let soma = 0, peso = base.length - 7;
    for(let i=0;i<base.length;i++){ soma += Number(base[i]) * peso--; if(peso < 2) peso = 9; }
    const r = soma % 11; return r < 2 ? 0 : 11 - r;
  };
  const d1 = calc(c.slice(0,12)), d2 = calc(c.slice(0,12) + d1);
  return c.endsWith(String(d1) + String(d2));
}
function mascaraCnpj(v){
  const d = v.replace(/\D/g,'').slice(0,14);
  return d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3')
          .replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2');
}
async function buscarCep(cep){
  const d = cep.replace(/\D/g,'');
  if(d.length!==8) return;
  try{
    const r = await fetch('https://viacep.com.br/ws/'+d+'/json/').then(r=>r.json());
    if(r.erro) return toast('CEP não encontrado.');
    const set = (id, v) => { const el = document.getElementById('emp-'+id); if(el && v && !el.value) el.value = v; };
    set('logradouro', r.logradouro); set('bairro', r.bairro); set('cidade', r.localidade); set('uf', r.uf);
    const num = document.getElementById('emp-numero'); if(num) num.focus();
  }catch(e){ /* sem internet: segue preenchimento manual */ }
}

  if((state.cfgEquipe||[]).some(m=>m.email.toLowerCase()===email)) return toast('Esta pessoa já faz parte da equipe.');

    .insert({ empresa_id: empresaAtual.id, email, papel, permissoes, convidado_por: usuarioAtual.id })

    return true;
  }
  return false;

// Guardada na empresa (empresas.personalizacao). Todos leem; só administradores alteram.
//   cotacao: cores do cabeçalho e do fundo do PDF da cotação e logo da empresa
//   responsaveis / vendedores: listas usadas nos campos da Nova Cotação (Simplificada e Formal)
const ESTILO_PADRAO = { corCabecalho:'#173A5E', corFundo:'#FFFFFF' };
const TIPOS_PESSOA = {
  responsaveis:{ titulo:'Responsáveis', singular:'responsável', campo:'responsavel', texto:'Pessoas responsáveis pela cotação. Aparecem na lista do campo "Responsável" em todo o site: Nova Cotação (Simplificada e Formal), Processos e filtros.' },
  vendedores:{ titulo:'Vendedores', singular:'vendedor', campo:'vendedor', texto:'Pessoas responsáveis pela venda. Aparecem na lista do campo "Vendedor" em todo o site: Nova Cotação (Simplificada e Formal), Processos e filtros.' },
};

function personalizacao(){ return (empresaAtual && empresaAtual.personalizacao) || {}; }
function estiloCotacao(){
  const c = personalizacao().cotacao || {};
  return { corCabecalho: c.corCabecalho || ESTILO_PADRAO.corCabecalho, corFundo: c.corFundo || ESTILO_PADRAO.corFundo,
           logo: c.logo || null, logoLargura: c.logoLargura || 0, logoAltura: c.logoAltura || 0 };
}
function hexParaRgb(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex||'').trim());
  if(!m) return [255,255,255];
  const n = parseInt(m[1], 16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
// Texto branco ou escuro, o que tiver mais contraste com a cor de fundo.
function corTextoSobre(rgb){
  const lin = v => { v /= 255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
  const L = 0.2126*lin(rgb[0]) + 0.7152*lin(rgb[1]) + 0.0722*lin(rgb[2]);
  return (1.05)/(L+0.05) >= (L+0.05)/(0.05) ? [255,255,255] : [20,30,40];
}
const corCabecalhoPdf = () => hexParaRgb(estiloCotacao().corCabecalho);
const corTextoCabecalhoPdf = () => corTextoSobre(corCabecalhoPdf());

// Pinta o fundo de todas as páginas do PDF, inclusive as criadas automaticamente pelas tabelas.
function prepararFundoPdf(doc){
  const cor = hexParaRgb(estiloCotacao().corFundo);
  if(cor.join()==='255,255,255') return;
  const pintar = ()=>{
    const w = doc.internal.pageSize.getWidth(), h = doc.internal.pageSize.getHeight();
    doc.setFillColor(cor[0], cor[1], cor[2]);
    doc.rect(0, 0, w, h, 'F');
  };
  pintar();
  const addPageOriginal = doc.addPage.bind(doc);
  doc.addPage = function(){ const r = addPageOriginal.apply(null, arguments); pintar(); return r; };
}

function listaPessoas(tipo){ return (personalizacao()[tipo] || []).filter(p=>p && p.nome); }

// Opções de Responsável / Vendedor: sempre a lista do administrador (Configurações → Personalização).
// Um valor antigo que não está na lista continua aparecendo, marcado como "fora da lista".
function opcoesPessoa(tipo, atual){
  const l = listaPessoas(tipo).map(p=>[p.nome, p.nome + (p.cargo ? ' — ' + p.cargo : '')]);
  if(atual && !l.some(([n])=>n===atual)) l.push([atual, atual + ' (fora da lista)']);

async function salvarPersonalizacao(alteracao, mensagem){

async function salvarPessoas(tipo){
  const lista = lerPessoasDigitadas(tipo);
  const limpa = lista.filter(p=>p.nome || p.cargo);
  if(limpa.some(p=>!p.nome)) return toast('Informe o nome completo de todas as pessoas da lista.');
  const nomes = limpa.map(p=>p.nome.toLowerCase());
  if(new Set(nomes).size !== nomes.length) return toast('Há nomes repetidos na lista.');
  if(await salvarPersonalizacao({ [tipo]: limpa }, `Lista de ${TIPOS_PESSOA[tipo].titulo.toLowerCase()} salva.`)){
    state.cfgPessoas[tipo] = JSON.parse(JSON.stringify(limpa));
    renderApp();
  }
}

// Logo: até 600×200 px, mantendo a proporção; PNG continua PNG (transparência), o resto vira JPEG.
function reduzirLogo(arquivo){
  return new Promise((resolve, reject)=>{
    if(!arquivo || !/^image\//.test(arquivo.type)) return reject(new Error('Escolha um arquivo de imagem (PNG ou JPG).'));
    const img = new Image(), url = URL.createObjectURL(arquivo);
    img.onload = ()=>{
      const escala = Math.min(1, 600/img.width, 200/img.height);
      const w = Math.max(1, Math.round(img.width*escala)), h = Math.max(1, Math.round(img.height*escala));
      const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      const png = arquivo.type==='image/png';
      if(!png){ ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, w, h); }
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve({ logo: canvas.toDataURL(png ? 'image/png' : 'image/jpeg', 0.9), logoLargura: w, logoAltura: h });
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('Não foi possível ler esta imagem.')); };
    img.src = url;
  });
}

    case 'cfg-pers-remover-logo':
      state.cfgEstilo = { ...state.cfgEstilo, logo:null, logoLargura:0, logoAltura:0 }; renderApp(); return true;

  return false;
}

// Campos de cor: o seletor e o código (#RRGGBB) ficam sincronizados e a prévia muda na hora.
function onPersonalizacaoInput(el){
  const m = /^pers-(cor|hex)-(cabecalho|fundo)$/.exec(el.id || '');
  if(!m || !state.cfgEstilo) return false;
  const chave = m[2]==='cabecalho' ? 'corCabecalho' : 'corFundo';
  let valor = el.value.trim();
  if(m[1]==='hex'){
    if(!valor.startsWith('#')) valor = '#' + valor;
    if(!/^#[0-9a-f]{6}$/i.test(valor)) return true;
    const seletor = document.getElementById('pers-cor-'+m[2]); if(seletor) seletor.value = valor.toLowerCase();
  }else{
    const hex = document.getElementById('pers-hex-'+m[2]); if(hex) hex.value = valor.toUpperCase();
  }
  state.cfgEstilo[chave] = valor.toUpperCase();
  atualizarPreviaEstilo();
  return true;
}

    [['frete', PROC_TIPOS_FRETE[t.modal] || 'Frete internacional'], ['taxasOrigem', 'Taxa de origem'], ['taxasDestino', 'Taxa de destino'], ['seguro', 'Seguro de frete internacional']].forEach(([g, rot])=>(t.custos[g]||[]).forEach(l=>{
      const ext = numProcSimples(l.tarifa)*numProcSimples(l.quantidade); if(!(ext>0)) return;
      add(pre + rot, l.descricao, quem(l), l.moeda, ext, taxaLinhaProc(l), totalLinhaProc(l), l.vencimento, l.pago, { kind:'linha', tIdx:k, grupo:g, id:l.id });
    }));
  });
  p.armazenagem.lancamentos.forEach(l=>{
    const ext = numProcSimples(l.tarifa)*numProcSimples(l.quantidade); if(!(ext>0)) return;
    add('Armazenagem', `${l.descricao || 'custo'} · ${nomeContainerProc(p, l.containerId)}`, (p.armazenagem.terminal||{}).nome, l.moeda, ext, taxaLinhaProc(l), totalLinhaProc(l), l.vencimento, l.pago, { kind:'arm', id:l.id });
  });
  p.outrasDespesas.lancamentos.forEach(d=>{
    if(!(numProcSimples(d.valor)>0)) return;
    add(`Outras despesas (${d.origem==='internacional' ? 'internacional' : 'nacional'})`, d.descricao, d.prestador, d.moeda, numProcSimples(d.valor), taxaLinhaProc(d), totalDespesaProc(d), d.vencimento, d.pago, { kind:'outra', id:d.id });
  });
  const nm = computeNumerarioProcesso(p);
  PROC_TRIBUTOS_IMPOSTOS.forEach(k=>{
    const v = nm.imposto(k); if(!(v>0)) return;
    add('Tributo', PROC_TRIBUTOS.find(([x])=>x===k)[1], (p.desembaraco||{}).despachante, 'BRL', v, 1, v, (p.desembaraco.datasPagamento||{})[k], (p.desembaraco.pagos||{})[k], { kind:'trib', k, calculado:nm.usaAliq });
  });
  return out;
}

function fmtPorMoeda(porMoeda){
  const e = Object.entries(porMoeda).filter(([,v])=>v);
  return e.length ? e.map(([m,v])=>fmtMoeda(v, m)).join(' + ') : fmtMoeda(0, Object.keys(porMoeda)[0] || 'USD');
}
function totaisProcesso(proc){
  const p = procNorm(proc);
  const porMoeda = {}; let pesoLiq = 0, mercadoriaBRL = 0; const faltaCambio = [];
  p.produto.fornecedores.forEach((fo, k)=>{
    const m = fo.moeda || 'USD'; porMoeda[m] = porMoeda[m] || 0;
    for(const i of fo.itens||[]) pesoLiq += numProcSimples(i.pesoLiquido);
    const cf = custoFornecedorProc(p, fo); porMoeda[m] += cf.ext;
    if(cf.ext>0 && !cf.brl) faltaCambio.push(fo.fornecedor || `Fornecedor ${k+1}`); else mercadoriaBRL += cf.brl;
  });
  const moeda = moedaPrincipalProc(p), moedas = Object.keys(porMoeda);
  const fob = moedas.length===1 ? porMoeda[moeda] : null;   // total numa moeda só quando todos os fornecedores usam a mesma
  const tributos = computeNumerarioProcesso(p).impostosTotal;
  return { porMoeda, fob, mercadoriaTexto: fmtPorMoeda(porMoeda), pesoLiq, moeda, mercadoriaBRL, faltaCambio, tributos };
}

/* ----------- Filtros configuráveis (Processos e Cotações Salvas) ----------- */
// Mesmo padrão do Card e da Lista: o Template → Configurar Filtros oferece TODOS os campos, por janela.
// Cada filtro: { id, label, janela, tipo:'texto'|'opcao'|'periodo'|'faixa', valores(item)->[brutos], opcoes?(itens)->[[valor,rótulo]] }
// Os valores só valem ao clicar em Filtrar (ou Enter) e ficam fixados até Limpar (guardados neste navegador).
const FILTROS_TPL = {
  proc: { chave:'filtrosProc:fixado', catalogo:()=>catalogoFiltrosProc(), itens:()=>state.processosIndex||[], prefs:()=>prefsProcessos() },
  cot:  { chave:'filtrosCot:fixado',  catalogo:()=>catalogoFiltrosCot(),  itens:()=>itensCotacoes(), prefs:()=>prefsCotacoes() },
  mon:  { chave:'filtrosMon:fixado',  catalogo:()=>catalogoFiltrosMon(),  itens:()=>state.monitoramento||[], prefs:()=>prefsMonitoramento() },
};
function filtrosAplicados(escopo){
  if(!state.filtrosAplicados) state.filtrosAplicados = {};
  return state.filtrosAplicados[escopo] || (state.filtrosAplicados[escopo] = {});
}
function mapaFiltrosTpl(escopo){ return Object.fromEntries(FILTROS_TPL[escopo].catalogo().map(f=>[f.id, f])); }
function filtroTplAtivo(valores, f){
  return (f.tipo==='periodo' || f.tipo==='faixa') ? !!(valores[f.id+':de'] || valores[f.id+':ate']) : !!valores[f.id];
}
function valoresBrutos(f, item){ try{ return juntar(f.valores(item)); }catch(e){ return []; } }
// Aplica os filtros visíveis (os ocultos não valem). "ignorar": ids que não se aplicam (ex.: status no quadro).
function aplicarFiltrosTpl(escopo, itens, ignorar){
  const mapa = mapaFiltrosTpl(escopo), valores = filtrosAplicados(escopo);
  const ativos = FILTROS_TPL[escopo].prefs().filtros.map(id=>mapa[id]).filter(f=>f && !(ignorar||[]).includes(f.id) && filtroTplAtivo(valores, f));
  if(!ativos.length) return itens;
  return itens.filter(item=>ativos.every(f=>{
    const vals = valoresBrutos(f, item);
    if(f.tipo==='opcao') return vals.includes(valores[f.id]);
    if(f.tipo==='periodo'){ const de = valores[f.id+':de'], ate = valores[f.id+':ate'];
      return vals.some(d=>(!de || d.slice(0,10)>=de) && (!ate || d.slice(0,10)<=ate)); }
    if(f.tipo==='faixa'){ const de = valores[f.id+':de'], ate = valores[f.id+':ate'];
      return vals.some(x=>{ const n = Number(x); return isFinite(n) && (de==='' || de==null || n>=Number(de)) && (ate==='' || ate==null || n<=Number(ate)); }); }
    const q = String(valores[f.id]).trim().toLowerCase();
    return vals.some(x=>x.toLowerCase().includes(q));
  }));
}
function algumFiltroTplAtivo(escopo, ignorar){
  const mapa = mapaFiltrosTpl(escopo), valores = filtrosAplicados(escopo);
  return FILTROS_TPL[escopo].prefs().filtros.some(id=>mapa[id] && !(ignorar||[]).includes(id) && filtroTplAtivo(valores, mapa[id]));
}
function opcoesFiltroTpl(escopo, f){
  if(f.opcoes) return f.opcoes();
  return juntar(FILTROS_TPL[escopo].itens().flatMap(item=>valoresBrutos(f, item))).sort((a,b)=>a.localeCompare(b,'pt-BR')).map(x=>[x,x]);
}
function filtroTplHtml(escopo, f){
  const v = filtrosAplicados(escopo);
  const attr = sufixo => `data-ftpl="${escopo}|${f.id}${sufixo||''}"`;
  if(f.tipo==='periodo' || f.tipo==='faixa'){
    const tp = f.tipo==='periodo' ? 'date' : 'number';
    const extra = f.tipo==='faixa' ? 'step="any"' : '';
    return `<div class="field filtro-periodo"><label>${esc(f.label)}</label><div class="periodo">
      <input type="${tp}" ${extra} ${attr(':de')} value="${esc(v[f.id+':de']||'')}" ${f.tipo==='faixa'?'placeholder="de"':''}>
      <span>até</span>
      <input type="${tp}" ${extra} ${attr(':ate')} value="${esc(v[f.id+':ate']||'')}" ${f.tipo==='faixa'?'placeholder="até"':''}></div></div>`;
  }
  if(f.tipo==='opcao'){
    return `<div class="field"><label>${esc(f.label)}</label><select ${attr()}>
      <option value="">Todos</option>${opcoesFiltroTpl(escopo, f).map(([o,t])=>`<option value="${esc(o)}" ${v[f.id]===o?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
  }
  return `<div class="field"><label>${esc(f.label)}</label><input ${attr()} value="${esc(v[f.id]||'')}" placeholder="${esc(f.placeholder||'')}" autocomplete="off"></div>`;
}
// Barra de filtros no padrão de Cotações Salvas: campos + Filtrar + Limpar (+ botões extras à direita)
function barraFiltrosTpl(escopo, ignorar, extrasHtml){
  const mapa = mapaFiltrosTpl(escopo);
  const filtros = FILTROS_TPL[escopo].prefs().filtros.map(id=>mapa[id]).filter(f=>f && !(ignorar||[]).includes(f.id));
  if(!filtros.length && !extrasHtml) return '';
  return `<div class="filter-bar">
    ${filtros.map(f=>filtroTplHtml(escopo, f)).join('')}
    ${filtros.length ? `<button class="btn btn-ghost btn-sm" data-action="ftpl-filtrar:${escopo}">${ICONS.filter} Filtrar</button>
    <button class="btn btn-ghost btn-sm" data-action="ftpl-limpar:${escopo}">Limpar</button>` : ''}

function seloFiltroFixado(escopo, ignorar){
  return algumFiltroTplAtivo(escopo, ignorar) ? ` <span class="badge badge-amber">${ICONS.filter} Filtro fixado — permanece até clicar em "Limpar"</span>` : '';
}
function acaoFiltrosTpl(cmd, escopo){
  if(cmd==='ftpl-filtrar'){
    const novos = {};
    document.querySelectorAll(`[data-ftpl^="${escopo}|"]`).forEach(el=>{
      const chave = el.getAttribute('data-ftpl').split('|')[1];
      const v = String(el.value||'').trim();
      if(v) novos[chave] = v;
    });
    state.filtrosAplicados[escopo] = novos;
    storeSet(FILTROS_TPL[escopo].chave, novos);
    toast(Object.keys(novos).length ? 'Filtro fixado — vai continuar aplicado até você clicar em "Limpar".' : 'Nenhum filtro preenchido.', Object.keys(novos).length ? 'ok' : undefined);
    renderApp(); return true;
  }
  if(cmd==='ftpl-limpar'){
    state.filtrosAplicados[escopo] = {};
    storeDelete(FILTROS_TPL[escopo].chave);
    renderApp(); return true;
  }
  return false;
}
// Ao esconder filtros no Template, o que estava aplicado neles deixa de valer.
function limparFiltrosOcultosTpl(escopo, visiveis){
  const v = filtrosAplicados(escopo), set = new Set(visiveis);
  let mudou = false;
  for(const chave of Object.keys(v)) if(!set.has(chave.split(':')[0])){ delete v[chave]; mudou = true; }
  if(mudou) storeSet(FILTROS_TPL[escopo].chave, v);
}

async function moverProcessoStatus(id, novo){
  if(!pode('processos','editar')){ toast('Você não tem permissão para editar processos.'); renderApp(); return; }
  const p = (state.processosIndex||[]).find(x=>x.id===id);
  if(!p || statusProc(p)===novo || !PROC_STATUS[novo]) return;
  p.status = novo; p.atualizadoEm = new Date().toISOString(); p.atualizadoPor = usuarioAtual.nome || usuarioAtual.email;

  renderApp();
}

function acaoTemplateProcesso(cmd, a1, a2){
  switch(cmd){
    case 'proc-modo': salvarPrefsProcessos({ modo: a1 }); renderApp(); return true;
    case 'proc-template':
      state.procTemplateAberto = !state.procTemplateAberto; state.procTemplateSel = null; renderApp(); return true;
    case 'proc-tpl-aba': state.procTemplateAba = a1; renderApp(); return true;
    case 'proc-tpl-grupo': {
      const aba = state.procTemplateAba || 'card';
      const ids = aba==='filtros' ? catalogoFiltrosProc().filter(f=>f.janela===a1).map(f=>f.id)
        : PROC_CAMPOS.filter(c=>c.janela===a1 && c.id!=='id' && !(aba==='card' && c.id==='status')).map(c=>c.id);
      const atual = new Set(state.procTemplateSel[aba]);
      ids.forEach(id=> a2==='1' ? atual.add(id) : atual.delete(id));
      state.procTemplateSel[aba] = (aba==='filtros' ? catalogoFiltrosProc().map(f=>f.id) : PROC_CAMPOS.map(c=>c.id)).filter(id=>atual.has(id));
      renderApp(); return true;
    }
    case 'proc-tpl-padrao': {
      const aba = state.procTemplateAba || 'card';
      state.procTemplateSel[aba] = [...PROC_TEMPLATE_PADRAO[aba]]; renderApp(); return true;
    }

    case 'proc-tpl-salvar': {
      const aba = state.procTemplateAba || 'card';
      const escolhidos = state.procTemplateSel[aba];
      if(aba!=='filtros' && !escolhidos.length) return toast('Selecione pelo menos uma informação.'), true;
      const alteracao = { [aba]: [...escolhidos] };
      if(aba!=='filtros') alteracao.modo = aba;
      else{
        // Filtro que saiu da tela deixa de ser aplicado.
        limparFiltrosOcultosTpl('proc', escolhidos);
      }
      salvarPrefsProcessos(alteracao, ({ card:'Template do card salvo.', lista:'Template da lista salvo.', filtros:'Filtros da tela salvos.' })[aba])
        .then(()=>{ state.procTemplateAberto = false; state.procTemplateSel = null; renderApp(); });
      return true;
    }
  }
  return false;
}
function onTemplateCampo(el){
  const id = el.getAttribute('data-tpl-campo'); if(!id || !state.procTemplateSel) return false;
  const aba = state.procTemplateAba || 'card';
  const atual = new Set(state.procTemplateSel[aba]);
  el.checked ? atual.add(id) : atual.delete(id);
  const ordem = aba==='filtros' ? catalogoFiltrosProc().map(f=>f.id) : PROC_CAMPOS.map(c=>c.id);
  state.procTemplateSel[aba] = ordem.filter(x=>atual.has(x)); // mantém a ordem das janelas
  renderApp();
  return true;
}

const PROC_EMPRESA_CAMPOS = {
  'proc-cliente':     { path:'cliente.nome',            tipo:'cliente',      label:'Cliente' },

function procCampoEmpresa(chave, opts){
  const c = PROC_EMPRESA_CAMPOS[chave];

function empresaPorNome(tipo, nome){
  const n = String(nome||'').trim().toLowerCase();
  return n ? empresasDoTipo(tipo).find(e=>nomeEmpresaCad(e).trim().toLowerCase()===n) : null;
}
// Confere o campo: vazio ou empresa cadastrada do tipo certo. Se não for, apaga (e avisa, se pedido).
function validarEmpresaProcesso(chave, avisar){
  const c = PROC_EMPRESA_CAMPOS[chave];
  const v = String(getPath(state.procDraft, c.path)||'').trim();
  if(!v) return true;
  const e = empresaPorNome(c.tipo, v);
  if(e){ setPath(state.procDraft, c.path, nomeEmpresaCad(e)); return true; }
  setPath(state.procDraft, c.path, '');
  if(avisar){
    toast(`"${v}" não é uma empresa cadastrada como ${TIPOS_CADASTRO[c.tipo]}. O campo ${c.label} ficou em branco.`);
    renderApp();
  }
  return false;
}
function escolherEmpresaProcesso(chave, empresa){
  const c = PROC_EMPRESA_CAMPOS[chave];
  setPath(state.procDraft, c.path, nomeEmpresaCad(empresa));
  if(chave==='proc-cliente'){
    // Traz CNPJ e o primeiro contato do cadastro para os campos vazios
    const cli = state.procDraft.cliente;
    const ct = ((empresa.enderecos||[])[0]||{}).contatos ? empresa.enderecos[0].contatos[0] : null;
    if(!cli.cnpjCpf) cli.cnpjCpf = empresa.cnpjCpf || '';
    if(ct){
      if(!cli.contato) cli.contato = ct.nome || '';
      if(!cli.email) cli.email = ct.email || '';
      if(!cli.telefone && ct.telefone) cli.telefone = [ct.ddd ? '('+ct.ddd+')' : '', ct.telefone].filter(Boolean).join(' ');
    }
  }
  saveDraftProcesso();
  renderApp();
}

  const o = opts || {};

    return `<div class="field"${span}><label>${label}</label><select data-proc="${path}">

  return `<div class="field"${span}><label>${label}</label><input data-proc="${path}" value="${esc(v)}"
    ${o.type ? `type="${o.type}"` : ''} ${o.list ? `list="${o.list}"` : ''} ${o.step ? `step="${o.step}"` : ''}
    placeholder="${esc(o.placeholder||'')}" autocomplete="off" ${o.cls ? `class="${o.cls}"` : ''}>${o.hint ? `<span class="hint">${o.hint}</span>` : ''}</div>`;

// Valores calculados que aparecem na tela (atualizados enquanto a pessoa digita)
function procAcharLinhaPorId(p, id){
  for(const t of todosTransportesProc(p)) for(const g of ['frete','taxasOrigem','taxasDestino','seguro']){ const l = (t.custos[g]||[]).find(x=>x.id===id); if(l) return { t:'custo', l }; }
  let l = p.armazenagem.lancamentos.find(x=>x.id===id); if(l) return { t:'custo', l };
  l = p.outrasDespesas.lancamentos.find(x=>x.id===id); if(l) return { t:'despesa', l };
  for(const fo of p.produto.fornecedores){ l = (fo.fechamento.parcelas||[]).find(x=>x.id===id); if(l) return { t:'parcela', l, fo }; }
  return null;
}
function procValorCalc(p, key){
  const [t, a, b] = key.split(':');
  if(t==='lin'){ const r = procAcharLinhaPorId(p, a); if(!r) return fmtBRL(0); return fmtBRL(r.t==='custo' ? totalLinhaProc(r.l) : r.t==='despesa' ? totalDespesaProc(r.l) : procParcelaBRL(r.l, r.fo.moeda||'USD')); }
  if(t==='tr'){ const tt = transporteDaChaveProc(p, a); if(!tt) return fmtBRL(0); const c = tt.t.custos; return fmtBRL(b==='total' ? somaLinhasProc(c.frete)+somaLinhasProc(c.taxasOrigem)+somaLinhasProc(c.taxasDestino)+somaLinhasProc(c.seguro) : somaLinhasProc(c[b])); }
  if(t==='trres'){ const tt = transporteDaChaveProc(p, a); return tt ? resumoTransporteTxt(tt.t) : ''; }
  if(t==='arm'){ return fmtBRL(somaLinhasProc(p.armazenagem.lancamentos.filter(l=>grupoArmazenagemProc(p, l)===a))); }
  if(t==='armtot') return fmtBRL(somaLinhasProc(p.armazenagem.lancamentos));
  if(t==='outras'){ const ls = p.outrasDespesas.lancamentos.filter(d=>a==='tot' || (a==='int' ? d.origem==='internacional' : d.origem!=='internacional')); return fmtBRL(ls.reduce((s,d)=>s + totalDespesaProc(d), 0)); }
  if(t==='cmb'){
    const fo = p.produto.fornecedores.find(x=>x.id===a); if(!fo) return '—';
    const M = fo.moeda||'USD', ps = fo.fechamento.parcelas, ext = ps.reduce((s,x)=>s + numProcSimples(x.valor), 0), brl = ps.reduce((s,x)=>s + procParcelaBRL(x, M), 0), alvo = totaisFornecedorProc(fo).total;
    if(b==='parcelas') return fmtMoeda(ext, M);
    if(b==='brl') return fmtBRL(brl);
    if(b==='taxa'){ const c = cambioFornecedorProc(p, fo); return c ? fmtNum(c, 4) : '—'; }
    if(b==='dif'){ const d = alvo - ext; return Math.abs(d)<0.005 ? 'Cobre toda a mercadoria' : (d>0 ? `Faltam ${fmtMoeda(d, M)} para fechar` : `Excede em ${fmtMoeda(-d, M)}`); }
  }
  return '';
}
function atualizarModalProcesso(){
  const p = state.procDraft; if(!p) return;
  document.querySelectorAll('[data-pm-calc]').forEach(el=>{ el.textContent = procValorCalc(p, el.getAttribute('data-pm-calc')); });
}

/* ============ Lista moderna: linhas compactas (rótulo pequeno sobre o valor), como as janelas minimizadas do Monitoramento ============ */
// linhas: [{ acao, idHtml, campos:[{ label, html, num }], acoes }]
// Cada coluna tem a largura justa ao conteúdo (o maior texto entre as linhas), alinhada entre as linhas; a linha só cresce se houver muitas informações.
function listaModernaHtml(linhas, rodape){
  const txt = h => String(h==null ? '' : h).replace(/<[^>]*>/g, '').replace(/&[a-z#0-9]+;/gi, 'x');
  const ncol = linhas.reduce((m, l)=>Math.max(m, l.campos.length), 0);
  const larg = Array.from({ length:ncol }, (_, i)=>{
    let w = 0;
    linhas.forEach(l=>{ const c = l.campos[i]; if(!c) return; w = Math.max(w, txt(c.html).length*(c.num ? 7.9 : 7.4) + (/badge/.test(String(c.html)) ? 22 : 0), String(c.label).length*5.8, c.minW || 0); });
    return Math.round(Math.min(Math.max(w + 4, 54), 230));
  });
  const idW = Math.round(Math.max(48, linhas.reduce((m, l)=>Math.max(m, l.idW || txt(l.idHtml).length*7.6), 0) + 4));
  return `<div class="lm-lista">${linhas.map(l=>`
    <div class="lm-linha" ${l.acao ? `data-action="${l.acao}"` : ''}>
      <div class="lm-id" style="width:${idW}px">${l.idHtml}</div>
      <div class="lm-campos">${l.campos.map((c, i)=>`<div class="lm-campo" style="width:${larg[i]}px"><span>${esc(c.label)}</span><div class="lm-val ${c.num ? 'num-mono' : ''}">${c.html}</div></div>`).join('')}</div>
      <div class="lm-acoes">${l.acoes || ''}</div>
    </div>`).join('')}</div>${rodape || ''}`;
}

];

function prodDias(l){
  if(!l.dataProntidao || l.pronto) return '';
  const d1 = new Date(String(l.dataProntidao).slice(0,10) + 'T12:00:00'), d0 = new Date(hojeISO() + 'T12:00:00');

// Célula de um campo (com os campos editáveis: data de prontidão e flag de pronto)

  return c.html(l);
}

function producaoLinhasTodas(){
  const hoje = hojeISO(), out = [];
  (state.processosIndex||[]).forEach(raw=>{
    let p; try{ p = procNorm(raw); }catch(e){ return; }
    const cl = p.cliente || {};
    p.produto.fornecedores.forEach((fo, k)=>(fo.itens||[]).forEach(it=>{
      const pr = it.producao; if(!pr || !pr.ativo) return;
      const l = { chave:`${p.id}|${fo.id}|${it.id}`, procId:p.id, foId:fo.id, itId:it.id, fornecedor:fo.fornecedor || ('Fornecedor ' + (k+1)), cliente:cl.nome||'', refCliente:cl.referenciaCliente||'',
        produto:it.produto||'', descricao:it.descricao||'', ncm:it.ncm||'', quantidade:it.quantidade||'', unidade:it.unidade||'', dataProntidao:pr.dataProntidao||'', pronto:!!pr.pronto, adicionadoEm:pr.adicionadoEm||'', adicionadoPor:pr.adicionadoPor||'' };
      l.sit = prodSituacao(l, hoje); out.push(l);
    }));
  });
  return out.sort((a, b)=>{ const va = a.dataProntidao || '9999', vb = b.dataProntidao || '9999'; return va.localeCompare(vb) || String(a.procId).localeCompare(String(b.procId)) || a.produto.localeCompare(b.produto); });
}
function producaoFiltradas(){
  const f = state.prodFiltro || {}, q = String(f.busca||'').trim().toLowerCase();
  return producaoLinhasTodas().filter(l=>{
    if(f.situacao && l.sit!==f.situacao) return false;
    if(f.de && !(l.dataProntidao && l.dataProntidao>=f.de)) return false;
    if(f.ate && !(l.dataProntidao && l.dataProntidao<=f.ate)) return false;
    if(q && ![l.procId, l.refCliente, l.cliente, l.fornecedor, l.produto, l.descricao].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });

// Grava no processo de origem. alteracoes: [{ procId, foId, itId, patch:{ dataProntidao, pronto, ativo } }]. Retorna o nº de itens alterados (ou -1 se falhar).
async function producaoSalvar(alteracoes){
  const porProc = new Map(); alteracoes.forEach(a=>{ if(!porProc.has(a.procId)) porProc.set(a.procId, []); porProc.get(a.procId).push(a); });
  const backup = new Map(), agora = new Date().toISOString(); let n = 0;
  for(const [procId, lista] of porProc){
    const i = state.processosIndex.findIndex(x=>x.id===procId); if(i<0) continue;
    const orig = state.processosIndex[i], p = normalizarProcesso(JSON.parse(JSON.stringify(orig)));
    let alterou = false;
    lista.forEach(a=>{
      const fo = p.produto.fornecedores.find(x=>x.id===a.foId), it = fo && fo.itens.find(x=>x.id===a.itId); if(!it) return;
      const pr = it.producao, m = a.patch;
      if(m.ativo===false){ it.producao = producaoVaziaProc(); }
      else{
        if(m.dataProntidao!==undefined) pr.dataProntidao = m.dataProntidao;
        if(m.pronto!==undefined){ pr.pronto = !!m.pronto; if(m.pronto && !pr.dataProntidao) pr.dataProntidao = hojeISO(); }
      }
      n++; alterou = true;
    });
    if(!alterou) continue;
    backup.set(i, orig);
    state.processosIndex[i] = { ...orig, ...p, id:orig.id, seq:orig.seq, criadoEm:orig.criadoEm, criadoPor:orig.criadoPor, atualizadoEm:agora, atualizadoPor:(usuarioAtual && (usuarioAtual.nome || usuarioAtual.email)) || '' };
  }
  if(!backup.size) return 0;
  const ok = await persistProcessosIndex();
  if(!ok){ backup.forEach((orig, i)=>{ state.processosIndex[i] = orig; }); return -1; }
  return n;
}

async function alternarProducaoItem(foId, itId){

  }else{
    toast(entrando ? 'Marcado para produção. Salve o processo para ele aparecer na sessão Produção.' : 'Produto retirado da produção.');
  }
}
async function acaoProd(cmd, a1, a2){
  if(cmd==='prod-nada') return true;
  if(cmd==='prod-filtrar'){
    const v = k => { const el = document.querySelector(`[data-prod-filtro="${k}"]`); return el ? el.value : ''; };
    state.prodFiltro = { busca:v('busca'), situacao:v('situacao'), de:v('de'), ate:v('ate') }; renderApp(); return true;
  }
  if(cmd==='prod-limpar'){ state.prodFiltro = { busca:'', situacao:'', de:'', ate:'' }; renderApp(); return true; }
  if(cmd==='prod-remover'){
    if(!podeEditarProd()) return true;
    const l = producaoLinhasTodas().find(x=>x.chave===a1); if(!l) return true;
    if(!requestDelete('prod', a1)) return true;
    const n = await producaoSalvar([{ procId:l.procId, foId:l.foId, itId:l.itId, patch:{ ativo:false } }]);
    if(n>=0) toast('Produto retirado de Produção.', 'ok');
    renderApp(); return true;
  }
  if(cmd==='prod-modo'){ salvarPrefsProducao({ modo:a1==='card' ? 'card' : 'lista' }); renderApp(); return true; }
  if(cmd==='prod-template'){ state.prodTemplateAberto = !state.prodTemplateAberto; state.prodTemplateSel = null; if(state.prodTemplateAberto) state.prodTemplateAba = prefsProducao().modo; renderApp(); return true; }
  if(cmd==='prod-tpl-aba'){ state.prodTemplateAba = a1==='card' ? 'card' : 'lista'; renderApp(); return true; }
  if(cmd==='prod-tpl-grupo'){ const aba = state.prodTemplateAba || 'lista', set = new Set(state.prodTemplateSel[aba]); PROD_CAMPOS.filter(c=>c.grupo===a1 && !(aba==='card' && c.id==='produto')).forEach(c=>{ if(a2==='1') set.add(c.id); else set.delete(c.id); }); state.prodTemplateSel[aba] = PROD_CAMPOS.map(c=>c.id).filter(x=>set.has(x)); renderApp(); return true; }
  if(cmd==='prod-tpl-padrao'){ const aba = state.prodTemplateAba || 'lista'; state.prodTemplateSel[aba] = [...PROD_TEMPLATE_PADRAO[aba]]; renderApp(); return true; }
  if(cmd==='prod-tpl-salvar'){
    const aba = state.prodTemplateAba || 'lista', escolhidos = (state.prodTemplateSel||{})[aba] || [];
    if(!escolhidos.length){ toast('Selecione pelo menos uma informação.'); return true; }

    return true;
  }
  if(cmd==='prod-abrir'){ abrirProcesso(a1); state.procTab = 'produto'; state.procModal = null; saveDraftProcesso(); renderApp(); return true; }
  return false;
}

   Cotação de venda: formaliza a proposta ao cliente (cliente, itens, impostos, frete, pagamento e transporte).

const VENDA_TIPOS = {

// Número digitado ("1.234,56", "1234.56" ou "10%") → número
const numV = v => { if(typeof v==='number') return isFinite(v) ? v : 0; let t = String(v ?? '').trim().replace(/\s/g, '').replace(/%$/, ''); if(!t) return 0; if(t.includes(',')) t = t.replace(/\./g, '').replace(',', '.'); const n = parseFloat(t); return isFinite(n) ? n : 0; };

    deposito:'Padrão', observacoes:'', observacoesInternas:'', cotacaoId:'', pedidoId:'' };

function normalizarVenda(v, tipo){

// Cálculo da venda: itens, impostos, totais, comissão e parcelas
function calcVenda(v){
  const itens = (v.itens||[]).filter(i=>String(i.descricao||'').trim() || numV(i.quantidade) || numV(i.precoUn));
  const totalProdutos = itens.reduce((s, i)=>s + numV(i.quantidade)*numV(i.precoUn), 0);
  const dStr = String(v.desconto||'').trim(), desconto = Math.min(totalProdutos, Math.max(0, dStr.endsWith('%') ? totalProdutos*numV(dStr)/100 : numV(dStr)));
  const fator = totalProdutos>0 ? (totalProdutos - desconto)/totalProdutos : 1;
  const linhas = itens.map(i=>{
    const qtd = numV(i.quantidade), total = qtd*numV(i.precoUn), base = total*fator;
    return { ...i, qtd, total, base, pesoBrutoTotal:qtd*numV(i.pesoBruto), pesoLiquidoTotal:qtd*numV(i.pesoLiquido),
      vIpi:base*numV(i.ipi)/100, vIcmsSt:base*numV(i.icmsSt)/100, vIcms:base*numV(i.icms)/100, vPis:base*numV(i.pis)/100, vCofins:base*numV(i.cofins)/100, vDifal:base*numV(i.difal)/100 };
  });
  const soma = k => linhas.reduce((s, l)=>s + l[k], 0);
  const ipi = soma('vIpi'), icmsSt = soma('vIcmsSt'), fretePagoCliente = numV(v.fretePagoCliente), despesas = numV(v.despesas);
  // IPI e ICMS ST somam na nota; ICMS, PIS, COFINS e Difal já estão no preço (informativos)
  const totalVenda = totalProdutos - desconto + ipi + icmsSt + fretePagoCliente + despesas;
  const n = Math.max(1, Math.min(48, Math.round(numV(v.parcelasQtd)) || 1)), intervalo = Math.max(0, Math.round(numV(v.intervaloDias)));
  const parcelas = []; let acum = 0;
  for(let k=0; k<n; k++){
    const valor = k<n-1 ? Math.round(totalVenda/n*100)/100 : Math.round((totalVenda - acum)*100)/100; acum += valor;
    let venc = ''; const base = v.primeiroVencimento || '';
    if(base){ const d = new Date(base + 'T12:00:00'); d.setDate(d.getDate() + k*intervalo); venc = d.toISOString().slice(0,10); }
    parcelas.push({ n:k+1, vencimento:venc, valor });
  }
  return { linhas, nItens:linhas.length, somaQtd:soma('qtd'), pesoBruto:soma('pesoBrutoTotal'), pesoLiquido:soma('pesoLiquidoTotal'), totalProdutos, desconto, ipi, icmsSt, icms:soma('vIcms'), pis:soma('vPis'), cofins:soma('vCofins'), difal:soma('vDifal'),
    fretePagoCliente, fretePagoEmpresa:numV(v.fretePagoEmpresa), despesas, totalVenda, comissao:(totalProdutos - desconto)*numV(v.comissaoPct)/100, parcelas };
}

let vendasAvisouLocal = false;
async function persistVendas(tipo){
  const cfg = VENDA_TIPOS[tipo];
  try{ localStorage.setItem(chaveLocal('vendas:' + tipo + ':copia'), JSON.stringify(state[cfg.estado])); }catch(e){}
  const ok = await storeSet(cfg.chave, state[cfg.estado]);
  if(!ok && !vendasAvisouLocal){ vendasAvisouLocal = true; toast(`${cfg.plural} mantidas neste navegador. Se o erro continuar, o servidor ainda precisa aceitar a chave "${cfg.chave}".`); }
  return ok;
}
function novoNumeroVenda(tipo){ const l = state[VENDA_TIPOS[tipo].estado] || []; return Math.max(0, ...l.map(x=>x.seq||0)) + 1; }
const idVenda = (tipo, seq) => VENDA_TIPOS[tipo].prefixo + String(seq).padStart(4, '0');

// Cliente cadastrado (tipo Cliente) pelo nome, CNPJ/CPF ou e-mail digitado
const normBuscaV = x => String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
function acharClienteVenda(txt){
  const q = normBuscaV(txt), dig = String(txt||'').replace(/\D/g, ''); if(!q) return null;
  return empresasDoTipo('cliente').find(e=>[nomeEmpresaCad(e), e.razaoSocial, e.nomeFantasia].some(n=>n && normBuscaV(n)===q) || (dig.length>=8 && String(e.cnpjCpf||'').replace(/\D/g, '')===dig)) || null;
}

async function gerarPedidoDaCotacao(cotId){
  const cot = state.vendasCot.find(x=>x.id===cotId); if(!cot) return null;
  if(cot.pedidoId && state.vendasPed.some(p=>p.id===cot.pedidoId)) return state.vendasPed.find(p=>p.id===cot.pedidoId);   // já migrada
  const seq = novoNumeroVenda('ped'), agora = new Date().toISOString();
  const ped = normalizarVenda({ ...JSON.parse(JSON.stringify(cot)), id:idVenda('ped', seq), seq, tipo:'ped', status:'aberto', cotacaoId:cot.id, pedidoId:'', criadoEm:agora, atualizadoEm:agora, criadoPor:nomeUsuarioVenda(), validade:'',
    itens:cot.itens.map(i=>({ ...JSON.parse(JSON.stringify(i)), id:uid() })) }, 'ped');
  state.vendasPed.push(ped);
  cot.status = 'aceita'; cot.pedidoId = ped.id; cot.atualizadoEm = agora;

  return ped;
}

    if(mp){   // produto cadastrado: preenche código, unidade, preço e pesos
      const it = f.draft.itens[+mp[1]], q = normBuscaV(it.descricao), pr = (state.produtos||[]).find(x=>normBuscaV(x.nome)===q || (x.codigoInterno && normBuscaV(x.codigoInterno)===q));

    }
    if(VENDA_REDESENHA.test(path)){ renderApp(); return; }
  }

function novaVendaForm(){ state.vendaForm = { tipo:'cot', draft:novaVenda('cot'), tab:'itens' }; navigate('vendaForm'); }
function abrirVenda(tipo, id){
  const item = (state[VENDA_TIPOS[tipo].estado]||[]).find(x=>x.id===id); if(!item){ toast('Registro não encontrado.'); return; }
  state.vendaForm = { tipo, draft:normalizarVenda(JSON.parse(JSON.stringify(item)), tipo), tab:'itens' }; navigate('vendaForm');
}
async function salvarVenda(){
  const f = state.vendaForm; if(!f) return false;
  const d = f.draft, cfg = VENDA_TIPOS[f.tipo];
  const cli = acharClienteVenda(d.cliente);
  if(!cli){ toast('Escolha um cliente cadastrado (Cadastro → Clientes e Empresas, tipo Cliente).'); return false; }
  d.clienteId = cli.id; d.cliente = nomeEmpresaCad(cli);
  const c = calcVenda(d); if(!c.nItens){ toast('Adicione pelo menos um item (descrição, quantidade e preço).'); return false; }
  const lista = state[cfg.estado], agora = new Date().toISOString(), copia = JSON.parse(JSON.stringify(d));
  const i = d.id ? lista.findIndex(x=>x.id===d.id) : -1, novo = i<0;
  if(i>=0){ copia.atualizadoEm = agora; copia.atualizadoPor = nomeUsuarioVenda(); lista[i] = copia; }
  else{ const seq = novoNumeroVenda(f.tipo); Object.assign(copia, { seq, id:idVenda(f.tipo, seq), criadoEm:agora, criadoPor:nomeUsuarioVenda(), atualizadoEm:agora }); lista.push(copia); state[cfg.atual] = copia.id; }
  const ok = await persistVendas(f.tipo);
  if(novo && state[cfg.atual] && lista.some(x=>x.id===state[cfg.atual])) copia.id = state[cfg.atual];
  d.id = copia.id; d.seq = copia.seq;
  if(f.tipo==='cot' && copia.status==='aceita' && !copia.pedidoId){
    const ped = await gerarPedidoDaCotacao(copia.id);
    toast(`Cotação ${copia.id} aceita: ${ped.id} gerado em Pedidos.`, 'ok'); state.vendaForm = null; navigate('vendaPedidos'); return true;
  }
  toast(`${cfg.nome} ${copia.id} salva.`, 'ok'); state.vendaForm = null; navigate(cfg.rota); return true;
}
async function aceitarCotacao(id){
  const cot = state.vendasCot.find(x=>x.id===id); if(!cot) return;
  if(cot.pedidoId){ toast(`Esta cotação já foi aceita: ${cot.pedidoId}.`); return; }
  if(!window.confirm(`Aceitar a cotação ${id} e gerar o pedido de venda?`)) return;
  const ped = await gerarPedidoDaCotacao(id); if(!ped) return;
  toast(`Cotação ${id} aceita: ${ped.id} gerado em Pedidos.`, 'ok'); navigate('vendaPedidos');
}
async function excluirVenda(tipo, id){
  if(!requestDelete('venda', id)) return;
  const cfg = VENDA_TIPOS[tipo]; state[cfg.estado] = state[cfg.estado].filter(x=>x.id!==id);
  await persistVendas(tipo); toast(cfg.nome + ' excluída.', 'ok'); renderApp();
}
async function duplicarVenda(id){
  const o = state.vendasCot.find(x=>x.id===id); if(!o) return;
  const seq = novoNumeroVenda('cot'), agora = new Date().toISOString();
  state.vendasCot.push(normalizarVenda({ ...JSON.parse(JSON.stringify(o)), id:idVenda('cot', seq), seq, status:'em_andamento', pedidoId:'', criadoEm:agora, atualizadoEm:agora, criadoPor:nomeUsuarioVenda(), dataVenda:hojeVenda(), itens:o.itens.map(i=>({ ...i, id:uid() })) }, 'cot'));

/* =========================== Financeiro (resumo de custos de todos os processos) =========================== */
const FIN_SIT = { pago:['Pago','badge-green'], aberto:['Em aberto','badge-navy'], vencido:['Vencido','badge-red'] };
const finSituacao = (l, hoje) => l.pago ? 'pago' : ((l.vencimento && String(l.vencimento).slice(0,10) < hoje) ? 'vencido' : 'aberto');

// Uma linha por custo lançado em TODOS os processos (câmbio, frete, taxas, armazenagem, outras despesas e tributos)
function financeiroLinhasTodas(){
  const hoje = hojeISO(), out = [];
  (state.processosIndex||[]).forEach(raw=>{
    let p; try{ p = procNorm(raw); }catch(e){ return; }
    const cl = p.cliente || {};
    lancamentosFinanceirosProc(p).forEach(l=>out.push({ ...l, procId:p.id, chave:p.id + '|' + (l.fonte.id || l.fonte.k), refCliente:cl.referenciaCliente||'', cliente:cl.nome||'', sit:finSituacao(l, hoje) }));
  });
  return out.sort((a, b)=>{ const va = a.vencimento || '9999', vb = b.vencimento || '9999'; return va.localeCompare(vb) || String(a.procId).localeCompare(String(b.procId)); });
}
function financeiroFiltradas(){
  const f = state.finFiltro || {}, q = String(f.busca||'').trim().toLowerCase();
  return financeiroLinhasTodas().filter(l=>{
    if(f.situacao && l.sit!==f.situacao) return false;
    if(f.de && !(l.vencimento && l.vencimento>=f.de)) return false;
    if(f.ate && !(l.vencimento && l.vencimento<=f.ate)) return false;
    if(q && ![l.procId, l.refCliente, l.cliente, l.tipo, l.descricao, l.prestador, l.moeda].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
}

/* --- gravação no processo de origem --- */
const strNumFin = n => String(Math.round(n*1e6)/1e6);
function finAcharObj(p, f){
  if(f.kind==='cambio'){ const fo = p.produto.fornecedores.find(x=>x.id===f.foId); return fo ? fo.fechamento.parcelas.find(x=>x.id===f.id) : null; }
  if(f.kind==='linha'){ const t = todosTransportesProc(p)[f.tIdx]; return t ? (t.custos[f.grupo]||[]).find(x=>x.id===f.id) : null; }
  if(f.kind==='arm') return p.armazenagem.lancamentos.find(x=>x.id===f.id) || null;
  if(f.kind==='outra') return p.outrasDespesas.lancamentos.find(x=>x.id===f.id) || null;
  return null;
}
// m: { valor, moeda, taxa, vencimento, pago } (só o que mudou). Retorna true se algo foi alterado.
function finAplicarNaFonte(p, f, m){
  let mudou = false; const tem = k => m[k]!==undefined && m[k]!==null;
  if(f.kind==='trib'){   // tributos: pagamento e data; o valor só muda quando não é calculado pelas alíquotas
    if(tem('pago')){ p.desembaraco.pagos[f.k] = !!m.pago; mudou = true; if(m.pago && !tem('vencimento') && !(p.desembaraco.datasPagamento||{})[f.k]) p.desembaraco.datasPagamento[f.k] = hojeISO(); }
    if(tem('vencimento')){ p.desembaraco.datasPagamento[f.k] = m.vencimento; mudou = true; }
    if(tem('valor') && !computeNumerarioProcesso(p).usaAliq){ p.desembaraco.tributos[f.k] = strNumFin(m.valor); mudou = true; }
    return mudou;
  }
  const o = finAcharObj(p, f); if(!o) return false;
  if(tem('moeda')){ o.moeda = m.moeda; if(m.moeda==='BRL') o.taxa = ''; mudou = true; }
  if(tem('taxa') && (o.moeda||'BRL')!=='BRL'){ o.taxa = m.taxa==='' ? '' : strNumFin(m.taxa); mudou = true; }
  if(tem('valor')){
    if(f.kind==='linha' || f.kind==='arm'){ const q = numProcSimples(o.quantidade); if(q>0) o.tarifa = strNumFin(m.valor/q); else { o.tarifa = strNumFin(m.valor); o.quantidade = '1'; } }
    else o.valor = strNumFin(m.valor);
    mudou = true;
  }
  if(tem('vencimento')){ o.vencimento = m.vencimento; mudou = true; }
  if(tem('pago')){ o.pago = !!m.pago; mudou = true; }
  return mudou;
}
// alteracoes: [{ procId, fonte, mudancas }]  →  grava os processos alterados (uma gravação só). Retorna o nº de custos alterados (ou -1 se falhar).
async function finSalvar(alteracoes){
  const porProc = new Map(); alteracoes.forEach(a=>{ if(!porProc.has(a.procId)) porProc.set(a.procId, []); porProc.get(a.procId).push(a); });
  const backup = new Map(), agora = new Date().toISOString(); let n = 0;
  for(const [procId, lista] of porProc){
    const i = state.processosIndex.findIndex(x=>x.id===procId); if(i<0) continue;
    const orig = state.processosIndex[i], p = normalizarProcesso(JSON.parse(JSON.stringify(orig)));
    let alterou = false; lista.forEach(a=>{ if(finAplicarNaFonte(p, a.fonte, a.mudancas)){ n++; alterou = true; } });
    if(!alterou) continue;
    backup.set(i, orig);
    state.processosIndex[i] = { ...orig, ...p, id:orig.id, seq:orig.seq, criadoEm:orig.criadoEm, criadoPor:orig.criadoPor, atualizadoEm:agora, atualizadoPor:(usuarioAtual && (usuarioAtual.nome || usuarioAtual.email)) || '' };
  }
  if(!backup.size) return 0;
  const ok = await persistProcessosIndex();
  if(!ok){ backup.forEach((orig, i)=>{ state.processosIndex[i] = orig; }); return -1; }
  return n;
}
function finLerEdicao(){
  const m = {}, lerEl = k => document.querySelector(`[data-fin-edit="${k}"]`);
  const v = lerEl('valor'); if(v && !v.disabled && v.value!=='') m.valor = Number(String(v.value).replace(',', '.'));
  const mo = lerEl('moeda'); if(mo && !mo.disabled) m.moeda = mo.value;
  const t = lerEl('taxa'); if(t && !t.disabled) m.taxa = t.value==='' ? '' : Number(String(t.value).replace(',', '.'));
  const d = lerEl('vencimento'); if(d) m.vencimento = d.value;
  const pg = lerEl('pago'); if(pg) m.pago = !!pg.checked;
  return m;
}
// Seleção para alteração em massa: só vale para custos do MESMO processo
const finProcDe = chave => String(chave).split('|')[0];
function finProcSelecionado(){ const k = Object.keys(state.finSel||{})[0]; return k ? finProcDe(k) : ''; }
function finRender(){ const y = window.scrollY || 0; renderApp(); try{ window.scrollTo(0, y); }catch(e){} }
async function acaoFin(cmd, a1){
  if(cmd==='fin-nada') return true;
  if(cmd==='fin-filtrar'){
    const v = k => { const el = document.querySelector(`[data-fin-filtro="${k}"]`); return el ? el.value : ''; };
    state.finFiltro = { busca:v('busca'), situacao:v('situacao'), de:v('de'), ate:v('ate') }; renderApp(); return true;
  }
  if(cmd==='fin-limpar'){ state.finFiltro = { busca:'', situacao:'', de:'', ate:'' }; renderApp(); return true; }
  if(cmd==='fin-massa-modo'){ if(!podeEditarFin()) return true; state.finMassa = !state.finMassa; state.finSel = {}; state.finEdit = null; renderApp(); return true; }
  if(cmd==='fin-sel-limpar'){ state.finSel = {}; finRender(); return true; }
  if(cmd==='fin-sel-processo'){ if(!podeEditarFin()) return true; finSelecionarProcesso(a1); return true; }
  if(cmd==='fin-editar'){ if(!podeEditarFin()) return true; state.finEdit = a1; renderApp(); return true; }
  if(cmd==='fin-cancelar'){ state.finEdit = null; renderApp(); return true; }
  if(cmd==='fin-salvar'){
    if(!podeEditarFin()) return true;
    const l = financeiroLinhasTodas().find(x=>x.chave===a1); if(!l){ state.finEdit = null; renderApp(); return true; }
    const m = finLerEdicao();
    if(m.valor!==undefined && !(m.valor>=0)){ toast('Informe um valor válido.'); return true; }
    if(m.taxa!==undefined && m.taxa!=='' && !(m.taxa>0)){ toast('Informe uma taxa válida (maior que zero).'); return true; }
    const n = await finSalvar([{ procId:l.procId, fonte:l.fonte, mudancas:m }]);
    if(n<0) return true;
    state.finEdit = null; toast(n ? `Custo atualizado no processo ${l.procId}.` : 'Nenhuma alteração.', n ? 'ok' : undefined); finRender(); return true;
  }
  if(cmd==='fin-massa-aplicar'){ finAplicarMassa(); return true; }
  return false;
}
// Seleciona todos os custos (do filtro atual) de um processo
function finSelecionarProcesso(procId){
  const atual = finProcSelecionado();
  if(atual && atual!==procId){ toast(`Só é possível alterar em massa custos do mesmo processo. Limpe a seleção de ${atual} para escolher ${procId}.`); finRender(); return; }
  financeiroFiltradas().filter(l=>l.procId===procId).forEach(l=>{ state.finSel[l.chave] = true; });
  finRender();
}
// Seleção de linhas (alteração em massa). O pagamento só é alterado com a linha em edição (lápis) ou em massa.
async function onFinInput(el){
  if(el.hasAttribute('data-fin-sel')){
    if(!podeEditarFin() || !state.finMassa) return;
    const k = el.getAttribute('data-fin-sel'), atual = finProcSelecionado();
    if(el.checked){
      if(atual && atual!==finProcDe(k)){ toast(`Só é possível alterar em massa custos do mesmo processo (${atual}).`); finRender(); return; }
      state.finSel[k] = true;
    }else delete state.finSel[k];
    finRender(); return;
  }
  if(el.hasAttribute('data-fin-proc-sel')){ if(el.value) finSelecionarProcesso(el.value); return; }
}
// Alteração em massa: aplica o que foi preenchido a todas as linhas selecionadas (do mesmo processo)
async function finAplicarMassa(){
  if(!podeEditarFin()) return;
  const el = k => document.querySelector(`[data-fin-massa="${k}"]`), val = k => el(k) ? el(k).value : '';
  const sel = financeiroLinhasTodas().filter(l=>state.finSel[l.chave]);
  if(!sel.length) return toast('Selecione os custos que serão alterados.');
  const procs = new Set(sel.map(l=>l.procId));
  if(procs.size>1) return toast('Só é possível alterar em massa custos do mesmo processo. Deixe selecionados apenas os de um processo.');
  const m = {}; const pg = val('pago'); if(pg==='pago') m.pago = true; else if(pg==='aberto') m.pago = false;
  if(val('vencimento')) m.vencimento = val('vencimento');
  const adiar = Number(val('adiar')) || 0;
  if(val('moeda')) m.moeda = val('moeda');
  if(val('taxa')!==''){ const t = Number(String(val('taxa')).replace(',', '.')); if(!(t>0)) return toast('Informe uma taxa válida (maior que zero).'); m.taxa = t; }
  if(m.pago===undefined && !m.vencimento && !adiar && !m.moeda && m.taxa===undefined) return toast('Preencha pelo menos um campo para alterar.');
  const procId = [...procs][0];
  if(!window.confirm(`Aplicar a alteração a ${sel.length} custo${sel.length===1?'':'s'} do processo ${procId}?`)) return;
  const alteracoes = sel.map(l=>{
    const mud = { ...m };
    if(l.fonte.kind==='trib'){ delete mud.moeda; delete mud.taxa; }
    if(adiar && !m.vencimento && l.vencimento){ const d = new Date(l.vencimento + 'T12:00:00'); d.setDate(d.getDate() + adiar); mud.vencimento = d.toISOString().slice(0,10); }
    return { procId:l.procId, fonte:l.fonte, mudancas:mud };
  });
  const n = await finSalvar(alteracoes);
  if(n<0) return;
  state.finSel = {}; toast(`${n} custo${n===1?'':'s'} atualizado${n===1?'':'s'} no processo ${procId}.`, 'ok'); finRender();
}

// --------- Numerário do processo ---------
// Mesma regra da cotação Formal: Custo = Mercadoria + Frete (frete internacional + taxas de origem e de destino, de todos os transportes)
// + Armazenagem + Outras Despesas + tributos (II, IPI, PIS, COFINS e ICMS lançados no Desembaraço).
// A mercadoria entra no custo pelo FECHAMENTO DE CÂMBIO (parcelas × taxas). Rateio por produto: frete pelo peso líquido (pelo valor,
// se não houver pesos); mercadoria, armazenagem, outras despesas e tributos pelo valor.
// Base de cálculo da importação (VMLE, VMLD e valor aduaneiro): só o valor do produto na Invoice, convertido pela taxa do dia do
// Desembaraço; não depende do fechamento de câmbio. Frete, Seguro, Acréscimo, Siscomex e AFRMM do Desembaraço NÃO somam no custo.
function computeNumerarioProcesso(proc){
  const p = procNorm(proc), tr = p.desembaraco.tributos || {};
  const typed = k => numProcSimples(tr[k]);                    // valores em R$ informados direto (formato anterior)
  const avisos = [];
  const bases = basesAduaneirasProc(p);
  const fornecedores = p.produto.fornecedores.map((fo, k)=>{
    const M = fo.moeda || 'USD', cf = custoFornecedorProc(p, fo), nome = fo.fornecedor || `Fornecedor ${k+1}`, td = taxaDiaProc(p, M);
    const itens = (fo.itens||[]).map((i, n)=>({ i, n })).filter(({i})=>i.produto || i.quantidade || i.valorUnit).map(({i, n})=>{
      const qty = numProcSimples(i.quantidade), vu = numProcSimples(i.valorUnit), peso = numProcSimples(i.pesoLiquido), totalExt = qty*vu, a = i.aliq || {};
      return { fornecedor:nome, moeda:M, produto:i.produto, ncm:i.ncm, unidade:i.unidade, qty, vu, peso, totalExt, totalBRL: cf.ext>0 ? totalExt/cf.ext*cf.brl : 0, baseBRL: totalExt*td, kForn:k, nItem:n,
        aliq:{ ii:numProcSimples(a.ii)/100, ipi:numProcSimples(a.ipi)/100, pis:numProcSimples(a.pis)/100, cofins:numProcSimples(a.cofins)/100, icms:numProcSimples(a.icms)/100 } };
    });
    if(cf.ext>0 && !cf.brl) avisos.push(`Informe o fechamento de câmbio de ${nome} (botão "Fechamento de câmbio" na janela Produto).`);
    if(cf.excesso) avisos.push(`As parcelas de câmbio de ${nome} excedem o valor da mercadoria.`);
    return { nome, incoterm:fo.incoterm, moeda:M, cambio:cf.taxa, cf, fo, itens, totalExt:cf.ext, totalBRL:itens.reduce((s,i)=>s + i.totalBRL, 0) };
  }).filter(fo=>fo.itens.length);
  linhasSemTaxaProc(p).forEach(rot=>avisos.push(`Informe a taxa da moeda: ${rot}.`));
  bases.faltamTaxaDia.forEach(m=>avisos.push(`Informe a taxa de conversão do dia de ${m} na janela Desembaraço (base de cálculo da importação).`));
  const itens = fornecedores.flatMap(fo=>fo.itens);
  const cx = totaisCustosProc(p);
  const acrescimo = bases.acrescimo;
  const mercadoriaBRL = fornecedores.reduce((s,fo)=>s + fo.totalBRL, 0);          // custo da mercadoria (fechamento de câmbio)
  const valorAduaneiro = bases.vmld + acrescimo;                                   // o Acréscimo soma-se ao VMLD
  const despesasTotal = cx.transporte + cx.armazenagem + cx.outras;
  const usaAliq = itens.some(i=>PROC_TRIBUTOS_IMPOSTOS.some(k=>i.aliq[k]>0));      // com alíquotas informadas, os tributos são calculados
  // Rateio por produto
  const somaBase = itens.reduce((s,i)=>s + i.totalBRL, 0) || itens.reduce((s,i)=>s + i.totalExt, 0), somaPeso = itens.reduce((s,i)=>s + i.peso, 0);
  const usaBRL = itens.some(i=>i.totalBRL>0);
  const n = itens.length || 1, afrmmSiscomex = typed('afrmm') + typed('siscomex');
  const linhas = itens.map(i=>{
    const valorShare = somaBase>0 ? (usaBRL ? i.totalBRL : i.totalExt)/somaBase : 1/n;
    const freteShare = somaPeso>0 ? i.peso/somaPeso : valorShare;
    const rateioFrete = freteShare*cx.transporte, rateioAcrescimo = valorShare*acrescimo;
    const valorAduaneiroItem = i.baseBRL + freteShare*bases.freteBRL + valorShare*bases.seguro + rateioAcrescimo;
    const rateioArmazenagem = valorShare*cx.armazenagem, rateioOutras = valorShare*cx.outras;
    let tributos;
    if(usaAliq){   // mesmas fórmulas da cotação Formal (planilha original)
      const va = valorAduaneiroItem, ii = va*i.aliq.ii, ipi = (va+ii)*i.aliq.ipi, pis = va*i.aliq.pis, cofins = va*i.aliq.cofins;
      const bcIcms = i.aliq.icms<1 ? (va + ii + ipi + pis + cofins + valorShare*afrmmSiscomex)/(1 - i.aliq.icms) : 0;
      tributos = { ii, ipi, pis, cofins, icms:bcIcms*i.aliq.icms };
    }else tributos = Object.fromEntries(PROC_TRIBUTOS_IMPOSTOS.map(k=>[k, valorShare*typed(k)]));
    const credito = PROC_TRIBUTOS_CREDITO.reduce((s,k)=>s + tributos[k], 0);
    const custoSem = i.totalBRL + rateioFrete + rateioArmazenagem + rateioOutras + PROC_TRIBUTOS_IMPOSTOS.reduce((s,k)=>s + tributos[k], 0);
    const custoCom = custoSem - credito;
    return { ...i, rateioFrete, rateioAcrescimo, valorAduaneiro:valorAduaneiroItem, rateioArmazenagem, rateioOutras, ...tributos,
      custoSemCredito:custoSem, custoComCredito:custoCom, unitSemCredito: i.qty>0 ? custoSem/i.qty : 0, unitComCredito: i.qty>0 ? custoCom/i.qty : 0 };
  });
  const soma = k => linhas.reduce((s,l)=>s + (l[k]||0), 0);
  const imposto = k => linhas.length ? soma(k) : typed(k);
  const impostosTotal = PROC_TRIBUTOS_IMPOSTOS.reduce((s,k)=>s + imposto(k), 0);
  const creditoTotal = PROC_TRIBUTOS_CREDITO.reduce((s,k)=>s + imposto(k), 0);
  const custoSemCredito = mercadoriaBRL + despesasTotal + impostosTotal;
  const custoComCredito = custoSemCredito - creditoTotal;
  const totais = Object.fromEntries(['qty','peso','totalBRL','rateioFrete','rateioAcrescimo','valorAduaneiro','rateioArmazenagem','rateioOutras',...PROC_TRIBUTOS_IMPOSTOS,'custoSemCredito','custoComCredito'].map(k=>[k, soma(k)]));
  const porMoeda = {}; fornecedores.forEach(fo=>{ porMoeda[fo.moeda] = (porMoeda[fo.moeda]||0) + fo.totalExt; });
  totais.totalExtTexto = Object.keys(porMoeda).length ? fmtPorMoeda(porMoeda) : '—';
  return { p, fornecedores, mercadoriaBRL, bases, vmle:bases.vmle, vmld:bases.vmld, seguro:bases.seguro, freteInternacional:bases.freteBRL, acrescimo, valorAduaneiro, custos:cx,
    usaAliq, imposto:(k)=>k==='capatazia'||k==='siscomex'||k==='afrmm' ? typed(k) : imposto(k), impostosTotal, creditoTotal, despesasTotal, custoSemCredito, custoComCredito, linhas, totais, avisos };
}
const fmtTaxaProc = v => v ? fmtNum(v, 4) : '—';
// Linhas do Resumo das Despesas (tela e PDF): { label, ext (moeda estrangeira), brl, taxa, indent }
function resumoNumerarioProc(nm){
  const p = nm.p, linhas = [];
  const estrangeira = l => (l.moeda||'BRL')!=='BRL';
  nm.fornecedores.forEach(fo=>{
    const cf = fo.cf;
    if(cf.parcelas.length){   // fechamento de câmbio: cada parcela com a sua taxa
      cf.parcelas.forEach((pa, n)=>linhas.push({ label:`Mercadoria — ${fo.nome} · Parcela ${n+1}${pa.descricao ? ' (' + pa.descricao + ')' : ''}${pa.banco ? ' · ' + pa.banco : ''}${pa.contrato ? ' · contrato ' + pa.contrato : ''}`,
        ext:fmtMoeda(numProcSimples(pa.valor), pa.moeda||fo.moeda), brl:fmtBRL(numProcSimples(pa.valor)*numProcSimples(pa.taxa)), taxa:fmtTaxaProc(numProcSimples(pa.taxa)), indent:true }));
      if(cf.saldoExt>0.005) linhas.push({ label:`Mercadoria — ${fo.nome} · Saldo sem fechamento (taxa média)`, ext:fmtMoeda(cf.saldoExt, fo.moeda), brl:fmtBRL(cf.saldoBRL), taxa:fmtTaxaProc(cf.media), indent:true });
    }else linhas.push({ label:`Mercadoria — ${fo.nome} (${fo.incoterm||'—'})`, ext:fmtMoeda(fo.totalExt, fo.moeda), brl:fmtBRL(fo.totalBRL), taxa:fmtTaxaProc(fo.cambio) });
  });
  if(!nm.fornecedores.length) linhas.push({ label:'Mercadoria', ext:'—', brl:fmtBRL(0), taxa:'' });
  const linha = (rot, l) => ({ label:`${rot} — ${l.descricao || '(sem descrição)'}`, ext: estrangeira(l) ? fmtMoeda(numProcSimples(l.tarifa)*numProcSimples(l.quantidade), l.moeda) : '',
    brl:fmtBRL(totalLinhaProc(l)), taxa: estrangeira(l) ? fmtTaxaProc(numProcSimples(l.taxa)) : '', indent:true });
  const ts = todosTransportesProc(p);
  ts.forEach((t, k)=>{
    const pre = ts.length>1 ? `Transporte ${k+1} · ` : '';
    t.custos.frete.filter(linhaPreenchidaProc).forEach(l=>linhas.push(linha(pre + (PROC_TIPOS_FRETE[t.modal] || 'Frete internacional'), l)));
    t.custos.taxasOrigem.filter(linhaPreenchidaProc).forEach(l=>linhas.push(linha(pre + 'Taxas de Origem', l)));
    t.custos.taxasDestino.filter(linhaPreenchidaProc).forEach(l=>linhas.push(linha(pre + 'Taxas de Destino', l)));
    (t.custos.seguro||[]).filter(linhaPreenchidaProc).forEach(l=>linhas.push(linha(pre + 'Seguro de Frete Internacional', l)));
  });
  const term = (p.armazenagem.terminal||{}).nome;
  p.armazenagem.lancamentos.filter(linhaPreenchidaProc).forEach(l=>linhas.push(linha('Armazenagem · ' + nomeContainerProc(p, l.containerId) + (term ? ' · ' + term : ''), l)));
  p.outrasDespesas.lancamentos.filter(linhaPreenchidaProc).forEach(d=>linhas.push({ label:`Outras Despesas · ${d.origem==='internacional' ? 'Internacional' : 'Nacional'} — ${d.descricao || '(sem descrição)'}${d.prestador ? ' · ' + d.prestador : ''}`,
    ext: estrangeira(d) ? fmtMoeda(numProcSimples(d.valor), d.moeda) : '', brl:fmtBRL(totalDespesaProc(d)), taxa: estrangeira(d) ? fmtTaxaProc(numProcSimples(d.taxa)) : '', indent:true }));
  PROC_TRIBUTOS_IMPOSTOS.forEach(k=>linhas.push({ label:PROC_TRIBUTOS.find(([x])=>x===k)[1], ext:'', brl:fmtBRL(nm.imposto(k)), taxa:'' }));
  return linhas;
}
// Bases do Desembaraço (informativas, não somam no custo): [rótulo, moeda estrangeira, R$]
const extTextoProc = o => Object.keys(o).length ? fmtPorMoeda(o) : '—';
function basesNumerarioProc(nm){
  const b = nm.bases;
  return [
    ['VMLE — valor da mercadoria no local de embarque (soma dos produtos da Invoice)', extTextoProc(b.vmleExt), nm.vmle],
    ['Frete internacional', extTextoProc(b.freteExt), nm.freteInternacional], ['Seguro internacional', extTextoProc(b.seguroExt), nm.seguro],
    ['VMLD — valor da mercadoria no local de destino (VMLE + frete + seguro)', extTextoProc(b.vmldExt), nm.vmld],
    ['Acréscimo (soma-se ao VMLD)', extTextoProc(b.acrescimoExt), nm.acrescimo], ['Valor aduaneiro (VMLD + Acréscimo)', '', nm.valorAduaneiro],
    ['Taxa Siscomex', '', nm.imposto('siscomex')], ['AFRMM', '', nm.imposto('afrmm')],
  ];
}

// Campos que mudam a estrutura da janela (redesenha) — o resto só guarda o valor.
const PROC_REDESENHA = /^(transporte\.(modal|tipoCarga)|transportes\.\d+\.(modal|tipoCarga)|desembaraco\.(liNecessaria|tipoDeclaracao|seguroMoeda)|financeiro\.(freteMoeda|seguroMoeda)|produto\.fornecedores\.\d+\.moeda|produto\.fornecedores\.\d+\.fechamento\.parcelas\.\d+\.moeda|(transporte|transportes\.\d+)\.custos\.(frete|taxasOrigem|taxasDestino|seguro)\.\d+\.moeda|armazenagem\.lancamentos\.\d+\.moeda|outrasDespesas\.lancamentos\.\d+\.(origem|moeda)|status)$/;
function onProcessoInput(el, evento){
  const path = el.getAttribute('data-proc');
  if(!path || !state.procDraft) return false;
  const valor = el.type==='checkbox' ? el.checked : el.value;
  setPath(state.procDraft, path, valor);
  // Autopreenchimento a partir dos cadastros
  const campoEmpresa = Object.entries(PROC_EMPRESA_CAMPOS).find(([,c])=>c.path===path);
  if(campoEmpresa){
    if(evento==='input'){
      if(String(valor).trim().length>=3) showAutocomplete(el, campoEmpresa[0], null); else hideAutocomplete();
    }else validarEmpresaProcesso(campoEmpresa[0], true);
    saveDraftProcesso();
    return true;
  }
  const mItem = /^produto\.fornecedores\.(\d+)\.itens\.(\d+)\.produto$/.exec(path);
  if(evento==='change' && mItem){
    const fo = state.procDraft.produto.fornecedores[+mItem[1]];
    const prod = state.produtos.find(x=>x.nome===valor), it = fo && fo.itens[+mItem[2]];
    if(prod && it){
      it.ncm = it.ncm || prod.ncm || ''; it.unidade = it.unidade || prod.unidadeMedida || '';
      it.descricao = it.descricao || prod.descricao || ''; it.pesoLiquido = it.pesoLiquido || prod.pesoLiquido || '';
      renderApp();
    }
  }
  const mForn = /^produto\.fornecedores\.(\d+)\.fornecedor$/.exec(path);
  if(evento==='change' && mForn){
    const fo = state.procDraft.produto.fornecedores[+mForn[1]];
    const f = (state.clientes||[]).find(x=>nomeCadastro(x)===valor);
    const pais = f && f.enderecos && f.enderecos[0] && f.enderecos[0].pais;
    if(fo && pais && pais!=='Brasil' && !fo.paisOrigem){ fo.paisOrigem = pais; renderApp(); }
  }
  // Moeda do fornecedor mudou: as parcelas do fechamento de câmbio acompanham
  const mMoedaFo = /^produto\.fornecedores\.(\d+)\.moeda$/.exec(path);
  if(evento==='change' && mMoedaFo){ const fo = state.procDraft.produto.fornecedores[+mMoedaFo[1]]; if(fo) fo.fechamento.parcelas.forEach(pa=>{ pa.moeda = valor; }); }
  // Outras Despesas: nacional = reais; internacional = moeda estrangeira com a sua taxa
  const mOrigem = /^outrasDespesas\.lancamentos\.(\d+)\.origem$/.exec(path);
  if(evento==='change' && mOrigem){ const d = state.procDraft.outrasDespesas.lancamentos[+mOrigem[1]]; if(d){ if(valor==='nacional'){ d.moeda = 'BRL'; d.taxa = ''; } else if(d.moeda==='BRL') d.moeda = 'USD'; } }
  if(evento==='change' && PROC_REDESENHA.test(path)) renderApp();
  else atualizarTotaisProcesso();
  saveDraftProcesso();
  return true;
}

function novoNumeroProcesso(){ return (state.processosIndex||[]).reduce((m,p)=>Math.max(m, p.seq||0), 0) + 1; }

async function salvarProcesso(){
  const p = state.procDraft;
  sincronizarContainersProc(p);
  if(!p.cliente.dataAbertura){ renderApp(); return toast('Informe a data de abertura do processo.'); }
  const invalidos = Object.keys(PROC_EMPRESA_CAMPOS).filter(t=>!validarEmpresaProcesso(t, false));
  if(invalidos.length){
    renderApp();
    toast('Apagado por não ser empresa cadastrada: ' + invalidos.map(t=>PROC_EMPRESA_CAMPOS[t].label).join(', ') + '. Escolha na lista e salve de novo.');
    return;
  }
  if(!p.cliente.nome.trim()){ state.procTab = 'cliente'; renderApp(); return toast('Informe o cliente do processo (empresa cadastrada como Cliente).'); }
  const agora = new Date().toISOString();
  const copia = JSON.parse(JSON.stringify(p));
  if(state.currentProcessoId){
    const i = state.processosIndex.findIndex(x=>x.id===state.currentProcessoId);
    if(i<0){ toast('Este processo foi excluído por outra pessoa. Ele será salvo como novo.'); state.currentProcessoId = null; return salvarProcesso(); }
    copia.id = state.currentProcessoId; copia.seq = state.processosIndex[i].seq; copia.criadoEm = state.processosIndex[i].criadoEm;
    copia.atualizadoEm = agora; copia.atualizadoPor = usuarioAtual.nome || usuarioAtual.email;
    state.processosIndex[i] = copia;
  }else{
    const seq = novoNumeroProcesso();
    copia.id = 'PRC-' + String(seq).padStart(4,'0'); copia.seq = seq;
    copia.criadoEm = agora; copia.atualizadoEm = agora; copia.criadoPor = usuarioAtual.nome || usuarioAtual.email;
    state.processosIndex.push(copia);
    state.currentProcessoId = copia.id;
  }
  const ok = await persistProcessosIndex();
  if(!ok) return;
  // O número pode ter mudado na mescla (outra pessoa salvou o mesmo número ao mesmo tempo).
  const salvo = state.processosIndex.find(x=>x.id===state.currentProcessoId);
  if(salvo){ state.procDraft = normalizarProcesso(JSON.parse(JSON.stringify(salvo))); }
  saveDraftProcesso();
  toast('Processo ' + state.currentProcessoId + ' salvo.', 'ok');
  renderApp();
}
async function persistProcessosIndex(){ return storeSet('processos:index', state.processosIndex); }

// Abre o processo direto na janela do custo clicado (usado pelo Financeiro): aba certa, janela do câmbio/transporte e a linha em destaque
function abrirProcessoNoCusto(procId, chave){
  const l = financeiroLinhasTodas().find(x=>x.chave===chave);
  abrirProcesso(procId);
  const p = state.procDraft; if(!l || !p || state.currentProcessoId!==procId) return;
  const f = l.fonte; let tab = 'cliente', modal = null, foco = null;
  if(f.kind==='cambio'){ tab = 'produto'; modal = { tipo:'cambio', id:f.foId }; foco = { lin:f.id }; }
  else if(f.kind==='linha'){ const t = todosTransportesProc(p)[f.tIdx]; tab = 'transporte'; modal = { tipo:'transporte', id: f.tIdx===0 ? 'principal' : (t ? t.id : 'principal') }; foco = { lin:f.id }; }
  else if(f.kind==='arm'){ tab = 'armazenagem'; foco = { lin:f.id }; }
  else if(f.kind==='outra'){ tab = 'financeiro'; foco = { lin:f.id }; }
  else if(f.kind==='trib'){ tab = 'desembaraco'; foco = { id:'proc-imp-tot-' + f.k }; }
  state.procTab = tab; state.procModal = modal; state.procFoco = foco;
  saveDraftProcesso(); renderApp();
}
function procAplicarFoco(){
  const f = state.procFoco; if(!f) return; state.procFoco = null;
  let el = null;
  if(f.lin){ const c = document.querySelector(`[data-pm-calc="lin:${f.lin}"]`); el = c ? (c.closest('tr') || c) : null; }
  else if(f.id){ const c = document.getElementById(f.id); el = c ? (c.closest('.field') || c) : null; }
  if(el){ if(el.scrollIntoView) el.scrollIntoView({ block:'center' }); el.classList.add('proc-destaque'); setTimeout(()=>el.classList.remove('proc-destaque'), 2800); }
}
function abrirProcesso(id){
  const p = (state.processosIndex||[]).find(x=>x.id===id);
  if(!p) return toast('Processo não encontrado.');
  state.procDraft = normalizarProcesso(JSON.parse(JSON.stringify(p)));
  state.currentProcessoId = id;
  state.procTab = 'cliente';
  saveDraftProcesso();
  navigate('processoForm');
}
async function duplicarProcesso(id){
  const origem = (state.processosIndex||[]).find(x=>x.id===id);
  if(!origem) return;
  const p = normalizarProcesso(JSON.parse(JSON.stringify(origem)));
  const agora = new Date().toISOString(), seq = novoNumeroProcesso();
  p.id = 'PRC-' + String(seq).padStart(4,'0'); p.seq = seq; p.status = 'aberto';
  p.criadoEm = agora; p.atualizadoEm = agora; p.criadoPor = usuarioAtual.nome || usuarioAtual.email; delete p.atualizadoPor;
  p.cliente.dataAbertura = hojeISO();
  todosTransportesProc(p).forEach(t=>Object.assign(t, { booking:'', conhecimentoMaster:'', conhecimentoHouse:'', navioVoo:'', etd:'', eta:'', chegada:'' }));
  Object.assign(p.desembaraco, { numeroDeclaracao:'', dataRegistro:'', canal:'', dataDesembaraco:'', numeroLi:'' });
  p.financeiro.contratoCambio = '';
  p.financeiro.parcelas = (p.financeiro.parcelas||[]).map(x=>({ ...x, id:uid(), vencimento:'', pago:false }));
  p.produto.fornecedores.forEach(fo=>{ fo.fechamento.contrato = ''; fo.fechamento.parcelas = fo.fechamento.parcelas.map(x=>({ ...x, id:uid(), vencimento:'', pago:false })); });
  p.outrasDespesas.lancamentos = p.outrasDespesas.lancamentos.map(x=>({ ...x, id:uid(), vencimento:'', pago:false }));
  p.desembaraco.pagos = {};
  state.processosIndex.push(p);
  if(!(await persistProcessosIndex())) return;
  const salvo = state.processosIndex.find(x=>x.criadoEm===agora && x.seq>=seq) || p;
  toast(`${id} duplicado como ${salvo.id}.`, 'ok');
  renderApp();
}
async function excluirProcesso(id){
  if(state.pendingDelete !== 'proc:'+id){ state.pendingDelete = 'proc:'+id; renderApp(); return; }
  state.pendingDelete = null;
  state.processosIndex = state.processosIndex.filter(x=>x.id!==id);
  if(state.currentProcessoId===id){ state.currentProcessoId = null; state.procDraft = null; storeDelete('processo:draft'); }
  await persistProcessosIndex();
  toast('Processo ' + id + ' excluído.', 'ok');
  renderApp();
}

function acaoProcesso(cmd, a1, a2){
  const p = state.procDraft;
  switch(cmd){
    case 'proc-novo':
      state.procDraft = novoProcesso(); state.currentProcessoId = null; state.procTab = 'cliente';
      saveDraftProcesso(); navigate('processoForm'); return true;
    case 'proc-abrir': abrirProcesso(a1); return true;
    case 'proc-abrir-custo': abrirProcessoNoCusto(a1, a2); return true;
    case 'proc-excluir': excluirProcesso(a1); return true;
    case 'proc-duplicar': duplicarProcesso(a1); return true;
    case 'proc-aba': state.procModal = null; state.procTab = a1; saveDraftProcesso(); renderApp(); window.scrollTo({ top:0, behavior:'instant' }); return true;
    case 'proc-cancelar': navigate('processos'); return true;
    case 'proc-salvar': salvarProcesso(); return true;
    case 'proc-numerario-pdf': baixarNumerarioProcessoPdf(); return true;
    case 'proc-add-fornecedor': {
      const primeiro = p.produto.fornecedores[0] || {};
      p.produto.fornecedores.push(novoFornecedorProcesso({ moeda: primeiro.moeda || 'USD', incoterm: primeiro.incoterm || 'FOB' }));
      saveDraftProcesso(); renderApp();
      const cards = document.querySelectorAll('.proc-fornecedor'); if(cards.length) cards[cards.length-1].scrollIntoView({ behavior:'smooth', block:'start' });
      return true;
    }
    case 'proc-rm-fornecedor': {
      const fo = p.produto.fornecedores.find(x=>x.id===a1);
      if(!fo || p.produto.fornecedores.length<2) return true;
      const temDados = fo.fornecedor || fo.itens.some(i=>i.produto || i.quantidade || i.valorUnit);
      if(temDados && !requestDelete('forn', a1)) return true;
      p.produto.fornecedores = p.produto.fornecedores.filter(x=>x.id!==a1); saveDraftProcesso(); renderApp(); return true;
    }
    case 'proc-add-item': { const fo = p.produto.fornecedores.find(x=>x.id===a1) || p.produto.fornecedores[0]; fo.itens.push(novoItemProcesso()); saveDraftProcesso(); renderApp(); return true; }
    case 'proc-add-producao': alternarProducaoItem(a1, a2); return true;
    case 'proc-rm-item': { const fo = p.produto.fornecedores.find(x=>x.id===a1); if(fo) fo.itens = fo.itens.filter(x=>x.id!==a2); saveDraftProcesso(); renderApp(); return true; }
    case 'proc-add-container': {
      const tt = transporteDaChaveProc(p, a1); if(!tt) return true;
      const cs = tt.t.containers, ult = cs[cs.length-1];
      cs.push(novoContainerProcesso({ tipo: ult ? ult.tipo : "40' HC" }));
      sincronizarContainersProc(p); saveDraftProcesso(); renderApp();
      return true;
    }
    case 'proc-rm-container': {
      const tt = transporteDaChaveProc(p, a1); if(!tt) return true;
      const cs = tt.t.containers, c = cs.find(x=>x.id===a2);
      if(!c || cs.length<2) return true;
      const temDados = c.numero || c.pesoBruto || c.pesoLiquido || c.cubagem || c.lacres;
      if(temDados && !requestDelete('cont', a2)) return true;
      tt.t.containers = cs.filter(x=>x.id!==a2); sincronizarContainersProc(p); saveDraftProcesso(); renderApp(); return true;
    }
    case 'proc-modal-abrir': state.procModal = { tipo:a1, id:a2 }; renderApp(); return true;
    case 'proc-modal-fechar': state.procModal = null; renderApp(); return true;
    case 'proc-modal-nada': return true;
    case 'proc-add-parcela-cambio': { const fo = p.produto.fornecedores.find(x=>x.id===a1); if(fo) fo.fechamento.parcelas.push(novaParcelaCambioProc({ moeda:fo.moeda||'USD' })); saveDraftProcesso(); renderApp(); return true; }
    case 'proc-rm-parcela-cambio': { const fo = p.produto.fornecedores.find(x=>x.id===a1); if(fo) fo.fechamento.parcelas = fo.fechamento.parcelas.filter(x=>x.id!==a2); saveDraftProcesso(); renderApp(); return true; }
    case 'proc-add-transporte': {
      p.transportes.push(novoTransporteExtraProc({ modal:'maritimo' }));
      saveDraftProcesso(); renderApp(); setTimeout(()=>window.scrollTo({ top:document.body.scrollHeight, behavior:'smooth' }), 50); return true;
    }
    case 'proc-rm-transporte': {
      if(!requestDelete('transp', a1)) return true;
      p.transportes = p.transportes.filter(x=>x.id!==a1); state.procModal = null; saveDraftProcesso(); renderApp(); return true;
    }
    case 'proc-add-linha': { const ls = getPath(p, a1); if(Array.isArray(ls)) ls.push(novaLinhaCustoProc({ moeda: a1.startsWith('armazenagem') ? 'BRL' : 'USD' })); saveDraftProcesso(); renderApp(); return true; }
    case 'proc-rm-linha': { const ls = getPath(p, a1); if(Array.isArray(ls)){ const i = ls.findIndex(x=>x.id===a2); if(i>=0) ls.splice(i, 1); } saveDraftProcesso(); renderApp(); return true; }
    case 'proc-add-armaz': p.armazenagem.lancamentos.push(novaArmazenagemProc({ containerId:a1 || '' })); saveDraftProcesso(); renderApp(); return true;
    case 'proc-add-outra': p.outrasDespesas.lancamentos.push(novaDespesaProc()); saveDraftProcesso(); renderApp(); return true;
  }
  return false;
}
