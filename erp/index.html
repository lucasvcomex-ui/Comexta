function prefsCotacoes(){
  const p = ((usuarioAtual && usuarioAtual.preferencias) || {}).cotacoes || {};
  const valido = (arr, mapa) => Array.isArray(arr) ? arr.filter(id=>mapa[id]) : null;

  return {
    modo: p.modo==='cards' ? 'cards' : 'lista',
    lista: valido(p.lista, COT_CAMPO) || COT_TEMPLATE_PADRAO.lista,
    card: valido(p.card, COT_CAMPO) || COT_TEMPLATE_PADRAO.card,
    filtros: valido(converterFiltrosAntigos(p.filtros, COT_FILTROS_ANTIGOS), mapaFiltrosTpl('cot')) || COT_TEMPLATE_PADRAO.filtros,
  };
}
async function salvarPreferencias(area, alteracao, atuais, mensagem){
  const nova = { ...((usuarioAtual.preferencias)||{}), [area]: { ...atuais, ...alteracao } };
  usuarioAtual.preferencias = nova;
  const { error } = await sb.from('perfis').update({ preferencias: nova }).eq('user_id', usuarioAtual.id);
  if(error){
    console.error(error);
    try{ localStorage.setItem(chaveLocal('preferencias'), JSON.stringify(nova)); }catch(e){}
    if(mensagem) toast('Salvo só neste navegador: não foi possível salvar no seu perfil.');
    return;
  }
  try{ localStorage.removeItem(chaveLocal('preferencias')); }catch(e){}
  if(mensagem) toast(mensagem, 'ok');
}
const salvarPrefsCotacoes = (alteracao, mensagem) => salvarPreferencias('cotacoes', alteracao, prefsCotacoes(), mensagem);

function valorCampoCotacao(campo, tipo, cot){
  let v;

  if(campo.tipo) return `<span class="badge ${tipo==='Simplificada'?'badge-navy':'badge-amber'}">${esc(v)}</span>`;

  return esc(v);
}

function idsDoGrupoCotacao(janela, aba){
  if(aba==='filtros') return catalogoFiltrosCot().filter(f=>f.janela===janela).map(f=>f.id);
  return COT_CAMPOS.filter(c=>c.janela===janela && !(aba==='card' && (c.id==='tipo' || c.id==='status'))).map(c=>c.id);
}
function ordenarSelecaoCot(aba, conjunto){
  const ordem = aba==='filtros' ? catalogoFiltrosCot().map(f=>f.id) : COT_CAMPOS.map(c=>c.id);
  return ordem.filter(id=>conjunto.has(id));
}
function acaoTemplateCotacoes(cmd, a1, a2){
  const aba = state.cotTemplateAba || 'card';
  switch(cmd){
    case 'cot-template': state.cotTemplateAberto = !state.cotTemplateAberto; state.cotTemplateSel = null; renderApp(); return true;
    case 'cot-tpl-aba': state.cotTemplateAba = a1; renderApp(); return true;
    case 'cot-tpl-grupo': {
      const atual = new Set(state.cotTemplateSel[aba]);
      idsDoGrupoCotacao(a1, aba).forEach(id=> a2==='1' ? atual.add(id) : atual.delete(id));
      state.cotTemplateSel[aba] = ordenarSelecaoCot(aba, atual); renderApp(); return true;
    }
    case 'cot-tpl-padrao': state.cotTemplateSel[aba] = [...COT_TEMPLATE_PADRAO[aba]]; renderApp(); return true;
    case 'cot-tpl-salvar': {
      const escolhidos = state.cotTemplateSel[aba];
      if(aba!=='filtros' && !escolhidos.length){ toast('Selecione pelo menos uma informação.'); return true; }
      const alteracao = { [aba]: [...escolhidos] };
      if(aba==='card') alteracao.modo = 'cards';
      if(aba==='lista') alteracao.modo = 'lista';
      if(aba==='filtros'){
        limparFiltrosOcultosTpl('cot', escolhidos);
      }
      const msg = { card:'Template do card salvo.', lista:'Template da lista salvo.', filtros:'Filtros da tela salvos.' }[aba];
      salvarPrefsCotacoes(alteracao, msg).then(()=>{
        if(alteracao.modo) state.cotacoesViewMode = alteracao.modo;
        state.cotTemplateAberto = false; state.cotTemplateSel = null; renderApp();
      });
      return true;
    }
  }
  return false;
}
function onCotTemplateCampo(el){
  const id = el.getAttribute('data-cot-tpl'); if(!id || !state.cotTemplateSel) return false;
  const aba = state.cotTemplateAba || 'card';
  const atual = new Set(state.cotTemplateSel[aba]);
  el.checked ? atual.add(id) : atual.delete(id);
  state.cotTemplateSel[aba] = ordenarSelecaoCot(aba, atual);
  renderApp();
  return true;
}

// Monta os objetos dos campos (e o filtro "busca" geral) de cada cadastro
for(const t of Object.values(CAD_TEMPLATE)){
  t.campos = t.campos.map(([janela, id, label, valores, extra])=>({ janela, id, label, valores, ...(extra||{}) }));
  t.mapa = Object.fromEntries(t.campos.map(c=>[c.id, c]));
  t.filtros = [{ id:'busca', label:'Busca em qualquer campo', janela:'Geral' }, ...t.campos];
  t.mapaFiltros = Object.fromEntries(t.filtros.map(f=>[f.id, f]));
}
const tipoFiltroCad = c => c.id==='busca' ? 'texto' : c.periodo ? 'periodo' : c.faixa ? 'faixa' : (c.opcao||c.opcaoDinamica) ? 'opcao' : 'texto';

function prefsCadastro(tipo){
  const t = CAD_TEMPLATE[tipo];
  const p = ((usuarioAtual && usuarioAtual.preferencias) || {})['cad_'+tipo] || {};
  const valido = (arr, mapa) => Array.isArray(arr) ? arr.filter(id=>mapa[id]) : null;
  return { modo: p.modo==='card' ? 'card' : 'lista', lista: valido(p.lista, t.mapa) || t.padrao.lista,
           card: valido(p.card, t.mapa) || t.padrao.card, filtros: valido(p.filtros, t.mapaFiltros) || t.padrao.filtros };
}
const salvarPrefsCadastro = (tipo, alteracao, mensagem) => salvarPreferencias('cad_'+tipo, alteracao, prefsCadastro(tipo), mensagem);

function textoCampoCad(c, item){
  let vals;
  try{ vals = juntar(c.valores(item)); }catch(e){ vals = []; }
  if(c.rotulo) vals = vals.map(v=>c.rotulo(v)||v);
  if(c.moeda) vals = vals.map(v=>isFinite(num(v)) && v!=='' ? fmtBRL(num(v)) : v);
  if(c.periodo) vals = vals.map(v=>fmtDateOnly(v));
  return vals.join(', ');
}
function valorCampoCadHtml(c, item){
  const v = textoCampoCad(c, item);
  if(!v) return '<span class="vazio">—</span>';
  if(c.id==='status') return item.status==='INATIVO' ? '<span class="badge badge-red">Inativo</span>' : '<span class="badge badge-green">Ativo</span>';
  if(c.id==='tipoCadastro') return `<span class="badge badge-navy">${esc(String(v).replace(/, /g, ' / '))}</span>`;
  return esc(v);
}

// ---- Filtros ----
function filtroCadAtivo(tipo, f){
  const v = (state.cadFiltrosTpl||{})[tipo] || {};
  const k = tipoFiltroCad(f);
  return (k==='periodo' || k==='faixa') ? !!(v[f.id+':de'] || v[f.id+':ate']) : !!v[f.id];
}
function filtrarCadastroTpl(tipo){
  const t = CAD_TEMPLATE[tipo];
  const lista = state[CAD_CONFIG[tipo].stateKey] || [];
  const visiveis = prefsCadastro(tipo).filtros.map(id=>t.mapaFiltros[id]).filter(f=>filtroCadAtivo(tipo, f));
  const v = (state.cadFiltrosTpl||{})[tipo] || {};
  return lista.filter(item=>visiveis.every(f=>{
    const k = tipoFiltroCad(f);
    if(f.id==='busca'){
      const q = String(v.busca).toLowerCase();
      return t.campos.some(c=>textoCampoCad(c, item).toLowerCase().includes(q));
    }
    let vals; try{ vals = juntar(f.valores(item)); }catch(e){ vals = []; }
    if(k==='opcao') return vals.includes(v[f.id]);
    if(k==='periodo') return vals.some(d=>(!v[f.id+':de'] || d>=v[f.id+':de']) && (!v[f.id+':ate'] || d<=v[f.id+':ate']));
    if(k==='faixa') return vals.some(x=>{ const n = num(x); if(!isFinite(n) || x==='') return false;
      return (v[f.id+':de']==='' || v[f.id+':de']==null || n>=num(v[f.id+':de'])) && (v[f.id+':ate']==='' || v[f.id+':ate']==null || n<=num(v[f.id+':ate'])); });
    const q = String(v[f.id]).toLowerCase();
    return vals.some(x=>x.toLowerCase().includes(q) || (f.rotulo && String(f.rotulo(x)||'').toLowerCase().includes(q)));
  }));
}
function opcoesFiltroCad(tipo, f){
  if(f.opcao) return f.opcao();
  const lista = state[CAD_CONFIG[tipo].stateKey] || [];
  return juntar(lista.flatMap(item=>{ try{ return f.valores(item); }catch(e){ return []; } })).sort((a,b)=>a.localeCompare(b,'pt-BR')).map(x=>[x,x]);
}
function filtroCadHtml(tipo, f){
  const v = (state.cadFiltrosTpl||{})[tipo] || {};
  const k = tipoFiltroCad(f);
  const attr = sufixo => `data-cad-filtro="${tipo}|${f.id}${sufixo||''}"`;
  if(k==='periodo' || k==='faixa'){
    const tp = k==='periodo' ? 'date' : 'number';
    return `<div class="field filtro-periodo"><label>${esc(f.label)}</label><div class="periodo">
      <input type="${tp}" ${k==='faixa'?'step="any" placeholder="de"':''} ${attr(':de')} value="${esc(v[f.id+':de']||'')}">
      <span>até</span>
      <input type="${tp}" ${k==='faixa'?'step="any" placeholder="até"':''} ${attr(':ate')} value="${esc(v[f.id+':ate']||'')}"></div></div>`;
  }
  if(k==='opcao'){
    return `<div class="field"><label>${esc(f.label)}</label><select ${attr()}>
      <option value="">Todos</option>${opcoesFiltroCad(tipo, f).map(([o,t])=>`<option value="${esc(o)}" ${v[f.id]===o?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
  }
  return `<div class="field" ${f.id==='busca'?'style="min-width:220px;"':''}><label>${esc(f.label)}</label>
    <input ${attr()} value="${esc(v[f.id]||'')}" placeholder="${f.id==='busca' ? 'Buscar…' : ''}" autocomplete="off"></div>`;
}
function onFiltroCadastro(el, evento){
  const chave = el.getAttribute('data-cad-filtro'); if(!chave) return false;
  const texto = el.tagName==='INPUT' && el.type==='text' || (el.tagName==='INPUT' && !el.type);
  const imediato = el.tagName==='INPUT' && (el.type==='text' || el.type==='number' || !el.type);
  if(imediato ? evento!=='input' : evento!=='change') return true;
  const [tipo, id] = chave.split('|');
  if(!state.cadFiltrosTpl) state.cadFiltrosTpl = {};
  if(!state.cadFiltrosTpl[tipo]) state.cadFiltrosTpl[tipo] = {};
  state.cadFiltrosTpl[tipo][id] = el.value;
  let pos = null; try{ pos = el.selectionStart; }catch(e){}
  renderApp();
  if(imediato){ const novo = document.querySelector(`[data-cad-filtro="${chave}"]`); if(novo){ novo.focus(); try{ if(texto) novo.setSelectionRange(pos, pos); }catch(e){} } }
  return true;
}

function barraCadastroTpl(tipo, total, filtrados){

function renderCadTemplate(tipo){
  const t = CAD_TEMPLATE[tipo];
  const aba = state.cadTemplateAba || 'card';
  if(!state.cadTemplateSel){ const pr = prefsCadastro(tipo); state.cadTemplateSel = { card:[...pr.card], lista:[...pr.lista], filtros:[...pr.filtros] }; }
  const sel = new Set(state.cadTemplateSel[aba]);
  const lista = aba==='filtros' ? t.filtros : t.campos;
  const janelas = aba==='filtros' ? ['Geral', ...t.janelas] : t.janelas;
  const grupos = janelas.map(janela=>{
    const campos = lista.filter(c=>c.janela===janela);
    if(!campos.length) return '';
    const marcados = campos.filter(c=>sel.has(c.id)).length;
    return `<div class="tpl-grupo">
      <div class="tpl-grupo-topo"><b>${esc(janela)}</b><span class="membro-sub">${marcados} de ${campos.length}</span>
        <button class="link-btn" data-action="cadtpl-grupo:${janela}:${marcados===campos.length?'0':'1'}">${marcados===campos.length ? 'Desmarcar todos' : 'Marcar todos'}</button></div>
      ${campos.map(c=>`<label class="tpl-campo"><input type="checkbox" data-cadtpl-campo="${esc(c.id)}" ${sel.has(c.id)?'checked':''}> ${esc(c.label)}</label>`).join('')}

  }).join('');
  const nome = tipo==='produto' ? 'produto' : 'cadastro';
  const textos = {
    card: `Escolha as informações de cada card. O nome${tipo==='cliente' ? ', o tipo de cadastro e o status' : ' e a foto'} aparecem sempre no topo.`,
    lista: `Escolha as colunas da lista. O nome do ${nome} aparece sempre na primeira coluna.`,
    filtros: 'Escolha os filtros da tela. Todos os campos do formulário podem ser usados como filtro; filtros ocultos deixam de ser aplicados.',
  };
  const contagem = aba==='filtros' ? (sel.size===1 ? 'filtro selecionado' : 'filtros selecionados') : (sel.size===1 ? 'informação selecionada' : 'informações selecionadas');
  return `<div class="card proc-template">
    <div class="proc-template-topo">
      <div class="section-title">${ICONS.gear} Template</div>
      <div class="pers-tabs" style="margin:0;">

        <button class="pers-tab ${aba==='lista'?'active':''}" data-action="cadtpl-aba:lista">Configurar Lista</button>

      </div>

      <span class="membro-sub">${sel.size} ${contagem}</span>
      <div class="btn-row">
        <button class="btn btn-ghost" data-action="cadtpl-padrao">Restaurar padrão</button>

        <button class="btn btn-primary" data-action="cadtpl-salvar">${ICONS.check} Salvar ${({ card:'card', lista:'lista', filtros:'filtros' })[aba]}</button>
      </div>

}
function ordemCadTpl(tipo, aba){ const t = CAD_TEMPLATE[tipo]; return (aba==='filtros' ? t.filtros : t.campos).map(c=>c.id); }
function acaoTemplateCadastro(cmd, a1, a2){
  const tipo = state.cadTemplateAberto, aba = state.cadTemplateAba || 'card';
  switch(cmd){
    case 'cadtpl-modo': salvarPrefsCadastro(a1, { modo:a2 }); renderApp(); return true;
    case 'cadtpl-abrir':
      state.cadTemplateAberto = state.cadTemplateAberto===a1 ? null : a1; state.cadTemplateSel = null; renderApp(); return true;
    case 'cadtpl-aba': state.cadTemplateAba = a1; renderApp(); return true;
    case 'cadtpl-limpar': if(state.cadFiltrosTpl) state.cadFiltrosTpl[a1] = {}; renderApp(); return true;
    case 'cadtpl-grupo': {
      const lista = aba==='filtros' ? CAD_TEMPLATE[tipo].filtros : CAD_TEMPLATE[tipo].campos;
      const atual = new Set(state.cadTemplateSel[aba]);
      lista.filter(c=>c.janela===a1).forEach(c=> a2==='1' ? atual.add(c.id) : atual.delete(c.id));
      state.cadTemplateSel[aba] = ordemCadTpl(tipo, aba).filter(id=>atual.has(id)); renderApp(); return true;
    }
    case 'cadtpl-padrao': state.cadTemplateSel[aba] = [...CAD_TEMPLATE[tipo].padrao[aba]]; renderApp(); return true;
    case 'cadtpl-salvar': {
      const escolhidos = state.cadTemplateSel[aba];
      if(aba!=='filtros' && !escolhidos.length){ toast('Selecione pelo menos uma informação.'); return true; }
      const alteracao = { [aba]: [...escolhidos] };
      if(aba!=='filtros') alteracao.modo = aba;
      else{
        const visiveis = new Set(escolhidos), v = (state.cadFiltrosTpl||{})[tipo] || {};
        for(const chave of Object.keys(v)) if(!visiveis.has(chave.split(':')[0])) delete v[chave];
      }
      salvarPrefsCadastro(tipo, alteracao, ({ card:'Template do card salvo.', lista:'Template da lista salvo.', filtros:'Filtros da tela salvos.' })[aba])
        .then(()=>{ state.cadTemplateAberto = null; state.cadTemplateSel = null; renderApp(); });
      return true;
    }
  }
  return false;
}
function onCadTemplateCampo(el){
  const id = el.getAttribute('data-cadtpl-campo'); if(!id || !state.cadTemplateSel) return false;
  const tipo = state.cadTemplateAberto, aba = state.cadTemplateAba || 'card';
  const atual = new Set(state.cadTemplateSel[aba]);
  el.checked ? atual.add(id) : atual.delete(id);
  state.cadTemplateSel[aba] = ordemCadTpl(tipo, aba).filter(x=>atual.has(x));
  renderApp();
  return true;
}

// Texto simples (sem HTML) de um valor
const textoPlano = v => String(v ?? '').replace(/\s+/g, ' ').trim();

// Resumo dos filtros aplicados (vai no PDF e na planilha)
function resumoFiltrosTpl(escopo, ignorar){
  const mapa = mapaFiltrosTpl(escopo), v = filtrosAplicados(escopo);
  return FILTROS_TPL[escopo].prefs().filtros.map(id=>mapa[id]).filter(f=>f && !(ignorar||[]).includes(f.id) && filtroTplAtivo(v, f)).map(f=>{
    if(f.tipo==='periodo' || f.tipo==='faixa'){
      const fmt = x => f.tipo==='periodo' ? fmtDateOnly(x) : x;
      const de = v[f.id+':de'], ate = v[f.id+':ate'];
      return `${f.label}: ${de && ate ? fmt(de)+' a '+fmt(ate) : de ? 'a partir de '+fmt(de) : 'até '+fmt(ate)}`;
    }
    if(f.tipo==='opcao'){ const op = opcoesFiltroTpl(escopo, f).find(([k])=>k===v[f.id]); return `${f.label}: ${op ? op[1] : v[f.id]}`; }
    return `${f.label}: "${v[f.id]}"`;
  });
}
function resumoFiltrosCad(tipo){
  const t = CAD_TEMPLATE[tipo], v = (state.cadFiltrosTpl||{})[tipo] || {};
  return prefsCadastro(tipo).filtros.map(id=>t.mapaFiltros[id]).filter(f=>f && filtroCadAtivo(tipo, f)).map(f=>{
    const k = tipoFiltroCad(f);
    if(k==='periodo' || k==='faixa'){
      const fmt = x => k==='periodo' ? fmtDateOnly(x) : x, de = v[f.id+':de'], ate = v[f.id+':ate'];
      return `${f.label}: ${de && ate ? fmt(de)+' a '+fmt(ate) : de ? 'a partir de '+fmt(de) : 'até '+fmt(ate)}`;
    }
    if(k==='opcao'){ const op = opcoesFiltroCad(tipo, f).find(([o])=>o===v[f.id]); return `${f.label}: ${op ? op[1] : v[f.id]}`; }
    return `${f.label}: "${v[f.id]}"`;
  });
}

// Monta { titulo, arquivo, colunas, linhas, filtros } de cada tela
function dadosExportacao(tela){
  if(tela==='cot'){
    const prefs = prefsCotacoes(), cards = state.cotacoesViewMode==='cards';
    const ids = cards ? ['tipo', 'status', ...prefs.card.filter(id=>id!=='tipo' && id!=='status')] : prefs.lista;
    const campos = ids.map(id=>COT_CAMPO[id]).filter(Boolean);
    const itens = cotacoesTodasFiltradas(cards);
    return { titulo:'Cotações Salvas', arquivo:'cotacoes-salvas',
      colunas: ['Nº', ...campos.map(c=>c.label)],
      linhas: itens.map(({tipo, cot})=>[cot.id, ...campos.map(c=>{ try{ return textoPlano(c.valor(tipo, cot)); }catch(e){ return ''; } })]),
      filtros: resumoFiltrosTpl('cot', cards ? ['status'] : []) };
  }
  if(tela==='vcot' || tela==='vped') return dadosExportacaoVendas(tela);
  if(tela==='prod'){
    const ls = producaoFiltradas(), f = state.prodFiltro || {}, campos = prefsProducao().lista.map(id=>PROD_CAMPO[id]);
    return { titulo:'Produção — produtos em produção', arquivo:'producao',
      colunas:['Ref. do processo', ...campos.map(c=>c.label)],
      linhas: ls.map(l=>[l.procId, ...campos.map(c=>c.txt(l))]),
      filtros:[f.busca && `Busca: "${f.busca}"`, f.situacao && `Situação: ${PROD_SIT[f.situacao][0]}`, f.de && `Prontidão de ${fmtDateOnly(f.de)}`, f.ate && `Prontidão até ${fmtDateOnly(f.ate)}`].filter(Boolean) };
  }
  if(tela==='fin'){
    const ls = financeiroFiltradas(), f = state.finFiltro || {};
    return { titulo:'Financeiro — resumo de custos dos processos', arquivo:'financeiro',
      colunas:['Ref. do processo','Ref. do cliente','Cliente','Custo','Prestador','Moeda','Valor','Taxa','Total R$','Vencimento','Pagamento'],
      linhas: ls.map(l=>[l.procId, l.refCliente, l.cliente, l.tipo + (l.descricao ? ' — ' + l.descricao : ''), l.prestador, l.moeda, fmtMoeda(l.valor, l.moeda), l.moeda!=='BRL' && l.taxa ? fmtNum(l.taxa, 4) : '', fmtBRL(l.brl), l.vencimento ? fmtDateOnly(l.vencimento) : '', FIN_SIT[l.sit][0]]),
      filtros:[f.busca && `Busca: "${f.busca}"`, f.situacao && `Pagamento: ${FIN_SIT[f.situacao][0]}`, f.de && `Vencimento de ${fmtDateOnly(f.de)}`, f.ate && `Vencimento até ${fmtDateOnly(f.ate)}`].filter(Boolean) };
  }
  if(tela==='mon'){
    const prefs = prefsMonitoramento(), cards = prefs.modo==='card';
    const ids = (cards ? ['situacao', ...prefs.card.filter(id=>id!=='situacao')] : prefs.lista).filter(id=>id!=='container');
    const campos = ids.map(id=>MON_CAMPO[id]).filter(Boolean);
    const itens = aplicarFiltrosTpl('mon', state.monitoramento||[]);
    return { titulo:'Monitoramento de Carga', arquivo:'monitoramento-de-carga',
      colunas: ['Container', ...campos.map(c=>c.label)],
      linhas: itens.map(m=>[m.container||'', ...campos.map(c=>{ try{ return textoPlano(c.valor(m)); }catch(e){ return ''; } })]),
      filtros: resumoFiltrosTpl('mon', []) };
  }
  if(tela==='proc'){
    const prefs = prefsProcessos(), cards = prefs.modo==='card';
    const ids = cards ? ['status', ...prefs.card.filter(id=>id!=='id' && id!=='status')] : prefs.lista.filter(id=>id!=='id');
    const campos = ids.map(id=>PROC_CAMPO[id]).filter(Boolean);
    const itens = aplicarFiltrosTpl('proc', [...(state.processosIndex||[])].sort((a,b)=>(b.seq||0)-(a.seq||0)), cards ? ['status'] : []);
    return { titulo:'Processos', arquivo:'processos',
      colunas: ['Nº', ...campos.map(c=>c.label)],
      linhas: itens.map(p=>[p.id, ...campos.map(c=>{ try{ return textoPlano(c.valor(p)); }catch(e){ return ''; } })]),
      filtros: resumoFiltrosTpl('proc', cards ? ['status'] : []) };
  }
  const tipo = tela==='cad-produto' ? 'produto' : 'cliente';
  const t = CAD_TEMPLATE[tipo], prefs = prefsCadastro(tipo), cards = prefs.modo==='card';
  let ids = cards ? prefs.card : prefs.lista;
  if(tipo==='cliente' && cards) ids = ['tipoCadastro', 'status', ...ids.filter(id=>id!=='tipoCadastro' && id!=='status')];
  ids = ids.filter(id=>!(tipo==='produto' && id==='nome') && !(tipo==='cliente' && id==='nomeFantasia'));
  const campos = ids.map(id=>t.mapa[id]).filter(Boolean);
  return { titulo: tipo==='produto' ? 'Produtos' : 'Clientes e Empresas', arquivo: tipo==='produto' ? 'produtos' : 'clientes-e-empresas',
    colunas: [tipo==='produto' ? 'Produto' : 'Nome', ...campos.map(c=>c.label)],
    linhas: filtrarCadastroTpl(tipo).map(item=>[textoPlano(t.nome(item)), ...campos.map(c=>textoPlano(textoCampoCad(c, item)))]),
    filtros: resumoFiltrosCad(tipo) };
}

let _xlsxCarregando = null;
function carregarXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(!_xlsxCarregando) _xlsxCarregando = new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ()=>res(window.XLSX);
    s.onerror = ()=>{ _xlsxCarregando = null; rej(new Error('Não foi possível carregar o gerador de Excel. Verifique sua conexão.')); };
    document.head.appendChild(s);
  });
  return _xlsxCarregando;
}
// Números em formato brasileiro ("R$ 1.234,56", "1,8", "12") viram número na planilha
function celulaExcel(v){
  const s = String(v||'').trim();
  // só milhar com grupos de 3 dígitos: NCM "8467.21.00", CNPJ e datas continuam como texto
  if(/^(R\$|US\$|€|£|¥)?\s?-?(\d{1,3}(\.\d{3})+|\d+)(,\d+)?$/.test(s)){
    const n = Number(s.replace(/^[^\d-]+/, '').replace(/\./g, '').replace(',', '.'));
    if(isFinite(n) && !/^0\d/.test(s.replace(/^[^\d]+/, ''))) return n;
  }
  return s;
}

async function exportarTela(tela, formato){
  const d = dadosExportacao(tela);
  if(!d.linhas.length){ toast('Nada para exportar: nenhum registro na tela com os filtros atuais.'); return; }
  const hoje = new Date().toISOString().slice(0,10);
  const nome = `comexta-${d.arquivo}-${hoje}.${formato}`;
  const empresa = nomeEmpresa();
  try{
    if(formato==='xlsx'){
      const XLSX = await carregarXLSX();
      const topo = [[`${d.titulo} — ${empresa}`], [`Gerado em ${fmtDate(new Date().toISOString())} por ${usuarioAtual.nome || usuarioAtual.email}`],
        [d.filtros.length ? 'Filtros: ' + d.filtros.join(' · ') : 'Sem filtros'], []];
      const aoa = [...topo, d.colunas, ...d.linhas.map(l=>l.map(celulaExcel))];
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = d.colunas.map((c, i)=>({ wch: Math.min(48, Math.max(10, c.length + 2, ...d.linhas.slice(0, 200).map(l=>String(l[i]||'').length + 2))) }));
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s:{ r:topo.length, c:0 }, e:{ r:topo.length + d.linhas.length, c:d.colunas.length-1 } }) };
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, d.titulo.slice(0, 31));
      const bin = XLSX.write(wb, { bookType:'xlsx', type:'array' });
      await saveArtifactFile(nome, new Blob([bin], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      return;
    }
    if(typeof window.jspdf==='undefined' || !window.jspdf.jsPDF){ toast('Não foi possível carregar o gerador de PDF. Recarregue a página.'); return; }
    const doc = novoPdfDoc(REL_TELA_DOC(tela));
    pdfHeader(doc, d.titulo, `${empresa} · ${d.linhas.length} registro${d.linhas.length===1?'':'s'}`, fmtDate(new Date().toISOString()));
    let y = 74;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(75,90,104);
    const filtrosTxt = doc.splitTextToSize((d.filtros.length ? 'Filtros: ' + d.filtros.join(' · ') : 'Sem filtros aplicados').replace(/→/g, '->'), doc.internal.pageSize.getWidth() - 56);
    if(relBloco(doc,'filtros')){ doc.text(filtrosTxt, 28, y); y += filtrosTxt.length * 11 + 6; }
    const fonte = d.colunas.length > 12 ? 6 : d.colunas.length > 8 ? 7 : 8;
    // as fontes padrão do PDF não têm a seta "→" (sairia "!’")
    const semSeta = x => String(x ?? '').replace(/→/g, '->');
    doc.autoTable({ startY:y, head:[d.colunas.map(semSeta)], body:d.linhas.map(l=>l.map(semSeta)), theme:'grid', margin:{ left:28, right:28 },
      styles:{ fontSize:fonte, cellPadding:3, overflow:'linebreak', valign:'top' },
      headStyles:{ fillColor:corCabecalhoPdf(), textColor:corTextoCabecalhoPdf(), fontSize:fonte },
      });
    await downloadPdfBlob(doc, nome);
  }catch(err){
    console.error('Falha ao exportar:', err);
    toast(err && err.message ? err.message : 'Não foi possível gerar o arquivo.');
  }
}

// Preenche campos que possam faltar em rascunhos/cotações salvos antes de alguma atualização
// (ex: "anexos" foi adicionado depois — sem isso, dados antigos ficariam com anexos undefined).
function normalizeDados(d){
  const base = dadosPadrao();
  const merged = Object.assign({}, base, d||{});
  if(!Array.isArray(merged.produtos) || merged.produtos.length===0) merged.produtos = [novoProduto()];
  if(!Array.isArray(merged.despExtra) || merged.despExtra.length<4){
    const src = (d && Array.isArray(d.despExtra)) ? d.despExtra : [];
    merged.despExtra = [0,1,2,3].map(i=> src[i]!==undefined ? src[i] : '');
  }
  if(!Array.isArray(merged.anexos)) merged.anexos = [];
  // Compatibilidade com cotações salvas antes da correção do bug de dupla conversão:
  // se vier > 1, é o formato antigo (percentual cru, ex: 60) — converte para fração (0.60).
  if(num(merged.ii) > 1) merged.ii = num(merged.ii)/100;
  if(num(merged.icms) > 1) merged.icms = num(merged.icms)/100;
  return merged;
}

/* =========================== IMPORTAÇÃO FORMAL =============================
   Escopo: motor de cálculo fiel às fórmulas centrais da planilha anexada
   (Invoice, Frete+Seguro, Despesas que compõem a Nota Fiscal, Desembaraço com
   II/IPI/PIS/COFINS/ICMS e rateio por produto). Não replica os 11 câmbios por
   invoice nem a lista extensa de taxas de origem/destino nomeadas da planilha
   original — usa um câmbio por seção, no mesmo padrão da Importação Simplificada. */
function novoProdutoFormal(){
  return {id:uid(), fornecedor:'', produto:'', ncm:'', quantidade:'', valorUnit:'', pesoLiquido:'', cambio:'',
    ii:'', ipi:'', pis:'', cofins:'', icms:''};
}
function novaDespesaLinha(descricao='', moeda='R$'){ return {id:uid(), descricao, tarifa:'', moeda, tipoCalculo:'', quantidade:''}; }
function calcDespesaLinha(linha, cambio){
  const tarifa = num(linha.tarifa), qtd = num(linha.quantidade);
  const taxaAplicada = linha.moeda && linha.moeda!=='R$' ? cambio : 1;
  const tarifaReal = tarifa*taxaAplicada;
  const total = tarifaReal*qtd;
  return {...linha, tarifaReal, total};
}
function dadosFormalPadrao(){

function normalizeDadosFormal(d){
  const base = dadosFormalPadrao();
  const merged = Object.assign({}, base, d||{});
  if(!Array.isArray(merged.produtos) || merged.produtos.length===0) merged.produtos = [novoProdutoFormal()];
  merged.produtos = merged.produtos.map(p=>{
    const prod = Object.assign({}, novoProdutoFormal(), p);
    // Compatibilidade com cotações salvas antes da correção do bug de dupla conversão:
    // se vier > 1, é o formato antigo (percentual cru, ex: 18) — converte para fração (0.18).
    ['ii','ipi','pis','cofins','icms'].forEach(k=>{ if(num(prod[k]) > 1) prod[k] = num(prod[k])/100; });
    return prod;
  });
  ['freteLinhas','taxasOrigem','taxasDestino','armazenagemLinhas','outrasDespesasLinhas'].forEach(k=>{
    if(!Array.isArray(merged[k]) || merged[k].length===0) merged[k] = base[k];
  });
  if(!Array.isArray(merged.anexos)) merged.anexos = [];
  return merged;
}
function computeDadosFormal(d){
  const produtos = d.produtos.map(p=>{
    const qty = num(p.quantidade), vu = num(p.valorUnit), peso = num(p.pesoLiquido), cambio = num(p.cambio);
    const totalUSD = qty*vu;
    const totalBRL = totalUSD*cambio;
    return {...p, qty, vu, peso, cambio, totalUSD, totalBRL};
  });
  const sumQty = sum(produtos.map(p=>p.qty));
  const sumPeso = sum(produtos.map(p=>p.peso));
  const sumTotalUSD = sum(produtos.map(p=>p.totalUSD));
  const sumTotalBRL = sum(produtos.map(p=>p.totalBRL));

  const freteCambio = num(d.freteCambio);
  const freteLinhasCalc = d.freteLinhas.map(l=>calcDespesaLinha(l,freteCambio));
  const taxasOrigemCalc = d.taxasOrigem.map(l=>calcDespesaLinha(l,freteCambio));
  const taxasDestinoCalc = d.taxasDestino.map(l=>calcDespesaLinha(l,freteCambio));
  const freteTotalBRL = sum(freteLinhasCalc.map(l=>l.total))+sum(taxasOrigemCalc.map(l=>l.total))+sum(taxasDestinoCalc.map(l=>l.total));

  const armazenagemCambio = num(d.armazenagemCambio);
  const armazenagemLinhasCalc = d.armazenagemLinhas.map(l=>calcDespesaLinha(l,armazenagemCambio));
  const armazenagemTotal = sum(armazenagemLinhasCalc.map(l=>l.total));

  const outrasCambio = num(d.outrasDespesasCambio);
  const outrasLinhasCalc = d.outrasDespesasLinhas.map(l=>calcDespesaLinha(l,outrasCambio));
  const outrasTotal = sum(outrasLinhasCalc.map(l=>l.total));

  // Custo = Invoice + Frete (aba Frete) + Armazenagem + Outras Despesas + tributos. Frete, Seguro, Acréscimo, Capatazia, Siscomex e AFRMM
  // do Desembaraço NÃO somam no custo: servem só para compor as bases dos tributos (Valor Aduaneiro e base do ICMS).
  const despesasNF = armazenagemTotal+outrasTotal;
  const afrmmSiscomexTotal = num(d.siscomex)+num(d.afrmm); // só estes dois entram na base do ICMS

  const cambioDesembaraco = num(d.desembaracoCambio);
  const freteExtD = num(d.desembaracoFreteExt), seguroExtD = num(d.desembaracoSeguroExt), acrescimoExtD = num(d.desembaracoAcrescimoExt);
  const freteBRLD = cambioDesembaraco*freteExtD;
  const seguroBRLD = cambioDesembaraco*seguroExtD;
  const acrescimoBRLD = cambioDesembaraco*acrescimoExtD;

  // VMLE (Valor da Mercadoria no Local de Embarque) e VMLD (VMLE + Frete + Seguro)
  const vmleUSD = sumTotalUSD, vmleBRL = sumTotalBRL;
  const vmldUSD = vmleUSD+freteExtD+seguroExtD;
  const vmldBRL = vmleBRL+freteBRLD+seguroBRLD;

  return { produtos, sumQty, sumPeso, sumTotalUSD, sumTotalBRL,
    freteLinhasCalc, taxasOrigemCalc, taxasDestinoCalc, freteTotalBRL,
    armazenagemLinhasCalc, armazenagemTotal, outrasLinhasCalc, outrasTotal, despesasNF, afrmmSiscomexTotal,
    freteExtD, seguroExtD, acrescimoExtD, freteBRLD, seguroBRLD, acrescimoBRLD,
    vmleUSD, vmleBRL, vmldUSD, vmldBRL };
}
function computeRateioFormal(d, c){
  const linhas = c.produtos.map(p=>{
    if(!(p.qty>0) && !p.fornecedor && !p.produto) return null;
    const pesoShare = c.sumPeso>0 ? p.peso/c.sumPeso : 0;
    const valorShare = c.sumTotalUSD>0 ? p.totalUSD/c.sumTotalUSD : 0;
    const rateioFrete = pesoShare*c.freteBRLD;                        // rateio por peso (I)
    const rateioSeguro = valorShare*c.seguroBRLD;                     // rateio por valor (J)
    const rateioAcrescimo = valorShare*c.acrescimoBRLD;               // rateio por valor (K)
    const valorAduaneiro = p.totalBRL+rateioFrete+rateioSeguro+rateioAcrescimo; // L — base do I.I./I.P.I./PIS/COFINS
    const vmldProduto = p.totalBRL+rateioFrete+rateioSeguro;          // VMLD por produto (sem acréscimo)
    const rateioDespesasNF = valorShare*c.despesasNF;                 // Armazenagem + Outras Despesas (soma no custo final)
    const rateioAfrmmSiscomex = valorShare*c.afrmmSiscomexTotal;      // só Siscomex + AFRMM (base do ICMS)

    // --- Colunas de exibição da tabela "Rateio dos Custos por Produto" (Numerário/PDF) ---
    // Rateio Frete exibido = Frete Marítimo + Taxas de Origem + Taxas de Destino (aba Frete) + Seguro
    // O CUSTO usa o frete REAL pago (aba Frete: marítimo + origem + destino, já com os seguros lançados lá), nunca o
    // frete/seguro "declarados" no Desembaraço — esses servem só de base de cálculo dos tributos (Valor Aduaneiro).
    const freteShare = c.sumPeso>0 ? pesoShare : valorShare;          // por peso; sem pesos, por valor
    const rateioFreteTabela = freteShare*c.freteTotalBRL;
    const rateioArmazenagemTabela = valorShare*c.armazenagemTotal;
    const rateioOutrasTabela = valorShare*c.outrasTotal;
    const rateioAfrmmTabela = valorShare*num(d.afrmm);

    const iiRate = num(p.ii), ipiRate = num(p.ipi), pisRate = num(p.pis), cofinsRate = num(p.cofins), icmsRate = num(p.icms);
    const bcII = valorAduaneiro;
    const ii = bcII*iiRate;
    const bcIpi = bcII+ii;
    const ipi = bcIpi*ipiRate;
    const bcPis = valorAduaneiro;
    const pis = bcPis*pisRate;
    const bcCofins = valorAduaneiro;
    const cofins = bcCofins*cofinsRate;
    // Base do ICMS = Valor Aduaneiro (com Acréscimo) + I.I. + I.P.I. + PIS + COFINS + AFRMM + Tx Siscomex
    // (replica exatamente a fórmula da planilha original: Desembaraço!AB = (L+P+S+V+Y+Z+AA)/(1-AC))
    const bcIcms = icmsRate<1 ? (valorAduaneiro+ii+ipi+pis+cofins+rateioAfrmmSiscomex)/(1-icmsRate) : 0;
    const icms = bcIcms*icmsRate;

    // Custo = Invoice + Frete (aba Frete) + Armazenagem + Outras Despesas + tributos (I.I., IPI, PIS, COFINS e ICMS).
    // É exatamente a soma das linhas do "Resumo das Despesas". Com créditos, IPI/PIS/COFINS/ICMS (recuperáveis) ficam de fora.
    const custoTotalComCredito = p.totalBRL + rateioFreteTabela + rateioDespesasNF + ii;
    const custoTotalSemCredito = custoTotalComCredito + ipi + pis + cofins + icms;
    const custoUnitComCredito = p.qty>0 ? custoTotalComCredito/p.qty : 0;
    const custoUnitSemCredito = p.qty>0 ? custoTotalSemCredito/p.qty : 0;

    return {...p, rateioFrete, rateioSeguro, rateioAcrescimo, valorAduaneiro, vmldProduto, rateioDespesasNF, rateioAfrmmSiscomex,
      rateioFreteTabela, rateioArmazenagemTabela, rateioOutrasTabela, rateioAfrmmTabela,
      // percentuais originais preservados (o.ii/.ipi/etc abaixo são sobrescritos pelos VALORES em R$)
      iiPct:num(p.ii), ipiPct:num(p.ipi), pisPct:num(p.pis), cofinsPct:num(p.cofins), icmsPct:num(p.icms),
      bcII, ii, bcIpi, ipi, bcPis, pis, bcCofins, cofins, bcIcms, icms,
      custoTotalComCredito, custoUnitComCredito, custoTotalSemCredito, custoUnitSemCredito};
  }).filter(Boolean);

  const totais = {
    qty: sum(linhas.map(l=>l.qty)), peso: sum(linhas.map(l=>l.peso)),
    totalUSD: sum(linhas.map(l=>l.totalUSD)), totalBRL: sum(linhas.map(l=>l.totalBRL)),
    rateioFrete: sum(linhas.map(l=>l.rateioFrete)), rateioSeguro: sum(linhas.map(l=>l.rateioSeguro)), rateioAcrescimo: sum(linhas.map(l=>l.rateioAcrescimo)),
    valorAduaneiro: sum(linhas.map(l=>l.valorAduaneiro)), rateioDespesasNF: sum(linhas.map(l=>l.rateioDespesasNF)),
    rateioFreteTabela: sum(linhas.map(l=>l.rateioFreteTabela)), rateioArmazenagemTabela: sum(linhas.map(l=>l.rateioArmazenagemTabela)),
    rateioOutrasTabela: sum(linhas.map(l=>l.rateioOutrasTabela)), rateioAfrmmTabela: sum(linhas.map(l=>l.rateioAfrmmTabela)),
    ii: sum(linhas.map(l=>l.ii)), ipi: sum(linhas.map(l=>l.ipi)), pis: sum(linhas.map(l=>l.pis)),
    cofins: sum(linhas.map(l=>l.cofins)), icms: sum(linhas.map(l=>l.icms)),
    custoTotalComCredito: sum(linhas.map(l=>l.custoTotalComCredito)),
    custoTotalSemCredito: sum(linhas.map(l=>l.custoTotalSemCredito)),
  };
  return { linhas, totais };
}

/* ============================ SIMULADOR DE CARGA ============================
   Cálculo estimado de ocupação de container (volume/peso/paletes), não é um
   otimizador de bin-packing 3D real — serve para planejamento e visualização
   aproximada, arredondando para cima o número de containers necessários. */
function novaCaixaSimulador(idx){
  return {id:uid(), nome:'', comprimento:'', largura:'', altura:'', quantidade:'', pesoPeca:'', cor: CORES_CAIXA[(idx||0)%CORES_CAIXA.length]};
}
function simulacaoPadrao(){
  return {
    nome:'',
    caixas:[novaCaixaSimulador(0)],
    tipoCarregamento:'solta', // solta | granel | pallets
    palete:{comprimento:'120', largura:'80', altura:'16', alturaMaxCarregamento:'200', cargaUtil:'1500', pesoPalete:'25'},
    containerTipos:[],
    embalagemTipo:'caixa-papelao',
    embalagemObs:'',
  };
}
function normalizeSimulacao(s){
  const base = simulacaoPadrao();
  const merged = Object.assign({}, base, s||{});
  if(!Array.isArray(merged.caixas) || merged.caixas.length===0) merged.caixas = [novaCaixaSimulador(0)];
  merged.palete = Object.assign({}, base.palete, merged.palete||{});
  if(!s || !Array.isArray(s.containerTipos)){
    // compatibilidade com simulações salvas antes do multi-seleção (campo antigo: containerTipo string)
    merged.containerTipos = (s && s.containerTipo) ? [s.containerTipo] : [];
  }
  delete merged.containerTipo;
  return merged;
}
function computeCaixaSimulador(cx){
  const qty = num(cx.quantidade), peso = num(cx.pesoPeca);
  const comp = num(cx.comprimento), larg = num(cx.largura), alt = num(cx.altura);
  const volumeUnitM3 = (comp*larg*alt)/1e6; // cm³ → m³
  const cbm = volumeUnitM3*qty;
  const pesoTotal = peso*qty;
  return {...cx, qty, peso, comp, larg, alt, volumeUnitM3, cbm, pesoTotal};
}
function computeSimulacao(sim){
  const caixas = sim.caixas.map(computeCaixaSimulador);
  const totalUnidades = sum(caixas.map(c=>c.qty));
  const totalCbm = sum(caixas.map(c=>c.cbm));
  const totalPeso = sum(caixas.map(c=>c.pesoTotal));
  return { caixas, totalUnidades, totalCbm, totalPeso };
}
function computePaleteCbmUtil(p){
  const comp=num(p.comprimento), larg=num(p.largura), altMax=num(p.alturaMaxCarregamento);
  return (comp*larg*altMax)/1e6; // m³ utilizáveis por palete (área x altura máxima de carregamento)
}
/* Aloca as caixas (Carga Solta/Granel) container a container, respeitando ao mesmo tempo o
   limite de volume (capacidadeCbm) E o limite de peso (maxPayload) de cada container — evita
   que um container "feche" por peso enquanto o cálculo de volume (ou vice-versa) ainda pensa
   que a carga toda coube no 1º container. */
function alocarContainersSolta(caixasComputadas, capacidadeCbm, maxPayload){
  const containers = [];
  let atual = { itens:[], volTotal:0, pesoTotal:0 };
  const fila = caixasComputadas.filter(c=>c.qty>0).map(c=>({...c, restante:c.qty}));
  if(fila.length===0) return containers;
  let seguro = 0;
  while(fila.some(c=>c.restante>0) && seguro<2000){
    seguro++;
    let progresso = false;
    for(const cx of fila){
      if(cx.restante<=0) continue;
      const volPerUnit = cx.volumeUnitM3||0, pesoPerUnit = cx.peso||0;
      const volLivre = capacidadeCbm>0 ? capacidadeCbm-atual.volTotal : Infinity;
      const pesoLivre = maxPayload>0 ? maxPayload-atual.pesoTotal : Infinity;
      const maxPorVolume = volPerUnit>0 ? Math.floor(volLivre/volPerUnit) : cx.restante;
      const maxPorPeso = pesoPerUnit>0 ? Math.floor(pesoLivre/pesoPerUnit) : cx.restante;
      const qtd = Math.max(0, Math.min(cx.restante, maxPorVolume, maxPorPeso));
      if(qtd<=0) continue;
      let existente = atual.itens.find(it=>it.id===cx.id);
      if(!existente){ existente = {...cx, qtyNesteContainer:0}; atual.itens.push(existente); }
      existente.qtyNesteContainer += qtd;
      atual.volTotal += qtd*volPerUnit;
      atual.pesoTotal += qtd*pesoPerUnit;
      cx.restante -= qtd;
      progresso = true;
    }
    if(!progresso){
      containers.push(atual);
      atual = { itens:[], volTotal:0, pesoTotal:0 };
    }
  }
  if(atual.itens.length) containers.push(atual);
  return containers;
}
function simularContainers(sim, containerKey){
  const cont = CONTAINERS[containerKey];
  const c = computeSimulacao(sim);
  if(!cont) return { cont:null, c };

  let volumeNecessario = c.totalCbm;
  let pesoNecessario = c.totalPeso;
  let unidadesPaletes = 0;
  let alocacaoContainers = null;

  if(sim.tipoCarregamento==='pallets'){
    const paleteCbmUtil = computePaleteCbmUtil(sim.palete);
    const pesoPalete = num(sim.palete.pesoPalete);
    unidadesPaletes = calcPaletizacao(sim).unidadesPaletes; // mesma fonte usada em toda a tela de Resultado
    volumeNecessario = unidadesPaletes*paleteCbmUtil;
    pesoNecessario = c.totalPeso + unidadesPaletes*pesoPalete;
  } else {
    alocacaoContainers = alocarContainersSolta(c.caixas, cont.capacidadeCbm, cont.maxPayload);
    volumeNecessario = sum(alocacaoContainers.map(ct=>ct.volTotal));
    pesoNecessario = sum(alocacaoContainers.map(ct=>ct.pesoTotal));
  }

  const containersPorVolume = cont.capacidadeCbm>0 ? Math.ceil(volumeNecessario/cont.capacidadeCbm) : 1;
  const containersPorPeso = cont.maxPayload>0 ? Math.ceil(pesoNecessario/cont.maxPayload) : 1;
  let containersPorPaletes = 1;
  if(sim.tipoCarregamento==='pallets' && unidadesPaletes>0){
    const info = simularPaletesNoContainer(sim, containerKey);
    const capacidadeReal = info ? info.capacidadeContainer : cont.maxPallets;
    containersPorPaletes = capacidadeReal>0 ? Math.ceil(unidadesPaletes/capacidadeReal) : 1;
  }
  const numContainers = sim.tipoCarregamento==='pallets'
    ? Math.max(containersPorVolume, containersPorPeso, containersPorPaletes, c.totalUnidades>0?1:0)
    : Math.max(alocacaoContainers ? alocacaoContainers.length : 1, c.totalUnidades>0?1:0);

  const ocupacaoVolume = numContainers>0 && cont.capacidadeCbm>0 ? (volumeNecessario/(cont.capacidadeCbm*numContainers))*100 : 0;
  const ocupacaoPeso = numContainers>0 && cont.maxPayload>0 ? (pesoNecessario/(cont.maxPayload*numContainers))*100 : 0;

  return { cont, c, volumeNecessario, pesoNecessario, unidadesPaletes, alocacaoContainers,
    numContainers, ocupacaoVolume, ocupacaoPeso, containersPorVolume, containersPorPeso, containersPorPaletes };
}

/* ------------------------------ Motor de cálculo --------------------------- */
function computeDados(d){
  const produtos = d.produtos.map(p=>{
    const qty = num(p.quantidade), vu = num(p.valorUnit), peso = num(p.pesoLiquido);
    const totalUSD = qty*vu;
    const totalBRL = totalUSD*num(d.cambioInvoice);
    return {...p, qty, vu, peso, totalUSD, totalBRL};
  });
  const sumQty = sum(produtos.map(p=>p.qty));
  const sumPeso = sum(produtos.map(p=>p.peso));
  const sumTotalUSD = sum(produtos.map(p=>p.totalUSD));   // F30
  const sumTotalBRL = sum(produtos.map(p=>p.totalBRL));   // G30

  const freteExt = num(d.freteExt), seguroExt = num(d.seguroExt);
  const cambioFrete = num(d.cambioFrete);
  const freteBRL = cambioFrete*freteExt;                  // E38
  const seguroBRL = cambioFrete*seguroExt;                // E39
  const totalFreteSeguroExt = freteExt+seguroExt;         // D41
  const totalFreteSeguroBRL = freteBRL+seguroBRL;         // E41

  const cambioDesembaraco = num(d.cambioDesembaraco);
  const invoiceExt = sumTotalUSD;                         // D52
  const invoiceBRL = cambioDesembaraco*invoiceExt;        // E52
  const freteExtD = freteExt;                             // D53
  const freteBRLD = cambioDesembaraco*freteExtD;          // E53
  const seguroExtD = seguroExt;                           // D54
  const seguroBRLD = cambioDesembaraco*seguroExtD;        // E54
  const valorAduaneiroExt = invoiceExt+freteExtD+seguroExtD;      // D56
  const valorAduaneiroBRL = cambioDesembaraco*valorAduaneiroExt;  // E56

  const ii = num(d.ii);        // D48
  const icms = num(d.icms);    // D49
  const iiValor = ii*valorAduaneiroBRL;                            // H52
  const vaMaisII = valorAduaneiroBRL+iiValor;                      // H53
  const bcIcms = icms<1 ? vaMaisII/(1-icms) : 0;                   // H54
  const icmsValor = bcIcms*icms;                                   // H55

  const despExtraTotal = sum(d.despExtra.map(num));                // D65
  const limiteUSD = valorAduaneiroExt;                             // F72 = D56
  const limiteExcedido = limiteUSD > LIMITE_SIMPLIFICADA_USD;

  return { produtos, sumQty, sumPeso, sumTotalUSD, sumTotalBRL,
    freteBRL, seguroBRL, totalFreteSeguroExt, totalFreteSeguroBRL,
    invoiceExt, invoiceBRL, freteExtD, freteBRLD, seguroExtD, seguroBRLD,
    valorAduaneiroExt, valorAduaneiroBRL, iiValor, vaMaisII, bcIcms, icmsValor,
    despExtraTotal, limiteUSD, limiteExcedido };
}

function computeRateio(d, c){
  // primeira passada — tudo exceto rateio de despesas extras
  const linhas = c.produtos.map(p=>{
    if(!(p.qty>0) && !p.fornecedor && !p.produto) return null;
    const pesoShare = c.sumPeso>0 ? p.peso/c.sumPeso : 0;
    const valorShare = c.sumTotalUSD>0 ? p.totalUSD/c.sumTotalUSD : 0;
    // O rateio respeita os pré-cálculos de cada taxa de câmbio preenchida em Dados:
    // o valor do produto usa a taxa da Invoice (p.totalBRL) e o frete/seguro usam a taxa do Frete
    // (c.freteBRL/c.seguroBRL) — a mesma taxa usada nos respectivos campos em Dados.
    const rateioFrete = pesoShare*c.freteBRL;                 // H (taxa da Invoice/Frete conforme Dados)
    const rateioSeguro = valorShare*c.seguroBRL;              // I (taxa do Frete conforme Dados)
    const valorAduaneiroProduto = p.totalBRL+rateioFrete+rateioSeguro; // J
    const rateioII = valorAduaneiroProduto*num(d.ii);   // K
    const icmsRate = num(d.icms);
    const rateioBcIcms = icmsRate<1 ? (valorAduaneiroProduto+rateioII)/(1-icmsRate) : 0; // L
    const rateioIcms = rateioBcIcms*icmsRate;              // M
    return {...p, valorShare, rateioFrete, rateioSeguro, valorAduaneiroProduto, rateioII, rateioBcIcms, rateioIcms};
  }).filter(Boolean);

  const sumJ = sum(linhas.map(l=>l.valorAduaneiroProduto));
  linhas.forEach(l=>{
    // Rateio das despesas extras segue a mesma proporção (valor $) usada no rateio do seguro.
    l.rateioDespExtra = l.valorShare*c.despExtraTotal;                    // N
    l.custoTotalSimples = l.valorAduaneiroProduto+l.rateioII+l.rateioIcms+l.rateioDespExtra; // O
    l.custoUnitSimples = l.qty>0 ? l.custoTotalSimples/l.qty : 0;         // P
    l.custoTotalLucroReal = l.valorAduaneiroProduto+l.rateioII+l.rateioDespExtra; // Q
    l.custoUnitLucroReal = l.qty>0 ? l.custoTotalLucroReal/l.qty : 0;     // R
  });

  const totais = {
    qty: sum(linhas.map(l=>l.qty)), peso: sum(linhas.map(l=>l.peso)),
    totalUSD: sum(linhas.map(l=>l.totalUSD)), totalBRL: sum(linhas.map(l=>l.totalBRL)),
    rateioFrete: sum(linhas.map(l=>l.rateioFrete)), rateioSeguro: sum(linhas.map(l=>l.rateioSeguro)),
    valorAduaneiroProduto: sumJ, rateioII: sum(linhas.map(l=>l.rateioII)),
    rateioBcIcms: sum(linhas.map(l=>l.rateioBcIcms)), rateioIcms: sum(linhas.map(l=>l.rateioIcms)),
    rateioDespExtra: sum(linhas.map(l=>l.rateioDespExtra)),
    custoTotalSimples: sum(linhas.map(l=>l.custoTotalSimples)),
    custoTotalLucroReal: sum(linhas.map(l=>l.custoTotalLucroReal)),
  };
  return { linhas, totais };
}

const semIds = x => JSON.stringify(x, (k, v)=>k==='id' ? undefined : v);
// Há informações da cotação em edição que ainda não foram salvas?
function cotacaoTemAlteracao(sessao){
  if(sessao==='simples'){
    const salvo = state.currentCotacaoId ? (state.cotacoesIndex||[]).find(x=>x.id===state.currentCotacaoId) : null;
    return semIds(state.dados) !== semIds(salvo ? normalizeDados(JSON.parse(JSON.stringify(salvo.dados))) : dadosPadrao());
  }
  const salvo = state.currentCotacaoFormalId ? (state.cotacoesFormalIndex||[]).find(x=>x.id===state.currentCotacaoFormalId) : null;
  return semIds(state.dadosFormal) !== semIds(salvo ? normalizeDadosFormal(JSON.parse(JSON.stringify(salvo.dados))) : dadosFormalPadrao());
}
function descartarCotacaoEmEdicao(sessao){
  const perdeu = cotacaoTemAlteracao(sessao);
  if(sessao==='simples'){ state.dados = dadosPadrao(); state.currentCotacaoId = null; }
  else{ state.dadosFormal = dadosFormalPadrao(); state.currentCotacaoFormalId = null; }
  return perdeu;
}

// Janela de confirmação ao sair da cotação com informações não salvas

async function acaoSairCotacao(cmd){
  const c = state.sairCotacao; if(!c) return true;
  if(cmd==='sair-cot-cancelar'){ state.sairCotacao = null; renderApp(); return true; }
  if(cmd==='sair-cot-descartar'){ state.sairCotacao = null; state.sairSemConfirmar = true; try{ navigate(c.destino); } finally { state.sairSemConfirmar = false; } return true; }
  if(cmd==='sair-cot-salvar'){
    state.sairCotacao = null;
    try{ if(c.sessao==='simples') await salvarCalculo(); else await salvarCalculoFormal(); }catch(e){ console.error(e); toast('Não foi possível salvar a cotação.'); renderApp(); return true; }
    if(cotacaoTemAlteracao(c.sessao)){ renderApp(); return true; }   // não salvou (ex.: faltou preencher algo): continua na cotação
    state.sairSemConfirmar = true; try{ navigate(c.destino); } finally { state.sairSemConfirmar = false; }
    return true;
  }
  return false;
}

// Cadastros salva a união e esvazia a lista antiga; os demais só veem a união.
async function unificarEmpresas(cli, forn){
  const clientes = (cli||[]).map(e=>({ ...e, tipoCadastro: e.tipoCadastro || 'cliente' }));
  const fornecedores = (forn||[]).filter(x=>!clientes.some(c=>c.id===x.id)).map(e=>({ ...e, tipoCadastro: e.tipoCadastro || 'fornecedor' }));
  state.clientes = [...clientes, ...fornecedores];
  if(!fornecedores.length || !(pode('cadastros','criar') || pode('cadastros','editar'))) return;
  if(!(await storeSet('clientes:list', state.clientes))) return;
  const { data: v } = await sb.rpc('salvar_dado', { p_chave:'fornecedores:list', p_valor:[], p_versao: versoes['fornecedores:list']||0 });
  if(v) versoes['fornecedores:list'] = v;
}

/* ============================ Monitoramento de Carga ============================
   Containers acompanhados (ETD, ETA, países, portos, free time e custo após o free time). Podem ser
   adicionados à mão ou puxados dos Processos (Transporte → Containers). Tem área de permissão própria
   ("Monitoramento de Carga"; quem ainda não a tem definida herda a de Processos). Se o servidor ainda não aceitar a chave "monitoramento:list", uma cópia local garante
   que nada se perca neste navegador. */
const MON_SITUACOES = {
  sem_dados:  { rotulo:'Informe free time e data', classe:'badge-navy' },
  aguardando: { rotulo:'Aguardando chegada', classe:'badge-navy' },
  no_prazo:   { rotulo:'No free time', classe:'badge-ok' },
  vencendo:   { rotulo:'Free time vencendo', classe:'badge-amber' },
  excedido:   { rotulo:'Free time excedido', classe:'badge-danger' },
  devolvido_ok:       { rotulo:'Devolvido no prazo', classe:'badge-ok' },
  devolvido_excedido: { rotulo:'Devolvido com excedente', classe:'badge-danger' },
};
const hojeLocalISO = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function monData(v){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v||'')); return m ? Date.UTC(+m[1], +m[2]-1, +m[3]) : null; }
function monDiasEntre(a, b){ return Math.round((b - a) / 86400000); }
function monAddDias(ts, n){ const d = new Date(ts + n*86400000); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
function novoContainerMonitorado(base){
  return { id:uid(), origem:'manual', processoId:'', referencia:'', referenciaCliente:'', cliente:'', containerId:'', container:'', tipo:"40' HC", etd:'', eta:'', chegada:'',
    paisOrigem:'', paisDestino:'Brasil', portoOrigem:'', portoDestino:'', freeTime:'', inicio:'', devolucao:'',
    custoDiario:'', moeda:'USD', cambio:'', scac:'AUTO', rastreio:null, criadoEm:new Date().toISOString(), ...(base||{}) };
}
// Free time: o dia da chegada conta como dia 1. Passou do free time, cada dia excedente custa o valor diário.
function monCalcular(m, hoje){
  hoje = hoje || hojeLocalISO();
  const ft = Math.max(0, Math.floor(num(m.freeTime)));
  const iniStr = m.inicio || m.chegada || m.eta;
  const ini = monData(iniStr), hojeTs = monData(hoje), dev = monData(m.devolucao);
  const custoDia = Math.max(0, num(m.custoDiario));
  const r = { ft, iniStr, ini, devolvido: dev!=null, uso:0, excedentes:0, restantes:null, limite:'', custoDia, custo:0, custoBRL:0, semCambio:false, situacao:'sem_dados' };
  r.limite = (ini!=null && ft>0) ? monAddDias(ini, ft-1) : '';
  if(ini==null || !(ft>0)) return r;
  const fim = dev!=null ? dev : hojeTs;
  r.uso = Math.max(0, monDiasEntre(ini, fim) + 1);
  r.excedentes = Math.max(0, r.uso - ft);
  r.custo = r.excedentes * custoDia;
  if(m.moeda==='R$') r.custoBRL = r.custo;
  else if(num(m.cambio)>0) r.custoBRL = r.custo * num(m.cambio);
  else r.semCambio = r.custo>0;
  if(r.devolvido) r.situacao = r.excedentes>0 ? 'devolvido_excedido' : 'devolvido_ok';
  else if(hojeTs < ini) r.situacao = 'aguardando';
  else if(r.uso > ft) r.situacao = 'excedido';
  else{ r.restantes = ft - r.uso; r.situacao = r.restantes<=2 ? 'vencendo' : 'no_prazo'; }
  return r;
}
function monTextoSituacao(m, c){
  const base = MON_SITUACOES[c.situacao].rotulo;
  if(c.situacao==='no_prazo' || c.situacao==='vencendo') return base + ' · ' + (c.restantes===0 ? 'vence hoje' : c.restantes + ' dia' + (c.restantes===1?'':'s') + ' restante' + (c.restantes===1?'':'s'));
  if(c.situacao==='excedido') return base + ' · ' + c.excedentes + ' dia' + (c.excedentes===1?'':'s');
  return base;
}
function monMoedaTxt(valor, moeda){ return moeda==='R$' ? fmtBRL(valor) : fmtMoedaExt(valor, moeda); }
function monCustoTxt(m, c){
  if(!(c.custo>0)) return moedaZero(m.moeda);
  return monMoedaTxt(c.custo, m.moeda) + (m.moeda!=='R$' && c.custoBRL>0 ? ' = ' + fmtBRL(c.custoBRL) : '');
}
function moedaZero(moeda){ return monMoedaTxt(0, moeda); }

/* --- containers vindos dos Processos --- */
function paisesDoProcesso(p){
  return [...new Set((((p||{}).produto||{}).fornecedores||[]).map(f=>String(f.paisOrigem||'').trim()).filter(Boolean))].join(', ');
}
function containersDosProcessos(){
  const out = [];
  (state.processosIndex||[]).forEach(raw=>{
    let p; try{ p = normalizarProcesso(raw); }catch(e){ return; }
    todosTransportesProc(p).forEach(t=>{
      if(!t || t.modal!=='maritimo') return;
      (t.containers||[]).forEach(c=>{
        const numero = String(c.numero||'').trim();
        if(!numero) return;
        out.push({ processoId:p.id, containerId:c.id, container:numero.toUpperCase(), tipo:c.tipo || "40' HC", etd:t.etd||'', eta:t.eta||'', chegada:t.chegada||'',
          paisOrigem:paisesDoProcesso(p), portoOrigem:t.origem||'', portoDestino:t.destino||'', freeTime:t.freeTime||'',
          referenciaCliente:(p.cliente||{}).referenciaCliente||'', cliente:(p.cliente||{}).nome||'' });
      });
    });
  });
  return out;
}
const monJaImportado = x => state.monitoramento.some(m=>m.processoId===x.processoId && m.containerId===x.containerId);
function monAtualizarDoProcesso(m, dados){
  ['container','tipo','etd','eta','chegada','paisOrigem','portoOrigem','portoDestino','referenciaCliente','cliente'].forEach(k=>{ m[k] = dados[k] || ''; });
  if(String(dados.freeTime||'').trim()!=='') m.freeTime = dados.freeTime;
  if(m.referencia===undefined || m.referencia==='') m.referencia = dados.processoId || '';
  m.removidoDoProcesso = false;
  m.atualizadoEm = new Date().toISOString();
}

/* --- ações --- */
function acaoMonitoramento(cmd, a1, a2){
  if(acaoTemplateMon(cmd, a1, a2)) return true;
  switch(cmd){
    case 'mon-abrir': {
      salvarPrefsMonitoramento({ modo:'janela' });
      const mn = monMinCarregar(); delete mn[a1]; monMinSalvar();
      state.monFoco = a1; renderApp(); return true;
    }
    case 'mon-add': {
      const novo = novoContainerMonitorado();
      state.monitoramento.unshift(novo);
      persistMonitoramento(); renderApp();
      const campo = document.querySelector(`[data-mon="${novo.id}.container"]`); if(campo){ campo.scrollIntoView({ block:'center' }); campo.focus(); }
      return true;
    }
    case 'mon-importar': {
      const novos = containersDosProcessos().filter(x=>!monJaImportado(x));
      if(!novos.length){ toast('Nenhum container novo nos Processos (só entram containers com número preenchido).'); return true; }
      novos.forEach(x=>state.monitoramento.push(novoContainerMonitorado({ ...x, origem:'processo', referencia:x.processoId })));
      persistMonitoramento(); renderApp();
      toast(novos.length + ' container' + (novos.length===1?'':'s') + ' puxado' + (novos.length===1?'':'s') + ' dos Processos.', 'ok');
      return true;
    }
    case 'mon-atualizar': case 'mon-atualizar-um': {
      const fontes = containersDosProcessos();
      let n = 0, sumiram = 0;
      state.monitoramento.filter(m=>m.origem==='processo' && (cmd==='mon-atualizar' || m.id===a1)).forEach(m=>{
        const f = fontes.find(x=>x.processoId===m.processoId && x.containerId===m.containerId);
        if(f){ monAtualizarDoProcesso(m, f); m.removidoDoProcesso = false; n++; } else { m.removidoDoProcesso = true; sumiram++; }
      });
      persistMonitoramento(); renderApp();
      toast(n + ' container' + (n===1?'':'s') + ' atualizado' + (n===1?'':'s') + ' com os dados dos Processos.' + (sumiram ? ' ' + sumiram + ' não está mais no processo.' : ''), n ? 'ok' : undefined);
      return true;
    }
    case 'mon-rastrear': rastrearContainer(a1); return true;
    case 'mon-rastrear-todos': monRastrearTodos(); return true;
    case 'mon-testar-api': monTestarApi(); return true;
    case 'mon-minimizar': {
      const mn = monMinCarregar(); if(mn[a1]) delete mn[a1]; else mn[a1] = true;
      monMinSalvar(); monRedesenharCartao(a1); return true;
    }
    case 'mon-minimizar-todos': {
      const mn = monMinCarregar(), algumAberto = state.monitoramento.some(m=>!mn[m.id]);
      state.monitoramento.forEach(m=>{ if(algumAberto) mn[m.id] = true; else delete mn[m.id]; });
      monMinSalvar(); renderApp(); return true;
    }
    case 'mon-aplicar-devolucao': {
      const m = state.monitoramento.find(x=>x.id===a1);
      if(m && m.rastreio && m.rastreio.devolucaoSugerida){ m.devolucao = m.rastreio.devolucaoSugerida; m.atualizadoEm = new Date().toISOString(); persistMonitoramento(); renderApp(); toast('Data de devolução aplicada.', 'ok'); }
      return true;
    }
    case 'mon-excluir': {
      const m = state.monitoramento.find(x=>x.id===a1); if(!m) return true;
      if(!requestDelete('mon', a1)) return true;
      state.monitoramento = state.monitoramento.filter(x=>x.id!==a1);
      persistMonitoramento(); renderApp();
      return true;
    }
  }
  return false;
}

async function monChamarApi(m){
  const { data } = await sb.auth.getSession();
  const token = data && data.session && data.session.access_token;
  const r = await fetch('/api/rastreio', { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + (token||'') },
    body: JSON.stringify({ container: monNumero(m), scac: String(m.scac||'AUTO').toUpperCase().trim() || 'AUTO' }) });
  let corpo = null; try{ corpo = await r.json(); }catch(e){}
  let destino = ''; try{ destino = new URL(r.url).pathname; }catch(e){}
  return { status:r.status, corpo, redirecionado:!!r.redirected, destino, tipo:(r.headers && r.headers.get && r.headers.get('content-type')) || '' };
}
function monAplicarRastreio(m, j){
  const mudou = [];
  const set = (campo, valor, rotulo) => { if(valor && m[campo]!==valor){ m[campo] = valor; mudou.push(rotulo); } };
  if(j.etd) set('etd', j.etd.data, 'ETD');
  if(j.eta){ set('eta', j.eta.data, 'ETA'); if(j.eta.real) set('chegada', j.eta.data, 'chegada efetiva'); }
  if(j.portoOrigem){ if(!m.portoOrigem) set('portoOrigem', j.portoOrigem.nome, 'porto de origem'); if(!m.paisOrigem) set('paisOrigem', monPaisPt(j.portoOrigem.pais), 'país de origem'); }
  if(j.portoDestino){ if(!m.portoDestino) set('portoDestino', j.portoDestino.nome, 'porto de destino'); if(!m.paisDestino || m.paisDestino==='Brasil') set('paisDestino', monPaisPt(j.portoDestino.pais), 'país de destino'); }
  m.rastreio = { atualizadoEm:new Date().toISOString(), status:j.status||'', falha:j.falha||'', trackingRequestId:j.trackingRequestId||'', shipmentId:j.shipmentId||'',
    armador:j.armador||null, situacao:j.situacao||'', navio:j.navio||'', viagem:j.viagem||'', atrasoDias:(j.atrasoDias==null?null:j.atrasoDias),
    etaInicialArmador:j.etaInicialArmador||'', link:j.link||'', eventos:(j.eventos||[]).slice(-12), devolucaoSugerida:j.devolucaoSugerida||'',
    etdReal:!!(j.etd && j.etd.real), etaReal:!!(j.eta && j.eta.real), erro:'' };

// Retorna 'ok', 'erro' ou 'fatal' (chave/login/permissão: não adianta continuar em lote).
async function rastrearContainer(id, opcoes){
  opcoes = opcoes || {};
  const m = state.monitoramento.find(x=>x.id===id); if(!m) return 'erro';
  if(!MON_CONTAINER_RE.test(monNumero(m))){ toast('Informe um número de container válido (4 letras + 7 números, ex.: MSKU1234567) para rastrear.'); return 'erro'; }
  state.monRastreando = state.monRastreando || {}; state.monRastreando[id] = true;
  if(!opcoes.lote) renderApp();
  let resultado = 'erro';
  try{
    const { status, corpo, redirecionado, destino, tipo } = await monChamarApi(m);
    if(status===401){ sessaoExpirada(); return 'fatal'; }
    if(!corpo || !corpo.ok){
      const naoPublicada = status===404 || (!corpo && status!==0 && status<500);
      const msg = (corpo && corpo.mensagem)
        || (redirecionado && !corpo ? 'A chamada foi redirecionada para "' + destino + '" em vez de chegar na função (login ou middleware do site bloqueando /api/). Use "Testar função de rastreio" para ver o diagnóstico.'
          : naoPublicada ? 'A função de rastreio (/api/rastreio) não respondeu como API (erro ' + status + (/html/i.test(tipo) ? ', veio uma página HTML' : '') + '). Use "Testar função de rastreio" no topo da página para ver a causa.'
          : 'Falha ao consultar o rastreamento (erro ' + status + '). Use "Testar função de rastreio" no topo da página para ver o diagnóstico.');
      m.rastreio = { ...(m.rastreio||{}), erro:msg, atualizadoEm:new Date().toISOString() };
      if(!opcoes.lote) toast(msg);
      resultado = naoPublicada || ([503,403,502,500].includes(status) && corpo && ['sem_chave','sem_permissao','chave_recusada','config'].includes(corpo.erro)) ? 'fatal' : 'erro';
    }else{
      const mudou = monAplicarRastreio(m, corpo);
      resultado = 'ok';
      if(!opcoes.lote){
        if(corpo.status==='processing_pending') toast('Pedido de rastreio criado. A Kpler leva alguns minutos para trazer os dados — clique em Rastrear de novo depois.', 'ok');
        else if(corpo.status==='request_failed' || corpo.status==='nao_encontrado') toast('A Kpler não encontrou este container' + (corpo.falha ? ' (' + corpo.falha + ')' : '') + '. Confira o número ou informe o código do armador (SCAC).');
        else toast(mudou.length ? 'Rastreio atualizado: ' + mudou.join(', ') + '.' : 'Rastreio consultado: nenhuma mudança.', 'ok');
      }
    }
  }catch(e){
    console.error('rastreio', e);
    m.rastreio = { ...(m.rastreio||{}), erro:'Sem conexão com o servidor de rastreamento.', atualizadoEm:new Date().toISOString() };
    if(!opcoes.lote) toast('Sem conexão com o servidor de rastreamento.');
  }finally{
    delete state.monRastreando[id];
    persistMonitoramento();
    if(!opcoes.lote) renderApp();
  }
  return resultado;
}
async function monRastrearTodos(){
  if(state.monLote) return;
  const alvo = state.monitoramento.filter(m=>MON_CONTAINER_RE.test(monNumero(m)) && !m.devolucao);
  if(!alvo.length){ toast('Nenhum container com número válido (e ainda não devolvido) para rastrear.'); return; }
  state.monLote = { total:alvo.length, feitos:0 }; renderApp();
  let ok = 0, erro = 0, parou = false;
  for(const m of alvo){
    const r = await rastrearContainer(m.id, { lote:true });
    state.monLote.feitos++;
    if(r==='ok') ok++; else erro++;
    if(r==='fatal'){ parou = true; break; }
    await new Promise(res=>setTimeout(res, 250));
  }
  const msgFatal = (alvo.map(m=>m.rastreio && m.rastreio.erro).filter(Boolean).pop()) || '';
  state.monLote = null; renderApp();
  toast(parou ? (msgFatal || 'Rastreamento interrompido.') : (ok + ' container' + (ok===1?'':'s') + ' consultado' + (ok===1?'':'s') + (erro ? ' · ' + erro + ' com erro (veja nos cartões)' : '') + '.'), ok && !parou ? 'ok' : undefined);
}
async function monTestarApi(){
  state.monDiag = { ok:null, texto:'Testando a função de rastreio…' }; renderApp();
  try{
    const r = await fetch('/api/rastreio', { method:'GET', headers:{ Accept:'application/json' } });
    const tipo = r.headers.get('content-type') || '';
    let j = null; if(/json/i.test(tipo)){ try{ j = await r.json(); }catch(e){} }
    let destino = ''; try{ destino = new URL(r.url).pathname; }catch(e){}
    if(j && j.ok && j.funcao==='rastreio'){
      state.monDiag = { ok:!!j.kplerConfigurada, texto: j.kplerConfigurada
        ? 'Tudo certo: a função está publicada e a chave da Kpler foi encontrada. Pode rastrear.'
        : 'A função está publicada, mas a chave KPLER_API_KEY não chegou neste deploy. Em Vercel → Settings → Environment Variables, deixe a chave em Production e faça um Redeploy.' };
    }else if(r.redirected){
      state.monDiag = { ok:false, texto:'A chamada foi redirecionada para "' + destino + '" (código ' + r.status + '): o login/middleware do site está interceptando /api/. A função precisa ser liberada no middleware.' };
    }else if(r.status===404){
      state.monDiag = { ok:false, texto:'Erro 404: o site não tem a função /api/rastreio. O arquivo api/rastreio.mjs precisa estar dentro da pasta api/ do repositório do GitHub (não na raiz) e o deploy mais novo precisa estar em Production.' };
    }else{
      state.monDiag = { ok:false, texto:'O servidor respondeu ' + r.status + (/html/i.test(tipo) ? ' com uma página HTML' : '') + ' em vez da resposta da função. Confira o vercel.json (rewrites/trailingSlash) e o middleware.' };
    }
  }catch(e){ state.monDiag = { ok:false, texto:'Sem conexão com o servidor.' }; }
  renderApp();
}

      <span data-mon-calc="sit" class="badge ${MON_SITUACOES[c.situacao].classe}">${esc(monTextoSituacao(m, c))}</span>

/* ============ Monitoramento: campos, filtros e template (mesmo padrão de Cotações e Processos) ============ */

const MON_CAMPO = Object.fromEntries(MON_CAMPOS.map(c=>[c.id, c]));
// Informações que a pessoa pode escolher para as Janelas. O container, a situação do free time e os botões ficam sempre no topo.

const MON_JANELA_ITEM = Object.fromEntries(MON_JANELA_ITENS.map(i=>[i.id, i]));
const MON_TEMPLATE_PADRAO = {

function prefsMonitoramento(){
  const p = ((usuarioAtual && usuarioAtual.preferencias) || {}).monitoramento || {};
  const valido = (arr, mapa) => Array.isArray(arr) ? arr.filter(id=>mapa[id]) : null;
  return { modo: (p.modo==='lista' || p.modo==='card') ? p.modo : 'janela',
    lista: valido(p.lista, MON_CAMPO) || MON_TEMPLATE_PADRAO.lista,
    card: valido(p.card, MON_CAMPO) || MON_TEMPLATE_PADRAO.card,
    janela: valido(p.janela, MON_JANELA_ITEM) || MON_TEMPLATE_PADRAO.janela,
    filtros: valido(p.filtros, mapaFiltrosTpl('mon')) || MON_TEMPLATE_PADRAO.filtros };
}
const salvarPrefsMonitoramento = (alteracao, mensagem) => salvarPreferencias('monitoramento', alteracao, prefsMonitoramento(), mensagem);

// Catálogo de filtros: todos os campos (texto, lista de opções, período ou faixa de valores) + busca em qualquer campo
let _catFiltrosMon = null;
function catalogoFiltrosMon(){
  if(_catFiltrosMon) return _catFiltrosMon;
  const data = v => v ? [String(v).slice(0,10)] : [];
  const n1 = v => { const x = Number(v); return (v===''||v==null||!isFinite(x)) ? [] : [String(x)]; };
  const c = m => monCalcular(m, hojeLocalISO());
  const temFt = x => x.ini!=null && x.ft>0;
  const fixo = obj => ()=>Object.entries(obj);
  const especial = {
    situacao: { tipo:'opcao', valores:m=>[c(m).situacao], opcoes:fixo(Object.fromEntries(Object.entries(MON_SITUACOES).map(([k,v])=>[k, v.rotulo]))) },
    origem: { tipo:'opcao', valores:m=>[m.origem==='processo' ? 'processo' : 'manual'], opcoes:fixo({ processo:'Processo', manual:'Manual' }) },
    tipo: { tipo:'opcao', valores:m=>[m.tipo] }, cliente: { tipo:'opcao' },
    paisOrigem: { tipo:'opcao' }, paisDestino: { tipo:'opcao' }, portoOrigem: { tipo:'opcao' }, portoDestino: { tipo:'opcao' },
    scac: { tipo:'opcao' }, armador: { tipo:'opcao' },
    situacaoViagem: { tipo:'opcao', valores:m=>[(m.rastreio||{}).situacao||''], opcoes:fixo(MON_SIT_VIAGEM) },
    statusRastreio: { tipo:'opcao', valores:m=>[(m.rastreio||{}).status||''], opcoes:fixo(MON_ST_PEDIDO) },
    criadoEm: { tipo:'periodo', valores:m=>data(m.criadoEm) }, etd: { tipo:'periodo', valores:m=>data(m.etd) }, eta: { tipo:'periodo', valores:m=>data(m.eta) },
    chegada: { tipo:'periodo', valores:m=>data(m.chegada) }, inicio: { tipo:'periodo', valores:m=>data(m.inicio || m.chegada || m.eta) },
    limite: { tipo:'periodo', valores:m=>data(c(m).limite) }, devolucao: { tipo:'periodo', valores:m=>data(m.devolucao) },
    ultimaConsulta: { tipo:'periodo', valores:m=>data((m.rastreio||{}).atualizadoEm) },
    freeTime: { tipo:'faixa', valores:m=>n1(m.freeTime) },
    uso: { tipo:'faixa', valores:m=>temFt(c(m)) ? [String(c(m).uso)] : [] }, excedentes: { tipo:'faixa', valores:m=>temFt(c(m)) ? [String(c(m).excedentes)] : [] },
    custoDiario: { tipo:'faixa', valores:m=>n1(num(m.custoDiario)||'') }, custoBRL: { tipo:'faixa', valores:m=>c(m).custoBRL>0 ? [String(c(m).custoBRL)] : [] },
    custo: { tipo:'faixa', valores:m=>c(m).custo>0 ? [String(c(m).custo)] : [] },
    atraso: { tipo:'faixa', valores:m=>n1(((m.rastreio||{}).atrasoDias)) },
  };
  const busca = { id:'busca', label:'Busca em qualquer campo', janela:'Geral', tipo:'texto', placeholder:'Buscar…',
    valores:m=>MON_CAMPOS.map(cp=>{ try{ return String(cp.valor(m)||''); }catch(e){ return ''; } }) };
  _catFiltrosMon = [busca, ...MON_CAMPOS.map(cp=>{
    const e = especial[cp.id] || {};
    const valores = e.valores || (m=>{ try{ return [String(cp.valor(m)||'')]; }catch(err){ return []; } });
    return { id:cp.id, label:cp.label, janela:cp.janela, tipo:e.tipo || 'texto', valores, ...(e.opcoes ? { opcoes:e.opcoes } : {}) };
  })];
  return _catFiltrosMon;
}

/* --- janela Template: Configurar Card / Lista / Filtros --- */

  const sel = new Set(state.monTemplateSel[aba]);
  let grupos;
  if(aba==='filtros'){
    grupos = gruposFiltrosTplHtml('mon', MON_JANELAS_TEMPLATE, sel, 'mon-tpl-grupo', 'data-mtpl-campo');
  }else if(aba==='janela'){
    grupos = MON_JANELAS_TEMPLATE.map(janela=>{
      const itens = MON_JANELA_ITENS.filter(i=>i.janela===janela);

      return `<div class="tpl-grupo">

      if(!campos.length) return '';

      return `<div class="tpl-grupo">

        ${campos.map(c=>`<label class="tpl-campo"><input type="checkbox" data-mtpl-campo="${esc(c.id)}" ${sel.has(c.id)?'checked':''}> ${esc(c.label)}</label>`).join('')}
      </div>`;
    }).join('');
  }
  const textos = {
    janela: 'Escolha as informações que aparecem em cada janela de container. O container, a situação do free time e os botões do topo aparecem sempre. As informações desmarcadas ficam escondidas, mas os dados continuam guardados.',
    card: 'Escolha as informações que aparecem em cada card. O container aparece sempre no topo do card, e os cards ficam agrupados pela situação do free time.',
    lista: 'Escolha as colunas da lista. O container aparece sempre na primeira coluna.',
    filtros: 'Escolha os filtros da tela: todas as informações do container estão disponíveis (texto, lista de opções, período ou faixa de valores). Os filtros valem ao clicar em Filtrar; filtros ocultos deixam de ser aplicados. Valem também para as Janelas.',
  };
  const contagem = aba==='filtros' ? (sel.size===1 ? 'filtro selecionado' : 'filtros selecionados') : (sel.size===1 ? 'informação selecionada' : 'informações selecionadas');
  return `<div class="card proc-template">
    <div class="proc-template-topo">
      <div class="section-title">${ICONS.gear} Template</div>
      <div class="pers-tabs" style="margin:0;">
        <button class="pers-tab ${aba==='janela'?'active':''}" data-action="mon-tpl-aba:janela">Configurar Janela</button>
        <button class="pers-tab ${aba==='card'?'active':''}" data-action="mon-tpl-aba:card">Configurar Card</button>
        <button class="pers-tab ${aba==='lista'?'active':''}" data-action="mon-tpl-aba:lista">Configurar Lista</button>
        <button class="pers-tab ${aba==='filtros'?'active':''}" data-action="mon-tpl-aba:filtros">Configurar Filtros</button>
      </div>
    </div>
    <p class="page-sub" style="margin:10px 0 16px;">${textos[aba]} Esta escolha vale só para você.</p>
    <div class="tpl-grupos">${grupos}</div>
    <div class="btn-row" style="margin-top:18px; justify-content:space-between;">
      <span class="membro-sub">${sel.size} ${contagem}</span>
      <div class="btn-row">
        <button class="btn btn-ghost" data-action="mon-tpl-padrao">Restaurar padrão</button>
        <button class="btn btn-ghost" data-action="mon-template">Cancelar</button>
        <button class="btn btn-primary" data-action="mon-tpl-salvar">${ICONS.check} Salvar ${({ janela:'janela', card:'card', lista:'lista', filtros:'filtros' })[aba]}</button>
      </div>
    </div>
  </div>`;
}
function acaoTemplateMon(cmd, a1, a2){
  switch(cmd){
    case 'mon-modo': salvarPrefsMonitoramento({ modo:a1 }); renderApp(); return true;
    case 'mon-template': state.monTemplateAberto = !state.monTemplateAberto; state.monTemplateSel = null; if(state.monTemplateAberto) state.monTemplateAba = prefsMonitoramento().modo; renderApp(); return true;
    case 'mon-tpl-aba': state.monTemplateAba = a1; renderApp(); return true;
    case 'mon-tpl-grupo': {
      const aba = state.monTemplateAba || 'card';
      const ids = aba==='janela' ? MON_JANELA_ITENS.filter(i=>i.janela===a1).map(i=>i.id)
        : aba==='filtros' ? catalogoFiltrosMon().filter(f=>f.janela===a1).map(f=>f.id)
        : MON_CAMPOS.filter(c=>c.janela===a1 && c.id!=='container' && !(aba==='card' && c.id==='situacao')).map(c=>c.id);
      const atual = new Set(state.monTemplateSel[aba]);
      ids.forEach(id=> a2==='1' ? atual.add(id) : atual.delete(id));
      state.monTemplateSel[aba] = (aba==='janela' ? MON_JANELA_ITENS.map(i=>i.id) : aba==='filtros' ? catalogoFiltrosMon().map(f=>f.id) : MON_CAMPOS.map(c=>c.id)).filter(id=>atual.has(id));
      renderApp(); return true;
    }
    case 'mon-tpl-padrao': { const aba = state.monTemplateAba || 'card'; state.monTemplateSel[aba] = [...MON_TEMPLATE_PADRAO[aba]]; renderApp(); return true; }
    case 'mon-tpl-salvar': {
      const aba = state.monTemplateAba || 'card', escolhidos = state.monTemplateSel[aba];
      if(aba!=='filtros' && !escolhidos.length) return toast('Selecione pelo menos uma informação.'), true;
      const alteracao = { [aba]: [...escolhidos] };
      if(aba!=='filtros') alteracao.modo = aba; else limparFiltrosOcultosTpl('mon', escolhidos);
      salvarPrefsMonitoramento(alteracao, ({ janela:'Template da janela salvo.', card:'Template do card salvo.', lista:'Template da lista salvo.', filtros:'Filtros da tela salvos.' })[aba])
        .then(()=>{ state.monTemplateAberto = false; state.monTemplateSel = null; renderApp(); });
      return true;
    }
  }
  return false;
}
function onTemplateCampoMon(el){
  const id = el.getAttribute('data-mtpl-campo'); if(!id || !state.monTemplateSel) return false;
  const aba = state.monTemplateAba || 'card', atual = new Set(state.monTemplateSel[aba]);
  el.checked ? atual.add(id) : atual.delete(id);
  const ordem = aba==='janela' ? MON_JANELA_ITENS.map(i=>i.id) : aba==='filtros' ? catalogoFiltrosMon().map(f=>f.id) : MON_CAMPOS.map(c=>c.id);
  state.monTemplateSel[aba] = ordem.filter(x=>atual.has(x));
  renderApp(); return true;
}

/* --- Lista e Cards (a edição fica nas Janelas) --- */
function valorCampoMon(campo, m){
  const v = campo.valor(m);
  if(!v) return '<span class="vazio">—</span>';
  if(campo.badge){ const c = monCalcular(m, hojeLocalISO()); return `<span class="badge ${MON_SITUACOES[c.situacao].classe}">${esc(v)}</span>`; }
  return esc(v);
}
function acoesMonHtml(m){
  return `<div class="ci-actions">
    <button class="icon-btn" title="Abrir a janela para editar" data-action="mon-abrir:${esc(m.id)}">${ICONS.open}</button>
    <button class="icon-btn" title="Rastrear pela API" data-action="mon-rastrear:${esc(m.id)}">${ICONS.ship}</button>
    ${deleteBtnHtml('mon', m.id, 'mon-excluir:'+m.id)}
  </div>`;
}
// Lista compacta (mesmo desenho de Cotações, Processos e Financeiro): container, informações do template e ações
function renderMonLista(lista, prefs){
  const campos = prefs.lista.filter(id=>id!=='container').map(id=>MON_CAMPO[id]);
  return listaModernaHtml(lista.map(m=>({ acao:`mon-abrir:${esc(m.id)}`, idHtml:`<span class="lm-ref">${esc(m.container) || 'sem número'}</span>`,
    campos:campos.map(c=>({ label:c.label, html:valorCampoMon(c, m) })), acoes:acoesMonHtml(m) })));
}
function renderMonKanban(lista, prefs){
  const campos = prefs.card.filter(id=>id!=='container' && id!=='situacao').map(id=>MON_CAMPO[id]);
  const hoje = hojeLocalISO(), sit = m => monCalcular(m, hoje).situacao;
  const colunas = Object.entries(MON_SITUACOES).filter(([k])=>lista.some(m=>sit(m)===k));
  return `<div class="kanban-scroll"><div class="kanban-board proc-board" style="grid-template-columns:repeat(${colunas.length||1}, 250px);">
    ${colunas.map(([k, s])=>{
      const doGrupo = lista.filter(m=>sit(m)===k);
      return `<div class="kanban-column">
        <div class="kanban-column-header"><span class="badge ${s.classe}">${esc(s.rotulo)}</span><span class="kanban-count">${doGrupo.length}</span></div>
        <div class="kanban-column-body">
          ${doGrupo.map(m=>`
          <div class="kanban-card" data-action="mon-abrir:${esc(m.id)}" title="Clique para abrir a janela deste container">
            <div class="kanban-card-top"><span class="stamp">${esc(m.container) || 'sem número'}</span><span class="kanban-card-acoes">${acoesMonHtml(m)}</span></div>
            <div class="kanban-card-campos">${campos.map(c=>`<div class="kc-linha" title="${esc(c.label)}"><span class="kc-rot">${esc(c.label)}</span><span class="kc-val">${valorCampoMon(c, m)}</span></div>`).join('')}</div>
          </div>`).join('')}
        </div>
      </div>`;
    }).join('')}

  <p class="hint" style="color:var(--ink-soft); font-size:12px; margin-top:12px;">Os cards ficam agrupados pela situação do free time. Clique num card para abrir a janela e editar o container.</p>`;
}

  let conta = { prazo:0, venc:0, exc:0 }, totalBRL = 0, semCambio = 0;
  todos.forEach(m=>{ const c = monCalcular(m, hoje);
    if(c.situacao==='no_prazo' || c.situacao==='aguardando') conta.prazo++;
    if(c.situacao==='vencendo') conta.venc++;
    if(c.situacao==='excedido' || c.situacao==='devolvido_excedido') conta.exc++;

/* --- tela: Custo de Free Time (calculadora) --- */
function monSimCalcular(){
  const s = state.monSim, ft = Math.max(0, Math.floor(num(s.freeTime))), dias = Math.max(0, Math.floor(num(s.dias)));
  const custoDia = Math.max(0, num(s.custoDiario)), qtd = Math.max(1, Math.floor(num(s.qtd)) || 1);
  const taxa = s.moeda==='R$' ? 1 : num(s.cambio);
  const exc = Math.max(0, dias - ft), custoUn = exc * custoDia;
  return { ft, dias, custoDia, qtd, taxa, exc, custoUn, custoTotal: custoUn*qtd, brl: custoUn*qtd*taxa, semCambio: s.moeda!=='R$' && !(taxa>0) && custoUn>0 };
}
function atualizarSimFreeTime(){
  const r = monSimCalcular(), moeda = state.monSim.moeda, set = (id, v) => { const e = document.getElementById(id); if(e) e.textContent = v; };
  set('monsim-exc', String(r.exc)); set('monsim-unit', monMoedaTxt(r.custoUn, moeda)); set('monsim-total', monMoedaTxt(r.custoTotal, moeda));
  set('monsim-brl', r.taxa>0 ? fmtBRL(r.brl) : (r.custoTotal>0 ? 'Informe o câmbio' : fmtBRL(0)));
  const camb = document.getElementById('monsim-cambio'); if(camb) camb.style.display = moeda==='R$' ? 'none' : '';
}
