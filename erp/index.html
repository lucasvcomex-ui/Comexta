// Completa campos que faltem (processos salvos antes de algum campo novo existir).
function normalizarProcesso(p){
  const base = novoProcesso(), r = { ...base, ...(p||{}) };
  r.status = statusProc(r);
  if(p && !(p.cliente||{}).dataAbertura) base.cliente.dataAbertura = p.criadoEm ? String(p.criadoEm).slice(0,10) : '';
  for(const k of ['cliente','produto','transporte','financeiro','desembaraco']) r[k] = { ...base[k], ...((p||{})[k]||{}) };
  r.desembaraco.tributos = { ...base.desembaraco.tributos, ...(((p||{}).desembaraco||{}).tributos||{}) };
  // Processos antigos tinham um só fornecedor, com os campos direto em "produto": vira o 1º da lista.
  const prodAnt = (p||{}).produto || {};
  if(Array.isArray(prodAnt.fornecedores) && prodAnt.fornecedores.length){
    r.produto = { fornecedores: prodAnt.fornecedores.map(fo=>novoFornecedorProcesso({ ...fo, itens: Array.isArray(fo.itens) ? fo.itens : [] })) };
  }else if(p && p.produto){
    const { fornecedor, paisOrigem, incoterm, moeda, proforma, invoice, itens } = prodAnt;
    r.produto = { fornecedores:[novoFornecedorProcesso({ fornecedor:fornecedor||'', paisOrigem:paisOrigem||'', incoterm:incoterm||'FOB', moeda:moeda||'USD',
      proforma:proforma||'', invoice:invoice||'', itens: Array.isArray(itens) ? itens : [] })] };
  }else r.produto = base.produto;
  // Câmbio antigo (um campo para a mercadoria e outros para frete/seguro em outra moeda) vira a tabela por moeda.
  const finAnt = (p||{}).financeiro || {};
  if(finAnt.cambios && typeof finAnt.cambios==='object') r.financeiro.cambios = { ...finAnt.cambios };
  else{
    const c = {};
    if(finAnt.taxaCambio) c[r.produto.fornecedores[0].moeda] = finAnt.taxaCambio;
    if(finAnt.taxaCambioFrete && !c[finAnt.freteMoeda]) c[finAnt.freteMoeda] = finAnt.taxaCambioFrete;
    if(finAnt.taxaCambioSeguro && !c[finAnt.seguroMoeda]) c[finAnt.seguroMoeda] = finAnt.taxaCambioSeguro;
    r.financeiro.cambios = c;
  }
  delete r.financeiro.taxaCambio; delete r.financeiro.taxaCambioFrete; delete r.financeiro.taxaCambioSeguro;
  if(!Array.isArray(r.financeiro.parcelas)) r.financeiro.parcelas = [];
  // Containers: processos antigos tinham só "tipo" e "quantidade" no topo. Viram uma linha por container;
  // o peso bruto e a cubagem que existiam ficam no primeiro (o total continua o mesmo).
  const trAnt = (p||{}).transporte || {};
  if(!Array.isArray(trAnt.containers)){
    const qtd = Math.max(1, parseInt(trAnt.containerQtd, 10) || 1);
    r.transporte.containers = Array.from({ length:qtd }, (_, i)=>novoContainerProcesso({
      tipo: trAnt.containerTipo || "40' HC",
      ...(i===0 ? { pesoBruto: trAnt.pesoBruto || '', cubagem: trAnt.cubagem || '' } : {}) }));
  }else r.transporte.containers = trAnt.containers.map(c=>novoContainerProcesso(c));
  if(!r.transporte.containers.length) r.transporte.containers = [novoContainerProcesso()];
  delete r.transporte.containerTipo;
  sincronizarContainersProc(r);
  return r;
}
// Totais da lista de containers (quantidade, peso bruto, peso líquido e cubagem).
function arred3(v){ return Math.round((v + Number.EPSILON) * 1000) / 1000; }
function totaisContainersProc(t){
  const cs = Array.isArray(t && t.containers) ? t.containers : [];
  const soma = k => arred3(cs.reduce((a,c)=>a + numProcSimples(c[k]), 0));
  return { qtd: cs.length, pesoBruto: soma('pesoBruto'), pesoLiquido: soma('pesoLiquido'), cubagem: soma('cubagem') };
}
// Em FCL os totais dos containers alimentam os campos gerais do transporte (usados em filtros e relatórios).
function sincronizarContainersProc(p){
  const t = p && p.transporte; if(!t || !(t.modal==='maritimo' && t.tipoCarga==='FCL')) return;
  const x = totaisContainersProc(t);
  t.containerQtd = String(x.qtd);
  t.pesoBruto = x.pesoBruto ? String(x.pesoBruto) : '';
  t.pesoLiquido = x.pesoLiquido ? String(x.pesoLiquido) : '';
  t.cubagem = x.cubagem ? String(x.cubagem) : '';
}

const numProc = v => { const n = parseFloat(String(v??'').replace(/\./g,'').replace(',','.')); return isFinite(n) ? n : 0; };
const numProcSimples = v => { const n = parseFloat(String(v??'').replace(',','.')); return isFinite(n) ? n : 0; };
function fmtMoeda(v, moeda){
  try{ return new Intl.NumberFormat('pt-BR', { style:'currency', currency: moeda||'USD' }).format(v||0); }
  catch(e){ return (moeda||'') + ' ' + (v||0).toFixed(2); }
}
// Processo no formato atual (vários fornecedores, câmbio por moeda); os salvos no formato antigo são convertidos.
const procNorm = p => (p && p.produto && Array.isArray(p.produto.fornecedores) && p.financeiro && p.financeiro.cambios) ? p : normalizarProcesso(p);
const fornecedoresProc = p => procNorm(p).produto.fornecedores;
const itensProc = p => fornecedoresProc(p).flatMap(fo=>(fo.itens||[]).map(it=>({ ...it, fornecedor:fo.fornecedor, moeda:fo.moeda||'USD' })));
const moedaPrincipalProc = p => (fornecedoresProc(p)[0]||{}).moeda || 'USD';
const unicosProc = arr => [...new Set(arr.filter(Boolean))];
// Moedas estrangeiras do processo (mercadoria de cada fornecedor, frete e seguro): cada uma tem sua taxa no Financeiro.
function moedasCambioProc(p){
  const n = procNorm(p);
  return unicosProc([...n.produto.fornecedores.map(fo=>fo.moeda||'USD'), n.financeiro.freteMoeda||'USD', n.financeiro.seguroMoeda||'USD']).filter(m=>m!=='BRL');
}
const cambioProc = (p, moeda) => moeda==='BRL' ? 1 : numProcSimples((procNorm(p).financeiro.cambios||{})[moeda]);
function fmtPorMoeda(porMoeda){
  const e = Object.entries(porMoeda).filter(([,v])=>v);
  return e.length ? e.map(([m,v])=>fmtMoeda(v, m)).join(' + ') : fmtMoeda(0, Object.keys(porMoeda)[0] || 'USD');
}
function totaisProcesso(proc){
  const p = procNorm(proc), f = p.financeiro;
  const porMoeda = {}; let pesoLiq = 0;
  for(const fo of p.produto.fornecedores){
    const m = fo.moeda || 'USD'; porMoeda[m] = porMoeda[m] || 0;
    for(const i of fo.itens||[]){ porMoeda[m] += numProcSimples(i.quantidade)*numProcSimples(i.valorUnit); pesoLiq += numProcSimples(i.pesoLiquido); }
  }
  const moeda = moedaPrincipalProc(p), moedas = Object.keys(porMoeda);
  const frete = numProcSimples(f.frete), seguro = numProcSimples(f.seguro);
  const fob = moedas.length===1 ? porMoeda[moeda] : null;   // total numa moeda só quando todos os fornecedores usam a mesma
  const umaMoeda = fob!=null && (!frete || f.freteMoeda===moeda) && (!seguro || f.seguroMoeda===moeda);
  const usadas = unicosProc([...moedas.filter(m=>porMoeda[m]), frete ? f.freteMoeda : '', seguro ? f.seguroMoeda : '']);
  const faltaCambio = usadas.filter(m=>!cambioProc(p, m));
  const mercadoriaBRL = moedas.reduce((s,m)=>s + porMoeda[m]*cambioProc(p, m), 0);
  const cifBRL = mercadoriaBRL + frete*cambioProc(p, f.freteMoeda) + seguro*cambioProc(p, f.seguroMoeda);
  const tributos = Object.values(p.desembaraco.tributos||{}).reduce((s,v)=>s + numProcSimples(v), 0);
  return { porMoeda, fob, mercadoriaTexto: fmtPorMoeda(porMoeda), pesoLiq, moeda, cif: umaMoeda ? fob + frete + seguro : null,
           mercadoriaBRL: faltaCambio.length ? 0 : mercadoriaBRL, cifBRL: faltaCambio.length ? 0 : cifBRL, faltaCambio, tributos };
}

/* ----------- Filtros configuráveis (Processos e Cotações Salvas) ----------- */
// Mesmo padrão do Card e da Lista: o Template → Configurar Filtros oferece TODOS os campos, por janela.
// Cada filtro: { id, label, janela, tipo:'texto'|'opcao'|'periodo'|'faixa', valores(item)->[brutos], opcoes?(itens)->[[valor,rótulo]] }
// Os valores só valem ao clicar em Filtrar (ou Enter) e ficam fixados até Limpar (guardados neste navegador).
const FILTROS_TPL = {
  proc: { chave:'filtrosProc:fixado', catalogo:()=>catalogoFiltrosProc(), itens:()=>state.processosIndex||[], prefs:()=>prefsProcessos() },
  cot:  { chave:'filtrosCot:fixado',  catalogo:()=>catalogoFiltrosCot(),  itens:()=>itensCotacoes(), prefs:()=>prefsCotacoes() },
};
function filtrosAplicados(escopo){
  if(!state.filtrosAplicados) state.filtrosAplicados = {};
  return state.filtrosAplicados[escopo] || (state.filtrosAplicados[escopo] = {});
}
function mapaFiltrosTpl(escopo){ return Object.fromEntries(FILTROS_TPL[escopo].catalogo().map(f=>[f.id, f])); }
function filtroTplAtivo(valores, f){
  return (f.tipo==='periodo' || f.tipo==='faixa') ? !!(valores[f.id+':de'] || valores[f.id+':ate']) : !!valores[f.id];
}
function valoresBrutos(f, item){ try{ return juntar(f.valores(item)); }catch(e){ return []; } }
// Aplica os filtros visíveis (os ocultos não valem). "ignorar": ids que não se aplicam (ex.: status no quadro).
function aplicarFiltrosTpl(escopo, itens, ignorar){
  const mapa = mapaFiltrosTpl(escopo), valores = filtrosAplicados(escopo);
  const ativos = FILTROS_TPL[escopo].prefs().filtros.map(id=>mapa[id]).filter(f=>f && !(ignorar||[]).includes(f.id) && filtroTplAtivo(valores, f));
  if(!ativos.length) return itens;
  return itens.filter(item=>ativos.every(f=>{
    const vals = valoresBrutos(f, item);
    if(f.tipo==='opcao') return vals.includes(valores[f.id]);
    if(f.tipo==='periodo'){ const de = valores[f.id+':de'], ate = valores[f.id+':ate'];
      return vals.some(d=>(!de || d.slice(0,10)>=de) && (!ate || d.slice(0,10)<=ate)); }
    if(f.tipo==='faixa'){ const de = valores[f.id+':de'], ate = valores[f.id+':ate'];
      return vals.some(x=>{ const n = Number(x); return isFinite(n) && (de==='' || de==null || n>=Number(de)) && (ate==='' || ate==null || n<=Number(ate)); }); }
    const q = String(valores[f.id]).trim().toLowerCase();
    return vals.some(x=>x.toLowerCase().includes(q));
  }));
}
function algumFiltroTplAtivo(escopo, ignorar){
  const mapa = mapaFiltrosTpl(escopo), valores = filtrosAplicados(escopo);
  return FILTROS_TPL[escopo].prefs().filtros.some(id=>mapa[id] && !(ignorar||[]).includes(id) && filtroTplAtivo(valores, mapa[id]));
}
function opcoesFiltroTpl(escopo, f){
  if(f.opcoes) return f.opcoes();
  return juntar(FILTROS_TPL[escopo].itens().flatMap(item=>valoresBrutos(f, item))).sort((a,b)=>a.localeCompare(b,'pt-BR')).map(x=>[x,x]);
}
function filtroTplHtml(escopo, f){
  const v = filtrosAplicados(escopo);
  const attr = sufixo => `data-ftpl="${escopo}|${f.id}${sufixo||''}"`;
  if(f.tipo==='periodo' || f.tipo==='faixa'){
    const tp = f.tipo==='periodo' ? 'date' : 'number';
    const extra = f.tipo==='faixa' ? 'step="any"' : '';
    return `<div class="field filtro-periodo"><label>${esc(f.label)}</label><div class="periodo">
      <input type="${tp}" ${extra} ${attr(':de')} value="${esc(v[f.id+':de']||'')}" ${f.tipo==='faixa'?'placeholder="de"':''}>
      <span>até</span>
      <input type="${tp}" ${extra} ${attr(':ate')} value="${esc(v[f.id+':ate']||'')}" ${f.tipo==='faixa'?'placeholder="até"':''}></div></div>`;
  }
  if(f.tipo==='opcao'){
    return `<div class="field"><label>${esc(f.label)}</label><select ${attr()}>
      <option value="">Todos</option>${opcoesFiltroTpl(escopo, f).map(([o,t])=>`<option value="${esc(o)}" ${v[f.id]===o?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
  }
  return `<div class="field"><label>${esc(f.label)}</label><input ${attr()} value="${esc(v[f.id]||'')}" placeholder="${esc(f.placeholder||'')}" autocomplete="off"></div>`;
}
// Barra de filtros no padrão de Cotações Salvas: campos + Filtrar + Limpar (+ botões extras à direita)
function barraFiltrosTpl(escopo, ignorar, extrasHtml){
  const mapa = mapaFiltrosTpl(escopo);
  const filtros = FILTROS_TPL[escopo].prefs().filtros.map(id=>mapa[id]).filter(f=>f && !(ignorar||[]).includes(f.id));
  if(!filtros.length && !extrasHtml) return '';
  return `<div class="filter-bar">
    ${filtros.map(f=>filtroTplHtml(escopo, f)).join('')}
    ${filtros.length ? `<button class="btn btn-ghost btn-sm" data-action="ftpl-filtrar:${escopo}">${ICONS.filter} Filtrar</button>
    <button class="btn btn-ghost btn-sm" data-action="ftpl-limpar:${escopo}">Limpar</button>` : ''}
    ${extrasHtml ? `<div style="flex:1;"></div>${extrasHtml}` : ''}
  </div>`;
}
function seloFiltroFixado(escopo, ignorar){
  return algumFiltroTplAtivo(escopo, ignorar) ? ` <span class="badge badge-amber">${ICONS.filter} Filtro fixado — permanece até clicar em "Limpar"</span>` : '';
}
function acaoFiltrosTpl(cmd, escopo){
  if(cmd==='ftpl-filtrar'){
    const novos = {};
    document.querySelectorAll(`[data-ftpl^="${escopo}|"]`).forEach(el=>{
      const chave = el.getAttribute('data-ftpl').split('|')[1];
      const v = String(el.value||'').trim();
      if(v) novos[chave] = v;
    });
    state.filtrosAplicados[escopo] = novos;
    storeSet(FILTROS_TPL[escopo].chave, novos);
    toast(Object.keys(novos).length ? 'Filtro fixado — vai continuar aplicado até você clicar em "Limpar".' : 'Nenhum filtro preenchido.', Object.keys(novos).length ? 'ok' : undefined);
    renderApp(); return true;
  }
  if(cmd==='ftpl-limpar'){
    state.filtrosAplicados[escopo] = {};
    storeDelete(FILTROS_TPL[escopo].chave);
    renderApp(); return true;
  }
  return false;
}
// Ao esconder filtros no Template, o que estava aplicado neles deixa de valer.
function limparFiltrosOcultosTpl(escopo, visiveis){
  const v = filtrosAplicados(escopo), set = new Set(visiveis);
  let mudou = false;
  for(const chave of Object.keys(v)) if(!set.has(chave.split(':')[0])){ delete v[chave]; mudou = true; }
  if(mudou) storeSet(FILTROS_TPL[escopo].chave, v);
}

    paisOrigem: { tipo:'opcao', valores:it=>[d(it).paisOrigem] }, paisDestino: { tipo:'opcao', valores:it=>[d(it).paisDestino] },
    cidadeOrigem: { tipo:'opcao', valores:it=>[ehS(it) ? d(it).cidadeOrigem : d(it).freteOrigem] },
    cidadeDestino: { tipo:'opcao', valores:it=>[ehS(it) ? d(it).cidadeDestino : d(it).freteDestino] },
    portoOrigem: { tipo:'opcao', valores:it=>[d(it).portoOrigem] }, portoDestino: { tipo:'opcao', valores:it=>[d(it).portoDestino] },
    incoterm: { tipo:'opcao', valores:it=>[d(it).incoterm], opcoes:()=>PROC_INCOTERMS.map(i=>[i,i]) },
    etd: { tipo:'periodo', valores:it=>data(d(it).etd || d(it).freteEtd) }, eta: { tipo:'periodo', valores:it=>data(d(it).eta || d(it).freteEta) },
    transitTime: { tipo:'faixa', valores:it=>num(d(it).freteTransitTime) }, pesoBruto: { tipo:'faixa', valores:it=>num(d(it).pesoBrutoTotal) }, cbm: { tipo:'faixa', valores:it=>num(d(it).cbm) },
    itens: { tipo:'faixa', valores:it=>[String((it.cot.resumo||{}).itens||0)] },
    produtos: { tipo:'opcao', valores:it=>(d(it).produtos||[]).map(p=>p.produto) },
    fornecedores: { tipo:'opcao', valores:it=>(d(it).produtos||[]).map(p=>p.fornecedor) },
    ncms: { tipo:'texto', valores:it=>(d(it).produtos||[]).map(p=>p.ncm) },
    custoA: { tipo:'faixa', valores:it=>num(ehS(it) ? (it.cot.resumo||{}).custoSimples : (it.cot.resumo||{}).custoComCredito) },
    custoB: { tipo:'faixa', valores:it=>num(ehS(it) ? (it.cot.resumo||{}).custoLucroReal : (it.cot.resumo||{}).custoSemCredito) },
    valorAduaneiro: { tipo:'faixa', valores:it=>num(ehS(it) ? (it.cot.resumo||{}).valorAduaneiroBRL : (it.cot.resumo||{}).valorAduaneiro) },
    limite: { tipo:'opcao', valores:it=>ehS(it) ? [(it.cot.resumo||{}).limiteExcedido ? 'excedido' : 'dentro'] : [], opcoes:()=>[['dentro','Dentro do limite'],['excedido','Excedido']] },
    motivoNegado: { tipo:'opcao', valores:it=>[d(it).statusMotivoNegado], opcoes:()=>Object.entries(COT_MOTIVO_LABEL) },
  };
  const textoExibido = c => it=>{ try{ return [String(c.valor(it.tipo, it.cot)||'')]; }catch(e){ return []; } };
  _catFiltrosCot = [
    { id:'numero', label:'Número', janela:'Geral', tipo:'texto', placeholder:'COT-0001 ou COTF-0001', valores:it=>[it.cot.id] },
    { id:'busca', label:'Busca em qualquer campo', janela:'Geral', tipo:'texto', placeholder:'Buscar…',
      valores:it=>[it.cot.id, ...COT_CAMPOS.map(c=>{ try{ return String(c.valor(it.tipo, it.cot)||''); }catch(e){ return ''; } }), ...((d(it).produtos)||[]).flatMap(p=>[p.produto, p.fornecedor, p.ncm])] },
    ...COT_CAMPOS.map(c=>{ const e = especial[c.id] || {}; return { id:c.id, label:c.label, janela:c.janela, tipo:e.tipo||'texto', valores:e.valores||textoExibido(c), opcoes:e.opcoes }; }),
  ];
  return _catFiltrosCot;
}

// ---------- Processos: status e quadro por status (arrastar o card muda o status) ----------
function statusProc(p){ const s = (p && p.status) || 'aberto'; return PROC_STATUS_LEGADO[s] || s; }
function procStatusOpcoes(atual){
  const l = Object.entries(PROC_STATUS).filter(([k,v])=>!v.legado || k===atual).map(([k,v])=>[k, v.label]);
  return l;
}
async function moverProcessoStatus(id, novo){
  if(!pode('processos','editar')){ toast('Você não tem permissão para editar processos.'); renderApp(); return; }
  const p = (state.processosIndex||[]).find(x=>x.id===id);
  if(!p || statusProc(p)===novo || !PROC_STATUS[novo]) return;
  p.status = novo; p.atualizadoEm = new Date().toISOString(); p.atualizadoPor = usuarioAtual.nome || usuarioAtual.email;
  if(state.currentProcessoId===id && state.procDraft) state.procDraft.status = novo;
  if(await persistProcessosIndex()) toast(`${id}: status alterado para "${PROC_STATUS[novo].label}".`, 'ok');
  renderApp();
}

function acaoTemplateProcesso(cmd, a1, a2){
  switch(cmd){
    case 'proc-modo': salvarPrefsProcessos({ modo: a1 }); renderApp(); return true;
    case 'proc-template':
      state.procTemplateAberto = !state.procTemplateAberto; state.procTemplateSel = null; renderApp(); return true;
    case 'proc-tpl-aba': state.procTemplateAba = a1; renderApp(); return true;
    case 'proc-tpl-grupo': {
      const aba = state.procTemplateAba || 'card';
      const ids = aba==='filtros' ? catalogoFiltrosProc().filter(f=>f.janela===a1).map(f=>f.id)
        : PROC_CAMPOS.filter(c=>c.janela===a1 && c.id!=='id' && !(aba==='card' && c.id==='status')).map(c=>c.id);
      const atual = new Set(state.procTemplateSel[aba]);
      ids.forEach(id=> a2==='1' ? atual.add(id) : atual.delete(id));
      state.procTemplateSel[aba] = (aba==='filtros' ? catalogoFiltrosProc().map(f=>f.id) : PROC_CAMPOS.map(c=>c.id)).filter(id=>atual.has(id));
      renderApp(); return true;
    }
    case 'proc-tpl-padrao': {
      const aba = state.procTemplateAba || 'card';
      state.procTemplateSel[aba] = [...PROC_TEMPLATE_PADRAO[aba]]; renderApp(); return true;
    }

    case 'proc-tpl-salvar': {
      const aba = state.procTemplateAba || 'card';
      const escolhidos = state.procTemplateSel[aba];
      if(aba!=='filtros' && !escolhidos.length) return toast('Selecione pelo menos uma informação.'), true;
      const alteracao = { [aba]: [...escolhidos] };
      if(aba!=='filtros') alteracao.modo = aba;
      else{
        // Filtro que saiu da tela deixa de ser aplicado.
        limparFiltrosOcultosTpl('proc', escolhidos);
      }
      salvarPrefsProcessos(alteracao, ({ card:'Template do card salvo.', lista:'Template da lista salvo.', filtros:'Filtros da tela salvos.' })[aba])
        .then(()=>{ state.procTemplateAberto = false; state.procTemplateSel = null; renderApp(); });
      return true;
    }
  }
  return false;
}
function onTemplateCampo(el){
  const id = el.getAttribute('data-tpl-campo'); if(!id || !state.procTemplateSel) return false;
  const aba = state.procTemplateAba || 'card';
  const atual = new Set(state.procTemplateSel[aba]);
  el.checked ? atual.add(id) : atual.delete(id);
  const ordem = aba==='filtros' ? catalogoFiltrosProc().map(f=>f.id) : PROC_CAMPOS.map(c=>c.id);
  state.procTemplateSel[aba] = ordem.filter(x=>atual.has(x)); // mantém a ordem das janelas
  renderApp();
  return true;
}

// Só aceitam empresas de Cadastro → Clientes e Empresas do tipo certo: ao digitar 3 letras aparecem as
// sugestões; ao sair do campo, um nome que não é de empresa cadastrada é apagado.
const PROC_EMPRESA_CAMPOS = {
  'proc-cliente':     { path:'cliente.nome',            tipo:'cliente',      label:'Cliente' },
  'proc-agente':      { path:'transporte.agenteCarga',  tipo:'agente_carga', label:'Agente de carga' },
  'proc-despachante': { path:'desembaraco.despachante', tipo:'despachante',  label:'Despachante aduaneiro' },
};
function procCampoEmpresa(chave, opts){
  const c = PROC_EMPRESA_CAMPOS[chave];
  const qtd = empresasDoTipo(c.tipo).length;
  const tipoNome = TIPOS_CADASTRO[c.tipo];
  const v = getPath(state.procDraft, c.path) || '';
  const span = opts && opts.span ? ` style="grid-column:span ${opts.span};"` : '';
  const dica = qtd
    ? `Digite 3 letras e escolha uma empresa cadastrada como "${tipoNome}".`
    : `Nenhuma empresa cadastrada como "${tipoNome}". Cadastre em Cadastro → Clientes e Empresas.`;
  return `<div class="field"${span}><label>${c.label}</label>
    <input data-proc="${c.path}" data-proc-empresa="${chave}" value="${esc(v)}" placeholder="Digite 3 letras para buscar…" autocomplete="off">
    <span class="hint ${qtd ? '' : 'aviso-lista'}">${dica}</span></div>`;
}
function empresaPorNome(tipo, nome){
  const n = String(nome||'').trim().toLowerCase();
  return n ? empresasDoTipo(tipo).find(e=>nomeEmpresaCad(e).trim().toLowerCase()===n) : null;
}
// Confere o campo: vazio ou empresa cadastrada do tipo certo. Se não for, apaga (e avisa, se pedido).
function validarEmpresaProcesso(chave, avisar){
  const c = PROC_EMPRESA_CAMPOS[chave];
  const v = String(getPath(state.procDraft, c.path)||'').trim();
  if(!v) return true;
  const e = empresaPorNome(c.tipo, v);
  if(e){ setPath(state.procDraft, c.path, nomeEmpresaCad(e)); return true; }
  setPath(state.procDraft, c.path, '');
  if(avisar){
    toast(`"${v}" não é uma empresa cadastrada como ${TIPOS_CADASTRO[c.tipo]}. O campo ${c.label} ficou em branco.`);
    renderApp();
  }
  return false;
}
function escolherEmpresaProcesso(chave, empresa){
  const c = PROC_EMPRESA_CAMPOS[chave];
  setPath(state.procDraft, c.path, nomeEmpresaCad(empresa));
  if(chave==='proc-cliente'){
    // Traz CNPJ e o primeiro contato do cadastro para os campos vazios
    const cli = state.procDraft.cliente;
    const ct = ((empresa.enderecos||[])[0]||{}).contatos ? empresa.enderecos[0].contatos[0] : null;
    if(!cli.cnpjCpf) cli.cnpjCpf = empresa.cnpjCpf || '';
    if(ct){
      if(!cli.contato) cli.contato = ct.nome || '';
      if(!cli.email) cli.email = ct.email || '';
      if(!cli.telefone && ct.telefone) cli.telefone = [ct.ddd ? '('+ct.ddd+')' : '', ct.telefone].filter(Boolean).join(' ');
    }
  }
  saveDraftProcesso();
  renderApp();
}

// --------- Numerário do processo ---------
// Resumo de todos os custos da operação a partir das janelas anteriores (mesmos moldes do Numerário das cotações):
// mercadoria de cada fornecedor, frete e seguro convertidos em reais, valor aduaneiro, tributos e despesas do
// Desembaraço, e o rateio por produto (frete pelo peso líquido; seguro, tributos e despesas pelo valor).
const PROC_TRIBUTOS_IMPOSTOS = ['ii','ipi','pis','cofins','icms'];
const PROC_TRIBUTOS_CREDITO = ['ipi','pis','cofins','icms'];   // geram crédito no Lucro Real
function computeNumerarioProcesso(proc){
  const p = procNorm(proc), f = p.financeiro, tr = p.desembaraco.tributos || {};
  const cambio = m => cambioProc(p, m);
  const freteExt = numProcSimples(f.frete), seguroExt = numProcSimples(f.seguro);
  const cambioFrete = cambio(f.freteMoeda||'USD'), cambioSeguro = cambio(f.seguroMoeda||'USD');
  const freteBRL = freteExt*cambioFrete, seguroBRL = seguroExt*cambioSeguro;
  const imposto = k => numProcSimples(tr[k]);
  const despesasLista = PROC_TRIBUTOS.filter(([k])=>!PROC_TRIBUTOS_IMPOSTOS.includes(k));
  const despesasTotal = despesasLista.reduce((s,[k])=>s + imposto(k), 0);
  const impostosTotal = PROC_TRIBUTOS_IMPOSTOS.reduce((s,k)=>s + imposto(k), 0);
  const creditoTotal = PROC_TRIBUTOS_CREDITO.reduce((s,k)=>s + imposto(k), 0);

  const fornecedores = p.produto.fornecedores.map((fo, k)=>{
    const M = fo.moeda || 'USD', tx = cambio(M);
    const itens = (fo.itens||[]).filter(i=>i.produto || i.quantidade || i.valorUnit).map(i=>{
      const qty = numProcSimples(i.quantidade), vu = numProcSimples(i.valorUnit), peso = numProcSimples(i.pesoLiquido);
      return { fornecedor: fo.fornecedor || `Fornecedor ${k+1}`, moeda:M, produto:i.produto, ncm:i.ncm, unidade:i.unidade, qty, vu, peso, totalExt: qty*vu, totalBRL: qty*vu*tx };
    });
    return { nome: fo.fornecedor || `Fornecedor ${k+1}`, incoterm: fo.incoterm, moeda:M, cambio:tx, itens,
      totalExt: itens.reduce((s,i)=>s + i.totalExt, 0), totalBRL: itens.reduce((s,i)=>s + i.totalBRL, 0) };
  }).filter(fo=>fo.itens.length);
  const itens = fornecedores.flatMap(fo=>fo.itens);
  // Com fornecedores em moedas diferentes o rateio por valor é feito em reais; sem algum câmbio, usa o valor na moeda.
  const todosCambios = itens.every(i=>cambio(i.moeda));
  const base = i => todosCambios ? i.totalBRL : i.totalExt;
  const somaBase = itens.reduce((s,i)=>s + base(i), 0), somaPeso = itens.reduce((s,i)=>s + i.peso, 0);
  const n = itens.length || 1;
  const linhas = itens.map(i=>{
    const valorShare = somaBase>0 ? base(i)/somaBase : 1/n;
    const pesoShare = somaPeso>0 ? i.peso/somaPeso : valorShare;   // sem pesos, o frete vai pelo valor
    const rateioFrete = pesoShare*freteBRL, rateioSeguro = valorShare*seguroBRL;
    const valorAduaneiro = i.totalBRL + rateioFrete + rateioSeguro;
    const tributos = Object.fromEntries(PROC_TRIBUTOS_IMPOSTOS.map(k=>[k, valorShare*imposto(k)]));
    const despesas = valorShare*despesasTotal;
    const credito = PROC_TRIBUTOS_CREDITO.reduce((s,k)=>s + tributos[k], 0);
    const custoSemCredito = valorAduaneiro + PROC_TRIBUTOS_IMPOSTOS.reduce((s,k)=>s + tributos[k], 0) + despesas;
    const custoComCredito = custoSemCredito - credito;
    return { ...i, rateioFrete, rateioSeguro, valorAduaneiro, ...tributos, despesas, custoSemCredito, custoComCredito,
      unitSemCredito: i.qty>0 ? custoSemCredito/i.qty : 0, unitComCredito: i.qty>0 ? custoComCredito/i.qty : 0 };
  });
  const soma = k => linhas.reduce((s,l)=>s + (l[k]||0), 0);
  const totais = Object.fromEntries(['qty','peso','totalBRL','rateioFrete','rateioSeguro','valorAduaneiro',...PROC_TRIBUTOS_IMPOSTOS,'despesas','custoSemCredito','custoComCredito'].map(k=>[k, soma(k)]));
  const porMoeda = {}; fornecedores.forEach(fo=>{ porMoeda[fo.moeda] = (porMoeda[fo.moeda]||0) + fo.totalExt; });
  totais.totalExtTexto = Object.keys(porMoeda).length ? fmtPorMoeda(porMoeda) : '—';
  const mercadoriaBRL = fornecedores.reduce((s,fo)=>s + fo.totalBRL, 0);
  const valorAduaneiro = mercadoriaBRL + freteBRL + seguroBRL;
  const faltam = unicosProc([...fornecedores.filter(fo=>fo.totalExt).map(fo=>fo.moeda), freteExt ? f.freteMoeda : '', seguroExt ? f.seguroMoeda : '']).filter(m=>!cambio(m));
  const avisos = faltam.map(m=>`Informe o câmbio de ${m} (R$ por ${m}) na janela Financeiro.`);
  return { p, fornecedores, cambioFrete, cambioSeguro, freteExt, seguroExt, freteBRL, seguroBRL, mercadoriaBRL,
    valorAduaneiro, imposto, impostosTotal, creditoTotal, despesasLista, despesasTotal,
    custoSemCredito: valorAduaneiro + impostosTotal + despesasTotal, custoComCredito: valorAduaneiro + impostosTotal + despesasTotal - creditoTotal,
    linhas, totais, avisos };
}

// Campos que mudam a estrutura da janela (redesenha) — o resto só guarda o valor.
const PROC_REDESENHA = /^(transporte\.(modal|tipoCarga)|desembaraco\.(liNecessaria|tipoDeclaracao)|financeiro\.(freteMoeda|seguroMoeda)|produto\.fornecedores\.\d+\.moeda|status)$/;
function onProcessoInput(el, evento){
  const path = el.getAttribute('data-proc');
  if(!path || !state.procDraft) return false;
  const valor = el.type==='checkbox' ? el.checked : el.value;
  setPath(state.procDraft, path, valor);
  // Autopreenchimento a partir dos cadastros
  const campoEmpresa = Object.entries(PROC_EMPRESA_CAMPOS).find(([,c])=>c.path===path);
  if(campoEmpresa){
    if(evento==='input'){
      if(String(valor).trim().length>=3) showAutocomplete(el, campoEmpresa[0], null); else hideAutocomplete();
    }else validarEmpresaProcesso(campoEmpresa[0], true);
    saveDraftProcesso();
    return true;
  }
  const mItem = /^produto\.fornecedores\.(\d+)\.itens\.(\d+)\.produto$/.exec(path);
  if(evento==='change' && mItem){
    const fo = state.procDraft.produto.fornecedores[+mItem[1]];
    const prod = state.produtos.find(x=>x.nome===valor), it = fo && fo.itens[+mItem[2]];
    if(prod && it){
      it.ncm = it.ncm || prod.ncm || ''; it.unidade = it.unidade || prod.unidadeMedida || '';
      it.descricao = it.descricao || prod.descricao || ''; it.pesoLiquido = it.pesoLiquido || prod.pesoLiquido || '';
      renderApp();
    }
  }
  const mForn = /^produto\.fornecedores\.(\d+)\.fornecedor$/.exec(path);
  if(evento==='change' && mForn){
    const fo = state.procDraft.produto.fornecedores[+mForn[1]];
    const f = (state.clientes||[]).find(x=>nomeCadastro(x)===valor);
    const pais = f && f.enderecos && f.enderecos[0] && f.enderecos[0].pais;
    if(fo && pais && pais!=='Brasil' && !fo.paisOrigem){ fo.paisOrigem = pais; renderApp(); }
  }
  if(evento==='change' && PROC_REDESENHA.test(path)) renderApp();
  else atualizarTotaisProcesso();
  saveDraftProcesso();
  return true;
}

function novoNumeroProcesso(){ return (state.processosIndex||[]).reduce((m,p)=>Math.max(m, p.seq||0), 0) + 1; }

async function salvarProcesso(){
  const p = state.procDraft;
  sincronizarContainersProc(p);
  if(!p.cliente.dataAbertura){ renderApp(); return toast('Informe a data de abertura do processo.'); }
  const invalidos = Object.keys(PROC_EMPRESA_CAMPOS).filter(t=>!validarEmpresaProcesso(t, false));
  if(invalidos.length){
    renderApp();
    toast('Apagado por não ser empresa cadastrada: ' + invalidos.map(t=>PROC_EMPRESA_CAMPOS[t].label).join(', ') + '. Escolha na lista e salve de novo.');
    return;
  }
  if(!p.cliente.nome.trim()){ state.procTab = 'cliente'; renderApp(); return toast('Informe o cliente do processo (empresa cadastrada como Cliente).'); }
  const agora = new Date().toISOString();
  const copia = JSON.parse(JSON.stringify(p));
  if(state.currentProcessoId){
    const i = state.processosIndex.findIndex(x=>x.id===state.currentProcessoId);
    if(i<0){ toast('Este processo foi excluído por outra pessoa. Ele será salvo como novo.'); state.currentProcessoId = null; return salvarProcesso(); }
    copia.id = state.currentProcessoId; copia.seq = state.processosIndex[i].seq; copia.criadoEm = state.processosIndex[i].criadoEm;
    copia.atualizadoEm = agora; copia.atualizadoPor = usuarioAtual.nome || usuarioAtual.email;
    state.processosIndex[i] = copia;
  }else{
    const seq = novoNumeroProcesso();
    copia.id = 'PRC-' + String(seq).padStart(4,'0'); copia.seq = seq;
    copia.criadoEm = agora; copia.atualizadoEm = agora; copia.criadoPor = usuarioAtual.nome || usuarioAtual.email;
    state.processosIndex.push(copia);
    state.currentProcessoId = copia.id;
  }
  const ok = await persistProcessosIndex();
  if(!ok) return;
  // O número pode ter mudado na mescla (outra pessoa salvou o mesmo número ao mesmo tempo).
  const salvo = state.processosIndex.find(x=>x.id===state.currentProcessoId);
  if(salvo){ state.procDraft = normalizarProcesso(JSON.parse(JSON.stringify(salvo))); }
  saveDraftProcesso();
  toast('Processo ' + state.currentProcessoId + ' salvo.', 'ok');
  renderApp();
}
async function persistProcessosIndex(){ return storeSet('processos:index', state.processosIndex); }

function abrirProcesso(id){
  const p = (state.processosIndex||[]).find(x=>x.id===id);
  if(!p) return toast('Processo não encontrado.');
  state.procDraft = normalizarProcesso(JSON.parse(JSON.stringify(p)));
  state.currentProcessoId = id;
  state.procTab = 'cliente';
  saveDraftProcesso();
  navigate('processoForm');
}
async function duplicarProcesso(id){
  const origem = (state.processosIndex||[]).find(x=>x.id===id);
  if(!origem) return;
  const p = normalizarProcesso(JSON.parse(JSON.stringify(origem)));
  const agora = new Date().toISOString(), seq = novoNumeroProcesso();
  p.id = 'PRC-' + String(seq).padStart(4,'0'); p.seq = seq; p.status = 'aberto';
  p.criadoEm = agora; p.atualizadoEm = agora; p.criadoPor = usuarioAtual.nome || usuarioAtual.email; delete p.atualizadoPor;
  p.cliente.dataAbertura = hojeISO();
  Object.assign(p.transporte, { booking:'', conhecimentoMaster:'', conhecimentoHouse:'', navioVoo:'', etd:'', eta:'', chegada:'' });
  Object.assign(p.desembaraco, { numeroDeclaracao:'', dataRegistro:'', canal:'', dataDesembaraco:'', numeroLi:'' });
  p.financeiro.contratoCambio = '';
  p.financeiro.parcelas = (p.financeiro.parcelas||[]).map(x=>({ ...x, id:uid(), vencimento:'', pago:false }));
  state.processosIndex.push(p);
  if(!(await persistProcessosIndex())) return;
  const salvo = state.processosIndex.find(x=>x.criadoEm===agora && x.seq>=seq) || p;
  toast(`${id} duplicado como ${salvo.id}.`, 'ok');
  renderApp();
}
async function excluirProcesso(id){
  if(state.pendingDelete !== 'proc:'+id){ state.pendingDelete = 'proc:'+id; renderApp(); return; }
  state.pendingDelete = null;
  state.processosIndex = state.processosIndex.filter(x=>x.id!==id);
  if(state.currentProcessoId===id){ state.currentProcessoId = null; state.procDraft = null; storeDelete('processo:draft'); }
  await persistProcessosIndex();
  toast('Processo ' + id + ' excluído.', 'ok');
  renderApp();
}

function acaoProcesso(cmd, a1, a2){
  const p = state.procDraft;
  switch(cmd){
    case 'proc-novo':
      state.procDraft = novoProcesso(); state.currentProcessoId = null; state.procTab = 'cliente';
      saveDraftProcesso(); navigate('processoForm'); return true;
    case 'proc-abrir': abrirProcesso(a1); return true;
    case 'proc-excluir': excluirProcesso(a1); return true;
    case 'proc-duplicar': duplicarProcesso(a1); return true;
    case 'proc-aba': state.procTab = a1; saveDraftProcesso(); renderApp(); window.scrollTo({ top:0, behavior:'instant' }); return true;
    case 'proc-cancelar': navigate('processos'); return true;
    case 'proc-salvar': salvarProcesso(); return true;
    case 'proc-numerario-pdf': baixarNumerarioProcessoPdf(); return true;
    case 'proc-add-fornecedor': {
      const primeiro = p.produto.fornecedores[0] || {};
      p.produto.fornecedores.push(novoFornecedorProcesso({ moeda: primeiro.moeda || 'USD', incoterm: primeiro.incoterm || 'FOB' }));
      saveDraftProcesso(); renderApp();
      const cards = document.querySelectorAll('.proc-fornecedor'); if(cards.length) cards[cards.length-1].scrollIntoView({ behavior:'smooth', block:'start' });
      return true;
    }
    case 'proc-rm-fornecedor': {
      const fo = p.produto.fornecedores.find(x=>x.id===a1);
      if(!fo || p.produto.fornecedores.length<2) return true;
      const temDados = fo.fornecedor || fo.itens.some(i=>i.produto || i.quantidade || i.valorUnit);
      if(temDados && !requestDelete('forn', a1)) return true;
      p.produto.fornecedores = p.produto.fornecedores.filter(x=>x.id!==a1); saveDraftProcesso(); renderApp(); return true;
    }
    case 'proc-add-item': { const fo = p.produto.fornecedores.find(x=>x.id===a1) || p.produto.fornecedores[0]; fo.itens.push(novoItemProcesso()); saveDraftProcesso(); renderApp(); return true; }
    case 'proc-rm-item': { const fo = p.produto.fornecedores.find(x=>x.id===a1); if(fo) fo.itens = fo.itens.filter(x=>x.id!==a2); saveDraftProcesso(); renderApp(); return true; }
    case 'proc-add-container': {
      const cs = p.transporte.containers, ult = cs[cs.length-1];
      cs.push(novoContainerProcesso({ tipo: ult ? ult.tipo : "40' HC" }));
      sincronizarContainersProc(p); saveDraftProcesso(); renderApp();
      const ls = document.querySelectorAll('.proc-containers tbody tr'); if(ls.length){ const inp = ls[ls.length-1].querySelector('input'); if(inp) inp.focus(); }
      return true;
    }
    case 'proc-rm-container': {
      const cs = p.transporte.containers, c = cs.find(x=>x.id===a1);
      if(!c || cs.length<2) return true;
      const temDados = c.numero || c.pesoBruto || c.pesoLiquido || c.cubagem || c.lacres;
      if(temDados && !requestDelete('cont', a1)) return true;
      p.transporte.containers = cs.filter(x=>x.id!==a1); sincronizarContainersProc(p); saveDraftProcesso(); renderApp(); return true;
    }
    case 'proc-add-parcela': p.financeiro.parcelas.push({ ...novaParcelaProcesso(), moeda: moedaPrincipalProc(p) }); saveDraftProcesso(); renderApp(); return true;
    case 'proc-rm-parcela': p.financeiro.parcelas = p.financeiro.parcelas.filter(x=>x.id!==a1); saveDraftProcesso(); renderApp(); return true;
  }
  return false;
}
// Somente leitura: sem permissão para salvar, os campos do formulário ficam bloqueados.
function aplicarLeituraProcesso(){
  const form = document.getElementById('proc-form');
  if(!form || !form.classList.contains('proc-leitura')) return;
  form.querySelectorAll('input, select, textarea').forEach(el=>{ el.disabled = true; });

}

async function salvarPreferencias(area, alteracao, atuais, mensagem){
  const nova = { ...((usuarioAtual.preferencias)||{}), [area]: { ...atuais, ...alteracao } };
  usuarioAtual.preferencias = nova;
  const { error } = await sb.from('perfis').update({ preferencias: nova }).eq('user_id', usuarioAtual.id);
  if(error){
    console.error(error);
    try{ localStorage.setItem(chaveLocal('preferencias'), JSON.stringify(nova)); }catch(e){}
    if(mensagem) toast('Salvo só neste navegador: não foi possível salvar no seu perfil.');
    return;
  }
  try{ localStorage.removeItem(chaveLocal('preferencias')); }catch(e){}
  if(mensagem) toast(mensagem, 'ok');
}
const salvarPrefsCotacoes = (alteracao, mensagem) => salvarPreferencias('cotacoes', alteracao, prefsCotacoes(), mensagem);

}

function idsDoGrupoCotacao(janela, aba){
  if(aba==='filtros') return catalogoFiltrosCot().filter(f=>f.janela===janela).map(f=>f.id);
  return COT_CAMPOS.filter(c=>c.janela===janela && !(aba==='card' && (c.id==='tipo' || c.id==='status'))).map(c=>c.id);
}
function ordenarSelecaoCot(aba, conjunto){
  const ordem = aba==='filtros' ? catalogoFiltrosCot().map(f=>f.id) : COT_CAMPOS.map(c=>c.id);
  return ordem.filter(id=>conjunto.has(id));
}
function acaoTemplateCotacoes(cmd, a1, a2){
  const aba = state.cotTemplateAba || 'card';
  switch(cmd){
    case 'cot-template': state.cotTemplateAberto = !state.cotTemplateAberto; state.cotTemplateSel = null; renderApp(); return true;
    case 'cot-tpl-aba': state.cotTemplateAba = a1; renderApp(); return true;
    case 'cot-tpl-grupo': {
      const atual = new Set(state.cotTemplateSel[aba]);
      idsDoGrupoCotacao(a1, aba).forEach(id=> a2==='1' ? atual.add(id) : atual.delete(id));
      state.cotTemplateSel[aba] = ordenarSelecaoCot(aba, atual); renderApp(); return true;
    }
    case 'cot-tpl-padrao': state.cotTemplateSel[aba] = [...COT_TEMPLATE_PADRAO[aba]]; renderApp(); return true;
    case 'cot-tpl-salvar': {
      const escolhidos = state.cotTemplateSel[aba];
      if(aba!=='filtros' && !escolhidos.length){ toast('Selecione pelo menos uma informação.'); return true; }
      const alteracao = { [aba]: [...escolhidos] };
      if(aba==='card') alteracao.modo = 'cards';
      if(aba==='lista') alteracao.modo = 'lista';
      if(aba==='filtros'){
        limparFiltrosOcultosTpl('cot', escolhidos);
      }
      const msg = { card:'Template do card salvo.', lista:'Template da lista salvo.', filtros:'Filtros da tela salvos.' }[aba];
      salvarPrefsCotacoes(alteracao, msg).then(()=>{
        if(alteracao.modo) state.cotacoesViewMode = alteracao.modo;
        state.cotTemplateAberto = false; state.cotTemplateSel = null; renderApp();
      });
      return true;
    }
  }
  return false;
}
function onCotTemplateCampo(el){
  const id = el.getAttribute('data-cot-tpl'); if(!id || !state.cotTemplateSel) return false;
  const aba = state.cotTemplateAba || 'card';
  const atual = new Set(state.cotTemplateSel[aba]);
  el.checked ? atual.add(id) : atual.delete(id);
  state.cotTemplateSel[aba] = ordenarSelecaoCot(aba, atual);
  renderApp();
  return true;
}

// Monta os objetos dos campos (e o filtro "busca" geral) de cada cadastro
for(const t of Object.values(CAD_TEMPLATE)){
  t.campos = t.campos.map(([janela, id, label, valores, extra])=>({ janela, id, label, valores, ...(extra||{}) }));
  t.mapa = Object.fromEntries(t.campos.map(c=>[c.id, c]));
  t.filtros = [{ id:'busca', label:'Busca em qualquer campo', janela:'Geral' }, ...t.campos];
  t.mapaFiltros = Object.fromEntries(t.filtros.map(f=>[f.id, f]));
}
const tipoFiltroCad = c => c.id==='busca' ? 'texto' : c.periodo ? 'periodo' : c.faixa ? 'faixa' : (c.opcao||c.opcaoDinamica) ? 'opcao' : 'texto';

function prefsCadastro(tipo){
  const t = CAD_TEMPLATE[tipo];
  const p = ((usuarioAtual && usuarioAtual.preferencias) || {})['cad_'+tipo] || {};
  const valido = (arr, mapa) => Array.isArray(arr) ? arr.filter(id=>mapa[id]) : null;
  return { modo: p.modo==='card' ? 'card' : 'lista', lista: valido(p.lista, t.mapa) || t.padrao.lista,
           card: valido(p.card, t.mapa) || t.padrao.card, filtros: valido(p.filtros, t.mapaFiltros) || t.padrao.filtros };
}
const salvarPrefsCadastro = (tipo, alteracao, mensagem) => salvarPreferencias('cad_'+tipo, alteracao, prefsCadastro(tipo), mensagem);

function textoCampoCad(c, item){
  let vals;
  try{ vals = juntar(c.valores(item)); }catch(e){ vals = []; }
  if(c.rotulo) vals = vals.map(v=>c.rotulo(v)||v);
  if(c.moeda) vals = vals.map(v=>isFinite(num(v)) && v!=='' ? fmtBRL(num(v)) : v);
  if(c.periodo) vals = vals.map(v=>fmtDateOnly(v));
  return vals.join(', ');
}
function valorCampoCadHtml(c, item){
  const v = textoCampoCad(c, item);
  if(!v) return '<span class="vazio">—</span>';
  if(c.id==='status') return item.status==='INATIVO' ? '<span class="badge badge-red">Inativo</span>' : '<span class="badge badge-green">Ativo</span>';
  if(c.id==='tipoCadastro') return `<span class="badge badge-navy">${esc(v)}</span>`;
  return esc(v);
}

// ---- Filtros ----
function filtroCadAtivo(tipo, f){
  const v = (state.cadFiltrosTpl||{})[tipo] || {};
  const k = tipoFiltroCad(f);
  return (k==='periodo' || k==='faixa') ? !!(v[f.id+':de'] || v[f.id+':ate']) : !!v[f.id];
}
function filtrarCadastroTpl(tipo){
  const t = CAD_TEMPLATE[tipo];
  const lista = state[CAD_CONFIG[tipo].stateKey] || [];
  const visiveis = prefsCadastro(tipo).filtros.map(id=>t.mapaFiltros[id]).filter(f=>filtroCadAtivo(tipo, f));
  const v = (state.cadFiltrosTpl||{})[tipo] || {};
  return lista.filter(item=>visiveis.every(f=>{
    const k = tipoFiltroCad(f);
    if(f.id==='busca'){
      const q = String(v.busca).toLowerCase();
      return t.campos.some(c=>textoCampoCad(c, item).toLowerCase().includes(q));
    }
    let vals; try{ vals = juntar(f.valores(item)); }catch(e){ vals = []; }
    if(k==='opcao') return vals.includes(v[f.id]);
    if(k==='periodo') return vals.some(d=>(!v[f.id+':de'] || d>=v[f.id+':de']) && (!v[f.id+':ate'] || d<=v[f.id+':ate']));
    if(k==='faixa') return vals.some(x=>{ const n = num(x); if(!isFinite(n) || x==='') return false;
      return (v[f.id+':de']==='' || v[f.id+':de']==null || n>=num(v[f.id+':de'])) && (v[f.id+':ate']==='' || v[f.id+':ate']==null || n<=num(v[f.id+':ate'])); });
    const q = String(v[f.id]).toLowerCase();
    return vals.some(x=>x.toLowerCase().includes(q) || (f.rotulo && String(f.rotulo(x)||'').toLowerCase().includes(q)));
  }));
}
function opcoesFiltroCad(tipo, f){
  if(f.opcao) return f.opcao();
  const lista = state[CAD_CONFIG[tipo].stateKey] || [];
  return juntar(lista.flatMap(item=>{ try{ return f.valores(item); }catch(e){ return []; } })).sort((a,b)=>a.localeCompare(b,'pt-BR')).map(x=>[x,x]);
}
function filtroCadHtml(tipo, f){
  const v = (state.cadFiltrosTpl||{})[tipo] || {};
  const k = tipoFiltroCad(f);
  const attr = sufixo => `data-cad-filtro="${tipo}|${f.id}${sufixo||''}"`;
  if(k==='periodo' || k==='faixa'){
    const tp = k==='periodo' ? 'date' : 'number';
    return `<div class="field filtro-periodo"><label>${esc(f.label)}</label><div class="periodo">
      <input type="${tp}" ${k==='faixa'?'step="any" placeholder="de"':''} ${attr(':de')} value="${esc(v[f.id+':de']||'')}">
      <span>até</span>
      <input type="${tp}" ${k==='faixa'?'step="any" placeholder="até"':''} ${attr(':ate')} value="${esc(v[f.id+':ate']||'')}"></div></div>`;
  }
  if(k==='opcao'){
    return `<div class="field"><label>${esc(f.label)}</label><select ${attr()}>
      <option value="">Todos</option>${opcoesFiltroCad(tipo, f).map(([o,t])=>`<option value="${esc(o)}" ${v[f.id]===o?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
  }
  return `<div class="field" ${f.id==='busca'?'style="min-width:220px;"':''}><label>${esc(f.label)}</label>
    <input ${attr()} value="${esc(v[f.id]||'')}" placeholder="${f.id==='busca' ? 'Buscar…' : ''}" autocomplete="off"></div>`;
}
function onFiltroCadastro(el, evento){
  const chave = el.getAttribute('data-cad-filtro'); if(!chave) return false;
  const texto = el.tagName==='INPUT' && el.type==='text' || (el.tagName==='INPUT' && !el.type);
  const imediato = el.tagName==='INPUT' && (el.type==='text' || el.type==='number' || !el.type);
  if(imediato ? evento!=='input' : evento!=='change') return true;
  const [tipo, id] = chave.split('|');
  if(!state.cadFiltrosTpl) state.cadFiltrosTpl = {};
  if(!state.cadFiltrosTpl[tipo]) state.cadFiltrosTpl[tipo] = {};
  state.cadFiltrosTpl[tipo][id] = el.value;
  let pos = null; try{ pos = el.selectionStart; }catch(e){}
  renderApp();
  if(imediato){ const novo = document.querySelector(`[data-cad-filtro="${chave}"]`); if(novo){ novo.focus(); try{ if(texto) novo.setSelectionRange(pos, pos); }catch(e){} } }
  return true;
}

  const lista = aba==='filtros' ? t.filtros : t.campos;
  const janelas = aba==='filtros' ? ['Geral', ...t.janelas] : t.janelas;
  const grupos = janelas.map(janela=>{
    const campos = lista.filter(c=>c.janela===janela);

    return `<div class="tpl-grupo">

        <button class="btn btn-primary" data-action="cadtpl-salvar">${ICONS.check} Salvar ${({ card:'card', lista:'lista', filtros:'filtros' })[aba]}</button>
      </div>
    </div>
  </div>`;
}
function ordemCadTpl(tipo, aba){ const t = CAD_TEMPLATE[tipo]; return (aba==='filtros' ? t.filtros : t.campos).map(c=>c.id); }
function acaoTemplateCadastro(cmd, a1, a2){
  const tipo = state.cadTemplateAberto, aba = state.cadTemplateAba || 'card';
  switch(cmd){
    case 'cadtpl-modo': salvarPrefsCadastro(a1, { modo:a2 }); renderApp(); return true;
    case 'cadtpl-abrir':
      state.cadTemplateAberto = state.cadTemplateAberto===a1 ? null : a1; state.cadTemplateSel = null; renderApp(); return true;
    case 'cadtpl-aba': state.cadTemplateAba = a1; renderApp(); return true;
    case 'cadtpl-limpar': if(state.cadFiltrosTpl) state.cadFiltrosTpl[a1] = {}; renderApp(); return true;
    case 'cadtpl-grupo': {
      const lista = aba==='filtros' ? CAD_TEMPLATE[tipo].filtros : CAD_TEMPLATE[tipo].campos;
      const atual = new Set(state.cadTemplateSel[aba]);
      lista.filter(c=>c.janela===a1).forEach(c=> a2==='1' ? atual.add(c.id) : atual.delete(c.id));
      state.cadTemplateSel[aba] = ordemCadTpl(tipo, aba).filter(id=>atual.has(id)); renderApp(); return true;
    }
    case 'cadtpl-padrao': state.cadTemplateSel[aba] = [...CAD_TEMPLATE[tipo].padrao[aba]]; renderApp(); return true;
    case 'cadtpl-salvar': {
      const escolhidos = state.cadTemplateSel[aba];
      if(aba!=='filtros' && !escolhidos.length){ toast('Selecione pelo menos uma informação.'); return true; }
      const alteracao = { [aba]: [...escolhidos] };
      if(aba!=='filtros') alteracao.modo = aba;
      else{
        const visiveis = new Set(escolhidos), v = (state.cadFiltrosTpl||{})[tipo] || {};
        for(const chave of Object.keys(v)) if(!visiveis.has(chave.split(':')[0])) delete v[chave];
      }
      salvarPrefsCadastro(tipo, alteracao, ({ card:'Template do card salvo.', lista:'Template da lista salvo.', filtros:'Filtros da tela salvos.' })[aba])
        .then(()=>{ state.cadTemplateAberto = null; state.cadTemplateSel = null; renderApp(); });
      return true;
    }
  }
  return false;
}
function onCadTemplateCampo(el){
  const id = el.getAttribute('data-cadtpl-campo'); if(!id || !state.cadTemplateSel) return false;
  const tipo = state.cadTemplateAberto, aba = state.cadTemplateAba || 'card';
  const atual = new Set(state.cadTemplateSel[aba]);
  el.checked ? atual.add(id) : atual.delete(id);
  state.cadTemplateSel[aba] = ordemCadTpl(tipo, aba).filter(x=>atual.has(x));
  renderApp();
  return true;
}

// Texto simples (sem HTML) de um valor
const textoPlano = v => String(v ?? '').replace(/\s+/g, ' ').trim();

// Resumo dos filtros aplicados (vai no PDF e na planilha)
function resumoFiltrosTpl(escopo, ignorar){
  const mapa = mapaFiltrosTpl(escopo), v = filtrosAplicados(escopo);
  return FILTROS_TPL[escopo].prefs().filtros.map(id=>mapa[id]).filter(f=>f && !(ignorar||[]).includes(f.id) && filtroTplAtivo(v, f)).map(f=>{
    if(f.tipo==='periodo' || f.tipo==='faixa'){
      const fmt = x => f.tipo==='periodo' ? fmtDateOnly(x) : x;
      const de = v[f.id+':de'], ate = v[f.id+':ate'];
      return `${f.label}: ${de && ate ? fmt(de)+' a '+fmt(ate) : de ? 'a partir de '+fmt(de) : 'até '+fmt(ate)}`;
    }
    if(f.tipo==='opcao'){ const op = opcoesFiltroTpl(escopo, f).find(([k])=>k===v[f.id]); return `${f.label}: ${op ? op[1] : v[f.id]}`; }
    return `${f.label}: "${v[f.id]}"`;
  });
}
function resumoFiltrosCad(tipo){
  const t = CAD_TEMPLATE[tipo], v = (state.cadFiltrosTpl||{})[tipo] || {};
  return prefsCadastro(tipo).filtros.map(id=>t.mapaFiltros[id]).filter(f=>f && filtroCadAtivo(tipo, f)).map(f=>{
    const k = tipoFiltroCad(f);
    if(k==='periodo' || k==='faixa'){
      const fmt = x => k==='periodo' ? fmtDateOnly(x) : x, de = v[f.id+':de'], ate = v[f.id+':ate'];
      return `${f.label}: ${de && ate ? fmt(de)+' a '+fmt(ate) : de ? 'a partir de '+fmt(de) : 'até '+fmt(ate)}`;
    }
    if(k==='opcao'){ const op = opcoesFiltroCad(tipo, f).find(([o])=>o===v[f.id]); return `${f.label}: ${op ? op[1] : v[f.id]}`; }
    return `${f.label}: "${v[f.id]}"`;
  });
}

// Monta { titulo, arquivo, colunas, linhas, filtros } de cada tela
function dadosExportacao(tela){
  if(tela==='cot'){
    const prefs = prefsCotacoes(), cards = state.cotacoesViewMode==='cards';
    const ids = cards ? ['tipo', 'status', ...prefs.card.filter(id=>id!=='tipo' && id!=='status')] : prefs.lista;
    const campos = ids.map(id=>COT_CAMPO[id]).filter(Boolean);
    const itens = cotacoesTodasFiltradas(cards);
    return { titulo:'Cotações Salvas', arquivo:'cotacoes-salvas',
      colunas: ['Nº', ...campos.map(c=>c.label)],
      linhas: itens.map(({tipo, cot})=>[cot.id, ...campos.map(c=>{ try{ return textoPlano(c.valor(tipo, cot)); }catch(e){ return ''; } })]),
      filtros: resumoFiltrosTpl('cot', cards ? ['status'] : []) };
  }
  if(tela==='proc'){
    const prefs = prefsProcessos(), cards = prefs.modo==='card';
    const ids = cards ? ['status', ...prefs.card.filter(id=>id!=='id' && id!=='status')] : prefs.lista.filter(id=>id!=='id');
    const campos = ids.map(id=>PROC_CAMPO[id]).filter(Boolean);
    const itens = aplicarFiltrosTpl('proc', [...(state.processosIndex||[])].sort((a,b)=>(b.seq||0)-(a.seq||0)), cards ? ['status'] : []);
    return { titulo:'Processos', arquivo:'processos',
      colunas: ['Nº', ...campos.map(c=>c.label)],
      linhas: itens.map(p=>[p.id, ...campos.map(c=>{ try{ return textoPlano(c.valor(p)); }catch(e){ return ''; } })]),
      filtros: resumoFiltrosTpl('proc', cards ? ['status'] : []) };
  }
  const tipo = tela==='cad-produto' ? 'produto' : 'cliente';
  const t = CAD_TEMPLATE[tipo], prefs = prefsCadastro(tipo), cards = prefs.modo==='card';
  let ids = cards ? prefs.card : prefs.lista;
  if(tipo==='cliente' && cards) ids = ['tipoCadastro', 'status', ...ids.filter(id=>id!=='tipoCadastro' && id!=='status')];
  ids = ids.filter(id=>!(tipo==='produto' && id==='nome') && !(tipo==='cliente' && id==='nomeFantasia'));
  const campos = ids.map(id=>t.mapa[id]).filter(Boolean);
  return { titulo: tipo==='produto' ? 'Produtos' : 'Clientes e Empresas', arquivo: tipo==='produto' ? 'produtos' : 'clientes-e-empresas',
    colunas: [tipo==='produto' ? 'Produto' : 'Nome', ...campos.map(c=>c.label)],
    linhas: filtrarCadastroTpl(tipo).map(item=>[textoPlano(t.nome(item)), ...campos.map(c=>textoPlano(textoCampoCad(c, item)))]),
    filtros: resumoFiltrosCad(tipo) };
}

let _xlsxCarregando = null;
function carregarXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(!_xlsxCarregando) _xlsxCarregando = new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ()=>res(window.XLSX);
    s.onerror = ()=>{ _xlsxCarregando = null; rej(new Error('Não foi possível carregar o gerador de Excel. Verifique sua conexão.')); };
    document.head.appendChild(s);
  });
  return _xlsxCarregando;
}
// Números em formato brasileiro ("R$ 1.234,56", "1,8", "12") viram número na planilha
function celulaExcel(v){
  const s = String(v||'').trim();
  // só milhar com grupos de 3 dígitos: NCM "8467.21.00", CNPJ e datas continuam como texto
  if(/^(R\$|US\$|€|£|¥)?\s?-?(\d{1,3}(\.\d{3})+|\d+)(,\d+)?$/.test(s)){
    const n = Number(s.replace(/^[^\d-]+/, '').replace(/\./g, '').replace(',', '.'));
    if(isFinite(n) && !/^0\d/.test(s.replace(/^[^\d]+/, ''))) return n;
  }
  return s;
}

async function exportarTela(tela, formato){
  const d = dadosExportacao(tela);
  if(!d.linhas.length){ toast('Nada para exportar: nenhum registro na tela com os filtros atuais.'); return; }
  const hoje = new Date().toISOString().slice(0,10);
  const nome = `comexta-${d.arquivo}-${hoje}.${formato}`;
  const empresa = nomeEmpresa();
  try{
    if(formato==='xlsx'){
      const XLSX = await carregarXLSX();
      const topo = [[`${d.titulo} — ${empresa}`], [`Gerado em ${fmtDate(new Date().toISOString())} por ${usuarioAtual.nome || usuarioAtual.email}`],
        [d.filtros.length ? 'Filtros: ' + d.filtros.join(' · ') : 'Sem filtros'], []];
      const aoa = [...topo, d.colunas, ...d.linhas.map(l=>l.map(celulaExcel))];
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = d.colunas.map((c, i)=>({ wch: Math.min(48, Math.max(10, c.length + 2, ...d.linhas.slice(0, 200).map(l=>String(l[i]||'').length + 2))) }));
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s:{ r:topo.length, c:0 }, e:{ r:topo.length + d.linhas.length, c:d.colunas.length-1 } }) };
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, d.titulo.slice(0, 31));
      const bin = XLSX.write(wb, { bookType:'xlsx', type:'array' });
      await saveArtifactFile(nome, new Blob([bin], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      return;
    }
    if(typeof window.jspdf==='undefined' || !window.jspdf.jsPDF){ toast('Não foi possível carregar o gerador de PDF. Recarregue a página.'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'landscape', unit:'pt', format:'a4' });
    prepararFundoPdf(doc);
    pdfHeader(doc, d.titulo, `${empresa} · ${d.linhas.length} registro${d.linhas.length===1?'':'s'}`, fmtDate(new Date().toISOString()));
    let y = 74;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(75,90,104);
    const filtrosTxt = doc.splitTextToSize((d.filtros.length ? 'Filtros: ' + d.filtros.join(' · ') : 'Sem filtros aplicados').replace(/→/g, '->'), doc.internal.pageSize.getWidth() - 56);
    doc.text(filtrosTxt, 28, y); y += filtrosTxt.length * 11 + 6;
    const fonte = d.colunas.length > 12 ? 6 : d.colunas.length > 8 ? 7 : 8;
    // as fontes padrão do PDF não têm a seta "→" (sairia "!’")
    const semSeta = x => String(x ?? '').replace(/→/g, '->');
    doc.autoTable({ startY:y, head:[d.colunas.map(semSeta)], body:d.linhas.map(l=>l.map(semSeta)), theme:'grid', margin:{ left:28, right:28 },
      styles:{ fontSize:fonte, cellPadding:3, overflow:'linebreak', valign:'top' },
      headStyles:{ fillColor:corCabecalhoPdf(), textColor:corTextoCabecalhoPdf(), fontSize:fonte },
      didDrawPage:(info)=>{ doc.setFontSize(7.5); doc.setTextColor(120,130,140);
        doc.text(`Página ${info.pageNumber}`, doc.internal.pageSize.getWidth() - 28, doc.internal.pageSize.getHeight() - 14, { align:'right' }); } });
    await downloadPdfBlob(doc, nome);
  }catch(err){
    console.error('Falha ao exportar:', err);
    toast(err && err.message ? err.message : 'Não foi possível gerar o arquivo.');
  }
}

// Preenche campos que possam faltar em rascunhos/cotações salvos antes de alguma atualização
// (ex: "anexos" foi adicionado depois — sem isso, dados antigos ficariam com anexos undefined).
function normalizeDados(d){
  const base = dadosPadrao();
  const merged = Object.assign({}, base, d||{});
  if(!Array.isArray(merged.produtos) || merged.produtos.length===0) merged.produtos = [novoProduto()];
  if(!Array.isArray(merged.despExtra) || merged.despExtra.length<4){
    const src = (d && Array.isArray(d.despExtra)) ? d.despExtra : [];
    merged.despExtra = [0,1,2,3].map(i=> src[i]!==undefined ? src[i] : '');
  }
  if(!Array.isArray(merged.anexos)) merged.anexos = [];
  // Compatibilidade com cotações salvas antes da correção do bug de dupla conversão:
  // se vier > 1, é o formato antigo (percentual cru, ex: 60) — converte para fração (0.60).
  if(num(merged.ii) > 1) merged.ii = num(merged.ii)/100;
  if(num(merged.icms) > 1) merged.icms = num(merged.icms)/100;
  return merged;
}

   invoice nem a lista extensa de taxas de origem/destino nomeadas da planilha
   original — usa um câmbio por seção, no mesmo padrão da Importação Simplificada. */
function novoProdutoFormal(){
  return {id:uid(), fornecedor:'', produto:'', ncm:'', quantidade:'', valorUnit:'', pesoLiquido:'', cambio:'',
    ii:'', ipi:'', pis:'', cofins:'', icms:''};
}
function novaDespesaLinha(descricao='', moeda='R$'){ return {id:uid(), descricao, tarifa:'', moeda, tipoCalculo:'', quantidade:''}; }
function calcDespesaLinha(linha, cambio){
  const tarifa = num(linha.tarifa), qtd = num(linha.quantidade);
  const taxaAplicada = linha.moeda && linha.moeda!=='R$' ? cambio : 1;
  const tarifaReal = tarifa*taxaAplicada;
  const total = tarifaReal*qtd;
  return {...linha, tarifaReal, total};
}

function normalizeDadosFormal(d){

  const merged = Object.assign({}, base, d||{});
  if(!Array.isArray(merged.produtos) || merged.produtos.length===0) merged.produtos = [novoProdutoFormal()];
  merged.produtos = merged.produtos.map(p=>{
    const prod = Object.assign({}, novoProdutoFormal(), p);
    // Compatibilidade com cotações salvas antes da correção do bug de dupla conversão:
    // se vier > 1, é o formato antigo (percentual cru, ex: 18) — converte para fração (0.18).
    ['ii','ipi','pis','cofins','icms'].forEach(k=>{ if(num(prod[k]) > 1) prod[k] = num(prod[k])/100; });
    return prod;
  });
  ['freteLinhas','taxasOrigem','taxasDestino','armazenagemLinhas','outrasDespesasLinhas'].forEach(k=>{
    if(!Array.isArray(merged[k]) || merged[k].length===0) merged[k] = base[k];
  });
  if(!Array.isArray(merged.anexos)) merged.anexos = [];
  return merged;
}
function computeDadosFormal(d){
  const produtos = d.produtos.map(p=>{
    const qty = num(p.quantidade), vu = num(p.valorUnit), peso = num(p.pesoLiquido), cambio = num(p.cambio);
    const totalUSD = qty*vu;
    const totalBRL = totalUSD*cambio;
    return {...p, qty, vu, peso, cambio, totalUSD, totalBRL};
  });
  const sumQty = sum(produtos.map(p=>p.qty));
  const sumPeso = sum(produtos.map(p=>p.peso));
  const sumTotalUSD = sum(produtos.map(p=>p.totalUSD));
  const sumTotalBRL = sum(produtos.map(p=>p.totalBRL));

  const freteCambio = num(d.freteCambio);
  const freteLinhasCalc = d.freteLinhas.map(l=>calcDespesaLinha(l,freteCambio));
  const taxasOrigemCalc = d.taxasOrigem.map(l=>calcDespesaLinha(l,freteCambio));
  const taxasDestinoCalc = d.taxasDestino.map(l=>calcDespesaLinha(l,freteCambio));
  const freteTotalBRL = sum(freteLinhasCalc.map(l=>l.total))+sum(taxasOrigemCalc.map(l=>l.total))+sum(taxasDestinoCalc.map(l=>l.total));

  const armazenagemCambio = num(d.armazenagemCambio);
  const armazenagemLinhasCalc = d.armazenagemLinhas.map(l=>calcDespesaLinha(l,armazenagemCambio));
  const armazenagemTotal = sum(armazenagemLinhasCalc.map(l=>l.total));

  const outrasCambio = num(d.outrasDespesasCambio);
  const outrasLinhasCalc = d.outrasDespesasLinhas.map(l=>calcDespesaLinha(l,outrasCambio));
  const outrasTotal = sum(outrasLinhasCalc.map(l=>l.total));

  const despesasNF = armazenagemTotal+outrasTotal+num(d.capatazia)+num(d.siscomex)+num(d.afrmm); // compõem a Nota Fiscal, rateadas por valor
  const afrmmSiscomexTotal = num(d.siscomex)+num(d.afrmm); // só estes dois entram na base do ICMS

  const cambioDesembaraco = num(d.desembaracoCambio);
  const freteExtD = num(d.desembaracoFreteExt), seguroExtD = num(d.desembaracoSeguroExt), acrescimoExtD = num(d.desembaracoAcrescimoExt);
  const freteBRLD = cambioDesembaraco*freteExtD;
  const seguroBRLD = cambioDesembaraco*seguroExtD;
  const acrescimoBRLD = cambioDesembaraco*acrescimoExtD;

  // VMLE (Valor da Mercadoria no Local de Embarque) e VMLD (VMLE + Frete + Seguro)
  const vmleUSD = sumTotalUSD, vmleBRL = sumTotalBRL;
  const vmldUSD = vmleUSD+freteExtD+seguroExtD;
  const vmldBRL = vmleBRL+freteBRLD+seguroBRLD;

  return { produtos, sumQty, sumPeso, sumTotalUSD, sumTotalBRL,
    freteLinhasCalc, taxasOrigemCalc, taxasDestinoCalc, freteTotalBRL,
    armazenagemLinhasCalc, armazenagemTotal, outrasLinhasCalc, outrasTotal, despesasNF, afrmmSiscomexTotal,
    freteExtD, seguroExtD, acrescimoExtD, freteBRLD, seguroBRLD, acrescimoBRLD,
    vmleUSD, vmleBRL, vmldUSD, vmldBRL };
}
function computeRateioFormal(d, c){
  const linhas = c.produtos.map(p=>{
    if(!(p.qty>0) && !p.fornecedor && !p.produto) return null;
    const pesoShare = c.sumPeso>0 ? p.peso/c.sumPeso : 0;
    const valorShare = c.sumTotalUSD>0 ? p.totalUSD/c.sumTotalUSD : 0;
    const rateioFrete = pesoShare*c.freteBRLD;                        // rateio por peso (I)
    const rateioSeguro = valorShare*c.seguroBRLD;                     // rateio por valor (J)
    const rateioAcrescimo = valorShare*c.acrescimoBRLD;               // rateio por valor (K)
    const valorAduaneiro = p.totalBRL+rateioFrete+rateioSeguro+rateioAcrescimo; // L — base do I.I./I.P.I./PIS/COFINS
    const vmldProduto = p.totalBRL+rateioFrete+rateioSeguro;          // VMLD por produto (sem acréscimo)
    const rateioDespesasNF = valorShare*c.despesasNF;                 // Capatazia + Siscomex + AFRMM + Armazenagem + Outras (soma no custo final)
    const rateioAfrmmSiscomex = valorShare*c.afrmmSiscomexTotal;      // só Siscomex + AFRMM (base do ICMS)

    // --- Colunas de exibição da tabela "Rateio dos Custos por Produto" (Numerário/PDF) ---
    // Rateio Frete exibido = Frete Marítimo + Taxas de Origem + Taxas de Destino (aba Frete) + Seguro
    const rateioFreteTabela = pesoShare*c.freteTotalBRL + rateioSeguro;
    const rateioArmazenagemTabela = valorShare*c.armazenagemTotal;
    const rateioOutrasTabela = valorShare*(c.outrasTotal + num(d.capatazia) + num(d.siscomex));
    const rateioAfrmmTabela = valorShare*num(d.afrmm);

    const iiRate = num(p.ii), ipiRate = num(p.ipi), pisRate = num(p.pis), cofinsRate = num(p.cofins), icmsRate = num(p.icms);
    const bcII = valorAduaneiro;
    const ii = bcII*iiRate;
    const bcIpi = bcII+ii;
    const ipi = bcIpi*ipiRate;
    const bcPis = valorAduaneiro;
    const pis = bcPis*pisRate;
    const bcCofins = valorAduaneiro;
    const cofins = bcCofins*cofinsRate;
    // Base do ICMS = Valor Aduaneiro (com Acréscimo) + I.I. + I.P.I. + PIS + COFINS + AFRMM + Tx Siscomex
    // (replica exatamente a fórmula da planilha original: Desembaraço!AB = (L+P+S+V+Y+Z+AA)/(1-AC))
    const bcIcms = icmsRate<1 ? (valorAduaneiro+ii+ipi+pis+cofins+rateioAfrmmSiscomex)/(1-icmsRate) : 0;
    const icms = bcIcms*icmsRate;

    const custoTotalComCredito = valorAduaneiro+ii+rateioDespesasNF;
    const custoTotalSemCredito = valorAduaneiro+ii+ipi+pis+cofins+icms+rateioDespesasNF;
    const custoUnitComCredito = p.qty>0 ? custoTotalComCredito/p.qty : 0;
    const custoUnitSemCredito = p.qty>0 ? custoTotalSemCredito/p.qty : 0;

    return {...p, rateioFrete, rateioSeguro, rateioAcrescimo, valorAduaneiro, vmldProduto, rateioDespesasNF, rateioAfrmmSiscomex,
      rateioFreteTabela, rateioArmazenagemTabela, rateioOutrasTabela, rateioAfrmmTabela,
      // percentuais originais preservados (o.ii/.ipi/etc abaixo são sobrescritos pelos VALORES em R$)
      iiPct:num(p.ii), ipiPct:num(p.ipi), pisPct:num(p.pis), cofinsPct:num(p.cofins), icmsPct:num(p.icms),
      bcII, ii, bcIpi, ipi, bcPis, pis, bcCofins, cofins, bcIcms, icms,
      custoTotalComCredito, custoUnitComCredito, custoTotalSemCredito, custoUnitSemCredito};
  }).filter(Boolean);

  const totais = {
    qty: sum(linhas.map(l=>l.qty)), peso: sum(linhas.map(l=>l.peso)),
    totalUSD: sum(linhas.map(l=>l.totalUSD)), totalBRL: sum(linhas.map(l=>l.totalBRL)),
    rateioFrete: sum(linhas.map(l=>l.rateioFrete)), rateioSeguro: sum(linhas.map(l=>l.rateioSeguro)), rateioAcrescimo: sum(linhas.map(l=>l.rateioAcrescimo)),
    valorAduaneiro: sum(linhas.map(l=>l.valorAduaneiro)), rateioDespesasNF: sum(linhas.map(l=>l.rateioDespesasNF)),
    rateioFreteTabela: sum(linhas.map(l=>l.rateioFreteTabela)), rateioArmazenagemTabela: sum(linhas.map(l=>l.rateioArmazenagemTabela)),
    rateioOutrasTabela: sum(linhas.map(l=>l.rateioOutrasTabela)), rateioAfrmmTabela: sum(linhas.map(l=>l.rateioAfrmmTabela)),
    ii: sum(linhas.map(l=>l.ii)), ipi: sum(linhas.map(l=>l.ipi)), pis: sum(linhas.map(l=>l.pis)),
    cofins: sum(linhas.map(l=>l.cofins)), icms: sum(linhas.map(l=>l.icms)),
    custoTotalComCredito: sum(linhas.map(l=>l.custoTotalComCredito)),
    custoTotalSemCredito: sum(linhas.map(l=>l.custoTotalSemCredito)),
  };
  return { linhas, totais };
}

/* ============================ SIMULADOR DE CARGA ============================
   Cálculo estimado de ocupação de container (volume/peso/paletes), não é um
   otimizador de bin-packing 3D real — serve para planejamento e visualização
   aproximada, arredondando para cima o número de containers necessários. */
function novaCaixaSimulador(idx){
  return {id:uid(), nome:'', comprimento:'', largura:'', altura:'', quantidade:'', pesoPeca:'', cor: CORES_CAIXA[(idx||0)%CORES_CAIXA.length]};
}
function simulacaoPadrao(){
  return {
    nome:'',
    caixas:[novaCaixaSimulador(0)],
    tipoCarregamento:'solta', // solta | granel | pallets
    palete:{comprimento:'120', largura:'80', altura:'16', alturaMaxCarregamento:'200', cargaUtil:'1500', pesoPalete:'25'},
    containerTipos:[],
    embalagemTipo:'caixa-papelao',
    embalagemObs:'',
  };
}
function normalizeSimulacao(s){
  const base = simulacaoPadrao();
  const merged = Object.assign({}, base, s||{});
  if(!Array.isArray(merged.caixas) || merged.caixas.length===0) merged.caixas = [novaCaixaSimulador(0)];
  merged.palete = Object.assign({}, base.palete, merged.palete||{});
  if(!s || !Array.isArray(s.containerTipos)){
    // compatibilidade com simulações salvas antes do multi-seleção (campo antigo: containerTipo string)
    merged.containerTipos = (s && s.containerTipo) ? [s.containerTipo] : [];
  }
  delete merged.containerTipo;
  return merged;
}
function computeCaixaSimulador(cx){
  const qty = num(cx.quantidade), peso = num(cx.pesoPeca);
  const comp = num(cx.comprimento), larg = num(cx.largura), alt = num(cx.altura);
  const volumeUnitM3 = (comp*larg*alt)/1e6; // cm³ → m³
  const cbm = volumeUnitM3*qty;
  const pesoTotal = peso*qty;
  return {...cx, qty, peso, comp, larg, alt, volumeUnitM3, cbm, pesoTotal};
}
function computeSimulacao(sim){
  const caixas = sim.caixas.map(computeCaixaSimulador);
  const totalUnidades = sum(caixas.map(c=>c.qty));
  const totalCbm = sum(caixas.map(c=>c.cbm));
  const totalPeso = sum(caixas.map(c=>c.pesoTotal));
  return { caixas, totalUnidades, totalCbm, totalPeso };
}
function computePaleteCbmUtil(p){
  const comp=num(p.comprimento), larg=num(p.largura), altMax=num(p.alturaMaxCarregamento);
  return (comp*larg*altMax)/1e6; // m³ utilizáveis por palete (área x altura máxima de carregamento)
}
/* Aloca as caixas (Carga Solta/Granel) container a container, respeitando ao mesmo tempo o
   limite de volume (capacidadeCbm) E o limite de peso (maxPayload) de cada container — evita
   que um container "feche" por peso enquanto o cálculo de volume (ou vice-versa) ainda pensa
   que a carga toda coube no 1º container. */
function alocarContainersSolta(caixasComputadas, capacidadeCbm, maxPayload){
  const containers = [];
  let atual = { itens:[], volTotal:0, pesoTotal:0 };
  const fila = caixasComputadas.filter(c=>c.qty>0).map(c=>({...c, restante:c.qty}));
  if(fila.length===0) return containers;
  let seguro = 0;
  while(fila.some(c=>c.restante>0) && seguro<2000){
    seguro++;
    let progresso = false;
    for(const cx of fila){
      if(cx.restante<=0) continue;
      const volPerUnit = cx.volumeUnitM3||0, pesoPerUnit = cx.peso||0;
      const volLivre = capacidadeCbm>0 ? capacidadeCbm-atual.volTotal : Infinity;
      const pesoLivre = maxPayload>0 ? maxPayload-atual.pesoTotal : Infinity;
      const maxPorVolume = volPerUnit>0 ? Math.floor(volLivre/volPerUnit) : cx.restante;
      const maxPorPeso = pesoPerUnit>0 ? Math.floor(pesoLivre/pesoPerUnit) : cx.restante;
      const qtd = Math.max(0, Math.min(cx.restante, maxPorVolume, maxPorPeso));
      if(qtd<=0) continue;
      let existente = atual.itens.find(it=>it.id===cx.id);
      if(!existente){ existente = {...cx, qtyNesteContainer:0}; atual.itens.push(existente); }
      existente.qtyNesteContainer += qtd;
      atual.volTotal += qtd*volPerUnit;
      atual.pesoTotal += qtd*pesoPerUnit;
      cx.restante -= qtd;
      progresso = true;
    }
    if(!progresso){
      containers.push(atual);
      atual = { itens:[], volTotal:0, pesoTotal:0 };
    }
  }
  if(atual.itens.length) containers.push(atual);
  return containers;
}
function simularContainers(sim, containerKey){
  const cont = CONTAINERS[containerKey];
  const c = computeSimulacao(sim);
  if(!cont) return { cont:null, c };

  let volumeNecessario = c.totalCbm;
  let pesoNecessario = c.totalPeso;
  let unidadesPaletes = 0;
  let alocacaoContainers = null;

  if(sim.tipoCarregamento==='pallets'){
    const paleteCbmUtil = computePaleteCbmUtil(sim.palete);
    const pesoPalete = num(sim.palete.pesoPalete);
    unidadesPaletes = calcPaletizacao(sim).unidadesPaletes; // mesma fonte usada em toda a tela de Resultado
    volumeNecessario = unidadesPaletes*paleteCbmUtil;
    pesoNecessario = c.totalPeso + unidadesPaletes*pesoPalete;
  } else {
    alocacaoContainers = alocarContainersSolta(c.caixas, cont.capacidadeCbm, cont.maxPayload);
    volumeNecessario = sum(alocacaoContainers.map(ct=>ct.volTotal));
    pesoNecessario = sum(alocacaoContainers.map(ct=>ct.pesoTotal));
  }

  const containersPorVolume = cont.capacidadeCbm>0 ? Math.ceil(volumeNecessario/cont.capacidadeCbm) : 1;
  const containersPorPeso = cont.maxPayload>0 ? Math.ceil(pesoNecessario/cont.maxPayload) : 1;
  let containersPorPaletes = 1;
  if(sim.tipoCarregamento==='pallets' && unidadesPaletes>0){
    const info = simularPaletesNoContainer(sim, containerKey);
    const capacidadeReal = info ? info.capacidadeContainer : cont.maxPallets;
    containersPorPaletes = capacidadeReal>0 ? Math.ceil(unidadesPaletes/capacidadeReal) : 1;
  }
  const numContainers = sim.tipoCarregamento==='pallets'
    ? Math.max(containersPorVolume, containersPorPeso, containersPorPaletes, c.totalUnidades>0?1:0)
    : Math.max(alocacaoContainers ? alocacaoContainers.length : 1, c.totalUnidades>0?1:0);

  const ocupacaoVolume = numContainers>0 && cont.capacidadeCbm>0 ? (volumeNecessario/(cont.capacidadeCbm*numContainers))*100 : 0;
  const ocupacaoPeso = numContainers>0 && cont.maxPayload>0 ? (pesoNecessario/(cont.maxPayload*numContainers))*100 : 0;

  return { cont, c, volumeNecessario, pesoNecessario, unidadesPaletes, alocacaoContainers,
    numContainers, ocupacaoVolume, ocupacaoPeso, containersPorVolume, containersPorPeso, containersPorPaletes };
}

/* ------------------------------ Motor de cálculo --------------------------- */
function computeDados(d){
  const produtos = d.produtos.map(p=>{
    const qty = num(p.quantidade), vu = num(p.valorUnit), peso = num(p.pesoLiquido);
    const totalUSD = qty*vu;
    const totalBRL = totalUSD*num(d.cambioInvoice);
    return {...p, qty, vu, peso, totalUSD, totalBRL};
  });
  const sumQty = sum(produtos.map(p=>p.qty));
  const sumPeso = sum(produtos.map(p=>p.peso));
  const sumTotalUSD = sum(produtos.map(p=>p.totalUSD));   // F30
  const sumTotalBRL = sum(produtos.map(p=>p.totalBRL));   // G30

  const freteExt = num(d.freteExt), seguroExt = num(d.seguroExt);
  const cambioFrete = num(d.cambioFrete);
  const freteBRL = cambioFrete*freteExt;                  // E38
  const seguroBRL = cambioFrete*seguroExt;                // E39
  const totalFreteSeguroExt = freteExt+seguroExt;         // D41
  const totalFreteSeguroBRL = freteBRL+seguroBRL;         // E41

  const cambioDesembaraco = num(d.cambioDesembaraco);
  const invoiceExt = sumTotalUSD;                         // D52
  const invoiceBRL = cambioDesembaraco*invoiceExt;        // E52
  const freteExtD = freteExt;                             // D53
  const freteBRLD = cambioDesembaraco*freteExtD;          // E53
  const seguroExtD = seguroExt;                           // D54
  const seguroBRLD = cambioDesembaraco*seguroExtD;        // E54
  const valorAduaneiroExt = invoiceExt+freteExtD+seguroExtD;      // D56
  const valorAduaneiroBRL = cambioDesembaraco*valorAduaneiroExt;  // E56

  const ii = num(d.ii);        // D48
  const icms = num(d.icms);    // D49
  const iiValor = ii*valorAduaneiroBRL;                            // H52
  const vaMaisII = valorAduaneiroBRL+iiValor;                      // H53
  const bcIcms = icms<1 ? vaMaisII/(1-icms) : 0;                   // H54
  const icmsValor = bcIcms*icms;                                   // H55

  const despExtraTotal = sum(d.despExtra.map(num));                // D65
  const limiteUSD = valorAduaneiroExt;                             // F72 = D56
  const limiteExcedido = limiteUSD > LIMITE_SIMPLIFICADA_USD;

  return { produtos, sumQty, sumPeso, sumTotalUSD, sumTotalBRL,
    freteBRL, seguroBRL, totalFreteSeguroExt, totalFreteSeguroBRL,
    invoiceExt, invoiceBRL, freteExtD, freteBRLD, seguroExtD, seguroBRLD,
    valorAduaneiroExt, valorAduaneiroBRL, iiValor, vaMaisII, bcIcms, icmsValor,
    despExtraTotal, limiteUSD, limiteExcedido };
}

function computeRateio(d, c){
  // primeira passada — tudo exceto rateio de despesas extras
  const linhas = c.produtos.map(p=>{
    if(!(p.qty>0) && !p.fornecedor && !p.produto) return null;
    const pesoShare = c.sumPeso>0 ? p.peso/c.sumPeso : 0;
    const valorShare = c.sumTotalUSD>0 ? p.totalUSD/c.sumTotalUSD : 0;
    // O rateio respeita os pré-cálculos de cada taxa de câmbio preenchida em Dados:
    // o valor do produto usa a taxa da Invoice (p.totalBRL) e o frete/seguro usam a taxa do Frete
    // (c.freteBRL/c.seguroBRL) — a mesma taxa usada nos respectivos campos em Dados.
    const rateioFrete = pesoShare*c.freteBRL;                 // H (taxa da Invoice/Frete conforme Dados)
    const rateioSeguro = valorShare*c.seguroBRL;              // I (taxa do Frete conforme Dados)
    const valorAduaneiroProduto = p.totalBRL+rateioFrete+rateioSeguro; // J
    const rateioII = valorAduaneiroProduto*num(d.ii);   // K
    const icmsRate = num(d.icms);
    const rateioBcIcms = icmsRate<1 ? (valorAduaneiroProduto+rateioII)/(1-icmsRate) : 0; // L
    const rateioIcms = rateioBcIcms*icmsRate;              // M
    return {...p, valorShare, rateioFrete, rateioSeguro, valorAduaneiroProduto, rateioII, rateioBcIcms, rateioIcms};
  }).filter(Boolean);

  const sumJ = sum(linhas.map(l=>l.valorAduaneiroProduto));
  linhas.forEach(l=>{
    // Rateio das despesas extras segue a mesma proporção (valor $) usada no rateio do seguro.
    l.rateioDespExtra = l.valorShare*c.despExtraTotal;                    // N
    l.custoTotalSimples = l.valorAduaneiroProduto+l.rateioII+l.rateioIcms+l.rateioDespExtra; // O
    l.custoUnitSimples = l.qty>0 ? l.custoTotalSimples/l.qty : 0;         // P
    l.custoTotalLucroReal = l.valorAduaneiroProduto+l.rateioII+l.rateioDespExtra; // Q
    l.custoUnitLucroReal = l.qty>0 ? l.custoTotalLucroReal/l.qty : 0;     // R
  });

  const totais = {
    qty: sum(linhas.map(l=>l.qty)), peso: sum(linhas.map(l=>l.peso)),
    totalUSD: sum(linhas.map(l=>l.totalUSD)), totalBRL: sum(linhas.map(l=>l.totalBRL)),
    rateioFrete: sum(linhas.map(l=>l.rateioFrete)), rateioSeguro: sum(linhas.map(l=>l.rateioSeguro)),
    valorAduaneiroProduto: sumJ, rateioII: sum(linhas.map(l=>l.rateioII)),
    rateioBcIcms: sum(linhas.map(l=>l.rateioBcIcms)), rateioIcms: sum(linhas.map(l=>l.rateioIcms)),
    rateioDespExtra: sum(linhas.map(l=>l.rateioDespExtra)),
    custoTotalSimples: sum(linhas.map(l=>l.custoTotalSimples)),
    custoTotalLucroReal: sum(linhas.map(l=>l.custoTotalLucroReal)),
  };
  return { linhas, totais };
}

// Une a antiga lista de Fornecedores à de Clientes (agora "Clientes e Empresas"). Quem pode gravar em
// Cadastros salva a união e esvazia a lista antiga; os demais só veem a união.
async function unificarEmpresas(cli, forn){
  const clientes = (cli||[]).map(e=>({ ...e, tipoCadastro: e.tipoCadastro || 'cliente' }));
  const fornecedores = (forn||[]).filter(x=>!clientes.some(c=>c.id===x.id)).map(e=>({ ...e, tipoCadastro: e.tipoCadastro || 'fornecedor' }));
  state.clientes = [...clientes, ...fornecedores];
  if(!fornecedores.length || !(pode('cadastros','criar') || pode('cadastros','editar'))) return;
  if(!(await storeSet('clientes:list', state.clientes))) return;
  const { data: v } = await sb.rpc('salvar_dado', { p_chave:'fornecedores:list', p_valor:[], p_versao: versoes['fornecedores:list']||0 });
  if(v) versoes['fornecedores:list'] = v;
}
async function persistCadastro(tipo){
  const map = {cliente:'clientes', produto:'produtos'};
  await storeSet(map[tipo]+':list', state[map[tipo]]);
}
