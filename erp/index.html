<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comexta · Importação Simplificada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="/js/supabase-client.js"></script>
<style>
:root{
  --paper:#F7F5F0;
  --paper-2:#EFEBE2;
  --ink:#171F2A;
  --ink-soft:#5B6673;
  --navy:#173A5E;
  --navy-deep:#0E2740;
  --navy-100:#EAF0F7;
  --amber:#C07A25;
  --amber-deep:#8F5A17;
  --amber-100:#F5E7CC;
  --green:#2F6B4F;
  --green-100:#E1EEE6;
  --red:#B23A32;
  --red-100:#F6E1DF;
  --line:#E3DACB;
  --line-soft:#EDE8DC;
  --surface:#FFFFFF;
  --shadow: 0 1px 1px rgba(20,35,55,0.04), 0 10px 28px -12px rgba(20,35,55,0.16);
  --shadow-lg: 0 4px 10px rgba(20,35,55,0.05), 0 22px 48px -16px rgba(20,35,55,0.22);
  --radius: 14px;
  --radius-sm: 10px;
  --ease: cubic-bezier(.2,.7,.3,1);
  --font-display:'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-body:'Inter', ui-sans-serif, system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 500px at 10% -10%, #FBF8F1 0%, transparent 60%),
    var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
#app{min-height:100vh; display:flex; flex-direction:column;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--amber-100);}

/* ---------- Topbar ---------- */
.topbar{
  background:linear-gradient(165deg,var(--navy) 0%, var(--navy-deep) 100%);
  color:#fff;
  padding:14px 28px;
  display:flex; align-items:center; gap:18px;
  position:sticky; top:0; z-index:40;
  box-shadow:0 1px 0 rgba(255,255,255,0.06) inset, 0 8px 24px -10px rgba(14,39,64,0.5);
  backdrop-filter:saturate(1.15);
}
.brand{display:flex; align-items:center; gap:0; cursor:pointer; user-select:none;}
.logo-chip{
  background:#fff; border-radius:12px; padding:6px 14px; display:flex; align-items:center;
  box-shadow:0 2px 8px -2px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,255,255,0.6);
  transition:transform .18s var(--ease);
}
.brand:hover .logo-chip{transform:translateY(-1px);}
.logo-chip img{display:block; height:30px; width:auto;}
@media (max-width:760px){ .logo-chip img{height:24px;} .logo-chip{padding:5px 10px;} }
.brand-mark{
  width:36px; height:36px; border-radius:10px;
  background:conic-gradient(from 220deg, var(--amber), var(--amber-deep) 40%, var(--amber) 80%);
  display:flex; align-items:center; justify-content:center;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35);
  flex-shrink:0;
}
.brand-mark svg{width:20px; height:20px;}
.brand-text{display:flex; flex-direction:column; line-height:1.15;}
.brand-text .t1{font-family:var(--font-display); font-weight:700; font-size:16px; letter-spacing:0.2px;}
.brand-text .t2{font-size:11px; color:#B9C9DA; letter-spacing:0.6px; text-transform:uppercase;}
.crumbs{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); margin:0 0 18px; flex-wrap:wrap;}
.crumbs .seg{cursor:pointer; opacity:0.85; transition:opacity .12s ease;}
.crumbs .seg:hover{opacity:1; text-decoration:underline;}
.crumbs .sep{opacity:0.4;}
.crumbs .cur{color:var(--navy); font-weight:700;}
.topbar-spacer{flex:1;}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.pill-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(255,255,255,0.18);
  padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer;
  transition:background .15s ease, transform .1s ease;
}
.pill-btn:hover{background:rgba(255,255,255,0.16);}
.pill-btn:active{transform:translateY(1px);}
.pill-btn svg{width:14px;height:14px;}

/* ---------- Top nav (Início / Importação Simplificada / Cadastro) ---------- */
.topnav{display:flex; align-items:center; gap:4px;}
.nav-btn{
  display:inline-flex; align-items:center; gap:8px; background:transparent; border:1px solid transparent;
  color:#EAF0F7; padding:9px 14px; border-radius:9px; font-weight:600; font-size:13.5px; cursor:pointer;
  white-space:nowrap; transition:background .15s ease;
}
.nav-btn svg{width:15px; height:15px; flex-shrink:0;}
.nav-btn:hover{background:rgba(255,255,255,0.10);}
.nav-btn.active{background:rgba(255,255,255,0.14); color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.22);}
.nav-group{position:relative;}
.nav-dropdown{
  position:absolute; top:calc(100% + 8px); left:0; min-width:220px; background:var(--surface);
  border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:8px;
  display:none; z-index:60;
}
.nav-dropdown.open{display:block;}
.nav-drop-item{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:7px;
  font-size:13px; font-weight:600; color:var(--ink); cursor:pointer;
}
.nav-drop-item svg{width:15px; height:15px; color:var(--amber-deep); flex-shrink:0;}
.nav-drop-item:hover{background:var(--paper);}
.nav-drop-item-parent{
  position:relative; display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:9px 10px; border-radius:7px; font-size:13px; font-weight:600; color:var(--ink); cursor:default;
}
.nav-drop-item-parent:hover{background:var(--paper);}
.nav-drop-item-parent .npl{display:flex; align-items:center; gap:10px;}
.nav-drop-item-parent svg.chev-right{width:13px; height:13px; color:var(--ink-soft); flex-shrink:0;}
.nav-flyout{
  position:absolute; top:-8px; left:calc(100% + 6px); min-width:200px; background:var(--surface);
  border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:8px;
  display:none; z-index:70;
}
.nav-drop-item-parent:hover .nav-flyout{display:block;}
@media (max-width:760px){
  .topnav{gap:0;}
  .nav-btn{padding:8px 9px; font-size:12px;}
  .brand-text{display:none;}
}

/* ---------- Layout shell ---------- */
.shell{flex:1; display:flex; width:100%;}
.sidenav{
  width:230px; flex-shrink:0; background:var(--navy-100); border-right:1px solid var(--line);
  padding:22px 14px; display:flex; flex-direction:column; gap:4px;
}
.sidenav .grp-label{font-size:11px; text-transform:uppercase; letter-spacing:0.7px; color:var(--ink-soft); margin:14px 8px 6px;}
.sidenav .side-sublabel{font-size:10px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-soft); opacity:0.75; margin:10px 8px 3px; min-height:12px;}
.side-link{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-sm);
  font-size:13.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; border:1px solid transparent;
  transition:background .15s var(--ease), color .15s var(--ease);
}
.side-link svg{width:16px;height:16px; flex-shrink:0;}
.side-link:hover{background:rgba(23,58,94,0.07); color:var(--navy);}
.side-link.active{background:var(--surface); color:var(--navy); border-color:var(--line); box-shadow:var(--shadow);}
.main{flex:1; min-width:0; padding:30px 34px 70px; max-width:1280px;}
.main.wide{max-width:none;}

/* ---------- Typography ---------- */
h1,h2,h3{font-family:var(--font-display); margin:0; color:var(--navy-deep);}
.page-title{font-size:27px; font-weight:700; letter-spacing:-0.3px;}
.page-sub{color:var(--ink-soft); font-size:14px; margin-top:5px; max-width:640px; line-height:1.5;}
.section-title{font-family:var(--font-display); font-size:15px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:0.5px; display:flex; align-items:center; gap:10px;}
.section-title .num{
  font-family:var(--font-mono); font-size:11px; color:var(--amber-deep); background:var(--amber-100);
  border-radius:6px; padding:2px 7px; font-weight:600;
}

/* ---------- Cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:24px 26px; margin-bottom:22px;
  transition:box-shadow .2s var(--ease);
}
.card-flat{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius); padding:19px 21px;}
.hairline{border:none; border-top:1px dashed var(--line); margin:20px 0;}

/* ---------- Dashboards ---------- */
.dash-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:980px){.dash-grid{grid-template-columns:1fr;}}
.dash-card{display:flex; flex-direction:column; gap:12px;}
.dash-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:var(--ink-soft);}
.dash-canvas-wrap{position:relative; height:220px;}
.dash-empty{
  height:220px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  color:var(--ink-soft); font-size:12.5px; text-align:center; border:1.5px dashed var(--line); border-radius:10px; padding:0 16px;
}
.dash-empty svg{width:26px; height:26px; color:var(--line);}

/* ---------- Home ---------- */
.home-hero{padding:46px 6px 10px;}
.home-hero .kicker{
  font-family:var(--font-mono); font-size:12px; letter-spacing:2px; text-transform:uppercase;
  color:var(--amber-deep); display:flex; align-items:center; gap:10px;
}
.home-hero .kicker::before{content:''; width:26px; height:1px; background:var(--amber-deep); display:inline-block;}
.home-hero h1{font-size:40px; margin-top:10px; max-width:680px; line-height:1.08;}
.home-hero p{color:var(--ink-soft); font-size:15px; max-width:560px; margin-top:14px; line-height:1.55;}

.module-grid{display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:34px;}
@media (max-width:880px){.module-grid{grid-template-columns:1fr;}}
.module-card{
  background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden;
  box-shadow:var(--shadow); transition:box-shadow .2s var(--ease), transform .2s var(--ease);
}
.module-card:hover{box-shadow:var(--shadow-lg); transform:translateY(-2px);}
.module-head{
  padding:24px 24px 20px; cursor:pointer; display:flex; align-items:flex-start; gap:16px; user-select:none;
}
.module-icon{
  width:46px; height:46px; border-radius:12px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.module-icon svg{width:24px; height:24px;}
.module-card.blue .module-icon{background:var(--navy-100); color:var(--navy);}
.module-card.amber .module-icon{background:var(--amber-100); color:var(--amber-deep);}
.module-head .mt{flex:1;}
.module-head h3{font-size:18px;}
.module-head p{margin:5px 0 0; font-size:13px; color:var(--ink-soft); line-height:1.45;}
.module-chevron{width:18px; height:18px; color:var(--ink-soft); transition:transform .2s ease; margin-top:6px; flex-shrink:0;}
.module-card.open .module-chevron{transform:rotate(90deg);}
.module-sub{max-height:0; overflow:hidden; transition:max-height .28s ease;}
.module-card.open .module-sub{max-height:260px;}
.module-sub-inner{padding:0 22px 22px; display:flex; flex-direction:column; gap:8px;}
.sub-btn{
  display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:11px;
  background:var(--paper); border:1px solid var(--line-soft); cursor:pointer; font-weight:600; font-size:13.5px; color:var(--ink);
  transition:background .15s ease, border-color .15s ease, transform .15s ease;
}
.sub-btn:hover{background:#fff; border-color:var(--amber); transform:translateX(2px);}
.sub-btn svg{width:16px;height:16px; color:var(--amber-deep); flex-shrink:0;}
.sub-btn .desc{font-weight:400; color:var(--ink-soft); font-size:12px; margin-left:auto; text-align:right;}

.home-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:30px;}
@media (max-width:880px){.home-stats{grid-template-columns:1fr;}}
.stat-card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px; transition:box-shadow .18s var(--ease);}
.stat-card:hover{box-shadow:var(--shadow);}
.stat-card .lbl{font-size:11.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); font-weight:600;}
.stat-card .val{font-family:var(--font-mono); font-size:24px; font-weight:600; color:var(--navy-deep); margin-top:6px;}
.stat-card .sub{font-size:12px; color:var(--ink-soft); margin-top:3px;}

/* ---------- Forms ---------- */
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:12px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.3px;}
.field input, .field select{
  border:1px solid var(--line); background:#fff; border-radius:var(--radius-sm); padding:10px 12px; font-size:14px;
  font-family:var(--font-body); color:var(--ink); outline:none; transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.field input.input-blue, .field select.input-blue, td input.input-blue{
  background:#EAF2FC; border-color:#BFD7F0;
}
.field input:focus, .field select:focus, td input:focus{border-color:var(--navy); box-shadow:0 0 0 3px rgba(23,58,94,0.12);}
.field .hint{font-size:11.5px; color:var(--ink-soft); opacity:0.85;}
.field-row{display:grid; gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
.grid-4{grid-template-columns:1fr 1fr 1fr 1fr;}
@media (max-width:760px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
input[readonly]{background:var(--paper-2) !important; color:var(--ink-soft); cursor:default;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px; border-radius:var(--radius-sm); padding:11px 18px;
  font-weight:700; font-size:13.5px; cursor:pointer; border:1px solid transparent; transition:filter .15s var(--ease), transform .1s var(--ease), box-shadow .15s var(--ease);
}
.btn svg{width:15px;height:15px;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy); color:#fff; box-shadow:0 1px 2px rgba(23,58,94,0.15);}
.btn-primary:hover{filter:brightness(1.12); box-shadow:0 4px 12px -4px rgba(23,58,94,0.4);}
.btn-amber{background:var(--amber); color:#fff; box-shadow:0 1px 2px rgba(192,122,37,0.15);}
.btn-amber:hover{filter:brightness(1.08); box-shadow:0 4px 12px -4px rgba(192,122,37,0.4);}
.btn-ghost{background:transparent; color:var(--navy); border-color:var(--line);}
.btn-ghost:hover{background:var(--navy-100);}
.btn-danger{background:transparent; color:var(--red); border-color:var(--red-100);}
.btn-danger:hover{background:var(--red-100);}
.btn-sm{padding:7px 12px; font-size:12.5px; border-radius:8px;}
.btn[disabled]{opacity:0.45; cursor:not-allowed;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-sm);}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:640px;}
thead th{
  background:var(--navy-100); color:var(--navy-deep); text-align:left; font-size:11px;
  text-transform:uppercase; letter-spacing:0.4px; padding:10px 12px; white-space:nowrap; font-weight:700;
  border-bottom:1px solid var(--line);
}
tbody td{padding:9px 10px; border-bottom:1px solid var(--line-soft); white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr{transition:background .12s ease;}
tbody tr:hover{background:#FBFAF6;}
tfoot td{padding:10px 12px; font-weight:700; background:var(--paper-2); border-top:2px solid var(--line); font-family:var(--font-mono);}
td input{width:100%; min-width:90px; border:1px solid var(--line); border-radius:7px; padding:7px 8px; font-size:13px; font-family:var(--font-body);}
.num-mono{font-family:var(--font-mono); text-align:right;}
td.num-mono, th.num-mono{text-align:right;}
.row-remove{color:var(--red); cursor:pointer; background:none; border:none; padding:4px;}
.row-remove svg{width:15px;height:15px;}

/* ---------- Badges / alerts ---------- */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; letter-spacing:0.2px;}
.badge-green{background:var(--green-100); color:var(--green);}
.badge-red{background:var(--red-100); color:var(--red);}
.badge-amber{background:var(--amber-100); color:var(--amber-deep);}
.badge-navy{background:var(--navy-100); color:var(--navy);}
.badge-ok{background:var(--green-100); color:var(--green);}
.badge-danger{background:var(--red-100); color:var(--red);}
.alert{border-radius:var(--radius-sm); padding:14px 16px; display:flex; gap:12px; align-items:flex-start; font-size:13px; border:1px solid;}
.alert svg{width:18px;height:18px; flex-shrink:0; margin-top:1px;}
.alert-ok{background:var(--green-100); border-color:#BFDCC9; color:#1F5A3D;}
.alert-warn{background:var(--red-100); border-color:#E9C2BD; color:#8C2C25;}
.alert-info{background:var(--navy-100); border-color:#C9D8E7; color:var(--navy-deep);}
.stamp{
  font-family:var(--font-mono); font-weight:700; font-size:12px; color:var(--amber-deep);
  border:1.5px dashed var(--amber-deep); border-radius:8px; padding:4px 10px; display:inline-block;
  transform:rotate(-2deg); background:var(--amber-100);
}

/* ---------- Summary strip ---------- */
.kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px 18px; transition:box-shadow .18s var(--ease), transform .18s var(--ease);}
.kpi:hover{box-shadow:var(--shadow); transform:translateY(-1px);}
.kpi .k-lbl{font-size:11px; text-transform:uppercase; color:var(--ink-soft); font-weight:700; letter-spacing:0.4px;}
.kpi .k-val{font-family:var(--font-mono); font-size:19px; font-weight:600; margin-top:6px; color:var(--navy-deep);}
.kpi .k-sub{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

/* ---------- Toast ---------- */
#toast-wrap{position:fixed; bottom:22px; right:22px; z-index:100; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--navy-deep); color:#fff; padding:12px 18px; border-radius:9px; font-size:13px; font-weight:600;
  box-shadow:0 10px 30px -10px rgba(0,0,0,0.4); display:flex; align-items:center; gap:10px;
  animation:toastIn .25s ease;
}
.toast svg{width:16px;height:16px; color:var(--amber);}
@keyframes toastIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Empty state ---------- */
.empty{
  text-align:center; padding:52px 24px; color:var(--ink-soft); border:1.5px dashed var(--line); border-radius:12px;
}
.empty svg{width:38px; height:38px; color:var(--line); margin-bottom:12px;}
.empty h3{color:var(--ink); font-size:15px; margin-bottom:6px;}
.empty p{font-size:13px; max-width:340px; margin:0 auto;}

/* ---------- Cadastro list ---------- */
.cad-list{display:flex; flex-direction:column; gap:0;}
.cad-item{display:flex; align-items:center; gap:14px; padding:14px 4px; border-bottom:1px solid var(--line-soft);}
.cad-item:last-child{border-bottom:none;}
.cad-avatar{
  width:36px; height:36px; border-radius:8px; background:var(--navy-100); color:var(--navy);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;
}
.cad-avatar.cad-avatar-lg{ width:68px; height:68px; border-radius:10px; font-size:22px; }
.cad-avatar.cad-avatar-lg svg{ width:26px; height:26px; }
.cad-item .ci-main{flex:1; min-width:0;}
.cad-item .ci-name{font-weight:600; font-size:14px;}
.cad-item .ci-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.cad-item .ci-actions{display:flex; gap:6px; flex-shrink:0;}
.icon-btn{
  width:30px; height:30px; border-radius:7px; border:1px solid var(--line); background:#fff; cursor:pointer;
  display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
}
.icon-btn:hover{background:var(--navy-100); color:var(--navy);}
.icon-btn-danger{background:var(--red); color:#fff; border-color:var(--red); animation:pulseDanger 1s ease infinite;}
.icon-btn-danger:hover{background:var(--red); color:#fff; filter:brightness(1.1);}
@keyframes pulseDanger{0%,100%{opacity:1;} 50%{opacity:0.65;}}
.icon-btn svg{width:14px;height:14px;}

/* ---------- Form tabs (Cadastro rico) ---------- */
.form-tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:20px; flex-wrap:wrap;}
.form-tab{
  display:inline-flex; align-items:center; gap:7px; padding:10px 16px; font-size:13px; font-weight:700;
  color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
  transition:color .15s ease, border-color .15s ease;
}
.form-tab svg{width:15px; height:15px;}
.form-tab:hover{color:var(--navy);}
.form-tab.active{color:var(--navy); border-bottom-color:var(--amber);}
.form-tab .tab-count{
  font-family:var(--font-mono); font-size:10.5px; background:var(--navy-100); color:var(--navy);
  border-radius:999px; padding:1px 7px; font-weight:700;
}

/* ---------- Visualização somente leitura (Cadastro) ---------- */
.view-section-title{
  font-family:var(--font-display); font-size:12px; font-weight:700; color:var(--navy);
  text-transform:uppercase; letter-spacing:0.5px; margin:22px 0 12px;
}
.view-section-title:first-of-type{margin-top:0;}
.view-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px 20px;}
@media (max-width:760px){.view-grid{grid-template-columns:1fr;}}
.view-field{display:flex; flex-direction:column; gap:3px; min-width:0;}
.view-label{font-size:11px; text-transform:uppercase; letter-spacing:0.3px; color:var(--ink-soft); font-weight:600;}
.view-value{font-size:13.5px; color:var(--ink); word-break:break-word;}
.foto-view-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:14px; margin-bottom:6px;}
.foto-view-item{position:relative; border-radius:10px; overflow:hidden; border:2px solid var(--line); aspect-ratio:1; cursor:zoom-in;}
.foto-view-item.is-principal{border-color:var(--amber);}
.foto-view-item img{width:100%; height:100%; object-fit:cover; display:block;}
.foto-view-item .foto-badge{position:absolute; top:6px; left:6px;}

/* ---------- Lightbox (ampliar imagem) ---------- */
.lightbox-overlay{
  position:fixed; inset:0; background:rgba(14,20,26,0.9); z-index:200;
  display:flex; align-items:center; justify-content:center; padding:40px; cursor:zoom-out;
  animation:toastIn .15s ease;
}
.lightbox-overlay img{max-width:100%; max-height:100%; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,0.5); cursor:default;}

/* ---------- Autocomplete (busca no Cadastro) ---------- */
.ac-dropdown{
  position:fixed; background:#fff; border:1px solid var(--line); border-radius:9px;
  box-shadow:var(--shadow); max-height:230px; overflow-y:auto; z-index:300;
}
.ac-option{padding:9px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line-soft); color:var(--ink);}
.ac-option:last-child{border-bottom:none;}
.ac-option:hover{background:var(--paper);}
.ac-option .ac-sub{font-size:11px; color:var(--ink-soft); margin-top:2px;}

/* ---------- Documentos (upload/drag-drop) ---------- */
.doc-dropzone{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  border:1.5px dashed var(--line); border-radius:12px; padding:26px 20px; text-align:center; cursor:pointer;
  color:var(--ink-soft); font-size:13px; transition:border-color .15s ease, background .15s ease;
}
.doc-dropzone svg{width:24px; height:24px; color:var(--amber-deep);}
.doc-dropzone b{color:var(--ink);}
.doc-dropzone:hover, .doc-dropzone.dragover{border-color:var(--amber); background:var(--amber-100);}

/* ---------- Filter bar ---------- */
.filter-bar{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:18px;}
.view-toggle{display:inline-flex; gap:2px; background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:3px;}
.view-toggle-btn{display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:7px; border:none; background:transparent; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
.view-toggle-btn svg{width:15px; height:15px;}
.view-toggle-btn.active{background:var(--surface); color:var(--navy); box-shadow:var(--shadow);}
.kanban-board{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; align-items:start;}
.kanban-column{background:var(--paper); border:1px solid var(--line-soft); border-radius:12px; padding:10px; min-height:120px;}
.kanban-column-header{display:flex; align-items:center; justify-content:space-between; padding:4px 4px 10px;}
.kanban-count{font-size:12px; font-weight:700; color:var(--ink-soft);}
.kanban-column-body{display:flex; flex-direction:column; gap:10px; min-height:80px; border-radius:8px; padding:4px; transition:background .15s;}
.kanban-column-body.dragover{background:var(--navy-100);}
.kanban-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px; cursor:grab; box-shadow:var(--shadow); transition:opacity .15s, transform .15s;}
.kanban-card:active{cursor:grabbing;}
.kanban-card.dragging{opacity:0.4;}
.kanban-card-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.kanban-card-cliente{font-weight:700; font-size:13.5px; color:var(--ink); margin-bottom:6px;}
.kanban-card-row{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); margin-bottom:3px; line-height:1.4;}
.kanban-card-row svg{width:13px; height:13px; flex-shrink:0; color:var(--amber-deep);}
.kanban-empty{font-size:12px; color:var(--ink-soft); text-align:center; padding:20px 8px; font-style:italic;}
@media (max-width:900px){ .kanban-board{grid-template-columns:repeat(2,minmax(0,1fr));} }
@media (max-width:600px){ .kanban-board{grid-template-columns:minmax(0,1fr);} }
.filter-bar .field{min-width:170px;}

/* ---------- Tabs (module subnav rendered inside sidenav already) ---------- */
.footer-note{margin-top:36px; padding-top:18px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-soft); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

@media (max-width:760px){
  .sidenav{display:none;}
  .main{padding:22px 16px 60px;}
  .topbar{padding:12px 16px; flex-wrap:wrap; gap:10px 8px;}
  .topnav{order:3; width:100%; flex-wrap:wrap;}
  .topbar .pill-btn{padding:7px 11px;}
  .crumbs{display:none;}
}

/* ---------- Usuário, configurações e equipe ---------- */
.avatar{display:inline-flex; align-items:center; justify-content:center; border-radius:50%; overflow:hidden; flex-shrink:0;
  background:var(--amber-100); color:var(--amber-deep); font-weight:700; font-family:var(--font-display);}
.avatar img{width:100%; height:100%; object-fit:cover; display:block;}
.user-btn{display:inline-flex; align-items:center; gap:9px; background:rgba(255,255,255,0.08); color:#fff;
  border:1px solid rgba(255,255,255,0.18); border-radius:999px; padding:4px 12px 4px 4px; cursor:pointer; font-family:inherit;
  transition:background .15s ease; max-width:260px;}
.user-btn:hover, .user-btn.active{background:rgba(255,255,255,0.16);}
.user-btn svg{width:16px; height:16px; opacity:0.85; flex-shrink:0;}
.user-btn-txt{display:flex; flex-direction:column; line-height:1.15; text-align:left; min-width:0;}
.user-btn-txt b{font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.user-btn-txt small{font-size:10.5px; color:#B9C9DA; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
@media (max-width:760px){ .user-btn-txt{display:none;} .user-btn{padding:3px 8px 3px 3px;} }
.foto-perfil{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
.foto-perfil .hint{font-size:11.5px; color:var(--ink-soft);}
.field select{border:1px solid var(--line); background:#fff; border-radius:var(--radius-sm); padding:10px 12px; font-size:14px; font-family:var(--font-body);}
.perm-matrix{border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; max-width:560px;}
.pm-head, .pm-row{display:grid; grid-template-columns:1.8fr repeat(3, 1fr); align-items:center; gap:8px; padding:9px 14px;}
.pm-head{background:var(--navy-100); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:var(--navy-deep);}
.pm-head span:not(:first-child), .pm-row .pm-check{text-align:center;}
.pm-row{border-top:1px solid var(--line-soft); font-size:13.5px;}
.pm-check input{width:17px; height:17px; accent-color:var(--navy); cursor:pointer;}
.pm-check input:disabled{cursor:default;}
.membro{border:1px solid var(--line-soft); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:12px;}
.membro-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:12px;}
.membro-info{flex:1; min-width:200px;}
.membro-nome{font-weight:700; color:var(--navy-deep); display:flex; align-items:center; gap:8px;}
.membro-sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.convite-linha{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 0; border-top:1px solid var(--line-soft);}
.convite-linha:first-child{border-top:none; padding-top:0;}
.convite-gerado{margin-top:18px; padding:14px 16px; border-radius:var(--radius-sm); background:var(--green-100); display:flex; flex-direction:column; gap:10px; font-size:13.5px;}
.convite-gerado input{border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-family:var(--font-mono); font-size:12.5px; background:#fff !important; color:var(--ink) !important;}
.completar-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px;
  background:linear-gradient(165deg,var(--navy) 0%, var(--navy-deep) 100%);}
.completar-card{max-width:620px; width:100%; margin:0;}

/* ---------- Personalização ---------- */
.pers-tabs{display:inline-flex; gap:4px; padding:4px; background:var(--paper-2); border-radius:999px; margin-bottom:18px; flex-wrap:wrap;}
.pers-tab{border:none; background:transparent; padding:8px 16px; border-radius:999px; font-weight:700; font-size:13px; color:var(--ink-soft); cursor:pointer; font-family:inherit;}
.pers-tab.active{background:var(--surface); color:var(--navy); box-shadow:var(--shadow);}
.pers-grid{display:grid; grid-template-columns:1.1fr 1fr; gap:28px; align-items:start;}
@media (max-width:980px){ .pers-grid{grid-template-columns:1fr;} }
.cor-campo{display:flex; gap:8px; align-items:center;}
.cor-campo input[type=color]{width:46px; height:42px; padding:3px; border:1px solid var(--line); border-radius:var(--radius-sm); background:#fff; cursor:pointer;}
.cor-campo input:not([type=color]){flex:1; font-family:var(--font-mono); text-transform:uppercase;}
.logo-campo{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.logo-amostra{height:58px; min-width:120px; max-width:220px; padding:8px 12px; border:1px dashed var(--line); border-radius:var(--radius-sm); background:#fff; display:flex; align-items:center; justify-content:center;}
.logo-amostra img{max-height:42px; max-width:196px; display:block;}
.pdf-previa{border:1px solid var(--line); border-radius:8px; overflow:hidden; box-shadow:var(--shadow); aspect-ratio:1.414/1;}
.pp-cabecalho{display:flex; align-items:center; gap:12px; padding:10px 12px;}
.pp-logo{background:#fff; border-radius:4px; padding:4px 7px; display:flex; align-items:center;}
.pp-logo img{height:22px; max-width:110px; display:block;}
.pp-titulo{display:flex; flex-direction:column; line-height:1.2;}
.pp-titulo b{font-size:12.5px;} .pp-titulo small{font-size:10px; opacity:0.85;}
.pp-corpo{padding:14px;}
.pp-tabela{border:1px solid rgba(0,0,0,0.12); border-radius:3px; overflow:hidden; background:#fff;}
.pp-th{font-size:10px; font-weight:700; padding:6px 8px;}
.pp-td{height:14px; border-top:1px solid rgba(0,0,0,0.08);}
.pessoas-lista{border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; max-width:760px;}
.pl-head, .pl-row{display:grid; grid-template-columns:1.4fr 1fr 40px; gap:10px; align-items:center; padding:8px 12px;}
.pl-head{background:var(--navy-100); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:var(--navy-deep);}
.pl-row{border-top:1px solid var(--line-soft);}
.pl-row input{border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13.5px; font-family:var(--font-body); min-width:0;}
.field select[data-bind]{border:1px solid var(--line); background:#fff; border-radius:var(--radius-sm); padding:10px 12px; font-size:14px; font-family:var(--font-body); color:var(--ink);}

/* ---------- Processos ---------- */
.proc-topo{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-top:18px;}
.proc-topo .field{min-width:230px;}
.field textarea{border:1px solid var(--line); background:#fff; border-radius:var(--radius-sm); padding:10px 12px; font-size:14px;
  font-family:var(--font-body); color:var(--ink); outline:none; resize:vertical;}
.field textarea:focus{border-color:var(--navy); box-shadow:0 0 0 3px rgba(23,58,94,0.12);}
.proc-itens td input{min-width:96px;}
.proc-itens td input.num-mono{min-width:72px;}
.proc-containers td select{min-width:110px;}
.proc-containers td input.num-mono{min-width:96px;}
.proc-resumo{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:18px;}
@media (max-width:760px){ .proc-resumo{grid-template-columns:1fr;} }
.proc-forn-topo{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
.proc-forn-topo .section-title{margin:0;}
.proc-forn-nome{color:var(--ink-soft); font-weight:600; text-transform:none; letter-spacing:0;}
.proc-forn-itens{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin:20px 0 10px;}
.proc-forn-rodape{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
.btn-perigo{color:var(--red, #b42318) !important; border-color:currentColor !important;}
.proc-total-tributos{margin-top:14px; font-size:14px; color:var(--ink-soft);}
.proc-total-tributos b{color:var(--navy-deep); font-family:var(--font-mono); font-size:15px;}
.proc-leitura input:disabled, .proc-leitura select:disabled, .proc-leitura textarea:disabled{background:var(--paper-2); color:var(--ink); cursor:default;}
.canal{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700;}
.canal::before{content:''; width:9px; height:9px; border-radius:50%; background:currentColor;}
.canal-verde{color:#2F6B4F;} .canal-amarelo{color:#B8860B;} .canal-vermelho{color:#B23A32;} .canal-cinza{color:#6B7280;}
@media (max-width:760px){
  /* Em uma coluna só, campos largos (span 2/3) não podem criar colunas extras */
  .field-row > .field{grid-column:auto !important; min-width:0;}
  .proc-topo, .proc-topo .field{width:100%;}
  .proc-topo .btn-row{width:100%;}
  .proc-topo .field{min-width:0;}
}

/* ---------- Processos: cards e Template ---------- */
.proc-barra{display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:18px;}
.proc-barra-dir{align-items:flex-end;}
.modo-toggle{display:inline-flex; border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; background:#fff;}
.modo-toggle button{border:none; background:transparent; padding:10px 14px; font-weight:700; font-size:13px; color:var(--ink-soft); cursor:pointer; font-family:inherit;}
.modo-toggle button.active{background:var(--navy); color:#fff;}
.btn.ativo{background:var(--navy-100);}
.proc-template{border-color:var(--navy-100);}
.proc-template-topo{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
.proc-template-topo .section-title svg{width:16px; height:16px;}
.tpl-grupos{display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;}
@media (max-width:980px){ .tpl-grupos{grid-template-columns:repeat(2, 1fr);} }
@media (max-width:620px){ .tpl-grupos{grid-template-columns:1fr;} }
.tpl-grupo{border:1px solid var(--line-soft); border-radius:var(--radius-sm); padding:12px 14px; background:var(--paper);}
.tpl-grupo-topo{display:flex; align-items:baseline; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
.tpl-grupo-topo b{color:var(--navy-deep); font-size:13.5px;}
.tpl-grupo-topo .link-btn{margin-left:auto;}
.link-btn{border:none; background:none; color:var(--navy); font-weight:700; font-size:12px; cursor:pointer; padding:0; font-family:inherit; text-decoration:underline;}
.tpl-campo{display:flex; align-items:center; gap:8px; font-size:13px; padding:4px 0; cursor:pointer;}
.tpl-campo input{width:16px; height:16px; accent-color:var(--navy); flex-shrink:0;}
.proc-cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:14px;}
.proc-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; display:flex; flex-direction:column; gap:12px;}
.pc-topo{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.pc-num{font-family:var(--font-mono); font-size:15px; color:var(--navy-deep);}
.pc-campos{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; margin:0; font-size:13px;}
.pc-campos dt{color:var(--ink-soft);}
.pc-campos dd{margin:0; font-weight:600; word-break:break-word;}
.pc-acoes{display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-top:auto; border-top:1px solid var(--line-soft); padding-top:10px;}
.pc-acoes .ci-actions{display:flex; gap:6px;}
.vazio{color:var(--ink-soft); font-weight:400;}

/* ---------- Cotações Salvas: Template e cards ---------- */
.cot-barra{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
.tpl-colunas{columns:3 220px; column-gap:18px;}
.tpl-colunas .tpl-campo{break-inside:avoid;}
.kanban-card-top{gap:6px;}
.kanban-card-acoes{margin-left:auto;}
.kanban-card-acoes .ci-actions{gap:2px;}
.kanban-card-acoes .icon-btn{width:26px; height:26px;}
.kanban-card-acoes .icon-btn svg{width:13px; height:13px;}
.kanban-card-campos{display:grid; grid-template-columns:minmax(0, 38%) minmax(0, 1fr); column-gap:8px; row-gap:5px;
  border-top:1px solid var(--line-soft); padding-top:8px; font-size:11.5px; line-height:1.4; text-align:left;}
.kc-linha{display:contents;}
.kc-rot{color:var(--ink-soft); overflow-wrap:anywhere;}
.kc-val{color:var(--ink); font-weight:600; overflow-wrap:anywhere; min-width:0;}
.kc-val .badge{font-size:10px; padding:2px 8px; vertical-align:1px;}
/* As colunas não alargam com textos longos; o topo do card quebra linha em vez de estourar */
.kanban-card{min-width:0;}
.kanban-card-top{flex-wrap:wrap; row-gap:6px;}

/* ---------- Processos: data de abertura e filtros ---------- */
.proc-topo-campos{display:flex; gap:14px; flex-wrap:wrap;}
.proc-topo-campos .field{min-width:200px;}
.proc-filtros{margin-bottom:16px;}
.filtro-periodo .periodo{display:flex; align-items:center; gap:6px;}
.filtro-periodo .periodo span{font-size:12px; color:var(--ink-soft);}
.filtro-periodo .periodo input{min-width:0; width:150px;}
@media (max-width:760px){
  .proc-topo-campos{width:100%;}
  .proc-topo-campos .field{min-width:0; flex:1 1 140px;}
  .filtro-periodo .periodo input{width:auto; flex:1;}
}
.aviso-lista{display:block; margin-top:4px; font-size:11.5px; color:var(--amber-deep);}
.aviso-lista .link-btn{color:inherit; font-size:inherit;}

/* ---------- Cadastros: lista e cards ---------- */
.cad-cel-nome{display:flex; align-items:center; gap:10px; min-width:180px;}
.cad-cel-nome .cad-avatar{width:32px; height:32px; font-size:12px; flex-shrink:0;}
.cad-cel-nome .cad-avatar-lg{width:36px; height:36px;}
.cad-card-topo{justify-content:flex-start; gap:12px; align-items:center;}
.cad-card-nome{display:block; color:var(--navy-deep); font-size:14.5px; margin-bottom:4px; word-break:break-word;}

<body>
<div id="app"></div>
<div id="toast-wrap"></div>
<div id="ac-dropdown" class="ac-dropdown" style="display:none;"></div>
<script>
/* =========================================================================
   MANIFESTO — ERP de Importação Simplificada
   Baseado na planilha "Simulação Importação Simplificada"
   ========================================================================= */

/* ---------------------------- Utilidades ------------------------------- */
function num(v){ v = typeof v==='string' ? v.replace(',', '.') : v; const n = parseFloat(v); return isFinite(n) ? n : 0; }
function sum(arr){ return arr.reduce((a,b)=>a+(num(b)||0),0); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtBRL(n){ return (num(n)).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtUSD(n){ return (num(n)).toLocaleString('en-US',{style:'currency',currency:'USD'}); }
function fmtMoedaExt(n, moeda){
  const v = num(n);
  if(moeda==='EUR') return v.toLocaleString('de-DE',{style:'currency',currency:'EUR'});
  if(moeda==='RMB') return 'CN¥ '+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return v.toLocaleString('en-US',{style:'currency',currency:'USD'}); // USD (padrão)
}
function fmtNum(n,d=2){ return (num(n)).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtPct(n){ return (num(n)*100).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%'; }
function fmtPctEdit(n){
  let v = Math.round(num(n)*100*10000)/10000; // elimina ruído de ponto flutuante (ex: 7.000000000000001 -> 7)
  if(!isFinite(v)) v = 0;
  let s = v.toFixed(4).replace(/0+$/,'').replace(/\.$/,'');
  if(s===''||s==='-0') s = '0';
  return s.replace('.', ',');
}
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function fmtBytes(n){ n=num(n); if(n<1024) return n+' B'; if(n<1024*1024) return (n/1024).toFixed(1)+' KB'; return (n/1024/1024).toFixed(2)+' MB'; }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function getPath(obj, path){ return path.split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj); }
function setPath(obj, path, val){
  const parts = path.split('.'); let o = obj;
  for(let i=0;i<parts.length-1;i++){ o = o[parts[i]]; }
  o[parts[parts.length-1]] = val;
}
function toast(msg, kind){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = (kind==='ok'?ICONS.check:ICONS.info) + '<span>'+esc(msg)+'</span>';
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s ease'; el.style.opacity='0'; setTimeout(()=>el.remove(),320); }, 2600);
}

/* ------------------------------ Storage --------------------------------- */
// Cotações, simulações e cadastros são da EMPRESA (tabela dados_empresa no Supabase), compartilhados
// pela equipe conforme as permissões de cada pessoa (as regras do banco conferem tudo de novo).
// Rascunhos e filtros ficam só neste navegador, separados por usuário.
// Cada chave tem uma versão: se outra pessoa salvou antes, as alterações são mescladas item a item.
const sb = window.comextaSupabase;
const CHAVE_LOCAL = /:draft$|^filtros(Todas|Proc|Cot):/;
const CHAVES_SERVIDOR = ['cotacoes:index','cotacoesFormal:index','simulacoes:index','clientes:list','fornecedores:list','produtos:list','processos:index'];
const SECAO_DA_CHAVE = {
  'cotacoes:index':'cotacoes', 'cotacoesFormal:index':'cotacoes', 'simulacoes:index':'simulador',
  'clientes:list':'cadastros', 'fornecedores:list':'cadastros', 'produtos:list':'cadastros',
  'processos:index':'processos',
};
const ESTADO_DA_CHAVE = {
  'cotacoes:index':'cotacoesIndex', 'cotacoesFormal:index':'cotacoesFormalIndex', 'simulacoes:index':'simulacoesIndex',
  'clientes:list':'clientes', 'produtos:list':'produtos',
  'processos:index':'processosIndex',
};
// Itens numerados em sequência: se dois usuários criarem o mesmo número ao mesmo tempo, o segundo é renumerado.
const NUMERACAO_DA_CHAVE = {
  'cotacoes:index':{ prefixo:'COT-', atual:'currentCotacaoId' },
  'cotacoesFormal:index':{ prefixo:'COTF-', atual:'currentCotacaoFormalId' },
  'simulacoes:index':{ prefixo:'SIM-', atual:'currentSimulacaoId' },
  'processos:index':{ prefixo:'PRC-', atual:'currentProcessoId' },
};
const SECOES = { cadastros:'Cadastros', cotacoes:'Cotações (nova e salvas)', simulador:'Simulador de Carga', processos:'Processos' };

let usuarioAtual = null; // { id, email, nome, telefone, cargo, foto, papel, permissoes, convidado, empresa_id }
let empresaAtual = null;
const chaveLocal = key => 'comexta:u:' + usuarioAtual.id + ':' + key;
const versoes = {};        // versão no servidor de cada chave carregada
const bases = {};          // último valor lido/gravado no servidor (base da mescla)
const filasGravacao = {};  // grava cada chave em ordem
// A base precisa ser uma cópia própria: o ERP altera as listas do estado no lugar.
const copia = v => v==null ? v : JSON.parse(JSON.stringify(v));
let gravacoesPendentes = 0;

function pode(secao, acao){
  if(!usuarioAtual) return false;
  if(usuarioAtual.papel==='admin') return true;
  const p = (usuarioAtual.permissoes||{})[secao] || {};
  if(acao==='ver') return !!(p.ver || p.criar || p.editar);
  return !!p[acao];
}
const souAdmin = () => !!usuarioAtual && usuarioAtual.papel==='admin';

function sessaoExpirada(){ window.location.href = '/login/'; }
const erroDeSessao = error => error && (error.code==='PGRST301' || error.code==='PGRST303' || /jwt/i.test(error.message||''));

async function carregarUsuario(){
  const { data } = await sb.auth.getSession();
  const session = data.session;
  if(!session){ sessaoExpirada(); return false; }
  // "Lembrar-me" desmarcado no login: a sessão acaba quando o navegador é fechado.
  let lembrar = '1', sessaoAtiva = '1';
  try{ lembrar = localStorage.getItem('comexta-lembrar') || '1'; sessaoAtiva = sessionStorage.getItem('comexta-sessao-ativa'); }catch(e){}
  if(lembrar==='0' && !sessaoAtiva){ await sb.auth.signOut({ scope:'local' }); sessaoExpirada(); return false; }

  await carregarPerfilEEmpresa(session.user.id);
  sb.auth.onAuthStateChange((evento, sessao)=>{ if(evento==='SIGNED_OUT' || !sessao) sessaoExpirada(); });
  return true;
}

async function carregarPerfilEEmpresa(userId){
  const { data: perfil, error } = await sb.from('perfis').select('*').eq('user_id', userId || usuarioAtual.id).maybeSingle();
  if(erroDeSessao(error)){ sessaoExpirada(); throw new Error('Sessão expirada'); }
  if(error) throw new Error('Falha ao carregar perfil: ' + error.message);
  if(!perfil) throw new Error('Perfil não encontrado: rode supabase/schema.sql no Supabase.');
  usuarioAtual = { id: perfil.user_id, ...perfil };
  if(!perfil.preferencias){ try{ const loc = localStorage.getItem('comexta:u:' + perfil.user_id + ':preferencias'); if(loc) usuarioAtual.preferencias = JSON.parse(loc); }catch(e){} }
  const { data: empresa, error: e2 } = await sb.from('empresas').select('*').eq('id', perfil.empresa_id).maybeSingle();
  if(e2) throw new Error('Falha ao carregar empresa: ' + e2.message);
  empresaAtual = empresa || { id: perfil.empresa_id };
}

async function sair(){
  await sb.auth.signOut({ scope:'local' });
  window.location.href = '/login/';
}

async function storeGetMany(keys){
  const valores = {};
  for(const k of keys.filter(k=>CHAVE_LOCAL.test(k))){
    try{ const raw = localStorage.getItem(chaveLocal(k)); valores[k] = raw!==null ? JSON.parse(raw) : null; }
    catch(e){ valores[k] = null; }
  }
  const remotas = keys.filter(k=>!CHAVE_LOCAL.test(k) && pode(SECAO_DA_CHAVE[k], 'ver'));
  keys.filter(k=>!CHAVE_LOCAL.test(k)).forEach(k=>{ valores[k] = null; });
  if(remotas.length){
    const { data, error } = await sb.from('dados_empresa').select('chave, valor, versao').in('chave', remotas);
    if(erroDeSessao(error)){ sessaoExpirada(); throw new Error('Sessão expirada'); }
    if(error) throw new Error('Falha ao carregar dados: ' + error.message);
    remotas.forEach(k=>{ versoes[k] = 0; bases[k] = null; });
    data.forEach(l=>{ valores[l.chave] = l.valor; versoes[l.chave] = l.versao; bases[l.chave] = copia(l.valor); });
  }
  return valores;
}
async function storeGet(key){ return (await storeGetMany([key]))[key]; }

// Mescla de listas de itens com "id": parte do que está no servidor agora e aplica o que este
// usuário mudou em relação à base (itens novos, alterados e excluídos).
function mesclarListas(key, base, local, remoto){
  const temIds = a => Array.isArray(a) && a.every(x=>x && x.id!=null);
  if(!temIds(local) || !temIds(remoto) || (base!=null && !temIds(base))) return { valor: local, renumerados: [] };
  const porId = a => new Map((a||[]).map(x=>[String(x.id), x]));
  const B = porId(base), L = porId(local), R = porId(remoto);
  const igual = (a,b) => JSON.stringify(a)===JSON.stringify(b);
  const numeracao = NUMERACAO_DA_CHAVE[key];
  const renumerados = [];
  let maxSeq = Math.max(0, ...remoto.map(x=>x.seq||0), ...local.map(x=>x.seq||0));
  const resultado = remoto.filter(x=>{
    const id = String(x.id);
    return !(B.has(id) && !L.has(id)); // excluído por este usuário
  }).map(x=>{
    const id = String(x.id), meu = L.get(id), b = B.get(id);
    return (meu && b && !igual(meu, b)) ? meu : x; // alterado por este usuário
  });
  for(const item of local){
    const id = String(item.id);
    if(B.has(id)) continue;                 // já existia: tratado acima
    if(!R.has(id)){ resultado.push(item); continue; }   // novo deste usuário
    if(igual(R.get(id), item)) continue;
    // Mesmo id criado pelos dois ao mesmo tempo
    if(numeracao){
      maxSeq += 1;
      const novoId = numeracao.prefixo + String(maxSeq).padStart(4,'0');
      renumerados.push({ de:item.id, para:novoId });
      resultado.push({ ...item, id:novoId, seq:maxSeq });
    }else{
      resultado.push({ ...item, id: item.id + '-' + uid() });
    }
  }
  return { valor: resultado, renumerados };
}

function aplicarNoEstado(key, valor){
  const campo = ESTADO_DA_CHAVE[key];
  if(!campo) return;
  if(key==='produtos:list') state.produtos = (valor||[]).map(normalizeProdutoCadastro);
  else if(key==='clientes:list') state.clientes = (valor||[]).map(e=>({ ...e, tipoCadastro: e.tipoCadastro || 'cliente' }));
  else state[campo] = valor || [];
}

function gravarNoServidor(key){
  gravacoesPendentes++;
  const tarefa = (filasGravacao[key] || Promise.resolve()).then(async ()=>{
    try{
      // Usa o valor mais recente do estado no momento em que chega a vez desta gravação.
      let valor = JSON.parse(JSON.stringify(state[ESTADO_DA_CHAVE[key]] ?? null));
      let mesclou = false;
      for(let tentativa=0; tentativa<5; tentativa++){
        const { data: nova, error } = await sb.rpc('salvar_dado', { p_chave:key, p_valor:valor, p_versao:versoes[key]||0 });
        if(erroDeSessao(error)){ sessaoExpirada(); return false; }
        if(error){
          console.error('storage set failed', key, error);
          toast(/sem_permissao/.test(error.message) ? 'Você não tem permissão para salvar nesta área.'
            : /too large|payload|413/i.test(error.message||'') ? 'Os dados ficaram grandes demais para salvar. Remova anexos ou fotos muito pesados.'
            : 'Não foi possível salvar no servidor. Tente novamente.');
          return false;
        }
        if(nova){
          versoes[key] = nova; bases[key] = copia(valor);
          if(mesclou){
            aplicarNoEstado(key, copia(valor));
            renderApp();
          }
          return true;
        }
        // Conflito: alguém salvou antes. Busca a versão nova e mescla.
        const { data: linha, error: e2 } = await sb.from('dados_empresa').select('valor, versao').eq('chave', key).maybeSingle();
        if(e2) throw e2;
        const { valor: mesclado, renumerados } = mesclarListas(key, bases[key], valor, linha ? linha.valor : null);
        const numeracao = NUMERACAO_DA_CHAVE[key];
        for(const r of renumerados){
          if(numeracao && state[numeracao.atual]===r.de) state[numeracao.atual] = r.para;
          toast(`O número ${r.de} já tinha sido usado por outra pessoa. Seu registro foi salvo como ${r.para}.`, 'ok');
        }
        valor = mesclado;
        versoes[key] = linha ? linha.versao : 0;
        bases[key] = linha ? copia(linha.valor) : null;
        mesclou = true;
      }
      toast('Muitas alterações simultâneas. Recarregue a página e tente de novo.');
      return false;
    }catch(e){
      console.error('storage set failed', key, e);
      toast('Sem conexão: as últimas alterações não foram salvas no servidor.');
      return false;
    }finally{ gravacoesPendentes--; }
  });
  filasGravacao[key] = tarefa;
  return tarefa;
}
async function storeSet(key, value){
  if(CHAVE_LOCAL.test(key)){
    try{ localStorage.setItem(chaveLocal(key), JSON.stringify(value)); return true; }
    catch(e){ console.error('storage set failed', key, e); return false; }
  }
  const secao = SECAO_DA_CHAVE[key];
  if(!(pode(secao, 'criar') || pode(secao, 'editar'))){
    toast('Você não tem permissão para salvar em ' + SECOES[secao] + '.');
    return false;
  }
  if(ESTADO_DA_CHAVE[key] && state[ESTADO_DA_CHAVE[key]]!==value) aplicarNoEstado(key, value);
  return gravarNoServidor(key);
}
async function storeDelete(key){
  if(CHAVE_LOCAL.test(key)){
    try{ localStorage.removeItem(chaveLocal(key)); return true; }
    catch(e){ return false; }
  }
  aplicarNoEstado(key, []);
  return storeSet(key, state[ESTADO_DA_CHAVE[key]]);
}
window.addEventListener('beforeunload', (e)=>{
  if(gravacoesPendentes>0){ e.preventDefault(); e.returnValue = ''; }
});

// Traz alterações feitas por outras pessoas da equipe (ao voltar para a aba e a cada 90 s).
async function atualizarDaEquipe(){
  if(!usuarioAtual || gravacoesPendentes>0 || document.hidden) return;
  const visiveis = CHAVES_SERVIDOR.filter(k=>pode(SECAO_DA_CHAVE[k], 'ver'));
  if(!visiveis.length) return;
  const { data, error } = await sb.from('dados_empresa').select('chave, versao').in('chave', visiveis);
  if(error || !data) return;
  const mudaram = data.filter(l=>l.versao!==(versoes[l.chave]||0)).map(l=>l.chave);
  if(!mudaram.length) return;
  const { data: linhas, error: e2 } = await sb.from('dados_empresa').select('chave, valor, versao').in('chave', mudaram);
  if(e2 || !linhas || gravacoesPendentes>0) return;
  linhas.forEach(l=>{ versoes[l.chave] = l.versao; bases[l.chave] = copia(l.valor); aplicarNoEstado(l.chave, l.valor); });
  // Não redesenha com um formulário de cadastro aberto, para não atrapalhar quem está digitando.
  if(!state.cadFormOpen) renderApp();
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) atualizarDaEquipe(); });
setInterval(atualizarDaEquipe, 90000);

// Antes do login por usuário, os dados ficavam soltos no navegador ("comexta:<chave>").
// Se a empresa ainda estiver vazia, oferece ao administrador importar esses dados — só com
// confirmação, porque o navegador pode ser compartilhado e os dados podem ser de outra pessoa.
async function importarDadosAntigos(valores){
  if(!souAdmin()) return false;
  const todas = [...CHAVES_SERVIDOR, 'dados:draft', 'dadosFormal:draft', 'simulacao:draft'];
  const antigos = {};
  for(const k of todas){
    try{ const raw = localStorage.getItem('comexta:'+k); if(raw!==null) antigos[k] = JSON.parse(raw); }catch(e){}
  }
  if(!CHAVES_SERVIDOR.some(k=>antigos[k]!=null)) return false;
  if(CHAVES_SERVIDOR.some(k=>valores[k]!=null)) return false;
  const ok = confirm('Encontramos cotações e cadastros salvos neste navegador antes do login por usuário.\n\n'
    + 'Deseja importá-los para a empresa ' + (empresaAtual.nome_fantasia || '') + ' (conta ' + usuarioAtual.email + ')?\n\n'
    + 'Clique em Cancelar se esses dados não forem seus.');
  if(!ok) return false;
  for(const k of CHAVES_SERVIDOR.filter(k=>antigos[k]!=null)) aplicarNoEstado(k, antigos[k]);
  const resultados = await Promise.all(CHAVES_SERVIDOR.filter(k=>antigos[k]!=null).map(k=>gravarNoServidor(k)));
  if(resultados.some(r=>!r)){ toast('Não foi possível importar tudo. Tente recarregar a página.'); return false; }
  for(const k of todas){
    if(antigos[k]==null) continue;
    if(CHAVE_LOCAL.test(k)) await storeSet(k, antigos[k]);
    else valores[k] = antigos[k];
    localStorage.removeItem('comexta:'+k);
  }
  toast('Dados importados para a empresa.', 'ok');
  return true;
}

/* ----------------------------- Permissões na tela ---------------------------- */
// Ação (data-action) → [área, ação necessária]. 'salvar' decide entre criar e editar na hora do clique.
const PERMISSAO_DA_ACAO = {
  'toggle-nav:imp':['cotacoes','ver'], 'toggle-module:imp':['cotacoes','ver'], 'go:cotacoesTodas':['cotacoes','ver'],
  'go:numerario':['cotacoes','ver'], 'go:numerarioFormal':['cotacoes','ver'],
  'abrir-cotacao':['cotacoes','ver'], 'abrir-cotacao-formal':['cotacoes','ver'],
  'go:dados':['cotacoes','criar'], 'go:dadosFormal':['cotacoes','criar'],
  'nova-cotacao':['cotacoes','criar'], 'nova-cotacao-formal':['cotacoes','criar'],
  'duplicar-cotacao':['cotacoes','criar'], 'duplicar-cotacao-formal':['cotacoes','criar'],
  'excluir-cotacao':['cotacoes','editar'], 'excluir-cotacao-formal':['cotacoes','editar'],
  'save-calculo':['cotacoes','salvar'], 'save-calculo-formal':['cotacoes','salvar'],

  'toggle-nav:sim':['simulador','ver'], 'go:simInicio':['simulador','ver'], 'abrir-simulacao':['simulador','ver'],
  'nova-simulacao':['simulador','criar'], 'salvar-simulacao':['simulador','salvar'],
  'excluir-simulacao':['simulador','editar'], 'renomear-simulacao':['simulador','editar'], 'salvar-nome-simulacao':['simulador','editar'],

  'toggle-nav:cad':['cadastros','ver'], 'toggle-module:cad':['cadastros','ver'],
  'go:cad-cliente':['cadastros','ver'], 'go:cad-fornecedor':['cadastros','ver'], 'go:cad-produto':['cadastros','ver'],
  'cad-view':['cadastros','ver'], 'cad-open-form':['cadastros','criar'],
  'cad-edit':['cadastros','editar'], 'cad-view-edit':['cadastros','editar'], 'cad-delete':['cadastros','editar'],
  'cad-save':['cadastros','salvar'],
  'cadtpl-modo':['cadastros','ver'], 'cadtpl-abrir':['cadastros','ver'],
  'exportar:cot':['cotacoes','ver'], 'exportar:proc':['processos','ver'], 'exportar:cad-cliente':['cadastros','ver'], 'exportar:cad-produto':['cadastros','ver'],

  'toggle-nav:proc':['processos','ver'], 'toggle-module:proc':['processos','ver'], 'go:processos':['processos','ver'],
  'go:processoForm':['processos','ver'], 'proc-abrir':['processos','ver'], 'proc-novo':['processos','criar'],
  'proc-excluir':['processos','editar'], 'proc-salvar':['processos','salvar'], 'proc-numerario-pdf':['processos','ver'], 'proc-duplicar':['processos','criar'],
  'proc-template':['processos','ver'], 'proc-modo':['processos','ver'],
};
const SECAO_DO_GRUPO = { imp:'cotacoes', sim:'simulador', cad:'cadastros', proc:'processos' };

function permissaoDaAcao(action){
  return PERMISSAO_DA_ACAO[action] || PERMISSAO_DA_ACAO[action.split(':')[0]] || null;
}
// "Salvar": novo registro exige criar; registro já salvo exige editar.
function acaoDeSalvar(action){
  if(action.startsWith('save-calculo-formal')) return state.currentCotacaoFormalId ? 'editar' : 'criar';
  if(action.startsWith('save-calculo')) return state.currentCotacaoId ? 'editar' : 'criar';
  if(action.startsWith('salvar-simulacao')) return state.currentSimulacaoId ? 'editar' : 'criar';
  if(action.startsWith('cad-save')) return (state.cadEdit && state.cadEdit.id) ? 'editar' : 'criar';
  if(action.startsWith('proc-salvar')) return state.currentProcessoId ? 'editar' : 'criar';
  return 'editar';
}
function acaoPermitida(action){
  const p = permissaoDaAcao(action);
  if(!p) return true;
  const [secao, acao] = p;
  if(acao==='salvar') return pode(secao, acaoDeSalvar(action));
  return pode(secao, acao);
}
const NOME_ACAO = { ver:'visualizar', criar:'criar', editar:'editar' };
function avisoSemPermissao(action){
  const [secao, acao] = permissaoDaAcao(action);
  const a = acao==='salvar' ? acaoDeSalvar(action) : acao;
  toast(`Você não tem permissão para ${NOME_ACAO[a]} em ${SECOES[secao]}. Fale com o administrador da empresa.`);
}

// Esconde o que o usuário não pode usar (menus, cartões e botões).
function aplicarPermissoesNaTela(){
  const app = document.getElementById('app');
  for(const el of app.querySelectorAll('[data-action]')){
    const action = el.getAttribute('data-action');
    const p = permissaoDaAcao(action);
    if(!p) continue;
    const [secao, acao] = p;
    const visivel = acao==='salvar' ? (pode(secao,'criar') || pode(secao,'editar')) : pode(secao, acao);
    if(!visivel) el.style.display = 'none';
  }
  for(const [grupo, secao] of Object.entries(SECAO_DO_GRUPO)){
    if(pode(secao, 'ver')) continue;
    const card = app.querySelector('#mod-'+grupo);
    if(card) card.style.display = 'none';
    const btn = app.querySelector(`[data-action="toggle-nav:${grupo}"]`);
    if(btn && btn.closest('.nav-group')) btn.closest('.nav-group').style.display = 'none';
  }
  // Submenus que ficaram vazios (ex.: "Importação Simplificada" sem "Nova Cotação")
  for(const pai of app.querySelectorAll('.nav-drop-item-parent')){
    const itens = [...pai.querySelectorAll('.nav-drop-item')];
    if(itens.length && itens.every(i=>i.style.display==='none')) pai.style.display = 'none';
  }
}

// Rotas: quem não vê a área não entra; "Nova Cotação" sem ter uma cotação aberta exige criar.
function rotaPermitida(route){
  const meta = ROUTE_META[route];
  if(!meta || !meta.group) return true;
  const secao = SECAO_DO_GRUPO[meta.group];
  if(!pode(secao, 'ver')) return false;
  if(route==='dados' && !state.currentCotacaoId && !pode('cotacoes','criar')) return false;
  if(route==='dadosFormal' && !state.currentCotacaoFormalId && !pode('cotacoes','criar')) return false;
  if(route==='processoForm' && !state.currentProcessoId && !pode('processos','criar')) return false;
  return true;
}

const CFG_ACOES = ['ver','criar','editar'];

function avatarHtml(perfil, tamanho){
  const t = tamanho || 34;
  const estilo = `width:${t}px;height:${t}px;font-size:${Math.round(t*0.38)}px;`;
  if(perfil && perfil.foto) return `<span class="avatar" style="${estilo}"><img src="${esc(perfil.foto)}" alt=""></span>`;
  return `<span class="avatar" style="${estilo}">${esc(initials((perfil && (perfil.nome || perfil.email)) || '?'))}</span>`;
}
function nomeEmpresa(){ return (empresaAtual && (empresaAtual.nome_fantasia || empresaAtual.razao_social)) || 'Minha empresa'; }
function perfilIncompleto(){ return !!usuarioAtual && usuarioAtual.convidado && (!usuarioAtual.telefone || !usuarioAtual.cargo); }

function permissoesPadraoConvite(){
  return { cadastros:{ver:true,criar:false,editar:false}, cotacoes:{ver:true,criar:false,editar:false}, simulador:{ver:true,criar:false,editar:false}, processos:{ver:true,criar:false,editar:false} };
}
function matrizPermissoesHtml(prefixo, permissoes, desabilitada){
  const p = permissoes || {};
  return `<div class="perm-matrix">
    <div class="pm-head"><span>Área</span>${CFG_ACOES.map(a=>`<span>${a==='ver'?'Visualizar':a==='criar'?'Criar':'Editar'}</span>`).join('')}</div>
    ${Object.entries(SECOES).map(([secao, rotulo])=>`
      <div class="pm-row"><span>${esc(rotulo)}</span>
        ${CFG_ACOES.map(a=>`<label class="pm-check"><input type="checkbox" data-perm="${prefixo}:${secao}:${a}"
          ${(p[secao]||{})[a] ? 'checked' : ''} ${desabilitada ? 'disabled' : ''}></label>`).join('')}
      </div>`).join('')}
  </div>`;
}
function lerMatriz(prefixo){
  const p = {};
  for(const secao of Object.keys(SECOES)){
    p[secao] = {};
    for(const a of CFG_ACOES){
      const el = document.querySelector(`[data-perm="${prefixo}:${secao}:${a}"]`);
      p[secao][a] = !!(el && el.checked);
    }
    if(p[secao].criar || p[secao].editar) p[secao].ver = true;
  }
  return p;
}
function resumoPermissoes(perfil){
  if(perfil.papel==='admin') return 'Acesso total';
  const partes = Object.entries(SECOES).map(([secao, rotulo])=>{
    const p = (perfil.permissoes||{})[secao] || {};
    const acoes = [p.ver||p.criar||p.editar ? 'ver' : null, p.criar ? 'criar' : null, p.editar ? 'editar' : null].filter(Boolean);
    return acoes.length ? `${rotulo.split(' ')[0]}: ${acoes.join(', ')}` : null;
  }).filter(Boolean);
  return partes.length ? partes.join(' · ') : 'Sem acesso às áreas';
}

function linkConvite(c){ return window.location.origin + '/login/?convite=' + encodeURIComponent(c.token); }

async function carregarEquipe(){
  if(state.cfgCarregandoEquipe) return;
  state.cfgCarregandoEquipe = true;
  try{
    const [{ data: equipe, error: e1 }, { data: convites, error: e2 }] = await Promise.all([
      sb.from('perfis').select('user_id, email, nome, telefone, cargo, foto, papel, permissoes, criado_em').order('criado_em'),
      sb.from('convites').select('*').is('aceito_em', null).order('criado_em', { ascending:false }),
    ]);
    if(e1 || e2) throw (e1 || e2);
    state.cfgEquipe = equipe; state.cfgConvites = convites;
  }catch(err){
    console.error(err);
    toast('Não foi possível carregar a equipe.');
    state.cfgEquipe = state.cfgEquipe || []; state.cfgConvites = state.cfgConvites || [];
  }finally{
    state.cfgCarregandoEquipe = false;
    if(state.route==='config') renderApp();
  }
}

// Reduz a foto para 256×256 (recorte central) em JPEG, para guardar leve no perfil.
function reduzirFoto(arquivo){
  return new Promise((resolve, reject)=>{
    if(!arquivo || !/^image\//.test(arquivo.type)) return reject(new Error('Escolha um arquivo de imagem.'));
    const img = new Image();
    const url = URL.createObjectURL(arquivo);
    img.onload = ()=>{
      const lado = 256, menor = Math.min(img.width, img.height);
      const canvas = document.createElement('canvas');
      canvas.width = lado; canvas.height = lado;
      canvas.getContext('2d').drawImage(img, (img.width-menor)/2, (img.height-menor)/2, menor, menor, 0, 0, lado, lado);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('Não foi possível ler esta imagem.')); };
    img.src = url;
  });
}
async function onFotoSelecionada(input){
  try{ state.cfgFotoNova = await reduzirFoto(input.files && input.files[0]); renderApp(); }

async function salvarPerfil(obrigarContato){

}

async function salvarEmpresa(){
  const campos = ['nome_fantasia','razao_social','cnpj','inscricao_estadual','telefone','email','site','cep','logradouro','numero','complemento','bairro','cidade','uf','pais'];
  const dados = Object.fromEntries(campos.map(c=>[c, valorCampo('emp-'+c)]));
  dados.uf = dados.uf.toUpperCase();
  if(!dados.nome_fantasia) return toast('Informe o nome fantasia da empresa.');
  const cnpjNum = dados.cnpj.replace(/\D/g,'');
  if(cnpjNum && !cnpjValido(cnpjNum)) return toast('CNPJ inválido. Confira os números.');
  dados.atualizado_em = new Date().toISOString();
  const { error } = await sb.from('empresas').update(dados).eq('id', empresaAtual.id);
  if(error){ console.error(error); return toast('Não foi possível salvar os dados da empresa.'); }
  Object.assign(empresaAtual, dados);
  toast('Dados da empresa salvos.', 'ok');
  renderApp();
}

function cnpjValido(c){
  if(!/^\d{14}$/.test(c) || /^(\d)\1{13}$/.test(c)) return false;
  const calc = (base) => {
    let soma = 0, peso = base.length - 7;
    for(let i=0;i<base.length;i++){ soma += Number(base[i]) * peso--; if(peso < 2) peso = 9; }
    const r = soma % 11; return r < 2 ? 0 : 11 - r;
  };
  const d1 = calc(c.slice(0,12)), d2 = calc(c.slice(0,12) + d1);
  return c.endsWith(String(d1) + String(d2));
}
function mascaraCnpj(v){
  const d = v.replace(/\D/g,'').slice(0,14);
  return d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3')
          .replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2');
}
async function buscarCep(cep){
  const d = cep.replace(/\D/g,'');
  if(d.length!==8) return;
  try{
    const r = await fetch('https://viacep.com.br/ws/'+d+'/json/').then(r=>r.json());
    if(r.erro) return toast('CEP não encontrado.');
    const set = (id, v) => { const el = document.getElementById('emp-'+id); if(el && v && !el.value) el.value = v; };
    set('logradouro', r.logradouro); set('bairro', r.bairro); set('cidade', r.localidade); set('uf', r.uf);
    const num = document.getElementById('emp-numero'); if(num) num.focus();
  }catch(e){ /* sem internet: segue preenchimento manual */ }
}

async function salvarAcesso(userId){
  const papelEl = document.querySelector(`[data-papel="${userId}"]`);
  const papel = papelEl ? papelEl.value : 'membro';
  const permissoes = lerMatriz('m-'+userId);
  const { error } = await sb.rpc('definir_acesso', { p_user:userId, p_papel:papel, p_permissoes:permissoes });
  if(error){
    console.error(error);
    return toast(/ultimo_admin/.test(error.message) ? 'A empresa precisa de pelo menos um administrador.' : 'Não foi possível salvar o acesso.');
  }

function hexParaRgb(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex||'').trim());
  if(!m) return [255,255,255];
  const n = parseInt(m[1], 16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
// Texto branco ou escuro, o que tiver mais contraste com a cor de fundo.
function corTextoSobre(rgb){
  const lin = v => { v /= 255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
  const L = 0.2126*lin(rgb[0]) + 0.7152*lin(rgb[1]) + 0.0722*lin(rgb[2]);
  return (1.05)/(L+0.05) >= (L+0.05)/(0.05) ? [255,255,255] : [20,30,40];
}

// Pinta o fundo de todas as páginas do PDF, inclusive as criadas automaticamente pelas tabelas.
function prepararFundoPdf(doc){
  const cor = hexParaRgb(estiloCotacao().corFundo);
  if(cor.join()==='255,255,255') return;
  const pintar = ()=>{
    const w = doc.internal.pageSize.getWidth(), h = doc.internal.pageSize.getHeight();
    doc.setFillColor(cor[0], cor[1], cor[2]);
    doc.rect(0, 0, w, h, 'F');
  };
  pintar();
  const addPageOriginal = doc.addPage.bind(doc);
  doc.addPage = function(){ const r = addPageOriginal.apply(null, arguments); pintar(); return r; };
}

// Logo: até 600×200 px, mantendo a proporção; PNG continua PNG (transparência), o resto vira JPEG.
function reduzirLogo(arquivo){
  return new Promise((resolve, reject)=>{
    if(!arquivo || !/^image\//.test(arquivo.type)) return reject(new Error('Escolha um arquivo de imagem (PNG ou JPG).'));
    const img = new Image(), url = URL.createObjectURL(arquivo);
    img.onload = ()=>{
      const escala = Math.min(1, 600/img.width, 200/img.height);
      const w = Math.max(1, Math.round(img.width*escala)), h = Math.max(1, Math.round(img.height*escala));
      const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      const png = arquivo.type==='image/png';
      if(!png){ ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, w, h); }
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve({ logo: canvas.toDataURL(png ? 'image/png' : 'image/jpeg', 0.9), logoLargura: w, logoAltura: h });
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('Não foi possível ler esta imagem.')); };
    img.src = url;
  });
}

// Campos de cor: o seletor e o código (#RRGGBB) ficam sincronizados e a prévia muda na hora.
function onPersonalizacaoInput(el){
  const m = /^pers-(cor|hex)-(cabecalho|fundo)$/.exec(el.id || '');
  if(!m || !state.cfgEstilo) return false;
  const chave = m[2]==='cabecalho' ? 'corCabecalho' : 'corFundo';
  let valor = el.value.trim();
  if(m[1]==='hex'){
    if(!valor.startsWith('#')) valor = '#' + valor;
    if(!/^#[0-9a-f]{6}$/i.test(valor)) return true;
    const seletor = document.getElementById('pers-cor-'+m[2]); if(seletor) seletor.value = valor.toLowerCase();
  }else{
    const hex = document.getElementById('pers-hex-'+m[2]); if(hex) hex.value = valor.toUpperCase();
  }
  state.cfgEstilo[chave] = valor.toUpperCase();
  atualizarPreviaEstilo();
  return true;
}
