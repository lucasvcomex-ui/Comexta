function limiteAlertHtml(c){
  if(c.limiteExcedido){
    return `<div class="alert alert-warn">${ICONS.warn}<div><b>Limite da Importação Simplificada excedido.</b><br>
      Custo + Frete + Seguro = <b>${fmtUSD(c.limiteUSD)}</b> — acima de US$ ${LIMITE_SIMPLIFICADA_USD.toLocaleString('en-US')}.
      Esta operação deve ser enquadrada como Importação Formal.</div></div>`;
  }
  return `<div class="alert alert-ok">${ICONS.check}<div><b>Dentro do limite da Importação Simplificada.</b><br>
      Custo + Frete + Seguro = <b>${fmtUSD(c.limiteUSD)}</b> (limite: US$ ${LIMITE_SIMPLIFICADA_USD.toLocaleString('en-US')}).</div></div>`;
}

function patchComputedDados(){
  const d = state.dados, c = computeDados(d);
  const root = document.getElementById('dados-form');
  if(!root) return;
  c.produtos.forEach((p,idx)=>{
    const a = root.querySelector(`[data-calc-row="${idx}:usd"]`); if(a) a.textContent = fmtUSD(p.totalUSD);
    const b = root.querySelector(`[data-calc-row="${idx}:brl"]`); if(b) b.textContent = fmtBRL(p.totalBRL);
  });
  const map = {
    'tot-qty': fmtNum(c.sumQty), 'tot-peso': fmtNum(c.sumPeso)+' kg', 'tot-usd': fmtUSD(c.sumTotalUSD), 'tot-brl': fmtBRL(c.sumTotalBRL),
    'frete-brl': '≈ '+fmtBRL(c.freteBRL), 'seguro-brl': '≈ '+fmtBRL(c.seguroBRL),
    'tot-fs-usd': fmtUSD(c.totalFreteSeguroExt), 'tot-fs-brl': fmtBRL(c.totalFreteSeguroBRL),
    'd52': fmtUSD(c.invoiceExt), 'e52': fmtBRL(c.invoiceBRL), 'd53': fmtUSD(c.freteExtD), 'e53': fmtBRL(c.freteBRLD),
    'd54': fmtUSD(c.seguroExtD), 'e54': fmtBRL(c.seguroBRLD), 'd56': fmtUSD(c.valorAduaneiroExt), 'e56': fmtBRL(c.valorAduaneiroBRL),
    'ii-valor': fmtBRL(c.iiValor), 'va-ii': fmtBRL(c.vaMaisII), 'bc-icms': fmtBRL(c.bcIcms), 'icms-valor': fmtBRL(c.icmsValor),
    'desp-extra-total': fmtBRL(c.despExtraTotal),
  };
  Object.keys(map).forEach(k=>{ const el = root.querySelector(`[data-calc="${k}"]`); if(el) el.textContent = map[k]; });
  const alertBox = document.getElementById('limite-alert'); if(alertBox) alertBox.innerHTML = limiteAlertHtml(c);
}

function renderDespesaTable(sectionKey, linhas, cambio){

    const calc = calcDespesaLinha(l, cRate);
    return `<tr>
      <td><input data-bind="${sectionKey}.${idx}.descricao" value="${esc(l.descricao)}" class="input-blue" placeholder="Descrição"></td>

        <option value="USD" ${l.moeda==='USD'?'selected':''}>USD</option>
        <option value="EUR" ${l.moeda==='EUR'?'selected':''}>EUR</option>
        <option value="RMB" ${l.moeda==='RMB'?'selected':''}>RMB</option>

      <td class="num-mono" data-despesa-calc="${sectionKey}:${idx}:tarifaReal">${fmtBRL(calc.tarifaReal)}</td>
      <td><select data-bind="${sectionKey}.${idx}.tipoCalculo" class="input-blue">

        <option value="Container" ${l.tipoCalculo==='Container'?'selected':''}>Container</option>
        <option value="Documento" ${l.tipoCalculo==='Documento'?'selected':''}>Documento</option>
      </select></td>
      <td><input type="number" step="any" data-bind="${sectionKey}.${idx}.quantidade" value="${esc(l.quantidade)}" class="input-blue num-mono" placeholder="0"></td>
      <td class="num-mono" data-despesa-calc="${sectionKey}:${idx}:total">${fmtBRL(calc.total)}</td>

    </tr>`;
  }).join('');
  const total = sum(linhas.map(l=>calcDespesaLinha(l,cRate).total));
  return `
  <div class="table-wrap" style="margin-bottom:10px;">
    <table><thead><tr><th>Descrição da Despesa</th><th>Tarifa</th><th>Moeda</th><th class="num-mono">Tarifa em Real</th><th>Tipo de Cálculo</th><th>Qtd.</th><th class="num-mono">Total</th><th></th></tr></thead>

  <button class="btn btn-ghost btn-sm" data-action="add-despesa-linha:${sectionKey}">${ICONS.plus} Adicionar Linha</button>
  `;
}

function patchDespesaSecao(root, sectionKey, linhas, cambio){
  const cRate = num(cambio);
  let total = 0;
  linhas.forEach((l, idx)=>{
    const calc = calcDespesaLinha(l, cRate);
    total += calc.total;
    const elReal = root.querySelector(`[data-despesa-calc="${sectionKey}:${idx}:tarifaReal"]`);
    if(elReal) elReal.textContent = fmtBRL(calc.tarifaReal);
    const elTotal = root.querySelector(`[data-despesa-calc="${sectionKey}:${idx}:total"]`);
    if(elTotal) elTotal.textContent = fmtBRL(calc.total);
  });
  const elGeral = root.querySelector(`[data-despesa-calc="${sectionKey}::total-geral"]`);
  if(elGeral) elGeral.textContent = fmtBRL(total);
}
function patchImpostosDesembaraco(root, d, c){
  const r = computeRateioFormal(d, c);
  d.produtos.forEach((p, idx)=>{
    const linha = r.linhas.find(l=>l.id===p.id);
    ['ii','ipi','pis','cofins','icms'].forEach(tributo=>{
      const el = root.querySelector(`[data-imposto-calc="${idx}:${tributo}"]`);
      if(el) el.textContent = fmtBRL(linha ? linha[tributo] : 0);
    });
  });
  ['ii','ipi','pis','cofins','icms'].forEach(tributo=>{
    const el = root.querySelector(`[data-imposto-calc="total:${tributo}"]`);
    if(el) el.textContent = fmtBRL(r.totais[tributo]);
  });
}
function patchComputedDadosFormal(){
  const d = state.dadosFormal, c = computeDadosFormal(d);
  const root = document.getElementById('dadosFormal-form');
  if(!root) return;
  c.produtos.forEach((p,idx)=>{
    const a = root.querySelector(`[data-calc-row="${idx}:usd"]`); if(a) a.textContent = fmtUSD(p.totalUSD);
    const b = root.querySelector(`[data-calc-row="${idx}:brl"]`); if(b) b.textContent = fmtBRL(p.totalBRL);
  });
  patchDespesaSecao(root, 'freteLinhas', d.freteLinhas, d.freteCambio);
  patchDespesaSecao(root, 'taxasOrigem', d.taxasOrigem, d.freteCambio);
  patchDespesaSecao(root, 'taxasDestino', d.taxasDestino, d.freteCambio);
  patchDespesaSecao(root, 'armazenagemLinhas', d.armazenagemLinhas, d.armazenagemCambio);
  patchDespesaSecao(root, 'outrasDespesasLinhas', d.outrasDespesasLinhas, d.outrasDespesasCambio);
  patchImpostosDesembaraco(root, d, c);
  const map = {
    'tot-qty': fmtNum(c.sumQty), 'tot-peso': fmtNum(c.sumPeso)+' kg', 'tot-usd': fmtUSD(c.sumTotalUSD), 'tot-brl': fmtBRL(c.sumTotalBRL),
    'frete-total': fmtBRL(c.freteTotalBRL), 'armazenagem-total': fmtBRL(c.armazenagemTotal), 'outras-total': fmtBRL(c.outrasTotal),
    'vmle-usd': fmtUSD(c.vmleUSD), 'vmle-brl': fmtBRL(c.vmleBRL), 'vmld-usd': fmtUSD(c.vmldUSD), 'vmld-brl': fmtBRL(c.vmldBRL),
  };
  Object.keys(map).forEach(k=>{ const el = root.querySelector(`[data-calc="${k}"]`); if(el) el.textContent = map[k]; });
}

/* --------------------------- Autocomplete (Cadastro) ------------------------ */
let acCurrentField = null; // {type, idx, inputEl}
function acSearch(type, query){
  const q = String(query||'').trim().toLowerCase();
  if(q.length<3) return [];
  if(type==='cliente'){
    return empresasDoTipo('cliente').filter(c=>((c.nomeFantasia||c.razaoSocial||'')).toLowerCase().includes(q))
      .slice(0,6).map(c=>({label:c.nomeFantasia||c.razaoSocial||'(sem nome)', sub:c.cnpjCpf||'', data:c}));
  }
  if(type==='clienteCnpj'){
    const qDigits = q.replace(/\D/g,'');
    if(qDigits.length<3) return [];
    return empresasDoTipo('cliente').filter(c=>(c.cnpjCpf||'').replace(/\D/g,'').includes(qDigits))
      .slice(0,6).map(c=>({label:c.cnpjCpf, sub:c.nomeFantasia||c.razaoSocial||'', data:c}));
  }
  if(type==='fornecedor'){
    return state.fornecedores.filter(f=>((f.nomeFantasia||f.razaoSocial||'')).toLowerCase().includes(q))
      .slice(0,6).map(f=>({label:f.nomeFantasia||f.razaoSocial||'(sem nome)', sub:f.cnpjCpf||'', data:f}));
  }
  if(PROC_EMPRESA_CAMPOS[type]){
    return empresasDoTipo(PROC_EMPRESA_CAMPOS[type].tipo).filter(e=>nomeEmpresaCad(e).toLowerCase().includes(q))
      .slice(0,8).map(e=>({label:nomeEmpresaCad(e), sub:[e.cnpjCpf, e.razaoSocial && e.razaoSocial!==e.nomeFantasia ? e.razaoSocial : ''].filter(Boolean).join(' · '), data:e}));
  }
  if(type==='produto'){
    return state.produtos.filter(p=>(p.nome||'').toLowerCase().includes(q))
      .slice(0,6).map(p=>({label:p.nome||'(sem nome)', sub:[p.codigoInterno,p.ncm].filter(Boolean).join(' · '), data:p}));
  }
  return [];
}
function showAutocomplete(inputEl, type, idx){
  const dd = document.getElementById('ac-dropdown');
  if(!dd) return;
  const results = acSearch(type, inputEl.value);
  if(!results.length){ hideAutocomplete(); return; }
  acCurrentField = {type, idx, inputEl};
  dd._results = results;
  dd.innerHTML = results.map((r,i)=>`
    <div class="ac-option" data-idx="${i}">${esc(r.label)}${r.sub?`<div class="ac-sub">${esc(r.sub)}</div>`:''}</div>
  `).join('');
  const rect = inputEl.getBoundingClientRect();
  dd.style.left = Math.round(rect.left)+'px';
  dd.style.top = Math.round(rect.bottom+4)+'px';
  dd.style.width = Math.max(Math.round(rect.width),220)+'px';
  dd.style.display = 'block';
}
function hideAutocomplete(){
  const dd = document.getElementById('ac-dropdown');
  if(dd){ dd.style.display='none'; dd.innerHTML=''; dd._results=null; }
  acCurrentField = null;
}
function selectAutocomplete(optIdx){
  const dd = document.getElementById('ac-dropdown');
  if(!dd || !dd._results || !acCurrentField) return;
  const r = dd._results[optIdx];
  if(!r) return;
  const { type, idx } = acCurrentField;
  const nome = r.data.nomeFantasia || r.data.razaoSocial || r.data.nome || '';
  if(PROC_EMPRESA_CAMPOS[type]){ escolherEmpresaProcesso(type, r.data); hideAutocomplete(); return; }
  if(type==='cliente'){
    state.dados.cliente = nome;
    state.dados.clienteCnpjCpf = r.data.cnpjCpf || state.dados.clienteCnpjCpf;
  } else if(type==='clienteCnpj'){
    state.dados.clienteCnpjCpf = r.data.cnpjCpf || '';
    state.dados.cliente = nome || state.dados.cliente;
  } else if(type==='fornecedor'){
    state.dados.produtos[idx].fornecedor = nome;
  } else if(type==='produto'){
    state.dados.produtos[idx].produto = nome;
  }
  saveDraft();
  hideAutocomplete();
  renderApp();
}

      <td>${esc(l.fornecedor)||'—'}</td><td>${esc(l.produto)||'—'}</td>

      <td class="num-mono">${fmtBRL(l.rateioBcIcms)}</td><td class="num-mono">${fmtBRL(l.rateioIcms)}</td><td class="num-mono">${fmtBRL(l.rateioDespExtra)}</td>
      <td class="num-mono" style="font-weight:700;">${fmtBRL(l.custoTotalSimples)}</td><td class="num-mono">${fmtBRL(l.custoUnitSimples)}</td>
      <td class="num-mono" style="font-weight:700;">${fmtBRL(l.custoTotalLucroReal)}</td><td class="num-mono">${fmtBRL(l.custoUnitLucroReal)}</td>
    </tr>`).join('') : `<tr><td colspan="17" style="text-align:center; color:var(--ink-soft); padding:24px;">Nenhum produto preenchido na aba Dados ainda.</td></tr>`;

  return `

  <div class="section-title" style="margin-bottom:12px;"><span class="num">01</span> Resumo das Despesas</div>

  return state.cotacoesIndex.filter(cot=>{

    if(f.texto){

      const hit = cot.dados.produtos.some(p=> (p.fornecedor||'').toLowerCase().includes(t) || (p.produto||'').toLowerCase().includes(t));

}

async function moverCotacaoStatus(id, tipo, novoStatus){
  if(!pode('cotacoes','editar')){ toast('Você não tem permissão para editar cotações.'); renderApp(); return; }
  const lista = tipo==='Simplificada' ? state.cotacoesIndex : state.cotacoesFormalIndex;
  const item = lista.find(x=>x.id===id);
  if(!item) return;
  const statusAntigo = item.dados.statusCotacao||'em_andamento';
  if(statusAntigo===novoStatus) return;
  item.dados.statusCotacao = novoStatus;
  if(novoStatus!=='negado'){ item.dados.statusMotivoNegado=''; item.dados.statusObservacao=''; }
  item.atualizadoEm = new Date().toISOString();
  if(tipo==='Simplificada') await persistCotacoesIndex(); else await persistCotacoesFormalIndex();
  const statusLabels = {em_andamento:'Em Andamento', enviado_cliente:'Enviado Cliente', aceito:'Aprovado', negado:'Negado'};
  toast(`${id}: status alterado para "${statusLabels[novoStatus]||novoStatus}".`, 'ok');
  renderApp();
}

/* --- Equipamentos --- */

  const cor = categoria==='Reefer' ? '#4C86E0' : categoria==='Open Top' ? '#2F9E7B' : categoria==='Flat Rack' ? '#B0729A' : '#C07A25';
  return `<svg viewBox="0 0 120 60" width="100%" height="64">
    <rect x="4" y="10" width="112" height="42" rx="3" fill="${cor}" opacity="0.15" stroke="${cor}" stroke-width="2"/>
    <line x1="4" y1="22" x2="116" y2="22" stroke="${cor}" stroke-width="1" opacity="0.5"/>
    <line x1="4" y1="34" x2="116" y2="34" stroke="${cor}" stroke-width="1" opacity="0.5"/>
    <line x1="4" y1="46" x2="116" y2="46" stroke="${cor}" stroke-width="1" opacity="0.5"/>
    <rect x="96" y="10" width="20" height="42" fill="${cor}" opacity="0.35"/>
  </svg>`;
}
function renderSimEquipamentos(){
  const sim = state.simulacao;
  const categorias = [...new Set(Object.values(CONTAINERS).map(c=>c.categoria))];
  const selecionados = sim.containerTipos||[];

  const cards = categorias.map(cat=>`
    <div class="section-title" style="margin:22px 0 12px;">${cat}</div>
    <div class="dash-grid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr));">
      ${Object.entries(CONTAINERS).filter(([k,v])=>v.categoria===cat).map(([key,ct])=>{
        const isSel = selecionados.includes(key);
        return `
        <div class="card-flat dash-card" style="cursor:pointer; border:2px solid ${isSel?'var(--amber)':'var(--line-soft)'};" data-action="set-container-sim:${key}">
          ${containerIconSvg(ct.categoria)}
          <div style="font-weight:700; font-size:13.5px;">${ct.nome}</div>
          <div class="hint" style="font-size:11.5px; line-height:1.6;">
            Interno: ${fmtNum(ct.interno.comp/100,2)}×${fmtNum(ct.interno.larg/100,2)}×${fmtNum(ct.interno.alt/100,2)} m<br>
            Capacidade: ${ct.capacidadeCbm||'—'} cbm · Máx. Payload: ${fmtNum(ct.maxPayload,0)} kg<br>
            Tara: ${fmtNum(ct.tara,0)} kg ${ct.maxPallets?('· Máx. '+ct.maxPallets+' paletes'):''}
          </div>
          ${isSel?`<span class="badge badge-amber" style="align-self:flex-start;">${ICONS.check} Selecionado</span>`:''}

    return `
    <div class="card-flat" style="margin-bottom:14px;">
      <div class="section-title" style="margin-bottom:12px;">${sim_r.cont.nome}</div>
      <div class="kpi-row" style="margin-bottom:14px;">
        <div class="kpi"><div class="k-lbl">Containers Necessários</div><div class="k-val">${sim_r.numContainers}</div></div>

/* --- Resultado (com visualização 3D) --- */
function renderSimResultado(){
  const sim = state.simulacao;
  const tipos = sim.containerTipos||[];
  const mostrarPalete = sim.tipoCarregamento==='pallets';

  if(tipos.length===0 && !mostrarPalete){
    return `
    <div class="page-title">Resultado</div>
    <hr class="hairline">
    ${simCrumb('Resultado')}
    <div class="empty">${ICONS.cube}<h3>Selecione ao menos um container</h3><p>Volte para a aba Equipamentos e marque um ou mais tipos de container para ver o resultado.</p></div>
    <div class="btn-row"><button class="btn btn-primary" data-action="go:simEquipamentos">${ICONS.back} Ir para Equipamentos</button></div>
    `;
  }

  let paleteBloco = '';
  const calcGeral = computeSimulacao(sim);
  const resumoCargaBloco = `
  <div class="kpi-row" style="margin-bottom:20px;">
    <div class="kpi"><div class="k-lbl">Peso Bruto da Carga</div><div class="k-val">${fmtNum(calcGeral.totalPeso,1)} kg</div></div>
    <div class="kpi"><div class="k-lbl">Volume Total da Carga</div><div class="k-val">${fmtNum(calcGeral.totalCbm,3)} m³</div></div>
    <div class="kpi"><div class="k-lbl">Unidades Totais</div><div class="k-val">${fmtNum(calcGeral.totalUnidades,0)}</div></div>
    <div class="kpi"><div class="k-lbl">Tipos de Caixa</div><div class="k-val">${calcGeral.caixas.filter(c=>c.qty>0).length}</div></div>
  </div>`;
  if(mostrarPalete && tipos.length===0){
    // Nenhum container selecionado ainda: mostra 1 palete ilustrativo (modelo real: estrado + caixas empilhadas)
    const { calc, unidadesPaletes, paletesAlocados } = calcPaletizacao(sim);
    const p = sim.palete;
    const itensPalete1 = paletesAlocados.length ? paletesAlocados[0].itens : [];
    const legenda = itensPalete1.filter(cx=>cx.nome||cx.qtyNesteContainer>0).map(cx=>`
      <span class="badge" style="background:${cx.cor}22; color:${cx.cor}; border:1px solid ${cx.cor}55;">
        <span style="display:inline-block; width:9px; height:9px; border-radius:2px; background:${cx.cor};"></span> ${boxRangeLabel(cx, 1, cx.qtyNesteContainer, cx.qty)}
      </span>`).join(' ');
    paleteBloco = `
    <div class="alert alert-info" style="margin-bottom:20px;">${ICONS.info}<div>Selecione um container em Equipamentos para ver todos os ${unidadesPaletes} paletes necessários carregados dentro dele. Por enquanto, este é um palete de exemplo.</div></div>
    <div class="card-flat" style="margin-bottom:20px;">
      <div class="kpi-row" style="margin-bottom:16px;">
        <div class="kpi"><div class="k-lbl">Paletes Necessários (total)</div><div class="k-val">${unidadesPaletes}</div></div>
        <div class="kpi"><div class="k-lbl">Carga Útil do Palete</div><div class="k-val">${fmtNum(num(p.cargaUtil),0)} kg</div></div>
        <div class="kpi"><div class="k-lbl">Peso do Palete Vazio</div><div class="k-val">${fmtNum(num(p.pesoPalete),0)} kg</div></div>
        <div class="kpi"><div class="k-lbl">Altura Total Carregado</div><div class="k-val">${fmtNum(num(p.altura)+num(p.alturaMaxCarregamento),0)} cm</div></div>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
        <div class="section-title" style="margin:0;">Palete de Exemplo</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">${legenda}</div>
      </div>
      <div style="position:relative; height:340px; border-radius:10px; overflow:hidden; background:linear-gradient(180deg,#EFEAE0,#E4DECD);">
        <canvas id="sim3d-pallet-canvas" data-action="abrir-3d-lightbox" data-3d-mode="pallet" style="width:100%; height:100%; display:block;"></canvas>
      </div>
      <p class="hint" style="color:var(--ink-soft); font-size:12px; margin-top:10px;">
        Palete de ${fmtNum(num(p.comprimento),0)}×${fmtNum(num(p.largura),0)} cm, com caixas empilhadas até ${fmtNum(num(p.alturaMaxCarregamento),0)} cm de altura sobre o estrado. Clique e arraste para girar, role para dar zoom, clique (sem arrastar) para ampliar.
      </p>
    </div>`;
  }

  const blocos = tipos.map((key,i)=>{
    const r = simularContainers(sim, key);
    if(!r || !r.cont) return '';
    const subCount = Math.max(1, Math.min(r.numContainers, MAX_CONTAINERS_RENDER));
    const subCards = [];
    const contadorPorTipo = {};
    for(let sub=0; sub<subCount; sub++){
      const paletInfo = mostrarPalete ? paletesParaContainerIndex(sim, key, sub) : null;
      const { volumePct, pesoPct, pesoNeste } = mostrarPalete
        ? ocupacaoContainerIndexPallets(r, r.cont, sim, key, sub)
        : ocupacaoContainerIndex(r, r.cont, sub);
      const alocadasNesteContainer = caixasNesteContainer(sim, r, key, sub);
      const legenda = alocadasNesteContainer.filter(cx=>cx.nome||cx.qtyNesteContainer>0).map(cx=>{
        const inicio = (contadorPorTipo[cx.id]||0)+1;
        const fim = inicio + cx.qtyNesteContainer - 1;
        contadorPorTipo[cx.id] = fim;
        return `
        <span class="badge" style="background:${cx.cor}22; color:${cx.cor}; border:1px solid ${cx.cor}55;">
          <span style="display:inline-block; width:9px; height:9px; border-radius:2px; background:${cx.cor};"></span> ${boxRangeLabel(cx, inicio, fim, cx.qty)}
        </span>`;
      }).join(' ');
      subCards.push(`
      <div class="card-flat" style="margin-bottom:20px;">
        <div class="kpi-row" style="margin-bottom:16px;">
          <div class="kpi"><div class="k-lbl">Container</div><div class="k-val" style="font-size:14px;">${r.cont.nome}</div></div>
          <div class="kpi"><div class="k-lbl">Containers Necessários</div><div class="k-val">${r.numContainers}</div></div>
          ${paletInfo ? `
          <div class="kpi"><div class="k-lbl">Paletes Neste Container</div><div class="k-val">${paletInfo.paletesNesteContainer} / ${paletInfo.unidadesPaletes}</div></div>
          <div class="kpi"><div class="k-lbl">Capacidade de Paletes</div><div class="k-val">${paletInfo.capacidadeContainer}</div></div>
          ` : ''}
          <div class="kpi"><div class="k-lbl">Ocupação Volume</div><div class="k-val">${fmtNum(volumePct,2)}%</div></div>
          <div class="kpi"><div class="k-lbl">Ocupação Peso</div><div class="k-val">${fmtNum(pesoPct,2)}%</div></div>
          <div class="kpi"><div class="k-lbl">Peso Bruto da Carga</div><div class="k-val">${fmtNum(pesoNeste,1)} kg</div></div>
          <div class="kpi"><div class="k-lbl">Peso Bruto + Tara do Container</div><div class="k-val">${fmtNum(pesoNeste+r.cont.tara,1)} kg</div></div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
          <div class="section-title" style="margin:0;">${r.cont.nome} — Container ${sub+1} de ${r.numContainers}</div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">${legenda}</div>
        </div>
        <div style="position:relative; height:380px; border-radius:10px; overflow:hidden; background:linear-gradient(180deg,#EFEAE0,#E4DECD);">
          <canvas id="sim3d-canvas-${i}-${sub}" data-action="abrir-3d-lightbox" data-3d-mode="container" data-3d-key="${key}" data-3d-sub="${sub}" style="width:100%; height:100%; display:block;"></canvas>
        </div>
        <p class="hint" style="color:var(--ink-soft); font-size:12px; margin-top:10px;">
          ${sub===0 ? `Carga carregada neste container.` : `Carga restante que não coube no(s) container(is) anterior(es).`}
          ${sub===subCount-1 && r.numContainers>subCount ? ` +${r.numContainers-subCount} container(s) adicional(is) idêntico(s) a este.` : ''}
          Clique e arraste para girar, role para dar zoom, clique (sem arrastar) para ampliar.
        </p>
      </div>`);
    }
    return subCards.join('');
  }).join('');

  return `
  <div class="page-title">Resultado da Simulação</div>
  <div class="page-sub">Visualização aproximada de como a carga ocupa ${mostrarPalete?'os paletes e ':''}cada tipo de container selecionado — estimativa de planejamento, não um posicionamento exato de cada caixa.</div>
  <hr class="hairline">
  ${simCrumb('Resultado')}
  ${resumoCargaBloco}
  ${paleteBloco}
  ${blocos}
  <p class="hint" style="color:var(--ink-soft); font-size:12px;">
    A quantidade de containers considera o maior entre: volume necessário, peso necessário${sim.tipoCarregamento==='pallets'?' e número de paletes':''} — sempre arredondado para cima.
  </p>

  <div class="btn-row">
    <button class="btn btn-ghost" data-action="go:simInicio">${ICONS.back} Voltar ao Início</button>
    <button class="btn btn-amber" data-action="salvar-simulacao">${ICONS.save} Salvar Simulação</button>
  </div>
  `;
}

let sim3dScenes = [];
function disposeScene3D(inst){
  if(!inst) return;
  if(inst.raf) cancelAnimationFrame(inst.raf);
  if(inst.winL) inst.winL.forEach(([t,f,o])=>{ try{ window.removeEventListener(t,f,o); }catch(e){} });
  if(inst.scene && inst.scene.traverse){
    inst.scene.traverse(obj=>{
      if(obj.geometry && obj.geometry.dispose) obj.geometry.dispose();
      if(obj.material){
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach(m=>{
          if(m.map && m.map.dispose) m.map.dispose();
          if(m.dispose) m.dispose();
        });
      }
    });
  }
  if(inst.renderer){
    try{ inst.renderer.dispose(); }catch(e){}
    try{ if(inst.renderer.forceContextLoss) inst.renderer.forceContextLoss(); }catch(e){}
  }
}
/* Empacota caixas (com dimensões reais, cm) dentro do container em "prateleiras": preenche uma
   linha ao longo do comprimento, depois avança em profundidade, depois em altura — cada caixa
   é desenhada na sua proporção real (caixas diferentes saem com tamanhos diferentes). */
// Resolução (lado maior, em px) das texturas de marcação. Cai automaticamente conforme o total de
// caixas desenhadas, para a memória de vídeo nunca estourar (o que travava a renderização).
let texLongSide = 192;
function definirResolucaoTextura(totalCaixas){
  const n = Math.max(1, totalCaixas||1);
  texLongSide = n<=60 ? 320 : n<=200 ? 224 : n<=600 ? 160 : n<=1500 ? 112 : n<=4000 ? 80 : 64;
}
function totalCaixasSimulacao(sim){
  const c = computeSimulacao(sim);
  const qtd = sum((c.caixas||[]).map(cx=>cx.qty||0));
  const nTipos = Math.max(1, (sim.containerTipos||[]).length);
  return qtd*nTipos;
}
function criarTexturaFaceCaixa(nome, comp, larg, alt, peso, numero, total, corFundo, aspectoFace){
  const cvs = document.createElement('canvas');
  const ctx = cvs.getContext('2d');
  const aspectoSeguro = (isFinite(aspectoFace) && aspectoFace>0) ? Math.min(6, Math.max(0.15, aspectoFace)) : 1;
  // Face com a mesma proporção da caixa (texto sem distorção), lado maior = texLongSide
  let W, H;
  if(aspectoSeguro<=1){ W = texLongSide; H = Math.max(40, Math.round(texLongSide*aspectoSeguro)); }
  else { H = texLongSide; W = Math.max(40, Math.round(texLongSide/aspectoSeguro)); }
  cvs.width = W; cvs.height = H;
  ctx.fillStyle = corFundo||'#173A5E';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#101820';
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  const pad = W*0.07;
  const larguraUtil = W - pad*2;
  const base = Math.min(H*0.24, W*0.13);
  const linhas = [
    { texto: nome||'Caixa', tam: base*1.25, peso:'700' },
    { texto: `Box : ${numero} / ${total}`, tam: base, peso:'600' },
    { texto: `Dimensions : ${fmtNum(comp,0)}x${fmtNum(larg,0)}x${fmtNum(alt,0)}`, tam: base, peso:'600' },
    { texto: `Weight : ${fmtNum(peso,0)}`, tam: base, peso:'600' },
  ];
  let fator = 1;
  linhas.forEach(l=>{
    ctx.font = `${l.peso} ${l.tam}px Inter, sans-serif`;
    const largMedida = ctx.measureText(l.texto).width;
    if(largMedida > larguraUtil) fator = Math.min(fator, larguraUtil/largMedida);
  });
  const alturaTotal = linhas.reduce((a,l)=>a+l.tam*fator*1.35,0);
  if(alturaTotal > H*0.92) fator = Math.min(fator, fator*(H*0.92)/alturaTotal);
  let ly = H*0.05;
  linhas.forEach(l=>{
    const tam = l.tam*fator;
    ctx.font = `${l.peso} ${tam}px Inter, sans-serif`;
    ctx.fillText(l.texto, pad, ly);
    ly += tam*1.35;
  });
  const tex = new THREE.CanvasTexture(cvs);
  tex.generateMipmaps = false;               // evita cópia extra em memória (e redimensionamento p/ potência de 2)
  tex.minFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return tex;
}
function empacotarCaixasNoContainer(caixasAlocadas, dimsContainerCm, scale, maxUnidades, inicioPorTipo){
  const cw = dimsContainerCm.comp*scale, ch = dimsContainerCm.alt*scale, cd = dimsContainerCm.larg*scale;
  const posicoes = [];
  let cursorX = -cw/2, cursorZ = -cd/2, cursorY = -ch/2;
  let rowDepth = 0, layerHeight = 0;
  const contador = inicioPorTipo || {};
  // maxUnidades aqui é só um teto de segurança absoluto (cargas com dezenas de milhares de peças),
  // nunca reduz a quantidade real desenhada — cada caixa é sempre desenhada em tamanho real, para o
  // volume visual bater com o % de ocupação calculado.
  let totalDesenhado = 0;

  outer:
  for(const cx of (caixasAlocadas||[])){
    const w = Math.max(0.04, (num(cx.comp)||10)*scale), d = Math.max(0.04, (num(cx.larg)||10)*scale), h = Math.max(0.04, (num(cx.alt)||10)*scale);
    const qtdReal = Math.round(cx.qtyNesteContainer||0);
    for(let n=0; n<qtdReal; n++){
      if(maxUnidades && maxUnidades>0 && totalDesenhado>=maxUnidades) break outer;
      if(cursorX+w > cw/2){ cursorX = -cw/2; cursorZ += (rowDepth||d); rowDepth = 0; }
      if(cursorZ+d > cd/2){ cursorZ = -cd/2; cursorX = -cw/2; cursorY += (layerHeight||h); layerHeight = 0; }
      if(cursorY+h > ch/2) break outer; // já não cabe mais em altura no container
      const inicioAcumulado = contador[cx.id]||0;
      const numeroUnidade = Math.min(cx.qty||1, inicioAcumulado + n + 1);
      posicoes.push({
        x:cursorX+w/2, y:cursorY+h/2, z:cursorZ+d/2, w, h, d, cor: cx.cor||'#8899aa',
        nome: cx.nome, comp: cx.comp, larg: cx.larg, alt: cx.alt, peso: cx.peso,
        numero: numeroUnidade, total: cx.qty||numeroUnidade,
      });
      cursorX += w;
      rowDepth = Math.max(rowDepth, d);
      layerHeight = Math.max(layerHeight, h);
      totalDesenhado++;
    }
    contador[cx.id] = (contador[cx.id]||0) + (cx.qtyNesteContainer||0);
  }
  return posicoes;
}
function init3DBoxScene(canvas, dimsCm, caixasAlocadas, inicioPorTipo){
  const w = canvas.clientWidth||600, h = canvas.clientHeight||380;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, w/h, 1, 5000);
  let renderer;
  try{ renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true}); }catch(e){ console.error('WebGL indisponível', e); return null; }
  renderer.setSize(w,h,false);

  const scale = 0.06; // cm -> unidades de cena
  const cw = dimsCm.comp*scale, ch = dimsCm.alt*scale, cd = dimsCm.larg*scale;
  const group = new THREE.Group();

  const contGeo = new THREE.BoxGeometry(cw,ch,cd);
  const edges = new THREE.EdgesGeometry(contGeo);
  group.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color:0x173A5E})));
  const floorMat = new THREE.MeshBasicMaterial({color:0xC9BFA0, transparent:true, opacity:0.4});
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(cw,cd), floorMat);
  floor.rotation.x = -Math.PI/2; floor.position.y = -ch/2;
  group.add(floor);

  const posicoes = empacotarCaixasNoContainer(caixasAlocadas, dimsCm, scale, 0, inicioPorTipo||{});
  const geoCache = {}, corCache = {};
  posicoes.forEach((p,i)=>{
    const gk = p.w.toFixed(4)+'|'+p.h.toFixed(4)+'|'+p.d.toFixed(4);
    const geo = geoCache[gk] || (geoCache[gk] = new THREE.BoxGeometry(p.w*0.96, p.h*0.96, p.d*0.96));
    const matTopoFundo = corCache[p.cor] || (corCache[p.cor] = new THREE.MeshLambertMaterial({color: new THREE.Color(p.cor)}));
    let materiais = matTopoFundo;
    if(p.numero){
      const texZ = criarTexturaFaceCaixa(p.nome, p.comp, p.larg, p.alt, p.peso, p.numero, p.total, p.cor, p.h/p.w);
      const texX = criarTexturaFaceCaixa(p.nome, p.comp, p.larg, p.alt, p.peso, p.numero, p.total, p.cor, p.h/p.d);
      const matZ = new THREE.MeshLambertMaterial({map:texZ});
      const matX = new THREE.MeshLambertMaterial({map:texX});
      // Ordem padrão do BoxGeometry: [+x,-x,+y,-y,+z,-z] — aplica a marcação nas 4 faces laterais,
      // mantendo topo e fundo (+y,-y) apenas com a cor sólida.
      materiais = [matX, matX, matTopoFundo, matTopoFundo, matZ, matZ];
    }
    const mesh = new THREE.Mesh(geo, materiais);
    mesh.position.set(p.x, p.y, p.z);
    group.add(mesh);
  });
  scene.add(group);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dl = new THREE.DirectionalLight(0xffffff, 0.7); dl.position.set(5,10,7); scene.add(dl);

  camera.position.set(cw*1.15, ch*1.05, cd*1.6);
  camera.lookAt(0,0,0);

  return { renderer, scene, camera, group };
}
/* --- Cálculo de quantos paletes cabem num container e monta a lista de cores por unidade --- */
function calcPaletizacao(sim){
  const calc = computeSimulacao(sim);
  const p = sim.palete;
  const paleteCbmUtil = computePaleteCbmUtil(p);
  const cargaUtilPalete = num(p.cargaUtil);
  // Empilha as caixas em cada palete até atingir a capacidade máxima (volume OU peso),
  // usando o mesmo motor de alocação da Carga Solta — cada palete é tratado como um "mini-container".
  const paletesAlocados = alocarContainersSolta(calc.caixas, paleteCbmUtil, cargaUtilPalete);
  const unidadesPaletes = Math.max(paletesAlocados.length, calc.totalUnidades>0?1:0);
  return { calc, unidadesPaletes, paletesAlocados };
}
function simularPaletesNoContainer(sim, containerKey){
  const cont = CONTAINERS[containerKey];
  if(!cont) return null;
  const p = sim.palete;
  const { unidadesPaletes } = calcPaletizacao(sim);
  const compCm = num(p.comprimento), largCm = num(p.largura);
  const alturaPaleteTotal = num(p.altura)+num(p.alturaMaxCarregamento);
  const porComprimento = compCm>0 ? Math.max(1, Math.floor(cont.interno.comp/compCm)) : 1;
  const porLargura = largCm>0 ? Math.max(1, Math.floor(cont.interno.larg/largCm)) : 1;
  const porAltura = alturaPaleteTotal>0 ? Math.max(1, Math.floor(cont.interno.alt/alturaPaleteTotal)) : 1;
  let capacidadeContainer = porComprimento*porLargura*porAltura;
  if(cont.maxPallets>0) capacidadeContainer = Math.min(capacidadeContainer, cont.maxPallets);
  const paletesNesteContainer = Math.max(0, Math.min(unidadesPaletes, capacidadeContainer));
  return { unidadesPaletes, capacidadeContainer, paletesNesteContainer, porComprimento, porLargura, porAltura };
}
function paletesParaContainerIndex(sim, containerKey, idx){
  const base = simularPaletesNoContainer(sim, containerKey);
  if(!base) return null;
  const i = idx||0;
  const jaAlocados = base.capacidadeContainer*i;
  const restante = Math.max(0, base.unidadesPaletes - jaAlocados);
  const paletesNesteContainer = Math.min(restante, base.capacidadeContainer);
  return {...base, paletesNesteContainer, containerIndex:i, jaAlocados};
}
function ocupacaoContainerIndex(r, cont, idx){
  const i = idx||0;
  let volNeste = 0, pesoNeste = 0;
  if(r.alocacaoContainers && r.alocacaoContainers[i]){
    volNeste = r.alocacaoContainers[i].volTotal;
    pesoNeste = r.alocacaoContainers[i].pesoTotal;
  }
  const volumePct = cont.capacidadeCbm>0 ? (volNeste/cont.capacidadeCbm)*100 : 0;
  const pesoPct = cont.maxPayload>0 ? (pesoNeste/cont.maxPayload)*100 : 0;
  return { volumePct, pesoPct, volNeste, pesoNeste };
}
/* Em modo Paletes, o que determina quantos paletes vão em cada container é a capacidade
   física de paletes (planta baixa/altura), não o volume/peso brutos do container — por isso
   a ocupação de volume/peso de cada container precisa ser proporcional à fração de paletes
   que ele recebe, e não calculada por "sobra" de capacidade bruta (que zera quando o
   container tem CBM/payload muito maior que o volume/peso real da carga paletizada). */
function ocupacaoContainerIndexPallets(r, cont, sim, key, idx){
  const info = paletesParaContainerIndex(sim, key, idx);
  if(!info || info.unidadesPaletes<=0) return { volumePct:0, pesoPct:0, volNeste:0, pesoNeste:0 };
  const fracao = info.paletesNesteContainer/info.unidadesPaletes;
  const volNeste = (r.volumeNecessario||0)*fracao;
  const pesoNeste = (r.pesoNecessario||0)*fracao;
  const volumePct = cont.capacidadeCbm>0 ? (volNeste/cont.capacidadeCbm)*100 : 0;
  const pesoPct = cont.maxPayload>0 ? (pesoNeste/cont.maxPayload)*100 : 0;
  return { volumePct, pesoPct, volNeste, pesoNeste };
}
/* Aloca os tipos de caixa a um container específico, por ordem cumulativa — usada para
   mostrar no relatório PDF quais caixas (com que quantidade) estão em cada container. */
function alocarCaixasPorVolume(caixasComputadas, volInicio, volFim){
  let cursor = 0;
  const alocadas = [];
  caixasComputadas.forEach(cx=>{
    if(!(cx.qty>0)) return;
    const boxStart = cursor, boxEnd = cursor+cx.cbm;
    const overlapStart = Math.max(boxStart, volInicio), overlapEnd = Math.min(boxEnd, volFim);
    const overlapVol = Math.max(0, overlapEnd-overlapStart);
    const qtyNesteContainer = cx.cbm>0 ? Math.round((overlapVol/cx.cbm)*cx.qty) : 0;
    if(qtyNesteContainer>0) alocadas.push({...cx, qtyNesteContainer});
    cursor = boxEnd;
  });
  return alocadas;
}
function alocarCaixasPorFracaoUnidades(caixasComputadas, fracaoInicio, fracaoFim){
  const totalQty = sum(caixasComputadas.map(c=>c.qty));
  if(totalQty<=0) return [];
  let cursor = 0;
  const alocadas = [];
  caixasComputadas.forEach(cx=>{
    if(!(cx.qty>0)) return;
    const boxStart = cursor/totalQty, boxEnd = (cursor+cx.qty)/totalQty;
    const overlapStart = Math.max(boxStart, fracaoInicio), overlapEnd = Math.min(boxEnd, fracaoFim);
    const overlapFrac = Math.max(0, overlapEnd-overlapStart);
    const qtyNesteContainer = Math.round(overlapFrac*totalQty);
    if(qtyNesteContainer>0) alocadas.push({...cx, qtyNesteContainer});
    cursor += cx.qty;
  });
  return alocadas;
}
function paletesNoContainer(sim, key, idx){
  const { paletesAlocados } = calcPaletizacao(sim);
  const info = paletesParaContainerIndex(sim, key, idx);
  if(!info) return [];
  return paletesAlocados.slice(info.jaAlocados, info.jaAlocados+info.paletesNesteContainer);
}
function boxRangeLabel(cx, inicio, fim, total){
  const faixa = inicio===fim ? `${inicio}/${total}` : `${inicio}–${fim}/${total}`;
  return `${esc(cx.nome)||'Caixa'} - ${fmtNum(cx.comp,0)}×${fmtNum(cx.larg,0)}×${fmtNum(cx.alt,0)}cm - ${fmtNum(cx.peso,2)}kg - ${faixa}`;
}
function caixasNesteContainer(sim, r, key, idx){
  if(sim.tipoCarregamento==='pallets'){
    const paletes = paletesNoContainer(sim, key, idx);
    const totais = {};
    const ordem = [];
    paletes.forEach(pl=>{
      pl.itens.forEach(it=>{
        if(!totais[it.id]){ totais[it.id] = {...it, qtyNesteContainer:0}; ordem.push(it.id); }
        totais[it.id].qtyNesteContainer += it.qtyNesteContainer;
      });
    });
    return ordem.map(id=>totais[id]);
  }
  if(r.alocacaoContainers && r.alocacaoContainers[idx]) return r.alocacaoContainers[idx].itens;
  return [];
}
function addPalletMesh(scene, scale, p, x, y, z, caixasAlocadas, inicioPorTipo){
  const pw = num(p.comprimento)*scale, pd = num(p.largura)*scale;
  const deckH = Math.max(num(p.altura)*scale, 0.12);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(pw*0.96, deckH, pd*0.96), new THREE.MeshLambertMaterial({color:0x9C6B3E}));
  deck.position.set(x, y+deckH/2, z);
  scene.add(deck);

  // Empilha as caixas reais (proporção real) sobre o estrado, até a altura máxima de carregamento —
  // mesmo motor de empacotamento usado na Carga Solta, aplicado ao volume acima do palete.
  const dimsPalete = { comp:num(p.comprimento), larg:num(p.largura), alt:num(p.alturaMaxCarregamento) };
  const chStack = dimsPalete.alt*scale;
  const posicoes = empacotarCaixasNoContainer(caixasAlocadas, dimsPalete, scale, 0, inicioPorTipo||{});
  const geoCache = {}, corCache = {};
  posicoes.forEach((pos,i)=>{
    const gk = pos.w.toFixed(4)+'|'+pos.h.toFixed(4)+'|'+pos.d.toFixed(4);
    const geo = geoCache[gk] || (geoCache[gk] = new THREE.BoxGeometry(pos.w*0.94, pos.h*0.94, pos.d*0.94));
    const matTopoFundo = corCache[pos.cor] || (corCache[pos.cor] = new THREE.MeshLambertMaterial({color: new THREE.Color(pos.cor)}));
    let materiais = matTopoFundo;
    if(pos.numero){
      const texZ = criarTexturaFaceCaixa(pos.nome, pos.comp, pos.larg, pos.alt, pos.peso, pos.numero, pos.total, pos.cor, pos.h/pos.w);
      const texX = criarTexturaFaceCaixa(pos.nome, pos.comp, pos.larg, pos.alt, pos.peso, pos.numero, pos.total, pos.cor, pos.h/pos.d);
      const matZ = new THREE.MeshLambertMaterial({map:texZ});
      const matX = new THREE.MeshLambertMaterial({map:texX});
      materiais = [matX, matX, matTopoFundo, matTopoFundo, matZ, matZ];
    }
    const mesh = new THREE.Mesh(geo, materiais);
    mesh.position.set(x+pos.x, y+deckH+(pos.y+chStack/2), z+pos.z);
    scene.add(mesh);
  });
  return posicoes.length;
}
function baseScene3D(canvas){
  const w = canvas.clientWidth||600, h = canvas.clientHeight||380;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, w/h, 1, 5000);

function initResultado3DCanvas(canvas, containerKey, containerIndex){
  const sim = state.simulacao;
  const cont = CONTAINERS[containerKey];
  if(!cont) return null;
  const r = simularContainers(sim, containerKey);
  const idx = containerIndex||0;
  const inicioPorTipo = {};
  for(let s=0; s<idx; s++){
    caixasNesteContainer(sim, r, containerKey, s).forEach(cx=>{
      inicioPorTipo[cx.id] = (inicioPorTipo[cx.id]||0) + (cx.qtyNesteContainer||0);
    });
  }
  const alocadas = caixasNesteContainer(sim, r, containerKey, idx);
  return init3DBoxScene(canvas, cont.interno, alocadas, inicioPorTipo);
}
/* Container preenchido com paletes reais (com caixas empilhadas), respeitando quantos
   paletes cabem por planta/altura do container e o limite "Máx. EUR pallets" do equipamento.
   containerIndex (0,1,...) mostra a carga restante quando ela não cabe em 1 único container. */
function initContainerPalletsCanvas(canvas, containerKey, containerIndex){
  const sim = state.simulacao;
  const cont = CONTAINERS[containerKey];
  if(!cont) return null;
  const base = baseScene3D(canvas);
  if(!base) return null;
  const { renderer, scene, camera } = base;
  const p = sim.palete;
  const { paletesAlocados } = calcPaletizacao(sim);
  const idx = containerIndex||0;
  const info = paletesParaContainerIndex(sim, containerKey, idx);
  if(!info) return null;
  const { unidadesPaletes, capacidadeContainer, paletesNesteContainer, porComprimento, porLargura, porAltura, jaAlocados } = info;

  const scale = 0.06;
  const cw = cont.interno.comp*scale, ch = cont.interno.alt*scale, cd = cont.interno.larg*scale;
  const group = new THREE.Group();
  group.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(cw,ch,cd)), new THREE.LineBasicMaterial({color:0x173A5E})));
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(cw,cd), new THREE.MeshBasicMaterial({color:0xC9BFA0, transparent:true, opacity:0.4}));
  floor.rotation.x = -Math.PI/2; floor.position.y = -ch/2;
  group.add(floor);

  const compCm = num(p.comprimento), largCm = num(p.largura);
  const alturaPaleteTotal = num(p.altura)+num(p.alturaMaxCarregamento);
  const pw = compCm*scale, pd = largCm*scale, ph = alturaPaleteTotal*scale;
  scene.add(group);
  const inicioPorTipo = {};
  for(let j=0; j<jaAlocados; j++){
    const pal = paletesAlocados[j];
    if(pal) pal.itens.forEach(it=>{ inicioPorTipo[it.id] = (inicioPorTipo[it.id]||0) + (it.qtyNesteContainer||0); });
  }
  for(let i=0; i<paletesNesteContainer; i++){
    const gx = i % porComprimento;
    const gz = Math.floor(i/porComprimento) % porLargura;
    const gy = Math.floor(i/(porComprimento*porLargura));
    if(gy>=porAltura) break;
    const px = -cw/2 + pw/2 + gx*pw;
    const pz = -cd/2 + pd/2 + gz*pd;
    const py = -ch/2 + gy*ph;
    const paleteGlobal = paletesAlocados[jaAlocados+i];
    const itens = paleteGlobal ? paleteGlobal.itens : [];
    addPalletMesh(group, scale, p, px, py, pz, itens, inicioPorTipo);
  }

  camera.position.set(cw*1.2, ch*1.1, cd*1.7);
  camera.lookAt(0,0,0);
  return { renderer, scene, camera, group, paletesNesteContainer, unidadesPaletes, capacidadeContainer, containerIndex: idx };
}
/* Palete único ilustrativo — usado apenas quando nenhum container foi selecionado ainda */
function initPalletCanvas(canvas){

  camera.position.set(pw*1.8, ph*1.3, pd*2.2);

}
/* Rotaciona somente enquanto o mouse está sobre o canvas; roda da mouse aproxima/afasta (zoom). */
function attachCanvasInteractions(canvas, inst){
  inst.sujo = true;
  inst.winL = [];
  const addWin = (t,f,o)=>{ window.addEventListener(t,f,o); inst.winL.push([t,f,o]); };
  inst.dragging = false;
  inst.lastX = 0; inst.lastY = 0;
  inst.dragDistance = 0;
  canvas.style.cursor = 'grab';
  canvas.addEventListener('mousedown', (e)=>{
    inst.dragging = true;
    inst.dragDistance = 0;
    inst.lastX = e.clientX; inst.lastY = e.clientY;
    canvas.style.cursor = 'grabbing';
  });
  addWin('mousemove', (e)=>{
    if(!inst.dragging) return;
    const dx = e.clientX - inst.lastX, dy = e.clientY - inst.lastY;
    inst.dragDistance += Math.abs(dx)+Math.abs(dy);
    inst.lastX = e.clientX; inst.lastY = e.clientY;
    inst.sujo = true;
    inst.group.rotation.y += dx*0.01;
    inst.group.rotation.x = Math.max(-0.6, Math.min(0.6, inst.group.rotation.x + dy*0.01));
  });
  addWin('mouseup', ()=>{
    if(inst.dragging){ inst.dragging = false; canvas.style.cursor = 'grab'; }
  });
  // Impede que arrastar para girar também abra a visualização ampliada (só um clique de verdade abre)
  canvas.addEventListener('click', (e)=>{
    if(inst.dragDistance > 4){ e.stopPropagation(); e.preventDefault(); }
    inst.dragDistance = 0;
  }, true);
  canvas.addEventListener('touchstart', (e)=>{
    if(e.touches.length===1){ inst.dragging = true; inst.dragDistance = 0; inst.lastX = e.touches[0].clientX; inst.lastY = e.touches[0].clientY; }
  }, {passive:true});
  addWin('touchmove', (e)=>{
    if(!inst.dragging || !e.touches.length) return;
    const dx = e.touches[0].clientX-inst.lastX, dy = e.touches[0].clientY-inst.lastY;
    inst.dragDistance += Math.abs(dx)+Math.abs(dy);
    inst.lastX = e.touches[0].clientX; inst.lastY = e.touches[0].clientY;
    inst.sujo = true;
    inst.group.rotation.y += dx*0.01;
    inst.group.rotation.x = Math.max(-0.6, Math.min(0.6, inst.group.rotation.x + dy*0.01));
  }, {passive:true});
  addWin('touchend', ()=>{ inst.dragging = false; });

  inst.zoom = 1;
  canvas.addEventListener('wheel', (e)=>{
    e.preventDefault();
    inst.sujo = true;
    const factor = e.deltaY>0 ? 1.08 : 0.92;
    const novoZoom = Math.max(0.35, Math.min(2.5, inst.zoom*factor));
    if(inst.camera && inst.camPosBase){
      inst.zoom = novoZoom;
      inst.camera.position.set(inst.camPosBase.x*novoZoom, inst.camPosBase.y*novoZoom, inst.camPosBase.z*novoZoom);
    }
  }, {passive:false});
}
function startSceneAnimation(inst){
  if(inst.camera && inst.camera.position && !inst.camPosBase){
    inst.camPosBase = {x:inst.camera.position.x, y:inst.camera.position.y, z:inst.camera.position.z};
  }
  inst.sujo = true;
  function animate(){
    // Só redesenha quando algo mudou (girar/zoom) — cena parada não consome GPU
    if(inst.sujo){ inst.renderer.render(inst.scene, inst.camera); inst.sujo = false; }
    inst.raf = requestAnimationFrame(animate);
  }
  animate();
}
let lightbox3dInst = null;
function initLightbox3D(){
  if(!state.lightbox3D || typeof THREE==='undefined') return;
  const canvas = document.getElementById('lightbox3d-canvas');
  if(!canvas) return;
  disposeScene3D(lightbox3dInst);
  definirResolucaoTextura(Math.ceil(totalCaixasSimulacao(state.simulacao)/Math.max(1,(state.simulacao.containerTipos||[]).length)));
  const { mode, key, sub } = state.lightbox3D;
  let inst = null;
  if(mode==='pallet') inst = initPalletCanvas(canvas);
  else if(mode==='container'){
    inst = state.simulacao.tipoCarregamento==='pallets'
      ? initContainerPalletsCanvas(canvas, key, sub||0)
      : initResultado3DCanvas(canvas, key, sub||0);
  }
  if(!inst) return;
  attachCanvasInteractions(canvas, inst);
  lightbox3dInst = inst;
  startSceneAnimation(inst);
}
function fecharLightbox3D(){
  disposeScene3D(lightbox3dInst);
  lightbox3dInst = null;
  state.lightbox3D = null;
  renderApp();
}
function initResultado3D(){
  const sim = state.simulacao;
  const tipos = sim.containerTipos||[];
  if(typeof THREE==='undefined') return;

  sim3dScenes.forEach(s=>disposeScene3D(s));
  sim3dScenes = [];
  definirResolucaoTextura(totalCaixasSimulacao(sim));

  if(sim.tipoCarregamento==='pallets' && tipos.length===0){
    const paletteCanvas = document.getElementById('sim3d-pallet-canvas');
    if(paletteCanvas){
      const inst = initPalletCanvas(paletteCanvas);
      if(inst){ attachCanvasInteractions(paletteCanvas, inst); sim3dScenes.push(inst); startSceneAnimation(inst); }
    }
  }

  tipos.forEach((key,i)=>{
    const r = simularContainers(sim, key);
    const subCount = Math.max(1, Math.min(r.numContainers||1, MAX_CONTAINERS_RENDER));
    for(let sub=0; sub<subCount; sub++){
      const canvas = document.getElementById('sim3d-canvas-'+i+'-'+sub);
      if(!canvas) continue;
      const inst = sim.tipoCarregamento==='pallets'
        ? initContainerPalletsCanvas(canvas, key, sub)
        : initResultado3DCanvas(canvas, key, sub);
      if(!inst) continue;
      attachCanvasInteractions(canvas, inst);
      sim3dScenes.push(inst);
      startSceneAnimation(inst);
    }
  });
}

/* --------------------- Relatório PDF da Simulação (Início) ------------------ */
function capturarImagens3D(offscreenRoot, sim){
  const capturas = [];
  definirResolucaoTextura(totalCaixasSimulacao(sim));
  function capturar(id, buildInst, label){
    const canvas = offscreenRoot.querySelector('#'+id);
    if(!canvas) return;
    let inst = null;
    try{ inst = buildInst(canvas); }catch(e){ console.error('Falha ao montar cena 3D para captura', id, e); }
    if(!inst) return;
    try{
      inst.renderer.render(inst.scene, inst.camera);
      const dataUri = canvas.toDataURL('image/png');
      capturas.push({ id, label, dataUri });
    }catch(e){ console.error('Falha ao capturar imagem 3D', id, e); }
    finally{
      try{ disposeScene3D(inst); }catch(e){}
    }
  }
  const tipos = sim.containerTipos||[];
  if(sim.tipoCarregamento==='pallets' && tipos.length===0){
    capturar('sim3d-pallet-canvas', (canvas)=>initPalletCanvas(canvas), 'Palete de Exemplo');
  }
  tipos.forEach((key,i)=>{
    const r = simularContainers(sim, key);
    const subCount = Math.max(1, Math.min(r.numContainers||1, MAX_CONTAINERS_RENDER));
    for(let sub=0; sub<subCount; sub++){
      const id = 'sim3d-canvas-'+i+'-'+sub;
      capturar(id, (canvas)=> sim.tipoCarregamento==='pallets'
        ? initContainerPalletsCanvas(canvas, key, sub)
        : initResultado3DCanvas(canvas, key, sub),
        `${CONTAINERS[key]?CONTAINERS[key].nome:key} — Container ${sub+1} de ${r.numContainers}`);
    }
  });
  return capturas;
}
async function gerarRelatorioSimulacaoPDF(id){
  const item = state.simulacoesIndex.find(x=>x.id===id);
  if(!item) return;
  try{
    if(typeof window.jspdf==='undefined' || !window.jspdf.jsPDF){
      toast('Não foi possível carregar a biblioteca de PDF. Verifique sua conexão e recarregue a página.');
      return;
    }
    if(typeof THREE==='undefined'){
      toast('Não foi possível carregar a biblioteca 3D para montar as imagens do relatório.');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:'landscape', unit:'pt', format:'a4'});
    prepararFundoPdf(doc);
    const sim = normalizeSimulacao(item.dados);

    const offscreen = document.createElement('div');
    offscreen.style.position = 'fixed';
    offscreen.style.left = '-99999px';
    offscreen.style.top = '0px';
    offscreen.style.width = '900px';
    document.body.appendChild(offscreen);

    const simAnterior = state.simulacao;
    state.simulacao = sim;
    let capturas = [];
    try{
      offscreen.innerHTML = renderSimResultado();
      capturas = capturarImagens3D(offscreen, sim);
    } finally {
      state.simulacao = simAnterior;
      document.body.removeChild(offscreen);
    }

    pdfHeader(doc, 'Relatório de Simulação de Carga', item.nome||item.id, fmtDate(item.criadoEm||new Date().toISOString()));
    let y = 72;

    const calc = computeSimulacao(sim);
    doc.setFontSize(10); doc.setTextColor(75,90,104); doc.setFont('helvetica','bold');
    doc.text('Resumo da Carga', 28, y); y += 8;
    y = pdfKpiCards(doc, y, [
      {label:'Tipos de Caixa', value:String(calc.caixas.filter(c=>c.qty>0).length)},
      {label:'Unidades Totais', value:fmtNum(calc.totalUnidades,0)},
      {label:'Peso Bruto da Carga', value:fmtNum(calc.totalPeso,1)+' kg'},
      {label:'Volume Total', value:fmtNum(calc.totalCbm,3)+' m³'},
    ]);
    y += 20;

    const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
    function garantirEspaco(altura){
      if(y+altura > pageH-30){ doc.addPage(); y = 40; }
    }

    const tipos = sim.containerTipos||[];
    if(sim.tipoCarregamento==='pallets' && tipos.length===0){
      const captura = capturas.find(c=>c.id==='sim3d-pallet-canvas');
      garantirEspaco(260);
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(20,30,40);
      doc.text('Palete de Exemplo', 28, y); y += 14;
      if(captura){ doc.addImage(captura.dataUri, 'PNG', 28, y, 380, 220); y += 236; }
    }

    tipos.forEach((key,i)=>{
      const r = simularContainers(sim, key);
      if(!r || !r.cont) return;
      const subCount = Math.max(1, Math.min(r.numContainers||1, MAX_CONTAINERS_RENDER));
      const contadorPorTipoPDF = {};
      for(let sub=0; sub<subCount; sub++){
        const paletInfo = sim.tipoCarregamento==='pallets' ? paletesParaContainerIndex(sim, key, sub) : null;
        const { volumePct, pesoPct, pesoNeste } = sim.tipoCarregamento==='pallets'
          ? ocupacaoContainerIndexPallets(r, r.cont, sim, key, sub)
          : ocupacaoContainerIndex(r, r.cont, sub);
        garantirEspaco(300);
        doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(20,30,40);
        doc.text(`${r.cont.nome} — Container ${sub+1} de ${r.numContainers}`, 28, y); y += 10;
        const kpis = [
          {label:'Ocupação Volume', value:fmtNum(volumePct,2)+'%'},
          {label:'Ocupação Peso', value:fmtNum(pesoPct,2)+'%'},
          {label:'Peso Bruto da Carga', value:fmtNum(pesoNeste,1)+' kg'},
          {label:'Peso Bruto + Tara', value:fmtNum(pesoNeste+r.cont.tara,1)+' kg'},
        ];
        if(paletInfo) kpis.push({label:'Paletes Neste Container', value:paletInfo.paletesNesteContainer+' / '+paletInfo.unidadesPaletes});
        y = pdfKpiCards(doc, y, kpis);
        y += 20;

        const alocadas = caixasNesteContainer(sim, r, key, sub);
        if(alocadas.length){
          garantirEspaco(40+alocadas.length*16);
          doc.autoTable({
            startY:y, margin:{left:28,right:28},
            head:[['Nome da Caixa','Cor','Dimensão (cm)','Nº Caixas','Quantidade','Peso Unit. (kg)','Peso Total (kg)','CBM (m³)']],
            body: alocadas.map(cx=>{
              const inicio = (contadorPorTipoPDF[cx.id]||0)+1;
              const fim = inicio + cx.qtyNesteContainer - 1;
              contadorPorTipoPDF[cx.id] = fim;
              return [
                cx.nome||'—', '',
                `${fmtNum(cx.comp,0)}×${fmtNum(cx.larg,0)}×${fmtNum(cx.alt,0)}`,
                inicio===fim ? `${inicio}/${cx.qty}` : `${inicio}–${fim}/${cx.qty}`,
                fmtNum(cx.qtyNesteContainer,0),
                fmtNum(cx.peso,2),
                fmtNum(cx.qtyNesteContainer*cx.peso,1),
                fmtNum(cx.qtyNesteContainer*cx.volumeUnitM3,3),
              ];
            }),
            theme:'grid', styles:{fontSize:7.5, cellPadding:4}, headStyles:{fillColor:corCabecalhoPdf(), textColor:corTextoCabecalhoPdf(), fontSize:7},
            columnStyles:{1:{cellWidth:34}},
            didDrawCell: function(data){
              if(data.section==='body' && data.column.index===1){
                const cx = alocadas[data.row.index];
                if(cx && cx.cor){
                  const hex = String(cx.cor).replace('#','');
                  const r5 = parseInt(hex.substring(0,2),16)||0, g5 = parseInt(hex.substring(2,4),16)||0, b5 = parseInt(hex.substring(4,6),16)||0;
                  doc.setFillColor(r5,g5,b5);
                  doc.rect(data.cell.x+data.cell.width/2-6, data.cell.y+data.cell.height/2-6, 12, 12, 'F');
                }
              }
            },
          });
          y = doc.lastAutoTable.finalY + 20;
        }

        const captura = capturas.find(c=>c.id===('sim3d-canvas-'+i+'-'+sub));
        if(captura){
          garantirEspaco(230);
          doc.addImage(captura.dataUri, 'PNG', 28, y, 380, 220);
          y += 236;
        }
      }
    });

    if(sim.embalagemObs && sim.embalagemObs.trim()){
      garantirEspaco(60);
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(20,30,40);
      doc.text('Observações de Embalagem', 28, y); y += 16;
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(60,70,80);
      const lines = doc.splitTextToSize(sim.embalagemObs.trim(), pageW-56);
      doc.text(lines, 28, y, {lineHeightFactor:1.4});
    }

    const filename = (item.id||'simulacao').toLowerCase().replace(/\s+/g,'-')+'-relatorio.pdf';
    downloadPdfBlob(doc, filename);
  }catch(err){
    console.error('Erro ao gerar relatório de simulação:', err);
    toast('Erro ao gerar o relatório: '+(err && err.message ? err.message : 'falha desconhecida.'));
  }
}

  const base = novoProdutoCadastro();
  const merged = Object.assign({}, base, item||{});
  merged.id = (item && item.id) || base.id;

  {id:'produto', label:'Produto'},

function renderCadRichFormPessoa(tipo){
  const cfg = CAD_CONFIG[tipo];

function pdfHeader(doc, titulo, subtitulo, meta){
  const pageW = doc.internal.pageSize.getWidth();
  const estilo = estiloCotacao();
  const cab = hexParaRgb(estilo.corCabecalho), txt = corTextoSobre(cab);
  doc.setFillColor(cab[0], cab[1], cab[2]);
  doc.rect(0,0,pageW,58,'F');
  // Logo da empresa (Personalização) ou, sem ele, o da Comexta. Altura fixa, largura pela proporção.
  const logoH = 34;
  let logoW = logoH*(378/144);
  try{
    const logo = estilo.logo || COMEXTA_LOGO_URI;
    if(typeof logo==='string' && logo.indexOf('data:image')===0){
      if(estilo.logo && estilo.logoLargura && estilo.logoAltura) logoW = Math.min(170, logoH*estilo.logoLargura/estilo.logoAltura);
      const formato = /^data:image\/png/.test(logo) ? 'PNG' : 'JPEG';
      doc.setFillColor(255,255,255);
      doc.roundedRect(20, 12, logoW+14, logoH+10, 4, 4, 'F');
      doc.addImage(logo, formato, 27, 17, logoW, logoH);
    }
  }catch(e){ console.error('Falha ao inserir logo no PDF:', e); }
  const textX = 20 + logoW + 14 + 14;
  doc.setTextColor(txt[0], txt[1], txt[2]);
  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text(titulo, textX, 27);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.text(subtitulo, textX, 42);
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text(meta, pageW-24, 33, {align:'right'});
  doc.setTextColor(20,30,40);
}
function pdfKpiCards(doc, y, items){
  const marginX = 28, gap = 10, w = (doc.internal.pageSize.getWidth()-marginX*2-gap*(items.length-1))/items.length;
  items.forEach((it,i)=>{
    const x = marginX + i*(w+gap);
    doc.setDrawColor(220,212,194); doc.setFillColor(246,243,236);
    doc.roundedRect(x,y,w,40,3,3,'FD');
    doc.setTextColor(75,90,104); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    doc.text(it.label.toUpperCase(), x+8, y+13);
    doc.setTextColor(14,39,64); doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
    doc.text(it.value, x+8, y+29);
  });
  return y+40;
}
function pdfDashboardBars(doc, y, items){
  const pageW = doc.internal.pageSize.getWidth();
  const marginX = 28, labelW = 118, valueW = 130;
  const trackX = marginX + labelW;
  const trackW = pageW - marginX*2 - labelW - valueW;
  const barH = 11, rowGap = 21;
  const total = sum(items.map(it=>it.value));
  const max = Math.max.apply(null, items.map(it=>it.value).concat([1]));
  items.forEach((it,i)=>{
    const ry = y + i*rowGap;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(60,70,80);
    doc.text(it.label, marginX, ry+barH-2.5);
    doc.setFillColor(230,231,235);
    doc.roundedRect(trackX, ry, trackW, barH, 2, 2, 'F');
    const w = Math.max(3, (it.value/max)*trackW);
    doc.setFillColor(it.color[0], it.color[1], it.color[2]);
    doc.roundedRect(trackX, ry, w, barH, 2, 2, 'F');
    const pct = total>0 ? (it.value/total*100) : 0;
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(20,30,40);
    doc.text(`${fmtBRL(it.value)} (${pct.toFixed(1)}%)`, trackX+trackW+8, ry+barH-2.5);
  });
  doc.setTextColor(20,30,40);
  return y + items.length*rowGap + 4;
}
async function gerarDashboardPDF(dados, meta){
  try{
    if(typeof window.jspdf==='undefined' || !window.jspdf.jsPDF){
      toast('Não foi possível carregar a biblioteca de PDF. Verifique sua conexão com a internet e recarregue a página.');
      console.error('gerarDashboardPDF: window.jspdf indisponível — script jspdf.umd.min.js não carregou.');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:'landscape', unit:'pt', format:'a4'});
    prepararFundoPdf(doc);
    if(typeof doc.autoTable!=='function'){
      toast('Não foi possível carregar o plugin de tabelas do PDF. Verifique sua conexão e recarregue a página.');
      console.error('gerarDashboardPDF: doc.autoTable indisponível — script jspdf.plugin.autotable.min.js não carregou.');
      return;
    }
    await _gerarDashboardPDFInner(doc, dados, meta);
  }catch(err){
    console.error('Erro ao gerar PDF do Numerário:', err);
    toast('Erro ao gerar o PDF: '+(err && err.message ? err.message : 'falha desconhecida.'));
  }
}
function fmtDateOnly(v){
  if(!v) return '—';
  const parts = String(v).split('-');
  if(parts.length!==3) return v;
  return parts[2]+'/'+parts[1]+'/'+parts[0];
}

/* --- Anexos (Dados) como novas páginas do PDF, na ordem em que foram adicionados --- */
function dataUriToUint8Array(dataUri){
  const base64 = String(dataUri).split(',')[1] || '';
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
function imageToPngDataUri(dataUri){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>{
      try{
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth || img.width;
        canvas.height = img.naturalHeight || img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0);
        resolve(canvas.toDataURL('image/png'));
      }catch(err){ reject(err); }
    };
    img.onerror = ()=>reject(new Error('Falha ao carregar imagem'));
    img.src = dataUri;
  });
}
async function appendAnexosToPdf(doc, anexos){
  if(typeof window.PDFLib==='undefined'){
    throw new Error('pdf-lib indisponível — script pdf-lib.min.js não carregou.');
  }
  const { PDFDocument } = window.PDFLib;
  const mainBytes = doc.output('arraybuffer');
  const merged = await PDFDocument.load(mainBytes);
  const PW = 841.89, PH = 595.28; // A4 paisagem em pt, mesmo formato do relatório principal

  for(const anexo of anexos){
    try{
      if(anexo.tipo && anexo.tipo.startsWith('image/')){
        const pngDataUri = await imageToPngDataUri(anexo.dataUri);
        const pngBytes = dataUriToUint8Array(pngDataUri);
        const img = await merged.embedPng(pngBytes);
        const page = merged.addPage([PW, PH]);
        page.drawText(anexo.nome, {x:28, y:PH-30, size:10});
        const maxW = PW-56, maxH = PH-90;
        const scale = Math.min(maxW/img.width, maxH/img.height, 1);
        const w = img.width*scale, h = img.height*scale;
        page.drawImage(img, {x:(PW-w)/2, y:(PH-h)/2-10, width:w, height:h});
      } else if(anexo.tipo==='application/pdf'){
        const subBytes = dataUriToUint8Array(anexo.dataUri);
        const subDoc = await PDFDocument.load(subBytes, {ignoreEncryption:true});
        const copied = await merged.copyPages(subDoc, subDoc.getPageIndices());
        copied.forEach(p=>merged.addPage(p));
      } else {
        const page = merged.addPage([PW, PH]);
        page.drawText('Anexo: '+anexo.nome, {x:28, y:PH-40, size:13});
        page.drawText('Tipo: '+(anexo.tipo||'desconhecido'), {x:28, y:PH-60, size:10});
        page.drawText('Tamanho: '+fmtBytes(anexo.tamanho), {x:28, y:PH-76, size:10});
        page.drawText('Este tipo de arquivo não pode ser exibido como página no PDF.', {x:28, y:PH-98, size:9});
      }
    }catch(errItem){
      console.error('Falha ao anexar', anexo.nome, errItem);
    }
  }
  return await merged.save();
}
async function baixarAnexo(anexos, id){
  const a = (anexos||[]).find(x=>x.id===id);
  if(!a) return;
  try{
    const res = await fetch(a.dataUri);
    const blob = await res.blob();
    await saveArtifactFile(a.nome, blob);
  }catch(err){
    console.error('Falha ao baixar anexo:', err);
    toast('Não foi possível baixar este anexo.');
  }
}
async function saveArtifactFile(filename, dataBlob){
  try{
    if(window.claude && typeof window.claude.use==='function'){
      const downloads = await window.claude.use('downloads');
      if(downloads){
        await downloads.save({ filename, data: dataBlob });
        toast('Arquivo salvo: '+filename, 'ok');
        return true;
      }
    }
  }catch(err){
    if(err && err.code==='declined') return false; // usuário cancelou, não é erro
    console.error('downloads.save falhou, tentando método alternativo:', err);
  }
  try{
    const url = URL.createObjectURL(dataBlob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast((/\.xlsx$/i.test(filename) ? 'Planilha gerada: ' : 'PDF gerado: ')+filename, 'ok');
    return true;
  }catch(err2){
    console.error('Falha ao baixar PDF:', err2);
    toast('Não foi possível baixar o PDF neste navegador.');
    return false;
  }
}
async function downloadBytesAsPdf(bytes, filename){
  const blob = new Blob([bytes], {type:'application/pdf'});
  await saveArtifactFile(filename, blob);
}
async function downloadPdfBlob(doc, filename){
  let blob;
  try{ blob = doc.output('blob'); }
  catch(err){
    try{ doc.save(filename); toast('PDF gerado: '+filename, 'ok'); }
    catch(err2){ console.error(err2); toast('Não foi possível baixar o PDF neste navegador.'); }
    return;
  }
  await saveArtifactFile(filename, blob);
}

function novoNumeroSeq(){
  const maxSeq = state.cotacoesIndex.reduce((m,c)=>Math.max(m,c.seq||0),0);
  return maxSeq+1;
}
async function salvarCalculo(){
  const d = state.dados, c = computeDados(d), r = computeRateio(d,c);
  if(r.linhas.length===0){ toast('Preencha ao menos um produto antes de salvar.'); return; }
  const resumo = {
    itens: r.linhas.length, valorAduaneiroBRL: r.totais.valorAduaneiroProduto,
    custoSimples: r.totais.custoTotalSimples, custoLucroReal: r.totais.custoTotalLucroReal,
    limiteExcedido: c.limiteExcedido,
  };
  const now = new Date().toISOString();
  if(state.currentCotacaoId){
    const item = state.cotacoesIndex.find(x=>x.id===state.currentCotacaoId);
    if(item){ item.dados = JSON.parse(JSON.stringify(d)); item.resumo = resumo; item.atualizadoEm = now; }
  } else {
    const seq = novoNumeroSeq();
    const id = 'COT-'+String(seq).padStart(4,'0');
    state.cotacoesIndex.push({ id, seq, dados:JSON.parse(JSON.stringify(d)), resumo, criadoEm:now, atualizadoEm:now });
    state.currentCotacaoId = id;
  }
  await persistCotacoesIndex();
  toast('Cálculo salvo em Cotações: '+state.currentCotacaoId, 'ok');
  renderApp();
}
async function duplicarCotacao(id, tipo){
  const formal = tipo==='Formal';
  const lista = formal ? state.cotacoesFormalIndex : state.cotacoesIndex;
  const origem = lista.find(x=>x.id===id);
  if(!origem) return;
  const seq = formal ? novoNumeroSeqFormal() : novoNumeroSeq();
  const novoId = (formal?'COTF-':'COT-')+String(seq).padStart(4,'0');
  const now = new Date().toISOString();
  // Cópia profunda: nenhuma referência é compartilhada com a cotação original
  const dados = JSON.parse(JSON.stringify(origem.dados));
  dados.statusCotacao = 'em_andamento'; dados.statusMotivoNegado = ''; dados.statusObservacao = '';
  const resumo = JSON.parse(JSON.stringify(origem.resumo||{}));
  lista.push({ id:novoId, seq, dados, resumo, criadoEm:now, atualizadoEm:now });
  if(formal) await persistCotacoesFormalIndex(); else await persistCotacoesIndex();
  toast(`${id} duplicada como ${novoId}.`, 'ok');
  renderApp();
}

  const key = kind+':'+id;

    return true; // segundo clique dentro da janela de confirmação: prossegue com a exclusão
  }
  state.pendingDelete = key;
  renderApp();
  if(pendingDeleteTimer) clearTimeout(pendingDeleteTimer);

function novoNumeroSeqSimulacao(){

async function salvarSimulacao(){
  const sim = state.simulacao;
  const now = new Date().toISOString();
  if(state.currentSimulacaoId){
    const item = state.simulacoesIndex.find(x=>x.id===state.currentSimulacaoId);
    if(item){ item.dados = JSON.parse(JSON.stringify(sim)); item.nome = sim.nome; item.atualizadoEm = now; }
  } else {
    const seq = novoNumeroSeqSimulacao();
    const id = 'SIM-'+String(seq).padStart(4,'0');
    state.simulacoesIndex.push({ id, seq, nome: sim.nome||id, dados: JSON.parse(JSON.stringify(sim)), criadoEm: now, atualizadoEm: now });

function fileToDataUri(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(reader.error);
    reader.readAsDataURL(file);
  });
}
const MAX_DOC_FILE_BYTES = 3*1024*1024;      // 3MB por arquivo
const MAX_DOC_TOTAL_BYTES = 4.5*1024*1024;   // ~4.5MB por cadastro (limite de armazenamento é 5MB/chave)
async function handleFilesSelected(fileList){
  if(!state.cadDraft || !fileList || !fileList.length) return;
  const files = Array.from(fileList);
  let currentTotal = sum((state.cadDraft.documentos||[]).map(d=>d.tamanho));
  let added = 0;
  for(const f of files){
    if(f.size > MAX_DOC_FILE_BYTES){ toast(`"${f.name}" excede 3MB e não foi anexado.`); continue; }
    if(currentTotal + f.size > MAX_DOC_TOTAL_BYTES){ toast('Limite de anexos atingido para este cadastro (~4,5MB no total).'); break; }
    try{
      const dataUri = await fileToDataUri(f);
      state.cadDraft.documentos.push({ id:uid(), nome:f.name, tipo:f.type||'arquivo', tamanho:f.size, dataUri, adicionadoEm:new Date().toISOString() });
      currentTotal += f.size; added++;
    }catch(err){ console.error('Falha ao ler arquivo', f.name, err); toast(`Não foi possível anexar "${f.name}".`); }
  }
  if(added) toast(added+' documento'+(added===1?'':'s')+' anexado'+(added===1?'':'s')+'.', 'ok');
  renderApp();
}
async function handleFotosSelected(fileList){
  if(!state.cadDraft || !fileList || !fileList.length) return;
  if(!Array.isArray(state.cadDraft.fotos)) state.cadDraft.fotos = [];
  const files = Array.from(fileList);
  let currentTotal = sum(state.cadDraft.fotos.map(f=>f.tamanho));
  let added = 0;
  for(const f of files){
    if(!f.type || !f.type.startsWith('image/')){ toast(`"${f.name}" não é uma imagem.`); continue; }
    if(f.size > MAX_DOC_FILE_BYTES){ toast(`"${f.name}" excede 3MB e não foi anexada.`); continue; }
    if(currentTotal + f.size > MAX_DOC_TOTAL_BYTES){ toast('Limite de imagens atingido para este produto (~4,5MB no total).'); break; }
    try{
      const dataUri = await fileToDataUri(f);
      const isFirst = state.cadDraft.fotos.length===0;
      state.cadDraft.fotos.push({ id:uid(), nome:f.name, tipo:f.type, tamanho:f.size, dataUri, principal:isFirst, adicionadoEm:new Date().toISOString() });
      currentTotal += f.size; added++;
    }catch(err){ console.error('Falha ao ler imagem', f.name, err); toast(`Não foi possível anexar "${f.name}".`); }
  }
  if(added) toast(added+' '+(added===1?'imagem adicionada':'imagens adicionadas')+'.', 'ok');
  renderApp();
}

/* ------------------------------ Delegação de eventos ------------------------ */
function onAppClick(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.getAttribute('data-action');
  if(!acaoPermitida(action)){ avisoSemPermissao(action); return; }
  const [cmd, a1, a2] = action.split(':');
  if(cmd.startsWith('cfg-')){ acaoConfig(cmd, a1, a2); return; }
  if(cmd.startsWith('proc-') && (acaoTemplateProcesso(cmd, a1, a2) || acaoProcesso(cmd, a1, a2))) return;
  if(cmd.startsWith('cot-') && acaoTemplateCotacoes(cmd, a1, a2)) return;
  if(cmd.startsWith('ftpl-') && acaoFiltrosTpl(cmd, a1)) return;
  if(cmd==='exportar'){ exportarTela(a1, a2); return; }
  if(cmd.startsWith('cadtpl-') && acaoTemplateCadastro(cmd, a1, a2)) return;
  switch(cmd){
    case 'go': navigate(a1); break;
    case 'toggle-module':
      state.openModule = state.openModule===a1 ? null : a1;
      renderApp();
      break;
    case 'toggle-nav':
      state.navDropdown = state.navDropdown===a1 ? null : a1;
      renderApp();
      break;
    case 'add-produto': addProduto(); break;
    case 'remove-produto': removeProduto(Number(a1)); break;
    case 'save-calculo': salvarCalculo(); break;
    case 'download-pdf-numerario': {
      const r = computeRateio(state.dados, computeDados(state.dados));
      if(r.linhas.length===0){ toast('Preencha ao menos um produto antes de exportar.'); break; }
      gerarDashboardPDF(state.dados, {id:state.currentCotacaoId, data:new Date().toISOString()});
      break;
    }
    case 'nova-cotacao': novaCotacao(); break;
    case 'limpar-dados': limparDados(); break;
    case 'abrir-cotacao': abrirCotacao(a1); break;
    case 'duplicar-cotacao': duplicarCotacao(a1, 'Simplificada'); break;
    case 'duplicar-cotacao-formal': duplicarCotacao(a1, 'Formal'); break;
    case 'excluir-cotacao': excluirCotacao(a1); break;
    case 'baixar-cotacao-pdf': baixarCotacaoPdf(a1); break;
    case 'cancelar-edicao-cotacao': state.currentCotacaoId=null; renderApp(); break;
    case 'aplicar-filtros': {
      state.filtros.numero = document.getElementById('f-numero').value.trim();
      state.filtros.texto = document.getElementById('f-texto').value.trim();
      state.filtros.de = document.getElementById('f-de').value;
      state.filtros.ate = document.getElementById('f-ate').value;
      renderApp();
      break;
    }
    case 'limpar-filtros': state.filtros = {numero:'',texto:'',de:'',ate:''}; renderApp(); break;
    case 'add-produto-formal': addProdutoFormal(); break;
    case 'add-caixa-sim': addCaixaSim(); break;
    case 'remove-caixa-sim': removeCaixaSim(Number(a1)); break;
    case 'set-tipo-carregamento': setTipoCarregamento(a1); break;
    case 'set-container-sim': setContainerSim(a1); break;
    case 'nova-simulacao': novaSimulacao(); break;
    case 'salvar-simulacao': salvarSimulacao(); break;
    case 'abrir-simulacao': abrirSimulacao(a1); break;
    case 'excluir-simulacao': excluirSimulacao(a1); break;
    case 'gerar-pdf-simulacao': gerarRelatorioSimulacaoPDF(a1); break;
    case 'renomear-simulacao': renomearSimulacao(a1); break;
    case 'cancelar-nome-simulacao': cancelarNomeSimulacao(); break;
    case 'salvar-nome-simulacao': salvarNomeSimulacao(a1); break;
    case 'add-despesa-linha': {
      const key = a1;
      if(Array.isArray(state.dadosFormal[key])) state.dadosFormal[key].push(novaDespesaLinha());
      saveDraftFormal(); renderApp();
      break;
    }
    case 'remove-despesa-linha': {
      const key = a1, idx = Number(a2);
      if(Array.isArray(state.dadosFormal[key]) && state.dadosFormal[key].length>1){
        state.dadosFormal[key].splice(idx,1);
        saveDraftFormal(); renderApp();
      }
      break;
    }
    case 'remove-produto-formal': removeProdutoFormal(Number(a1)); break;
    case 'save-calculo-formal': salvarCalculoFormal(); break;
    case 'download-pdf-numerario-formal': {
      const r = computeRateioFormal(state.dadosFormal, computeDadosFormal(state.dadosFormal));
      if(r.linhas.length===0){ toast('Preencha ao menos um produto antes de exportar.'); break; }

    case 'limpar-dados-formal': limparDadosFormal(); break;
    case 'abrir-cotacao-formal': abrirCotacaoFormal(a1); break;
