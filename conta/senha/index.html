<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comexta · Trocar senha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#173A5E;
  --navy-deep:#0D2740;
  --sky-100:#EAF2FC;
  --sky-50:#F5F9FE;
  --line:#DCE6F1;
  --ink:#16222E;
  --ink-soft:#5B6B79;
  --accent:#2F6FC4;
  --accent-deep:#22579C;
  --white:#FFFFFF;
  --radius:16px;
  --shadow: 0 1px 2px rgba(13,39,64,0.04), 0 24px 60px -20px rgba(13,39,64,0.35);
  --ease: cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{background:#0D2740;}
body{
  min-height:100vh;
  font-family:'Inter', ui-sans-serif, system-ui, sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1100px 620px at 85% -10%, rgba(255,255,255,0.06) 0%, transparent 60%),
    linear-gradient(165deg, var(--navy) 0%, var(--navy-deep) 100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:32px 20px;
  position:relative;
  overflow-x:hidden;
}
::selection{background:var(--sky-100);}

/* Rota maritima decorativa, discreta, ao fundo */
.route-lines{
  position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none;
}
.route-lines svg{position:absolute; width:100%; height:100%; opacity:0.16;}

.wrap{
  position:relative; z-index:1;
  width:100%; max-width:420px;
  display:flex; flex-direction:column; align-items:center;
  animation:riseIn .6s var(--ease) both;
}
@keyframes riseIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
@media (prefers-reduced-motion: reduce){ .wrap{animation:none;} }

.logo-mark{
  display:block; height:44px; width:auto; margin-bottom:30px;
  filter:drop-shadow(0 6px 16px rgba(0,0,0,0.25));
}

.card{
  background:var(--white);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:38px 34px 30px;
  width:100%;
}
.card h1{
  font-family:'Space Grotesk', ui-sans-serif, sans-serif;
  font-size:22px; font-weight:700; margin:0 0 6px; color:var(--navy-deep); letter-spacing:-0.2px;
}
.card .sub{font-size:13.5px; color:var(--ink-soft); margin:0 0 26px; line-height:1.5;}

.field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
.field label{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
.field input{
  border:1.5px solid var(--line); background:var(--sky-50); border-radius:10px;
  padding:12px 14px; font-size:14.5px; font-family:inherit; color:var(--ink);
  outline:none; transition:border-color .15s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease);
}
.field input::placeholder{color:#9DAAB8;}
.field input:focus{border-color:var(--accent); background:var(--white); box-shadow:0 0 0 4px rgba(47,111,196,0.14);}

.pw-row{position:relative;}
.pw-row input{width:100%; padding-right:44px;}
.pw-toggle{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  background:none; border:none; cursor:pointer; padding:6px; color:var(--ink-soft);
  display:flex; align-items:center; justify-content:center; border-radius:6px;
}
.pw-toggle:hover{color:var(--accent);}
.pw-toggle svg{width:18px; height:18px;}

.row-between{display:flex; align-items:center; justify-content:space-between; margin:2px 0 22px;}
.remember{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); cursor:pointer; user-select:none;}
.remember input{width:15px; height:15px; accent-color:var(--accent); cursor:pointer;}
.link{font-size:13px; color:var(--accent); font-weight:600; text-decoration:none; cursor:pointer; background:none; border:none; padding:0; font-family:inherit;}
.link:hover{color:var(--accent-deep); text-decoration:underline;}

.btn-enter{
  width:100%; background:var(--accent); color:#fff; border:none; border-radius:10px;
  padding:13px 18px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;
  transition:background .15s var(--ease), box-shadow .15s var(--ease), transform .08s ease;
  box-shadow:0 10px 24px -10px rgba(47,111,196,0.55);
}
.btn-enter:hover{background:var(--accent-deep);}
.btn-enter:active{transform:translateY(1px);}
.btn-enter:disabled, .btn-secondary:disabled{opacity:.7; cursor:wait;}
.form-ok{
  margin:0; padding:12px 14px; border-radius:10px; font-size:13.5px; line-height:1.5;
  background:#E6F2EA; color:#23583F; border:1px solid #C5E0CF;
}
.hp{position:absolute; left:-9999px; width:1px; height:1px; opacity:0;}
.form-error{
  margin:0 0 14px; padding:10px 12px; border-radius:10px; font-size:13px; line-height:1.45;
  background:#FBEAEA; color:#9B2C2C; border:1px solid #F1CACA;
}

.foot-links{display:flex; justify-content:center; gap:8px; margin-top:22px; font-size:13.5px; color:var(--ink-soft);}

.divider{display:flex; align-items:center; gap:12px; margin:24px 0; color:var(--ink-soft); font-size:12px;}
.divider::before, .divider::after{content:''; flex:1; height:1px; background:var(--line);}

/* Painel de cadastro (revela ao clicar em "Criar nova conta") */
.signup-panel{
  display:none; margin-top:18px; padding-top:18px; border-top:1px solid var(--line);
}
.signup-panel.open{display:block;}
.signup-panel .sp-title{font-size:14px; font-weight:700; color:var(--navy-deep); margin-bottom:4px;}
.signup-panel .sp-note{font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:16px;}
.btn-secondary{
  width:100%; background:var(--sky-100); color:var(--navy); border:1.5px solid var(--line); border-radius:10px;
  padding:12px 18px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
  transition:background .15s var(--ease);
}
.btn-secondary:hover{background:#DEEAF8;}

.bottom-note{
  position:relative; z-index:1; text-align:center; margin-top:26px; font-size:12.5px;
  color:rgba(255,255,255,0.75); max-width:420px;
}
.bottom-note b{color:#fff;}

@media (max-width:480px){
  .card{padding:30px 22px 24px;}
  .logo-mark{height:36px; margin-bottom:24px;}
}
</style>
</head>

  <div class="card">
    <h1>Trocar senha</h1>
    <p class="sub">Ao trocar a senha, os outros aparelhos conectados à sua conta são desconectados.</p>

    <form id="senhaForm">
      <div class="field">
        <label for="senhaAtual">Senha atual</label>
        <input type="password" id="senhaAtual" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="novaSenha">Nova senha</label>
        <input type="password" id="novaSenha" placeholder="Mínimo de 8 caracteres" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="novaSenha2">Confirmar nova senha</label>
        <input type="password" id="novaSenha2" placeholder="Repita a nova senha" autocomplete="new-password" required>
      </div>
      <p class="form-error" id="senhaError" role="alert" hidden></p>
      <p class="form-ok" id="senhaOk" role="status" hidden>Senha alterada com sucesso.</p>
      <button type="submit" class="btn-enter">Salvar nova senha</button>
    </form>

    <div class="foot-links"><a class="link" href="/erp/">← Voltar ao ERP</a></div>
  </div>
</div>

<p class="bottom-note">© <span id="year"></span> <b>Comexta</b> · Soluções em importação</p>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

const form = document.getElementById('senhaForm');
const btn = form.querySelector('.btn-enter');
const erroEl = document.getElementById('senhaError');
const okEl = document.getElementById('senhaOk');
function mostrarErro(msg){ erroEl.textContent = msg; erroEl.hidden = !msg; }

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  mostrarErro(''); okEl.hidden = true;
  const senhaAtual = document.getElementById('senhaAtual').value;
  const novaSenha = document.getElementById('novaSenha').value;
  if(novaSenha.length < 8) return mostrarErro('A nova senha precisa ter pelo menos 8 caracteres.');
  if(novaSenha !== document.getElementById('novaSenha2').value) return mostrarErro('As novas senhas não conferem.');

  btn.disabled = true;
  btn.textContent = 'Salvando…';
  try{
    const res = await fetch('/api/trocar-senha', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ senhaAtual, novaSenha }),
    });
    const data = await res.json().catch(() => ({}));
    if(res.status === 401){ window.location.href = '/login/'; return; }
    if(res.ok && data.ok){ form.reset(); okEl.hidden = false; }
    else mostrarErro(data.erro || 'Não foi possível trocar a senha. Tente novamente.');
  }catch(err){
    mostrarErro('Sem conexão com o servidor. Verifique sua internet e tente novamente.');
  }
  btn.disabled = false;
  btn.textContent = 'Salvar nova senha';
});
</script>
